    return /^[a-z0-9+#_.-]*$/.test(t) ? t : '';
  }

  function parseHl(spec) {
    var set = {};
    String(spec == null ? '' : spec).split(',').forEach(function (part) {
      var p = part.trim();
      var m = /^(\d+)\s*-\s*(\d+)$/.exec(p);
      if (m) {
        var a = +m[1], b = +m[2];
        // {1-99999999} 같은 오타 하나로 브라우저가 멈추면 안 된다.
        if (b > a + 5000) b = a + 5000;
        for (var k = a; k <= b; k++) set[k] = true;
      } else if (/^\d+$/.test(p)) {
        set[+p] = true;
      }
    });
    return set;
  }

  function renderCode(code, info) {
    var meta = String(info == null ? '' : info).trim();
    var lang = langOf(meta);
    var tm = /title\s*=\s*"([^"]*)"/.exec(meta);
    var hm = /\{([0-9,\s-]+)\}/.exec(meta);
    var noLines = /(^|\s)nolines(\s|$)/.test(meta);
    var title = tm ? tm[1] : '';
    var hlSet = parseHl(hm ? hm[1] : '');

    var body = String(code == null ? '' : code).replace(/\n+$/, '');

    // 원문을 이스케이프하지 않고 넘긴다 — 이스케이프는 HL의 책임이다(계약 §2.1).
    // HL이 아직 로드되지 않았거나 터져도 코드는 보여야 하므로 자체 esc로 물러선다.
    var painted;
    try {
      var HL = global.HL;
      painted = (HL && typeof HL.highlight === 'function') ? HL.highlight(body, lang) : esc(body);
      if (typeof painted !== 'string') painted = esc(body);
    } catch (e) {
      painted = esc(body);
    }

    var rows = painted.split('\n').map(function (ln, k) {
      var cls = 'line' + (hlSet[k + 1] ? ' hl' : '');
      return (noLines ? '' : '<span class="ln">' + (k + 1) + '</span>') +
        '<span class="' + cls + '">' + ln + '</span>';
    }).join('\n');

    // title이 없어도 head는 남긴다 — 복사 버튼이 거기 산다(계약 §2.1).
    var head = '<div class="codeblock-head">' +
      (title ? '<span class="codeblock-title">' + esc(title) + '</span>' : '') +
      (lang ? '<span class="codeblock-lang">' + esc(lang) + '</span>' : '') +
      '<button class="codeblock-copy" type="button" aria-label="코드 복사">복사</button>' +
      '</div>';

    return '<div class="codeblock" data-lang="' + esc(lang) + '">' + head +
      '<pre class="code' + (noLines ? ' nolines' : '') + '">' +
      '<code class="lang-' + esc(lang) + '">' + rows + '</code></pre></div>';
  }

  /* ==================== ::: dual ==================== */

  var LANG_LABEL = {
    python: 'Python', cpp: 'C++', c: 'C', text: 'Text',
    bash: 'Bash', json: 'JSON', console: 'Console'
  };

  function renderDual(inner, ctx) {
    var lines = inner.split('\n');
    var panes = [];
    var slot = {};
    var stray = [];
    var i = 0;

    while (i < lines.length) {
      var f = /^\s*(`{3,}|~{3,})(.*)$/.exec(lines[i]);
      if (f) {
        var mark = f[1].charAt(0);
        var len = f[1].length;
        var meta = f[2];
        var buf = [];
        i++;
        while (i < lines.length && !isFenceClose(lines[i], mark, len)) { buf.push(lines[i]); i++; }
        i++;
        var lang = langOf(meta) || 'text';
        var html = renderCode(buf.join('\n'), meta);
        if (slot.hasOwnProperty(lang)) panes[slot[lang]].html += html;
        else { slot[lang] = panes.length; panes.push({ lang: lang, html: html }); }
        continue;
      }
      if (lines[i].trim()) stray.push(lines[i]);
      i++;
    }

    // 코드 펜스가 하나도 없으면 dual로 만들 게 없다. 본문을 버리지 말고 그대로 살린다.
    if (!panes.length) return blocks(inner, ctx, true);

    // A-04: Python이 항상 먼저, C++이 뒤. 그 외 언어는 등장 순서로 뒤에 붙인다.
    var ordered = [];
    ['python', 'cpp'].forEach(function (l) {
      panes.forEach(function (p) { if (p.lang === l) ordered.push(p); });
    });
    panes.forEach(function (p) {
      if (p.lang !== 'python' && p.lang !== 'cpp') ordered.push(p);
    });

    var tabs = ordered.map(function (p, k) {
      return '<button class="dual-tab' + (k === 0 ? ' is-active' : '') +
        '" data-dual-lang="' + esc(p.lang) + '" role="tab" type="button">' +
        esc(LANG_LABEL[p.lang] || p.lang) + '</button>';
    }).join('');

    // `둘 다` 모드에서 app.js가 컨테이너에 .is-both를 붙여 두 패널을 세로로 쌓는다.
    // 렌더러는 두 패널을 항상 다 만들어 두기만 하면 된다(계약 §2.2).
    var body = ordered.map(function (p, k) {
      return '<div class="dual-pane' + (k === 0 ? ' is-active' : '') +
        '" data-dual-lang="' + esc(p.lang) + '">' + p.html + '</div>';
    }).join('');

    var html = '<div class="dual" data-dual>' +
      '<div class="dual-tabs" role="tablist">' + tabs + '</div>' + body + '</div>';

    return stray.length ? html + '\n' + blocks(stray.join('\n'), ctx, true) : html;
  }

  /* ==================== ::: 상자 ==================== */

  // 계약 §2.3의 기본 라벨. lead는 라벨이 없다.
  var BOX_LABEL = {
    lead: '',
    note: '참고',
    tip: '요령',
    warn: '주의',
    danger: '위험',
    deep: '한 단계 아래',
    perf: '성능',
    hist: '설계 배경',
    trace: '손으로 따라가기',
    pitfall: '틀리는 지점',
    classify: '이 유형을 알아보는 법',
    interview: '면접에서는',
    quiz: '연습',
    answer: '정답'
  };

  function renderBox(kind, title, body, ctx) {
    // 클래스명에 임의 문자열이 들어가지 않게 한 번 더 거른다.
    var k = String(kind).toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (!k) k = 'note';
    var known = BOX_LABEL.hasOwnProperty(k);
    var label = title || (known ? BOX_LABEL[k] : k);

    // classify 안에서만 불릿에 data-classify-key를 붙인다(계약 §2.4).
    // build.py가 이 블록을 수집해 Anki 덱을 만들기 때문에 키는 상자 밖으로 새면 안 된다.
    if (k === 'classify') ctx.classify++;
    var inner = blocks(body, ctx, true);
    if (k === 'classify') ctx.classify--;

    if (k === 'answer') {
      return '<details class="box box-answer"><summary class="box-title">' +
        esc(label || BOX_LABEL.answer) + '</summary>' +
        '<div class="box-body">' + inner + '</div></details>';
    }
    // lead는 제목 줄 자체가 없다. 절 머리말이라 라벨이 붙으면 오히려 방해가 된다.
    if (k === 'lead') {
      return '<div class="box box-lead"><div class="box-body">' + inner + '</div></div>';
    }
    return '<div class="box box-' + k + '">' +
      (label ? '<div class="box-title">' + esc(label) + '</div>' : '') +
      '<div class="box-body">' + inner + '</div></div>';
  }

  /* ==================== ::: widget ==================== */

  function renderWidget(rest, bodyLines) {
    var m = /^([A-Za-z0-9_.-]+)\s*([\s\S]*)$/.exec(String(rest || '').trim());
    var type = m ? m[1] : '';
    var jsonText = ((m ? m[2] : '') + '\n' + bodyLines.join('\n')).trim();
    var opts = '{}';
    if (jsonText) {
      try {
        var parsed = JSON.parse(jsonText);
        // 배열·숫자를 옵션으로 넘기면 위젯 쪽 계약이 깨진다. 객체만 인정한다.
        if (parsed && typeof parsed === 'object' && !(parsed instanceof Array)) {
          opts = JSON.stringify(parsed);
        }
      } catch (e) {
        opts = '{}'; // 깨진 JSON은 조용히 버린다. 한 챕터의 오타로 책 전체가 안 뜨면 안 된다.
      }
    }
    return '<div class="widget" data-widget="' + esc(type) + '" data-opts=\'' + escSingle(opts) + '\'></div>';
  }

  /* ==================== 표 ==================== */

  function isTableDelim(s) {
    return typeof s === 'string' && /\|/.test(s) && /-/.test(s) && /^[\s|:-]+$/.test(s);
  }

  function splitRow(line) {
    var s = String(line).trim().replace(/^\|/, '').replace(/\|$/, '');
    var cells = [];
    var cur = '';
    var inCode = false;
    for (var k = 0; k < s.length; k++) {
      var ch = s.charAt(k);
      if (ch === '\\' && s.charAt(k + 1) === '|') { cur += '|'; k++; continue; }
      if (ch === '`') inCode = !inCode;
      if (ch === '|' && !inCode) { cells.push(cur); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur);
    return cells;
  }

  function alignOf(cell) {
    var c = String(cell).trim();
    if (/^:.*:$/.test(c)) return 'center';
    if (/:$/.test(c)) return 'right';
    if (/^:/.test(c)) return 'left';
    return '';
  }

  /* ==================== 목록 ==================== */

  // 그룹1=들여쓰기, 그룹2=불릿 문자(순서 있는 목록이면 undefined), 그룹3=번호.
  // /g 를 붙이면 lastIndex가 남아 .test()가 번갈아 실패하므로 절대 붙이지 않는다.
  var MARKER = /^(\s*)(?:([-*+])|(\d+)[.)])[ \t]+/;

  function classifyKey(text) {
    var t = String(text).replace(/^[\s*_`>]+/, '');
    if (/^신호어/.test(t)) return 'signals';
    if (/^제약\s*조건/.test(t)) return 'constraints';
    // 집필 현장에서 `혼동 주의`와 `혼동주의`가 섞여 들어온다. 둘 다 받는다(계약 §2.4).
    if (/^혼동\s*주의/.test(t)) return 'confusion';
    if (/^반례\s*함정/.test(t)) return 'traps';
    return '';
  }

  function renderList(lines, ctx) {
    var first = MARKER.exec(lines[0]);
    if (!first) return '<p>' + inline(lines.join('\n')) + '</p>';

    var indent = first[1].length;
    var ordered = !first[2];
    var start = ordered ? parseInt(first[3], 10) : 1;

    // 이 레벨의 '같은 종류' 마커만 항목 시작으로 인정한다. 더 깊게 들여쓴 줄은
    // 항목 본문으로 넘겨서 blocks()가 재귀로 중첩 목록을 처리하게 한다.
    var markerRe = new RegExp('^\\s{' + indent + '}' + (ordered ? '\\d+[.)]' : '[-*+]') + '[ \\t]+');
    var items = [];
    var cur = null;
    var contIndent = 0;

    lines.forEach(function (ln) {
      var m = markerRe.exec(ln);
      if (m) {
        if (cur) items.push(cur);
        cur = [ln.slice(m[0].length)];
        contIndent = m[0].length;
      } else if (cur) {
        cur.push(/^\s*$/.test(ln) ? '' : ln.replace(new RegExp('^\\s{0,' + contIndent + '}'), ''));
      }
    });
    if (cur) items.push(cur);

    var html = items.map(function (item) {
      var text = item.join('\n');
      var attrs = '';
      var prefix = '';

      var cb = /^\[([ xX])\][ \t]*([\s\S]*)$/.exec(text);
      if (cb) {
        attrs = ' class="task"';
        prefix = '<input type="checkbox" disabled' +
          (cb[1].toLowerCase() === 'x' ? ' checked' : '') + '> ';
        text = cb[2];
      } else if (ctx.classify > 0) {
        var key = classifyKey(text);
        if (key) attrs = ' data-classify-key="' + key + '"';
      }

      var inner = blocks(text, ctx, true);
      // 한 문단짜리 항목이면 <p>를 벗긴다. 안 벗기면 목록 줄 간격이 통째로 벌어진다.
      var only = /^<p>([\s\S]*)<\/p>$/.exec(inner.trim());
      if (only && only[1].indexOf('<p>') === -1) {
        inner = only[1];
      } else if (!/\n[ \t]*\n/.test(text)) {
        // 빈 줄이 없는 항목(tight)은 중첩 목록을 달고 있어도 첫 줄이 문단이 아니다.
        // 여기서 안 벗기면 `- 항목\n  - 중첩` 이 loose 목록처럼 벌어진다.
        inner = inner.replace(/^<p>([\s\S]*?)<\/p>(\n|$)/, '$1$2');
      }
      return '<li' + attrs + '>' + prefix + inner + '</li>';
    }).join('');

    return ordered
      ? '<ol' + (start !== 1 && !isNaN(start) ? ' start="' + start + '"' : '') + '>' + html + '</ol>'
      : '<ul>' + html + '</ul>';
  }

  /* ==================== 블록 상태 기계 ==================== */

  function isFenceClose(line, mark, len) {
    var m = /^\s*(`{3,}|~{3,})\s*$/.exec(line);
    if (!m) return false;
    return m[1].charAt(0) === mark && m[1].length >= len;
  }

  // 목록의 게으른 연속(lazy continuation)이 삼키면 안 되는 줄들.
  // 이게 없으면 목록 뒤에 붙은 `## 제목`이 목록 안으로 빨려 들어가고,
  // 그러면 headings()와 render()의 슬러그 번호가 어긋난다.
  function isHardBlockStart(line) {
    return /^#{1,6}[ \t]+/.test(line) ||
      /^:::/.test(line) ||
      /^(?:`{3,}|~{3,})/.test(line) ||
      /^>/.test(line);
  }

  function isBlockBreak(lines, i) {
    var l = lines[i];
    return /^\s*$/.test(l) ||
      /^#{1,6}[ \t]+/.test(l) ||
      /^:::/.test(l) ||
      /^\s{0,3}(?:`{3,}|~{3,})/.test(l) ||
      /^\s{0,3}>/.test(l) ||
      MARKER.test(l) ||
      /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l) ||
      /^\s*\$\$/.test(l) ||
      (/\|/.test(l) && i + 1 < lines.length && isTableDelim(lines[i + 1]));
  }

  function blank(s) { return /^\s*$/.test(s); }

  /**
   * @param src    마크다운 원문
   * @param ctx    { used, classify } — 슬러그 중복 사전과 classify 깊이
   * @param nested 재귀 호출 여부. 상자·인용·목록 안의 제목에는 id를 붙이지 않는다.
   *               headings()가 최상위 h2·h3만 세므로, 여기서 id를 남발하면 `-2` 접미가
   *               어긋나 인북 목차 링크가 통째로 깨진다.
   */
  function blocks(src, ctx, nested) {
    var lines = String(src == null ? '' : src).split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (blank(line)) { i++; continue; }

      /* --- 코드 펜스 --- */
      var fence = /^\s{0,3}(`{3,}|~{3,})(.*)$/.exec(line);
      if (fence) {
        var mark = fence[1].charAt(0);
        var len = fence[1].length;
        var meta = fence[2];
        var cbuf = [];
        i++;
        while (i < lines.length && !isFenceClose(lines[i], mark, len)) { cbuf.push(lines[i]); i++; }
        i++; // 닫는 펜스(없으면 EOF)
        out.push(renderCode(cbuf.join('\n'), meta));
        continue;
      }

      /* --- ::: 블록 (widget / dual / 표시 상자) --- */
      var bm = /^:::[ \t]*([A-Za-z][A-Za-z0-9_-]*)[ \t]*(.*)$/.exec(line);
      if (bm) {
        var kind = bm[1].toLowerCase();
        var rest = bm[2].trim();
        var bbuf = [];
        var depth = 1;
        var inFence = null; // 상자 안의 코드 펜스에 들어 있는 `:::`는 세면 안 된다
        i++;
        while (i < lines.length) {
          var l = lines[i];
          var fm = /^\s{0,3}(`{3,}|~{3,})/.exec(l);
          if (fm) {
            if (!inFence) inFence = fm[1];
            else if (fm[1].charAt(0) === inFence.charAt(0) && fm[1].length >= inFence.length) inFence = null;
          } else if (!inFence) {
            // 닫는 :::는 항상 홀로 있는 ::: 줄이다(계약 §2.3).
            if (/^:::[ \t]*$/.test(l)) {
              depth--;
              if (depth === 0) { i++; break; }
            } else if (/^:::[ \t]*\S/.test(l)) {
              depth++;
            }
          }
          bbuf.push(l);
          i++;
        }

        if (kind === 'widget') { out.push(renderWidget(rest, bbuf)); continue; }
        if (kind === 'dual') { out.push(renderDual(bbuf.join('\n'), ctx)); continue; }
        out.push(renderBox(kind, rest, bbuf.join('\n'), ctx));
        continue;
      }

      /* --- 제목 --- */
      var h = /^(#{1,6})[ \t]+(.*)$/.exec(line);
      if (h) {
        var lvl = h[1].length;
        var raw = h[2].replace(/\s+#+\s*$/, '').trim();
        var text = headingText(raw);
        var attr = '';
        var anchor = '';
        if (!nested && (lvl === 2 || lvl === 3)) {
          var id = uniqueSlug(slugify(text), ctx.used);
          attr = ' id="' + esc(id) + '"';
          anchor = '<a class="anchor" href="#' + esc(id) + '" aria-label="이 절 링크">#</a>';
        }
        out.push('<h' + lvl + attr + '>' + inline(raw) + anchor + '</h' + lvl + '>');
        i++;
        continue;
      }

      /* --- 수평선 --- */
      if (/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* --- 블록 수식 --- */
      var mb = /^\s*\$\$([\s\S]*)$/.exec(line);
      if (mb) {
        var acc = mb[1];
        if (/\$\$\s*$/.test(acc)) {
          acc = acc.replace(/\$\$\s*$/, '');
          i++;
        } else {
          i++;
          while (i < lines.length && lines[i].indexOf('$$') === -1) { acc += '\n' + lines[i]; i++; }
          if (i < lines.length) { acc += '\n' + lines[i].replace(/\$\$[\s\S]*$/, ''); i++; }
        }
        out.push('<div class="math-block">' + esc(tidyMath(acc)) + '</div>');
        continue;
      }

      /* --- 표 --- */
      if (/\|/.test(line) && i + 1 < lines.length && isTableDelim(lines[i + 1])) {
        var head = splitRow(line);
        var align = splitRow(lines[i + 1]).map(alignOf);
        i += 2;
        var rows = [];
        while (i < lines.length && !blank(lines[i]) && /\|/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        // 가로 스크롤 컨테이너는 필수다(계약 §2.6·§5). body에 가로 스크롤을 만들면 안 된다.
        var t = '<div class="table-wrap"><table><thead><tr>';
        head.forEach(function (c, k) {
          t += '<th' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
            inline(c.trim()) + '</th>';
        });
        t += '</tr></thead><tbody>';
        rows.forEach(function (row) {
          t += '<tr>';
          head.forEach(function (_, k) {
            t += '<td' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
              inline(String(row[k] == null ? '' : row[k]).trim()) + '</td>';
          });
          t += '</tr>';
        });
        out.push(t + '</tbody></table></div>');
        continue;
      }

      /* --- 인용 --- */
      if (/^\s{0,3}>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s{0,3}>/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^\s{0,3}>[ \t]?/, ''));
          i++;
        }
        out.push('<blockquote>' + blocks(qbuf.join('\n'), ctx, true) + '</blockquote>');
        continue;
      }

      /* --- 목록 --- */
      if (MARKER.test(line)) {
        var lm = MARKER.exec(line);
        var baseIndent = lm[1].length;
        var baseOrdered = !lm[2];
        var lbuf = [];
        while (i < lines.length) {
          if (blank(lines[i])) {
            var j = i + 1;
            while (j < lines.length && blank(lines[j])) j++;
            if (j < lines.length && /^(?:\s{2,}|\s*(?:[-*+]|\d+[.)])[ \t])/.test(lines[j])) {
              lbuf.push(''); i++; continue;
            }
            break;
          }
          var mm = MARKER.exec(lines[i]);
          // 같은 레벨에서 마커 종류가 바뀌면(- → 1.) 별개의 목록이다.
          if (mm && mm[1].length === baseIndent && (!mm[2]) !== baseOrdered) break;
          if (!mm && isHardBlockStart(lines[i])) break;
          lbuf.push(lines[i]);
          i++;
        }
        out.push(renderList(lbuf, ctx));
        continue;
      }

      /* --- 문단 --- */
      var pbuf = [line];

      while (i < lines.length && !isBlockBreak(lines, i)) { pbuf.push(lines[i]); i++; }

  // CRLF만 정규화한다. 탭은 건드리지 않는다 — 코드 블록 원문이 바뀌면 안 되기 때문이다.
  function norm(src) {

  // 코드 펜스 안과 ::: 상자 안의 `#`는 제외한다(계약 §2.7).
  // 슬러그 계산은 render()와 같은 함수를 쓰고, 스캔 순서도 같으므로 결과가 일치한다.
  function headings(markdown) {

      var used = {};
      var fence = null;
      var depth = 0;

      for (var i = 0; i < lines.length; i++) {

        var fm = /^\s{0,3}(`{3,}|~{3,})/.exec(l);
        if (fm) {
          if (!fence) fence = fm[1];
          else if (fm[1].charAt(0) === fence.charAt(0) && fm[1].length >= fence.length) fence = null;
          continue;
        }
        if (fence) continue;

        if (/^:::[ \t]*$/.test(l)) { if (depth > 0) depth--; continue; }
        if (/^:::[ \t]*\S/.test(l)) { depth++; continue; }

        if (!h) continue;
        var lvl = h[1].length;
        if (lvl !== 2 && lvl !== 3) continue;

,"num":"VIII-10","title":"DP 최적화 입문","desc":"슬라이딩 윈도우·누적합과의 결합"},{"id":"viii-11","num":"VIII-11","title":"DP 상태 정의 실패 사례집","desc":"상태가 부족하면 무엇이 먼저 깨지는가"}]},{"id":"advanced","num":"Part IX","title":"고급 자료구조·문자열","desc":"구간·집합·문자열을 로그 시간에 다루는 자료구조들. 실무 연결이 특히 진한 구간.","chapters":[{"id":"ix-1","num":"IX-1","title":"유니온 파인드","desc":"연결 요소 라벨링, 맵 병합"},{"id":"ix-2","num":"IX-2","title":"세그먼트 트리와 lazy propagation","desc":"구간 집계와 구간 갱신"},{"id":"ix-3","num":"IX-3","title":"펜윅 트리(BIT)","desc":"세그먼트 트리보다 짧고 빠른 경우"},{"id":"ix-4","num":"IX-4","title":"최소 신장 트리","desc":"크루스칼과 프림. 로드맵·토폴로지 맵 생성, 네트워크 설계"},{"id":"ix-5","num":"IX-5","title":"LCA와 희소 배열","desc":"좌표 프레임 트리의 공통 조상"},{"id":"ix-6","num":"IX-6","title":"트라이","desc":"명령어 자동완성, IP 라우팅 테이블"},{"id":"ix-7","num":"IX-7","title":"문자열 매칭","desc":"KMP, 라빈-카프. 로그 스캔과 grep의 정체"},{"id":"ix-8","num":"IX-8","title":"네트워크 플로우 입문","desc":"최대 유량, 이분 매칭. 작업 할당과 이어진다"}]},{"id":"math","num":"Part X","title":"수학·기하","desc":"정수론·조합론·기하. 부동소수점이 왜 배신하는지까지 끝낸다.","chapters":[{"id":"x-1","num":"X-1","title":"정수론","desc":"GCD/LCM, 유클리드 호제법"},{"id":"x-2","num":"X-2","title":"소수","desc":"에라토스테네스의 체, 소인수분해"},{"id":"x-3","num":"X-3","title":"모듈러 연산과 분할 정복 거듭제곱","desc":"나머지 연산의 규칙과 빠른 거듭제곱"},{"id":"x-4","num":"X-4","title":"조합론 기초","desc":"이항계수, 중복 조합, 포함배제"},{"id":"x-5","num":"X-5","title":"기하","desc":"CCW, 선분 교차, 다각형 내부 판정. 충돌 검사의 기초"},{"id":"x-6","num":"X-6","title":"볼록 껍질","desc":"로봇 footprint 생성"},{"id":"x-7","num":"X-7","title":"부동소수점의 함정","desc":"왜 ==로 비교하면 안 되는가, EPS 정하는 법, 정수로 우회하기"}]},{"id":"realtime","num":"Part XI","title":"실무 자료구조와 동시성","desc":"메모리 안이 아니라 시간 축 위에서 도는 자료구조. 동시성과 실시간 제약이 기준을 바꾼다.","chapters":[{"id":"xi-1","num":"XI-1","title":"링 버퍼(원형 큐)","desc":"센서 스트림, 로그 버퍼, 오버런 정책"},{"id":"xi-2","num":"XI-2","title":"생산자-소비자와 유계 큐","desc":"제어 루프와 통신 스레드를 분리한다"},{"id":"xi-3","num":"XI-3","title":"락과 락프리","desc":"뮤텍스, 조건변수, 원자적 연산, 메모리 순서, SPSC 락프리 큐"},{"id":"xi-4","num":"XI-4","title":"스레드 풀과 작업 큐","desc":"병렬 이미지 처리, 워크 스틸링"},{"id":"xi-5","num":"XI-5","title":"실시간 스케줄링 개념","desc":"우선순위, RM/EDF, 우선순위 역전"},{"id":"xi-6","num":"XI-6","title":"상태 기계","desc":"FSM, 계층적 FSM, Behavior Tree. 작업 오더 상태머신"},{"id":"xi-7","num":"XI-7","title":"이벤트 루프와 백프레셔","desc":"메시지 폭주로부터 시스템을 지키는 법"},{"id":"xi-8","num":"XI-8","title":"타이머 휠과 지연 큐","desc":"타임아웃과 재시도"},{"id":"xi-9","num":"XI-9","title":"공간 인덱스","desc":"그리드 해싱, KD 트리, 옥트리, R 트리. 최근접 탐색과 충돌 검사"},{"id":"xi-10","num":"XI-10","title":"그래프의 메모리 표현","desc":"CSR, 인접 리스트와 행렬의 실제 비용"},{"id":"xi-11","num":"XI-11","title":"순환 참조와 소유권","desc":"그래프 자료구조의 메모리 관리, 스마트 포인터 사이클"}]},{"id":"patterns","num":"Part XII","title":"설계 패턴","desc":"카탈로그를 나열하지 않는다. 실제 시스템에서 그 패턴이 박혀 있는 지점을 먼저 보이고 이름은 나중에 붙인다.","chapters":[{"id":"xii-1","num":"XII-1","title":"패턴을 왜 배우는가","desc":"이름 붙이기의 힘과 남용의 위험"},{"id":"xii-2","num":"XII-2","title":"Adapter","desc":"이기종 장비 프로토콜 변환 계층"},{"id":"xii-3","num":"XII-3","title":"Facade / Bridge / Proxy","desc":"서브시스템 단일 창구, 원격 객체 프록시, 지연 로딩"},{"id":"xii-4","num":"XII-4","title":"Decorator / Composite","desc":"Behavior Tree 노드 합성, 레이어 중첩, 미들웨어 체인"},{"id":"xii-5","num":"XII-5","title":"Factory Method / Abstract Factory / Builder","desc":"드라이버·플러그인 생성, 설정 기반 객체 조립"},{"id":"xii-6","num":"XII-6","title":"Strategy","desc":"경로 플래너·컨트롤러 교체, 압축·인코딩 교체"},{"id":"xii-7","num":"XII-7","title":"Observer / Publish-Subscribe","desc":"토픽·이벤트 버스·메시지 브로커의 정체, 콜백 지옥과 그 해법"},{"id":"xii-8","num":"XII-8","title":"State","desc":"작업 오더 상태머신. if-else 지옥과 상태 객체"},{"id":"xii-9","num":"XII-9","title":"Command","desc":"즉시 액션, 작업 큐, 실행 취소와 재시도"},{"id":"xii-10","num":"XII-10","title":"Template Method / Chain of Responsibility","desc":"알고리즘 골격 고정, 에러 핸들러 체인, 미들웨어"},{"id":"xii-11","num":"XII-11","title":"Mediator","desc":"트래픽 매니저. 개체끼리 직접 말하지 않고 중재자를 통한다"},{"id":"xii-12","num":"XII-12","title":"Singleton과 그 함정","desc":"제어 소프트웨어에서 싱글톤이 재앙이 되는 경로, 테스트 불가능성"},{"id":"xii-13","num":"XII-13","title":"동시성 패턴","desc":"Active Object, Reactor, Monitor, Half-Sync/Half-Async"},{"id":"xii-14","num":"XII-14","title":"아키텍처 패턴","desc":"계층형(Sense-Plan-Act), 포트&어댑터, 플러그인 아키텍처, 블랙보드, 파이프-필터"},{"id":"xii-15","num":"XII-15","title":"안티패턴","desc":"God Object, 싱글톤 남용, 스마트 UI, 순환 의존, 조기 추상화"},{"id":"xii-16","num":"XII-16","title":"패턴 선택 결정 트리","desc":"Part I과 같은 형식으로 접는다"}]},{"id":"perception","num":"Part XIII","title":"상태추정·인지 알고리즘","desc":"센서 값에서 상태를 복원하는 알고리즘. 자료구조 대신 확률과 최적화가 뼈대를 이룬다.","chapters":[{"id":"xiii-1","num":"XIII-1","title":"점유 격자 지도와 로그 오즈 갱신","desc":"확률을 덧셈으로 바꾸는 표현"},{"id":"xiii-2","num":"XIII-2","title":"베이즈 필터의 뼈대","desc":"예측과 보정, 두 단계가 전부다"},{"id":"xiii-3","num":"XIII-3","title":"칼만 필터와 EKF","desc":"수식 최소화, 직관 우선"},{"id":"xiii-4","num":"XIII-4","title":"파티클 필터","desc":"샘플로 분포를 대신한다"},{"id":"xiii-5","num":"XIII-5","title":"ICP","desc":"점군 정합"},{"id":"xiii-6","num":"XIII-6","title":"RANSAC","desc":"이상치에 강건한 모델 추정"},{"id":"xiii-7","num":"XIII-7","title":"포즈 그래프 최적화와 루프 클로저","desc":"누적 오차를 한 번에 되돌린다"},{"id":"xiii-8","num":"XIII-8","title":"이미지 기본 연산","desc":"컨볼루션, 형태학, 엣지"},{"id":"xiii-9","num":"XIII-9","title":"허프 변환과 특징점(ORB) 매칭","desc":"선을 찾고 대응점을 찾는다"}]},{"id":"scale","num":"Part XV","title":"시스템 규모의 자료구조","desc":"\"메모리에 다 들어간다\"는 가정이 깨지는 순간 무엇이 달라지는가. 코딩테스트에는 안 나오고 실무 시스템에는 전부 들어 있다.","chapters":[{"id":"xv-1","num":"XV-1","title":"메모리를 벗어나는 순간","desc":"캐시 계층, 페이지, 블록 I/O. 왜 인메모리 자료구조가 디스크에서 무너지는가"},{"id":"xv-2","num":"XV-2","title":"B-Tree와 B+Tree","desc":"높이를 낮춰 디스크 읽기 횟수를 줄인다. 관계형 DB 인덱스, 파일시스템"},{"id":"xv-3","num":"XV-3","title":"LSM Tree와 SSTable","desc":"쓰기를 순차화한다. RocksDB, LevelDB, Cassandra, 시계열 DB"},{"id":"xv-4","num":"XV-4","title":"블룸 필터와 쿠쿠 필터","desc":"거짓양성을 허용하고 공간을 줄인다. SSTable 스킵, 크롤러 중복 제거"},{"id":"xv-5","num":"XV-5","title":"스킵 리스트","desc":"확률로 균형을 잡는다. Redis Sorted Set, 동시성 인덱스"},{"id":"xv-6","num":"XV-6","title":"카디널리티·빈도 추정","desc":"HyperLogLog, Count-Min Sketch. 유니크 방문자 수, 핫키 검출"},{"id":"xv-7","num":"XV-7","title":"머클 트리와 해시 체인","desc":"부분만 비교해 차이를 찾는다. Git 오브젝트 그래프, 복제본 동기화"},{"id":"xv-8","num":"XV-8","title":"일관성 해싱","desc":"노드가 늘고 줄 때 재배치를 최소화한다. 샤딩, 분산 캐시, 로드 밸런서"},{"id":"xv-9","num":"XV-9","title":"캐시 교체 정책","desc":"LRU/LFU/ARC/W-TinyLFU를 직접 구현하고 히트율을 비교한다"},{"id":"xv-10","num":"XV-10","title":"레이트 리미팅","desc":"토큰 버킷, 리키 버킷, 슬라이딩 윈도우. API 게이트웨이와 백프레셔"},{"id":"xv-11","num":"XV-11","title":"복제와 합의 입문","desc":"왜 어려운가, Raft의 뼈대, 벡터 클럭, CRDT"},{"id":"xv-12","num":"XV-12","title":"메모리에 안 들어가는 데이터 처리","desc":"외부 정렬, 병합 전략, 스트리밍 집계, MapReduce의 자료구조적 정체"}]},{"id":"wrapup","num":"Part XIV","title":"종합","desc":"전 Part를 한 장의 지도로 접는다. 항상 마지막에 온다.","chapters":[{"id":"xiv-1","num":"XIV-1","title":"실전 체크리스트","desc":"시험장과 실무에서 그대로 꺼내 쓰는 목록"},{"id":"xiv-2","num":"XIV-2","title":"기술 면접 CS 총정리","desc":"전 Part의 면접 상자를 한곳에 모은다"},{"id":"xiv-3","num":"XIV-3","title":"시스템 설계형 질문 대비","desc":"자료구조 선택으로 답하는 뼈대"},{"id":"xiv-4","num":"XIV-4","title":"알고리즘 계보 한 장 지도","desc":"BFS에서 CBS까지, 해시에서 HyperLogLog까지"}]}],"docs":{"0-11":"# 0-11 손추적(dry run) 방법론\n\n::: lead\n코드를 실행하지 않고, 종이 위에서 그 코드가 실제로 무엇을 하는지 정확히 아는 방법.\n:::\n\n## 1. 문제\n\n이분 탐색은 열 줄이다. 읽으면 전부 이해된다. 그런데 직접 짜면 셋 중 하나가 일어난다. 답이 정확히 하나 어긋나거나, 배열 범위를 벗어나거나, 프로그램이 끝나지 않는다. 채점기가 돌려주는 것은 `틀렸습니다` 한 줄뿐이고, 어느 줄이 문제인지는 알려주지 않는다.\n\n흔한 대응은 코드를 조금 고쳐서 다시 제출하는 것이다. `<`를 `<=`로 바꿔 보고, `mid`를 `mid+1`로 바꿔 보고, `hi`를 `n`에서 `n-1`로 바꿔 본다. 네 군데를 각각 두 가지로 바꾸면 조합이 열여섯 개다. 그중 하나가 우연히 통과해도 그 코드는 통과했을 뿐 이해된 것이 아니다. 다음 문제에서 같은 열여섯 개를 다시 돌리게 된다.\n\n디버거를 붙이면 되지 않느냐는 반문이 나온다. 붙일 수 없는 자리가 셋 있다.\n\n- **면접과 화이트보드.** 실행 환경 자체가 없다. 종이 위에서 코드가 옳다는 것을 설명해야 한다.\n- **실시간·동시성 코드.** 브레이크포인트는 타이밍을 바꾼다. 멈춰 세우는 순간 재현되던 경합 조건이 사라진다. 이 현상은 [XI-3 락과 락프리](#/xi-3)에서 다시 다룬다.\n- **재현되지 않는 입력.** 10만 개짜리 입력 중 어느 하나에서만 깨지는 경우, 그 하나를 찾기 전까지 디버거는 붙일 자리가 없다.\n\n더 근본적인 이유가 있다. ==디버거는 코드가 무엇을 하는지 보여주지만, 코드가 무엇을 해야 하는지는 보여주지 않는다.== 화면의 `lo = 3`이 옳은지 틀린지는 결국 사람이 판단한다. 그 판단의 근거를 만드는 것이 손추적이다.\n\n\"읽으면 이해되는데 못 짠다\"는 상태의 정체도 여기 있다. 읽을 때는 **코드가 상태를 대신 들고 있다.** 짤 때는 그 상태를 전부 머리가 들어야 한다. 읽기는 실행 모델 없이도 되지만 쓰기는 안 된다. 손추적은 그 모델을 종이에 외부화해 훈련하는 절차다.\n\n비용은 싸다. 이분 탐색은 원소가 100만 개여도 20스텝, 여섯 개로 줄이면 세 스텝이다. **표 세 줄이 열여섯 번의 제출을 대체한다.**\n\n## 2. 아이디어\n\n손추적은 상태 표를 그리는 일이다. 표를 그린다는 것은 세 가지를 결정한다는 뜻이다. 무엇을 열로 둘 것인가, 언제 한 줄을 찍을 것인가, 언제 멈출 것인가.\n\n### 2.1 무엇을 관찰할 것인가\n\n변수를 전부 열로 만들면 표가 죽는다. 열이 열두 개인 표는 채우다 지치고, 채워도 무엇이 이상한지 보이지 않는다. 남길 것은 세 부류뿐이다.\n\n**첫째, 경계 변수.** 그 알고리즘의 **불변식**이 걸려 있는 변수다. 불변식은 특정 지점에서 항상 참이어야 하는 명제다. 반열림 구간 이분 탐색이라면 \"답은 항상 `[lo, hi)` 안에 있다\"가 불변식이고, 거기 등장하는 `lo`와 `hi`가 경계 변수다. BFS라면 \"큐 안의 정점들은 거리 순으로 정렬되어 있다\"가 불변식이고 큐가 경계다.\n\n**둘째, 측도.** 매 반복 반드시 줄어드는 음이 아닌 정수량이다. 이분 탐색에서는 구간의 폭 `hi - lo`가 측도다. 0 밑으로 못 내려가는데 매번 줄어드니 무한히 돌 수 없고, 그래서 루프가 끝난다는 것이 증명된다. 반대로 **측도가 줄지 않는 반복이 한 번이라도 있으면 그 코드는 무한 루프에 빠질 수 있다.**\n\n**셋째, 판정에 쓰인 파생값.** `mid`, `a[mid]`, 비교 결과다. 이 열이 없으면 다음 줄에서 왜 그쪽으로 갔는지 재구성할 수 없다.\n\n**불변식이 정확성을 맡고 측도가 종료를 맡는다.** 알고리즘이 옳다는 말은 이 둘이 모두 성립한다는 뜻이고, 손추적 표는 그것을 한 화면에서 확인하는 장치다.\n\n::: note\n열을 고르는 일이 손추적의 절반이다. ==열을 못 고르겠다면 그 알고리즘을 아직 이해하지 못한 것이다.== 이것은 실패가 아니라 유용한 신호다. 코드를 더 들여다볼 것이 아니라 \"이 루프가 매 바퀴 지켜야 하는 명제가 무엇인가\"를 한 문장으로 먼저 적어야 한다는 뜻이다.\n:::\n\n### 2.2 언제 한 줄을 찍을 것인가\n\n스냅샷 지점은 **루프 머리 한 곳으로 고정한다.** 불변식은 루프 머리에서 참인 명제이지 루프 중간에서 참인 명제가 아니다. `lo`는 갱신했는데 `hi`는 아직 안 갱신한 시점의 상태를 표에 적으면, 그 줄은 어떤 불변식도 만족하지 않는 유령 상태가 된다. 표가 거짓말을 시작하는 지점이 대개 여기다.\n\n재귀 함수라면 찍는 자리는 **함수 진입 직후**다. 열에는 인자와 현재 깊이를 둔다. 반환값은 별도 열로 두고 되돌아올 때 채운다. 이 형식은 [III-1 재귀 사고법](#/iii-1)에서 호출 트리로 확장된다.\n\n### 2.3 언제 멈출 것인가\n\n세 줄만 채우고 덮는 습관은 손추적의 효과를 거의 다 버린다. **끝까지 간다.** 정확히는 측도가 0이 되고 루프 조건이 거짓이 되는 줄까지 간다.\n\n오프바이원은 거의 항상 마지막 한 줄에서 드러나기 때문이다. 중간 스텝은 웬만한 구현이 다 통과한다. `lo`와 `hi`가 붙는 마지막 순간에 한쪽이 하나 어긋나거나 조건이 `<=`여서 한 바퀴를 더 도는 것이 그 자리에서 나온다. 표의 마지막 줄은 \"루프가 끝났을 때 무엇이 보장되는가\"를 적는 줄이고, 그것이 곧 반환값의 의미다.\n\n### 2.4 표의 모양\n\n```text nolines\n  step | lo | hi | width | mid | a[mid] | branch\n  -----+----+----+-------+-----+--------+-----------\n     0 |  0 |  6 |     6 |   3 |      5 | hi = mid\n     1 |  0 |  3 |     3 |   1 |      3 | lo = mid+1\n     2 |    |    |       |     |        |\n          ^            ^                    ^\n          |            |                    +-- 갱신: 어느 쪽 절반을 버렸는가\n          |            +---------------------- 측도: 반드시 단조 감소한다\n          +----------------------------------- 경계: 불변식이 걸려 있는 변수\n```\n\n왼쪽 세 덩어리가 전부다. 경계가 불변식을 지키는지 보고, 측도가 줄어드는지 보고, 갱신 규칙이 방금 검사한 원소를 제대로 처리했는지 본다. 세 번째 확인이 오프바이원을 잡는다. **`mid`를 검사했으면 `mid`는 반드시 어느 한쪽에서 사라져야 한다.** 양쪽 다 `mid`를 남기면 구간이 줄지 않고, 양쪽 다 `mid`를 버리면 답을 건너뛴다.\n\n### 2.5 어떤 입력으로 추적할 것인가\n\n크기는 **답이 나오는 최소 크기의 두 배** 정도가 좋다. 원소 여섯 개면 세 스텝을 돌아 갈림길이 양쪽 다 한 번씩 나온다. 세 개면 한쪽 분기만 밟고 끝나 반쪽만 검증된다.\n\n값의 배치는 세 가지를 각각 돌린다.\n\n1. **답이 중간에 있는 입력.** 정상 경로.\n2. **답이 맨 끝에 있는 입력.** 오른쪽 경계가 닫힌 구간인지 열린 구간인지가 여기서 갈린다.\n3. **답이 없는 입력.** 루프가 빈 구간에서 어떻게 끝나는지, 그때 돌려주는 값이 무엇인지가 여기서 정해진다.\n\n중복 원소를 하나 섞어 두는 것도 값싸다. `a = [1, 3, 3, 5, 7, 9]`에서 `3`이 둘인 이유가 그것이다. \"첫 위치\"와 \"마지막 다음 위치\"를 구분하는 구현인지가 이 입력에서만 드러난다.\n\n### 2.6 손추적이 잡지 못하는 것\n\n::: widget complexity-plot {\"n\":1000000,\"curves\":[\"n\",\"n log n\",\"n^2\",\"2^n\"],\"budget\":100000000}\n:::\n\n위젯은 N이 커질 때 $O(n)$, $O(n \\log n)$, $O(n^2)$, $O(2^n)$이 로그 축에서 얼마나 벌어지는지와 \"1초 안에 되는 선\"이 어디를 지나는지를 보인다. 슬라이더를 밀면 $O(n^2)$ 곡선이 그 선을 넘는 지점이 나오고, $O(2^n)$은 훨씬 왼쪽에서 이미 넘어가 있다.\n\n이 그림이 여기 있는 이유는 **손추적의 한계를 긋기 위해서다.** 손추적은 정확성 도구이지 성능 도구가 아니다. 원소 여섯 개를 손으로 따라가서는 그 알고리즘이 100만 개에서 시간 초과인지 알 수 없다. 성능은 제약조건에서 거꾸로 계산한다. 그 절차는 [0-9 N 범위로 알고리즘 역산하기](#/0-9)에 있다.\n\n::: tip\n두 도구를 쓰는 순서가 정해져 있다. **역산이 먼저, 손추적이 나중이다.** 역산으로 알고리즘 후보를 정하고 나서 그 후보의 구현을 손으로 따라간다. 순서를 뒤집으면 시간 초과가 확정된 코드를 정성껏 검증하는 일이 생긴다.\n:::\n\n::: hist\n손추적은 새 기법이 아니다. 계산 자원이 비싸고 한 번의 실행에 대기 시간이 길던 시절, 코드를 기계에 넣기 전에 책상에서 종이로 검증하는 것이 표준 절차였고 그 절차의 이름이 desk checking이다. 기계가 싸지면서 \"일단 돌려 보고 고친다\"가 자리를 대신했다.\n\n다만 그 시절의 명제 하나는 지금도 유효하다. Dijkstra는 1970년의 노트에서 테스트가 버그의 존재를 보일 수는 있어도 부재를 보일 수는 없다고 적었다. 실행은 넣어 본 입력에 대해서만 말하고, 불변식과 측도는 넣어 보지 않은 입력에 대해서도 말한다. 손추적이 겨냥하는 것은 실행이 답할 수 없는 질문 쪽이다.\n:::\n\n## 3. 손으로 따라가기\n\n::: trace\n입력: `a = [1, 3, 3, 5, 7, 9]`, 찾을 값 `x = 5`.\n구할 것: `a[i] >= 5`를 만족하는 **가장 왼쪽 인덱스** `i`.\n\n불변식: 답은 항상 반열림 구간 `[lo, hi)` 안에 있다. 시작은 `lo = 0`, `hi = 6`.\n갱신 규칙: `mid = lo + (hi - lo) // 2`. `a[mid] >= 5`이면 `hi = mid`, 아니면 `lo = mid + 1`.\n루프 조건: `lo < hi`.\n\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 2 |\n| 2 |  |  |  |  |  |  |  |\n| 3 |  |  |  |  |  |  |  |\n\n세 가지를 확인하라.\n\n- [ ] `width` 열이 매 스텝 **실제로** 줄어드는가\n- [ ] 루프가 멈추는 순간 `lo`와 `hi`는 각각 얼마인가\n- [ ] 그때의 `lo`가 정말 답인가. 답이 `[lo, hi)` 안에 있다는 불변식이 폭 0인 구간에서 무엇을 뜻하는가\n:::\n\n::: answer\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 2 |\n| 2 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 3 |\n| 3 | 3 | 3 | 0 | — | — | — | `lo < hi`가 거짓, 종료 |\n\n답은 `lo = 3`이고 `a[3] = 5`가 맞다.\n\n`width` 열이 `6 → 3 → 1 → 0`으로 매 스텝 엄격히 줄었다. 이것이 이 루프가 반드시 끝난다는 증거다. 스텝 수는 폭이 매번 절반 이하로 줄어드는 데서 나온다.\n\n마지막 질문의 핵심은 폭 0인 구간에서 불변식이 무엇을 뜻하느냐다. `[3, 3)`은 빈 구간이다. \"답이 이 안에 있다\"가 참이려면 답은 이 구간의 **왼쪽 끝 위치**, 즉 `lo`여야 한다. 반열림으로 짜면 `lo`와 `hi`가 만나는 지점이 곧 답이라 루프 뒤에 보정할 것이 없다. 닫힌 구간으로 짜면 끝난 뒤 `lo`인지 `lo+1`인지를 매번 다시 생각해야 한다. ==구간 표기를 반열림으로 통일하는 것이 오프바이원에 대한 가장 값싼 방어다.==\n\n**이제 규칙 하나만 바꿔 같은 표를 다시 채워 보라.** `lo = mid + 1` 대신 `lo = mid`로 두면:\n\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 1 |\n| 2 | 1 | 3 | 2 | 2 | 3 | 아니오 | lo = 2 |\n| 3 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 2 |\n| 4 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 2 |\n\n스텝 3에서 `width`가 1로 멈춘다. `mid`가 `lo`와 같아지는 순간 `lo = mid`는 아무것도 바꾸지 않고, 표는 같은 줄을 영원히 반복한다. **무한 루프가 실행 없이 표 다섯 줄에서 잡혔다.** 이것이 측도를 열로 두는 이유다.\n:::\n\n## 4. 구현\n\n손추적 표를 그대로 코드로 옮기면 추적 로그가 된다. 열 이름이 곧 출력 필드이고 출력 지점이 곧 루프 머리다. 표를 먼저 그렸다면 무엇을 찍을지 고민할 일이 없다.\n\n::: dual\n```python title=\"lower_bound — 손추적 표를 코드가 대신 찍게 하기\"\ndef lower_bound(a, x):\n    lo, hi = 0, len(a)          # 불변식: 답은 항상 [lo, hi) 안에 있다\n    step = 0\n    while lo < hi:              # 측도: hi - lo 가 매 반복 반드시 줄어든다\n        mid = lo + (hi - lo) // 2\n        print(f\"step={step} lo={lo} hi={hi} width={hi - lo} mid={mid} a[mid]={a[mid]}\")\n        if a[mid] >= x:\n            hi = mid            # mid 는 조건을 만족하므로 후보로 남긴다\n        else:\n            lo = mid + 1        # mid 는 조건을 만족하지 못하므로 버린다\n        step += 1\n    print(f\"done lo={lo} hi={hi} width={hi - lo}\")\n    return lo\n\n\na = [1, 3, 3, 5, 7, 9]\nans = lower_bound(a, 5)\nprint(\"answer =\", ans)\n```\n```cpp title=\"lower_bound — 손추적 표를 코드가 대신 찍게 하기\"\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint lower_bound(const vector<int>& a, int x) {\n    int lo = 0, hi = (int)a.size();   // 불변식: 답은 항상 [lo, hi) 안에 있다\n    int step = 0;\n    while (lo < hi) {                 // 측도: hi - lo 가 매 반복 반드시 줄어든다\n        int mid = lo + (hi - lo) / 2;\n        cout << \"step=\" << step << \" lo=\" << lo << \" hi=\" << hi\n             << \" width=\" << hi - lo << \" mid=\" << mid << \" a[mid]=\" << a[mid] << \"\\n\";\n        if (a[mid] >= x)\n            hi = mid;                 // mid 는 조건을 만족하므로 후보로 남긴다\n        else\n            lo = mid + 1;             // mid 는 조건을 만족하지 못하므로 버린다\n        step += 1;\n    }\n    cout << \"done lo=\" << lo << \" hi=\" << hi << \" width=\" << hi - lo << \"\\n\";\n    return lo;\n}\n\nint main() {\n    vector<int> a = {1, 3, 3, 5, 7, 9};\n    int ans = lower_bound(a, 5);\n    cout << \"answer = \" << ans << \"\\n\";\n    return 0;\n}\n```\n:::\n\n두 구현의 출력은 한 글자도 다르지 않다.\n\n```console\nstep=0 lo=0 hi=6 width=6 mid=3 a[mid]=5\nstep=1 lo=0 hi=3 width=3 mid=1 a[mid]=3\nstep=2 lo=2 hi=3 width=1 mid=2 a[mid]=3\ndone lo=3 hi=3 width=0\nanswer = 3\n```\n\n**복잡도:** 시간 $O(\\log n)$ — 매 반복마다 구간 폭 `hi - lo`가 절반 이하로 줄고, 폭이 0이 되면 끝나므로 반복 횟수는 폭을 1까지 반으로 접는 횟수, 즉 $\\log_2 n$을 넘지 않는다. 공간 $O(1)$ — 재귀 없이 정수 변수 네 개만 쓰므로 입력 크기와 무관하다.\n\n상수도 말해 둔다. $O(\\log n)$은 $n = 10^6$에서 20회지만 **각 스텝이 배열의 전혀 다른 곳을 찌른다.** 접근 위치가 매번 절반씩 뛰어 캐시 라인이 재사용되지 않으므로 초반 스텝은 사실상 매번 캐시 미스다. 같은 20회라도 연속 접근 20회와는 비용이 다르다. 이 차이는 [0-6 C++ 컨테이너 세트](#/0-6)에서 다룬다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 정수 나눗셈 | `//`는 항상 내림. 음수에서 `-1 // 2 == -1` | `/`는 0 방향 절삭. `-1 / 2 == 0` |\n| `(lo + hi)` 오버플로 | 임의 정밀도라 발생하지 않는다 | `int` 범위를 넘을 수 있다. `lo + (hi - lo) / 2`로 쓰는 이유 |\n| 배열 길이 타입 | `len(a)`는 `int` | `a.size()`는 부호 없는 `size_t`. 부호 있는 값과 섞으면 비교가 뒤집힌다 |\n| 표준 대응 | `bisect.bisect_left(a, x)` | `std::lower_bound(a.begin(), a.end(), x)` |\n| 이름 충돌 | 없음 | `using namespace std;` 아래에서 같은 이름을 쓰면 인자 개수로 구분된다. 헷갈리면 이름을 바꿔라 |\n\n::: danger\n`mid = (lo + hi) / 2`는 C++에서 실제 장애를 만드는 코드다. `lo`와 `hi`가 각각 20억 근처면 합이 `int` 범위를 넘어 음수가 되고, 음수 인덱스로 배열을 읽는다. 정의되지 않은 동작이라 크래시할 수도 있고 조용히 쓰레기 값을 읽을 수도 있다.\n\n`mid = lo + (hi - lo) / 2`로 쓰면 뺄셈이 먼저라 중간값이 커지지 않는다. **Python에서는 두 표기가 동등하지만 같은 습관을 양쪽에 들여 두는 편이 안전하다.** 언어를 오갈 때 무너지는 것은 지식이 아니라 습관이다. 오버플로가 무엇을 부수는지는 [0-5 C++ 입출력과 기본 타입](#/0-5)에 있다.\n:::\n\n::: warn\n추적 출력은 **디버깅용이지 제출용이 아니다.** 채점기는 표준 출력을 정답과 비교하므로 로그 한 줄이 섞이면 알고리즘이 맞아도 오답이 된다. 지우는 것을 잊는 사고가 잦다면 `sys.stderr` / `cerr`로 보내라. 표준 에러는 채점 대상이 아니다.\n:::\n\n::: perf\n추적 출력을 켠 채로 큰 입력을 돌리는 것은 방법이 아니다. 정렬된 배열 $n = 10^6$에 질의 10만 번이면 한 질의가 약 20스텝이라 로그가 약 200만 줄 나온다. 그 200만 줄을 전부 `/dev/null`로 버렸는데도 이렇다.\n\n| | 추적 없이 | 추적 출력 | 배수 |\n|---|---|---|---|\n| Python 3.13 | 0.42초 | 1.43초 | 3.4배 |\n| C++17 `-O2` | 0.018초 | 0.69초 | 38배 |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다.)\n\nC++ 쪽 배수가 압도적으로 큰 것이 핵심이다. 계산 자체가 이미 0.018초로 끝나므로 계측 코드가 전체를 지배한다. **알고리즘이 빠를수록 로그가 프로그램이 된다.** 손추적이 입력을 여섯 개로 줄이는 데서 시작하는 이유가 이것이다.\n:::\n\n버그가 있는 쪽도 같은 형식으로 남긴다. 아래는 앞 절의 정답 상자에서 무한 루프를 만든 변형이다.\n\n```python title=\"무한 루프에 빠지는 버전 (조각)\" {2,4-5}\nwhile lo < hi:\n    mid = lo + (hi - lo) // 2\n    if a[mid] >= x:\n        hi = mid       # ✅ mid 는 조건을 만족하므로 후보로 남긴다\n    else: lo = mid     # ❌ mid 는 조건을 만족하지 않는데도 버리지 않았다\n```\n\n정수 나눗셈이 내림이라 `mid`는 폭이 1일 때 항상 `lo`와 같아지고, 그 순간 `lo = mid`는 아무 일도 하지 않는다. 즉 **이 버그는 폭이 1이 되기 전까지 드러나지 않는다.** 표를 끝까지 채우라는 §2.3이 겨냥하는 것이 이 종류다.\n\n무한 루프를 <kbd>Ctrl</kbd>+<kbd>C</kbd>로 끊었을 때 마지막 로그 몇 줄이 같은 값을 반복하고 있다면, 원인은 거의 항상 측도가 줄지 않는 갱신 규칙이다.\n\n::: pitfall\n- **`mid`를 양쪽 다 남긴다.** `hi = mid`와 `lo = mid`를 함께 쓰면 폭 1에서 멈춘다. 한쪽은 반드시 `mid`를 버려야 한다.\n- **구간 표기를 섞는다.** `hi = len(a)`로 시작해 놓고 `while lo <= hi`를 쓰면 첫 반복부터 `a[len(a)]`를 읽는다. 반열림이면 조건은 `<`, 닫힌 구간이면 `hi = len(a) - 1`에 `<=`다. 한 함수 안에서 표기는 하나로 통일한다.\n- **끝난 뒤의 값을 확인하지 않는다.** `x`가 모든 원소보다 크면 `lo == len(a)`가 되고, 그대로 `a[lo]`를 읽으면 터진다. 반환값을 쓰기 전에 범위 검사를 넣어라.\n- **관찰 대상을 잘못 고른다.** `mid`만 열로 두고 `width`를 빼면 무한 루프가 표에서 보이지 않는다. 측도 열은 선택이 아니다.\n- **중간 상태를 표에 적는다.** `lo`만 갱신하고 `hi`는 아직인 시점을 남기면 그 줄은 어떤 불변식도 만족하지 않는다. 찍는 자리는 루프 머리 하나다.\n- **표를 세 줄에서 덮는다.** 오프바이원은 마지막 줄에서 드러난다.\n:::\n\n::: deep\n불변식과 측도를 함께 쓰는 이 형식은 즉흥적인 요령이 아니라 프로그램 검증의 표준 도구를 축소한 것이다. Hoare가 1969년에 제시한 논리에서 루프의 정확성은 사전조건, 불변식, 사후조건으로 서술된다. 루프 조건이 거짓이 된 시점에 \"불변식 ∧ ¬루프조건\"이 성립하고, 그것이 곧 사후조건이 되어야 한다.\n\n이분 탐색에 대입하면 이렇다. 불변식은 \"답은 `[lo, hi)` 안에 있다\", 루프 조건의 부정은 `lo >= hi`이고 폭이 음수가 될 수 없으니 `lo == hi`다. 둘을 결합하면 \"답은 폭 0인 구간의 위치, 즉 `lo`이다\"가 나온다. **루프가 끝난 뒤 `lo`를 돌려주면 된다는 결론이 코드를 보지 않고 논리만으로 나온다.** 종료는 측도가 따로 담당한다.\n\n실전에서 값어치를 하는 지점은 증명 자체가 아니라 **문서화**다. 루프 위에 불변식 한 줄을 주석으로 적어 두면 반년 뒤 그 루프를 고치는 사람이 무엇을 깨면 안 되는지 즉시 안다. 주석에는 \"무엇을 하는지\"가 아니라 \"무엇이 항상 참인지\"를 적어라.\n:::\n\n## 5. 어디에 쓰이는가\n\n**코드 리뷰가 손추적이다.** 리뷰어가 루프 앞에서 멈춰 \"여기서 `i`가 `n-1`까지 가나 `n`까지 가나\"를 묻는 행위는 머릿속에서 표를 두어 줄 채우는 일이다. 리뷰 코멘트가 \"이상한 것 같은데요\"에서 \"`n=1`일 때 이 루프는 한 번도 안 돕니다\"로 바뀌는 순간, 그것은 표의 마지막 줄을 실제로 채워 봤다는 뜻이다.\n\n**로그 필드 설계가 관찰 대상 선택과 같은 문제다.** 운영 중인 시스템에서 무엇을 로그로 남길지 정하는 일은 어떤 변수를 열로 둘지 정하는 일과 같다. 전부 찍으면 디스크가 차고 정작 필요한 줄을 못 찾는다. 남길 것은 그 컴포넌트의 불변식이 깨졌는지 판정할 수 있는 최소 필드다. 큐 길이, 처리 지연, 재시도 횟수가 그 자리에 온다. 이 관점은 [XI-7 이벤트 루프와 백프레셔](#/xi-7)에서 다시 쓰인다.\n\n**단위 테스트의 케이스 표가 손추적의 마지막 줄이다.** §2.5에서 고른 세 입력은 그대로 테스트 케이스 세 개가 된다. 손추적으로 확인한 것을 테스트로 고정하면 다음에 그 함수를 고칠 때 같은 확인을 다시 손으로 하지 않아도 된다.\n\n**실시간·임베디드 코드에서는 대안이 없다.** 제어 주기가 1밀리초인 루프에 브레이크포인트를 걸면 그 순간 시스템의 동작 자체가 달라진다. 관측이 대상을 바꾼다. 이 영역에서 검증은 실행 전에, 종이 위에서 이루어진다.\n\n## 6. 이 유형을 알아보는 법\n\n손추적이 필요한 코드에는 공통된 표식이 있다.\n\n::: classify\n- 신호어: \"정확히 K번\", \"이상/이하\", \"포함한다/포함하지 않는다\", \"가장 왼쪽의\", \"처음으로 ~가 되는 시점\"\n- 제약조건: 구간이 반열림인지 닫힘인지 지문이 명시하지 않을 때. 인덱스가 1부터 시작하는 입력. 원소가 1개일 수 있는 입력. 답이 없을 수 있는 입력\n- 혼동 주의: 경계가 흔들리는 것과 알고리즘 선택이 틀린 것은 다른 문제다. 손추적은 앞쪽만 고친다. 유형 자체를 잘못 잡은 경우는 [I-5 오분류 사례집](#/i-5)으로 간다\n- 반례 함정: 원소 1개, 답이 맨 끝, 답이 아예 없음. 이 세 입력에서만 깨지는 구현이 대부분이고, 중간 크기 입력만 돌려 보면 전부 통과한다\n:::\n\n::: interview\n경계가 있는 루프를 화이트보드에 짜게 한 뒤 이어지는 질문은 대개 둘이다.\n\n**\"이 루프가 무한 루프에 빠지지 않는 이유를 설명해 보세요.\"**\n답변 뼈대는 측도다. 매 반복 엄격히 줄어드는 음이 아닌 정수량을 지목하고, 그것이 0 밑으로 못 내려간다는 것을 말한다. \"구간 폭 `hi - lo`가 매 반복 최소 1 줄고 0 밑으로는 못 갑니다. 따라서 최대 초기 폭만큼만 돌고 끝납니다.\" \"테스트해 봤는데 잘 돌았습니다\"는 답이 아니다.\n\n**\"이 함수가 옳은 값을 돌려준다는 것을 어떻게 압니까.\"**\n답변 뼈대는 불변식이다. 루프 머리에서 항상 참인 명제를 한 문장으로 말하고, 거기에 루프 조건의 부정을 결합해 무엇이 나오는지 보인다. \"답은 항상 `[lo, hi)` 안에 있고, 루프가 끝나면 `lo == hi`이므로 답은 `lo`입니다.\"\n\n두 답변 모두 코드를 다시 읽지 않고 나온다. 그것이 이 질문이 재는 것이다.\n:::\n\n## 연습\n\n::: quiz\n아래 문제들은 전부 경계 조건이 본체인 유형이다. **코드를 짜기 전에 손추적 표부터 그려라.** 정답 코드는 싣지 않는다.\n\n**1. 백준 1920 수 찾기 (실버 4)** — https://www.acmicpc.net/problem/1920\n- 신호: \"존재하는지 알아내시오\" + N과 M이 각각 10만. 선형 탐색이면 100억이라 넘는다.\n- 상태: 탐색 구간 `[lo, hi)` 하나. 답이 이 구간 안에 있다는 것이 불변식이다.\n- 자료구조: 정렬된 배열. 순서만 필요하고 삽입·삭제가 없어 트리나 해시를 쓸 이유가 없다.\n\n**2. 백준 10816 숫자 카드 2 (실버 4)** — https://www.acmicpc.net/problem/10816\n- 신호: 존재 여부가 아니라 \"몇 개인지\"를 묻는다. 정렬 배열에서 개수를 세는 것은 경계 두 개의 차다.\n- 상태: 같은 값이 놓인 구간의 왼쪽 끝과 오른쪽 끝 다음 위치. `upper_bound - lower_bound`가 답이다.\n- 자료구조: 정렬 배열 + 두 종류의 경계 탐색. 해시로도 풀리지만 훈련 가치는 두 경계의 차이를 손으로 확인하는 데 있다.\n\n**3. 백준 2805 나무 자르기 (실버 2)** — https://www.acmicpc.net/problem/2805\n- 신호: \"절단기에 설정할 수 있는 높이의 최댓값\". 답 자체가 수이고, \"높이 H면 M 이상인가\"라는 판정이 H에 대해 단조롭다.\n- 상태: 답의 후보 구간 `[lo, hi)`. 배열 인덱스가 아니라 **답의 값**을 이분 탐색한다.\n- 자료구조: 배열 하나와 누적 합계용 정수. 합이 20억을 넘어 C++에서는 `long long`이 필수다. 이 유형은 [VII-3 매개변수 탐색](#/vii-3)에서 다룬다.\n\n**4. 손추적 과제.** `a = [2, 4, 4, 4, 8]`, `x = 4`로 위의 `lower_bound`를 끝까지 표로 채워라. 이어서 조건 `a[mid] >= x`를 `a[mid] > x`로만 바꾸고 같은 표를 다시 채워라. 두 표는 어디서 갈라지고, 두 결과의 차가 무엇을 뜻하는가.\n\n::: answer\n`a[mid] >= x`인 원본은 `lo = 1`에서 끝난다. `a[1] = 4`가 4 이상인 첫 위치다.\n\n`a[mid] > x`로 바꾸면 `4`들은 조건을 만족하지 못해 `lo = mid + 1`로 전부 버려지고, 루프는 `lo = 4`에서 끝난다. `a[4] = 8`이 4보다 큰 첫 위치다.\n\n두 표는 `mid`가 값 `4`를 가리키는 스텝에서 처음 갈라진다. 원본은 `hi = mid`로 왼쪽 절반을 남기고, 변형은 `lo = mid + 1`로 오른쪽으로 간다.\n\n두 결과의 차 `4 - 1 = 3`이 배열 안에 있는 `4`의 개수다. 이것이 곧 `upper_bound - lower_bound`이고 2번 문제의 답이다. **부등호 하나를 바꾸는 것이 \"첫 위치\"와 \"마지막 다음 위치\"를 가르고, 두 값의 차가 개수를 준다.** 세 결과가 같은 표에서 나온다는 것이 이 과제의 요점이다.\n:::\n:::\n\n## 요약\n\n- 손추적은 코드를 실행하지 않고 상태 표를 채워 실행 모델을 검증하는 절차다. \"읽으면 이해되는데 못 짠다\"는 상태를 정면으로 겨냥한다.\n- 열로 둘 것은 셋뿐이다. 불변식이 걸린 **경계 변수**, 매 반복 줄어드는 **측도**, 판정에 쓰인 **파생값**. 열을 못 고르면 알고리즘을 아직 모르는 것이다.\n- **불변식이 정확성을 맡고 측도가 종료를 맡는다.** 측도가 줄지 않는 반복이 하나라도 있으면 무한 루프다.\n- 스냅샷은 **루프 머리 한 곳**에서만 찍고, 표는 **측도가 0이 되는 줄까지** 채운다. 오프바이원은 마지막 줄에서 드러난다.\n- 입력은 답이 중간에 있는 것, 맨 끝에 있는 것, 아예 없는 것 세 가지를 돌린다. 크기는 갈림길이 양쪽 다 한 번씩 나올 만큼만.\n- 구간 표기는 한 함수 안에서 **반열림 `[lo, hi)` 하나로 통일한다.** 폭이 `hi - lo`이고 빈 구간이 `lo == hi` 하나로 표현되는 것이 오프바이원을 줄인다.\n- 손추적은 정확성 도구다. 성능은 [0-9 N 범위로 알고리즘 역산하기](#/0-9)의 역산으로 판단하고, 역산을 먼저 한다.\n\n**다음 절**: [0-12 디버깅과 반례 찾기](#/0-12) — 손추적으로도 안 잡히는 버그를 브루트포스 대조와 랜덤 스트레스 테스트로 몰아낸다.\n"},"classify":[{"chapter":"0-11","num":"0-11","title":"손추적(dry run) 방법론","signals":"\"정확히 K번\", \"이상/이하\", \"포함한다/포함하지 않는다\", \"가장 왼쪽의\", \"처음으로 ~가 되는 시점\"","constraints":"구간이 반열림인지 닫힘인지 지문이 명시하지 않을 때. 인덱스가 1부터 시작하는 입력. 원소가 1개일 수 있는 입력. 답이 없을 수 있는 입력","confusion":"경계가 흔들리는 것과 알고리즘 선택이 틀린 것은 다른 문제다. 손추적은 앞쪽만 고친다. 유형 자체를 잘못 잡은 경우는 [I-5 오분류 사례집](#/i-5)으로 간다","traps":"원소 1개, 답이 맨 끝, 답이 아예 없음. 이 세 입력에서만 깨지는 구현이 대부분이고, 중간 크기 입력만 돌려 보면 전부 통과한다"}]};

<script>
/* 자동 생성 파일 — 직접 고치지 말 것. `python build.py` 로 다시 만든다. */
/* 원본: assets/widgets/*.js */
window.Widgets = window.Widgets || {};

</script>
<script>
/* app.js — 라우팅 · 목차 · 검색 · 진도 · SRS · 언어 토글
 *
 * 이 파일은 통합 지점이다. 렌더링은 markdown.js, 강조는 highlight.js,
 * 시각화는 widgets/*.js 가 맡고, 여기서는 그것들을 화면에 붙이고 상태를 관리한다.
 *
 * 저장은 전부 localStorage 이고 네임스페이스는 'algobook:' 이다.
 * 사생활 보호 모드에서는 setItem 이 예외를 던진다. 그래서 모든 접근을 감싼다 —
 * 저장이 안 되는 것은 불편이지만, 예외로 앱이 죽는 것은 고장이다.
 */
(function () {
  'use strict';

  var BOOK = window.BOOK || { meta: {}, toc: [], docs: {}, classify: [] };
  var MD = window.MD;

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  };

  var LS = {
    get: function (k, d) {
      try {
        var v = localStorage.getItem('algobook:' + k);
        return v === null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem('algobook:' + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ }
    }
  };

  // 목차를 평평하게 편 배열. 이전/다음 절 이동과 검색이 이 순서를 쓴다.
  var FLAT = [];
  (function buildFlat() {
    for (var i = 0; i < BOOK.toc.length; i++) {
      var part = BOOK.toc[i];
      for (var j = 0; j < (part.chapters || []).length; j++) {
        var ch = part.chapters[j];
        FLAT.push({ id: ch.id, num: ch.num, title: ch.title, partNum: part.num, partTitle: part.title });
      }
    }
  })();

  var CH = {};
  FLAT.forEach(function (c) { CH[c.id] = c; });

  function hasDoc(id) { return Object.prototype.hasOwnProperty.call(BOOK.docs, id); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------------------------------------------------------------- 테마 · 글자 크기

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    LS.set('theme', t);
  }

  function applyFont(f) {
    document.documentElement.setAttribute('data-font', f);
    LS.set('font', f);
  }

  (function initChrome() {
    // 저장된 값이 없으면 OS 설정을 따른다. 첫 방문자에게 강제로 다크를 씌우지 않는다.
    var saved = LS.get('theme', null);
    if (!saved) {
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      saved = prefersLight ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', saved);
    document.documentElement.setAttribute('data-font', LS.get('font', 'm'));
  })();

  // ---------------------------------------------------------------- 언어 토글
  //
  // 'both' 가 기본값인 이유: 이 책의 정체성이 이중 언어 대조다.
  // 한쪽만 보는 것은 선택이지 기본이 아니다.

  var LANGS = ['python', 'cpp', 'both'];

  function currentLang() {
    var v = LS.get('lang', 'both');
    return LANGS.indexOf(v) >= 0 ? v : 'both';
  }

  function applyLang(lang) {
    LS.set('lang', lang);
    $$('#lang-toggle .seg-btn').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-lang') === lang);
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    $$('#doc .dual').forEach(function (dual) { applyLangToDual(dual, lang); });
  }

  function applyLangToDual(dual, lang) {
    var panes = $$('.dual-pane', dual);
    var tabs = $$('.dual-tab', dual);
    var available = panes.map(function (p) { return p.getAttribute('data-dual-lang'); });

    if (lang === 'both') {
      dual.classList.add('is-both');
      panes.forEach(function (p) { p.classList.add('is-active'); });
      return;
    }

    dual.classList.remove('is-both');
    // 요청한 언어가 이 블록에 없으면(한쪽만 실은 블록) 있는 쪽을 보인다.
    var target = available.indexOf(lang) >= 0 ? lang : available[0];
    panes.forEach(function (p) {
      p.classList.toggle('is-active', p.getAttribute('data-dual-lang') === target);
    });
    tabs.forEach(function (t) {
      t.classList.toggle('is-active', t.getAttribute('data-dual-lang') === target);
      t.setAttribute('aria-selected', t.getAttribute('data-dual-lang') === target ? 'true' : 'false');
    });
  }

  // 탭을 직접 누르면 그 블록만 바뀐다. 전역 설정까지 바꾸지는 않는다 —
  // 한 곳에서 C++ 을 잠깐 보려던 것이 책 전체 설정을 갈아엎으면 곤란하다.
  function wireDualTabs(root) {
    $$('.dual', root).forEach(function (dual) {
      $$('.dual-tab', dual).forEach(function (tab) {
        tab.addEventListener('click', function () {
          dual.classList.remove('is-both');
          var want = tab.getAttribute('data-dual-lang');
          $$('.dual-pane', dual).forEach(function (p) {
            p.classList.toggle('is-active', p.getAttribute('data-dual-lang') === want);
          });
          $$('.dual-tab', dual).forEach(function (t) {
            t.classList.toggle('is-active', t === tab);
            t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
          });
        });
      });
    });
  }

  // ---------------------------------------------------------------- 진도

  function progress() { return LS.get('progress', {}); }

  function isDone(id) { return !!progress()[id]; }

  function setDone(id, done) {
    var p = progress();
    if (done) { p[id] = Date.now(); } else { delete p[id]; }
    LS.set('progress', p);
    renderProgressLine();
    markTocDone();
  }

  function renderProgressLine() {
    var el = $('#progress-line');
    if (!el) return;
    var total = FLAT.filter(function (c) { return hasDoc(c.id); }).length;
    var done = Object.keys(progress()).length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    el.innerHTML =
      '<div class="progress-bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="progress-text">' + done + ' / ' + total + ' 절 · ' + pct + '%</div>';
  }

  function markTocDone() {
    var p = progress();
    $$('#toc-tree a[data-id]').forEach(function (a) {
      a.classList.toggle('is-done', !!p[a.getAttribute('data-id')]);
    });
  }

  // ---------------------------------------------------------------- SRS (SM-2)
  //
  // 챕터 단위가 아니라 ::: classify 항목 단위로 돌린다.
  // 알고리즘 학습에서 휘발하는 것은 "챕터를 읽었다"가 아니라
  // "이 지문을 보고 유형을 맞출 수 있다" 쪽이기 때문이다.

  var DAY = 86400000;

  function srsAll() { return LS.get('srs', {}); }

  function srsCards() {
    return (BOOK.classify || []).map(function (c) {
      return {
        key: 'classify:' + c.chapter,
        chapter: c.chapter,
        num: c.num,
        title: c.title,
        front: [c.signals, c.constraints].filter(Boolean).join('\n'),
        back: [c.num + ' ' + c.title, c.confusion, c.traps].filter(Boolean).join('\n')
      };
    });
  }

  function srsState(key) {
    var s = srsAll()[key];
    // 처음 보는 카드는 지금 당장 만기다. 안 그러면 새 챕터가 큐에 영원히 안 뜬다.
    return s || { ease: 2.5, interval: 0, due: 0, reps: 0, lapses: 0 };
  }

  function srsDue() {
    var now = Date.now();
    return srsCards().filter(function (c) { return srsState(c.key).due <= now; });
  }

  /* SM-2. grade 는 UI 4단계(0=모름 1=어려움 2=보통 3=쉬움)이고
   * 원 논문의 quality 0~5 로 옮겨서 계산한다. 3 미만이 실패다. */
  function srsGrade(key, grade) {
    var q = [2, 3, 4, 5][grade];
    var s = srsState(key);

    if (q < 3) {
      s.reps = 0;
      s.lapses += 1;
      s.interval = 1;
    } else {
      if (s.reps === 0) { s.interval = 1; }
      else if (s.reps === 1) { s.interval = 6; }
      else { s.interval = Math.round(s.interval * s.ease); }
      s.reps += 1;
      s.ease = s.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
      if (s.ease < 1.3) { s.ease = 1.3; }  // 원 논문의 하한. 밑으로 두면 간격이 영영 안 늘어난다.
    }

    s.due = Date.now() + s.interval * DAY;
    var all = srsAll();
    all[key] = s;
    LS.set('srs', all);
    updateReviewBadge();
  }

  function updateReviewBadge() {
    var badge = $('#btn-review .badge');
    if (!badge) return;
    var n = srsDue().length;
    badge.textContent = String(n);
    badge.hidden = n === 0;
  }

  var reviewQueue = [];
  var reviewIndex = 0;
  var reviewRevealed = false;

  function openReview() {
    reviewQueue = srsDue();
    reviewIndex = 0;
    reviewRevealed = false;
    renderReview();
    openModal('#review-modal');
  }

  function renderReview() {
    var body = $('#review-body');
    if (!body) return;

    if (!reviewQueue.length) {
      body.innerHTML =
        '<div class="review-empty"><h2>오늘 복습할 것이 없다</h2>' +
        '<p>새 챕터를 읽으면 그 챕터의 유형 판별 카드가 큐에 들어온다.</p>' +
        '<button class="btn" type="button" data-review-close>닫기</button></div>';
      return;
    }

    if (reviewIndex >= reviewQueue.length) {
      body.innerHTML =
        '<div class="review-empty"><h2>큐를 비웠다</h2>' +
        '<p>' + reviewQueue.length + '개를 복습했다.</p>' +
        '<button class="btn" type="button" data-review-close>닫기</button></div>';
      return;
    }

    var card = reviewQueue[reviewIndex];
    var html =
      '<div class="review-card">' +
      '<div class="review-count">' + (reviewIndex + 1) + ' / ' + reviewQueue.length + '</div>' +
      '<div class="review-front">' + MD.render(card.front) + '</div>';

    if (reviewRevealed) {
      html +=
        '<div class="review-back">' + MD.render(card.back) + '</div>' +
        '<div class="review-grades">' +
        '<button class="btn grade-0" type="button" data-grade="0">모름</button>' +
        '<button class="btn grade-1" type="button" data-grade="1">어려움</button>' +
        '<button class="btn grade-2" type="button" data-grade="2">보통</button>' +
        '<button class="btn grade-3" type="button" data-grade="3">쉬움</button>' +
        '</div>' +
        '<a class="review-jump" href="#/' + escapeHtml(card.chapter) + '" data-review-close>' +
        escapeHtml(card.num + ' ' + card.title) + ' 로 가기</a>';
    } else {
      html += '<div class="review-grades"><button class="btn" type="button" data-reveal>답 보기</button></div>';
    }

    html += '</div>';
    body.innerHTML = html;
  }

  // ---------------------------------------------------------------- 좌측 목차

  function renderToc() {
    var tree = $('#toc-tree');
    if (!tree) return;
    var html = '';
    BOOK.toc.forEach(function (part) {
      html += '<section class="toc-part" data-part="' + escapeHtml(part.id) + '">';
      html += '<h3 class="toc-part-title"><span class="toc-part-num">' + escapeHtml(part.num) +
              '</span> ' + escapeHtml(part.title) + '</h3>';
      html += '<ul class="toc-list">';
      (part.chapters || []).forEach(function (ch) {
        var empty = hasDoc(ch.id) ? '' : ' is-empty';
        html += '<li><a href="#/' + escapeHtml(ch.id) + '" data-id="' + escapeHtml(ch.id) +
                '" class="toc-link' + empty + '">' +
                '<span class="toc-num">' + escapeHtml(ch.num) + '</span>' +
                '<span class="toc-title">' + escapeHtml(ch.title) + '</span></a></li>';
      });
      html += '</ul></section>';
    });
    tree.innerHTML = html;
    markTocDone();
  }

  function filterToc(q) {
    var needle = q.trim().toLowerCase();
    $$('#toc-tree .toc-part').forEach(function (sec) {
      var any = false;
      $$('li', sec).forEach(function (li) {
        var text = li.textContent.toLowerCase();
        var hit = !needle || text.indexOf(needle) >= 0;
        li.hidden = !hit;
        if (hit) any = true;
      });
      sec.hidden = !any;
    });
  }

  function highlightCurrentToc(id) {
    $$('#toc-tree a[data-id]').forEach(function (a) {
      a.classList.toggle('is-current', a.getAttribute('data-id') === id);
    });
    var cur = $('#toc-tree a.is-current');
    if (cur && cur.scrollIntoView) {
      // 목차가 길다. 현재 절이 화면 밖이면 사용자가 자기 위치를 잃는다.
      var box = cur.getBoundingClientRect();
      var nav = $('#sidebar').getBoundingClientRect();
      if (box.top < nav.top || box.bottom > nav.bottom) {
        cur.scrollIntoView({ block: 'center' });
      }
    }
  }

  // ---------------------------------------------------------------- 인북 목차 + 스크롤 스파이

  function renderInbook(md) {
    var aside = $('#inbook');
    if (!aside) return;
    var hs = (MD.headings ? MD.headings(md) : []) || [];
    if (!hs.length) { aside.innerHTML = ''; return; }
    var html = '<div class="inbook-title">이 절의 내용</div><ul class="inbook-list">';
    hs.forEach(function (h) {
      html += '<li class="lv' + h.level + '"><a href="#' + escapeHtml(h.id) + '" data-anchor="' +
              escapeHtml(h.id) + '">' + escapeHtml(h.text) + '</a></li>';
    });
    aside.innerHTML = html + '</ul>';
  }

  var spyTicking = false;
  function spy() {
    if (spyTicking) return;
    spyTicking = true;
    requestAnimationFrame(function () {
      spyTicking = false;
      var links = $$('#inbook a[data-anchor]');
      if (!links.length) return;
      var best = null;
      var bestTop = -Infinity;
      links.forEach(function (a) {
        var t = document.getElementById(a.getAttribute('data-anchor'));
        if (!t) return;
        var top = t.getBoundingClientRect().top - 90;
        if (top <= 0 && top > bestTop) { bestTop = top; best = a; }
      });
      links.forEach(function (a) { a.classList.toggle('is-current', a === best); });
    });
  }

  // ---------------------------------------------------------------- 위젯 · 복사 버튼

  function mountWidgets(root) {
    $$('.widget[data-widget]', root).forEach(function (el) {
      var type = el.getAttribute('data-widget');
      var opts = {};
      try { opts = JSON.parse(el.getAttribute('data-opts') || '{}'); } catch (e) { opts = {}; }
      var reg = window.Widgets || {};
      if (typeof reg[type] !== 'function') {
        // 아직 구현되지 않은 위젯은 자리를 남기고 넘어간다. 콘텐츠가 위젯보다 먼저 쓰이므로
        // 이 상태는 정상적인 중간 단계다. 크래시로 페이지를 죽이지 않는다.
        el.classList.add('is-placeholder');
        el.innerHTML = '<div class="widget-placeholder">위젯 <code>' + escapeHtml(type) + '</code> — 준비 중</div>';
        return;
      }
      try {
        reg[type](el, opts);
      } catch (err) {
        el.classList.add('is-error');
        el.innerHTML = '<div class="widget-placeholder">위젯 <code>' + escapeHtml(type) + '</code> 오류</div>';
        if (window.console) console.error('widget', type, err);
      }
    });
  }

  function wireCopy(root) {
    $$('.codeblock-copy', root).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var block = btn.closest('.codeblock');
        var code = block ? block.querySelector('pre.code') : null;
        if (!code) return;
        // 줄 번호는 복사에서 빼야 한다. 붙여넣고 나서 지우게 만들면 안 된다.
        var clone = code.cloneNode(true);
        Array.prototype.slice.call(clone.querySelectorAll('.ln')).forEach(function (n) {
          n.parentNode.removeChild(n);
        });
        var text = clone.textContent;
        var done = function () {
          btn.textContent = '복사됨';
          setTimeout(function () { btn.textContent = '복사'; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        } else {
          fallbackCopy(text, done);
        }
      });
    });
  }

  function fallbackCopy(text, done) {
    // file:// 이나 구형 환경에서는 clipboard API 가 없다.
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* 무시 */ }
    document.body.removeChild(ta);
  }

  function wireAnchors(root) {
    $$('.anchor', root).forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var id = a.getAttribute('href').replace(/^#/, '');
        var url = location.href.split('#')[0] + location.hash.split('#').slice(0, 2).join('#') + '#' + id;
        if (navigator.clipboard) navigator.clipboard.writeText(url);
        var t = document.getElementById(id);
        if (t) t.scrollIntoView();
      });
    });
  }

  // ---------------------------------------------------------------- 라우팅

  function currentRoute() {
    var h = location.hash || '#/';
    var m = h.match(/^#\/([^#]*)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function render() {
    var id = currentRoute();
    var doc = $('#doc');

    if (!id) { renderHome(); return; }

    var meta = CH[id];
    if (!meta) {
      doc.innerHTML = '<div class="notice"><h1>없는 절</h1><p><code>' + escapeHtml(id) +
                      '</code> 은 목차에 없다. <a href="#/">표지로</a></p></div>';
      renderPager(null);
      $('#inbook').innerHTML = '';
      return;
    }

    if (!hasDoc(id)) {
      doc.innerHTML = '<div class="notice"><h1>' + escapeHtml(meta.num + ' ' + meta.title) + '</h1>' +
                      '<p>아직 쓰이지 않은 절이다.</p></div>';
      renderPager(meta);
      $('#inbook').innerHTML = '';
      highlightCurrentToc(id);
      return;
    }

    var md = BOOK.docs[id];
    doc.innerHTML = MD.render(md) + doneButtonHtml(id);
    renderInbook(md);
    mountWidgets(doc);
    wireCopy(doc);
    wireAnchors(doc);
    wireDualTabs(doc);
    applyLang(currentLang());
    renderPager(meta);
    highlightCurrentToc(id);
    document.title = meta.num + ' ' + meta.title + ' · Algorithmic';

    var btn = $('#btn-done');
    if (btn) {
      btn.addEventListener('click', function () {
        var now = !isDone(id);
        setDone(id, now);
        btn.classList.toggle('is-done', now);
        btn.textContent = now ? '완료함' : '이 절을 완료로 표시';
      });
    }

    scrollToAnchorOrTop();
    spy();
  }

  function doneButtonHtml(id) {
    var done = isDone(id);
    return '<div class="done-row"><button id="btn-done" class="btn done-btn' +
           (done ? ' is-done' : '') + '" type="button">' +
           (done ? '완료함' : '이 절을 완료로 표시') + '</button></div>';
  }

  function renderHome() {
    var total = FLAT.length;
    var written = FLAT.filter(function (c) { return hasDoc(c.id); }).length;
    var due = srsDue().length;
    var meta = BOOK.meta || {};

    var html = '<div class="home">';
    html += '<h1 class="home-title">' + escapeHtml(meta.title || 'Algorithmic') + '</h1>';
    if (meta.subtitle) html += '<p class="home-sub">' + escapeHtml(meta.subtitle) + '</p>';
    html += '<div class="home-stats">' +
            '<div class="stat"><b>' + written + '</b><span>쓰인 절</span></div>' +
            '<div class="stat"><b>' + total + '</b><span>전체 절</span></div>' +
            '<div class="stat"><b>' + Object.keys(progress()).length + '</b><span>완료</span></div>' +
            '<div class="stat"><b>' + due + '</b><span>복습 대기</span></div></div>';

    if (due > 0) {
      html += '<p class="home-review"><button class="btn" type="button" id="home-review">' +
              '오늘 복습할 ' + due + '개 시작</button></p>';
    }

    html += '<div class="home-parts">';
    BOOK.toc.forEach(function (part) {
      var chs = part.chapters || [];
      var w = chs.filter(function (c) { return hasDoc(c.id); }).length;
      var first = chs.length ? chs[0].id : '';
      html += '<a class="home-part" href="#/' + escapeHtml(first) + '">' +
              '<span class="home-part-num">' + escapeHtml(part.num) + '</span>' +
              '<span class="home-part-title">' + escapeHtml(part.title) + '</span>' +
              (part.desc ? '<span class="home-part-desc">' + escapeHtml(part.desc) + '</span>' : '') +
              '<span class="home-part-count">' + w + ' / ' + chs.length + '</span></a>';
    });
    html += '</div></div>';

    $('#doc').innerHTML = html;
    $('#inbook').innerHTML = '';
    renderPager(null);
    highlightCurrentToc('');
    document.title = (meta.title || 'Algorithmic');

    var hr = $('#home-review');
    if (hr) hr.addEventListener('click', openReview);
    window.scrollTo(0, 0);
  }

  function neighbors(meta) {
    var i = FLAT.findIndex(function (c) { return c.id === meta.id; });
    return { prev: i > 0 ? FLAT[i - 1] : null, next: i >= 0 && i < FLAT.length - 1 ? FLAT[i + 1] : null };
  }

  function renderPager(meta) {
    var el = $('#pager');
    if (!el) return;
    if (!meta) { el.innerHTML = ''; return; }
    var n = neighbors(meta);
    var html = '';
    if (n.prev) {
      html += '<a class="pager-link prev" href="#/' + escapeHtml(n.prev.id) + '">' +
              '<span class="pager-dir">이전</span><span class="pager-title">' +
              escapeHtml(n.prev.num + ' ' + n.prev.title) + '</span></a>';
    }
    if (n.next) {
      html += '<a class="pager-link next" href="#/' + escapeHtml(n.next.id) + '">' +
              '<span class="pager-dir">다음</span><span class="pager-title">' +
              escapeHtml(n.next.num + ' ' + n.next.title) + '</span></a>';
    }
    el.innerHTML = html;
  }

  function scrollToAnchorOrTop() {
    // '#/id#anchor' 형태. 브라우저는 이 조합을 자기 방식대로 해석하려다 실패하고 맨 위로 되돌린다.
    // 그래서 다음 프레임에 한 번 더 적용한다.
    var parts = (location.hash || '').split('#');
    var anchor = parts.length > 2 ? decodeURIComponent(parts[2]) : '';
    var go = function () {
      if (anchor) {
        var t = document.getElementById(anchor);
        if (t) { window.scrollTo(0, t.getBoundingClientRect().top + window.pageYOffset - 80); return; }
      }
      window.scrollTo(0, 0);
    };
    go();
    requestAnimationFrame(go);
  }

  // ---------------------------------------------------------------- 검색
  //
  // h2 단위로 쪼개 색인한다. 결과가 문서 전체가 아니라 해당 절로 바로 가야
  // 검색이 실제로 쓸모가 있다.

  var INDEX = null;

  function buildIndex() {
    if (INDEX) return INDEX;
    INDEX = [];
    FLAT.forEach(function (ch) {
      if (!hasDoc(ch.id)) return;
      var md = BOOK.docs[ch.id];
      var lines = md.split('\n');
      var cur = { chapter: ch, heading: '', anchor: '', body: [] };
      var inFence = false;
      var slugs = {};

      var push = function () {
        if (cur.body.length || cur.heading) {
          INDEX.push({ chapter: ch, heading: cur.heading, anchor: cur.anchor, text: cur.body.join(' ') });
        }
      };

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (/^\s*```/.test(line)) { inFence = !inFence; continue; }
        if (inFence) continue;
        var m = line.match(/^##\s+(.+)$/);
        if (m) {
          push();
          var text = m[1].replace(/[*`=]/g, '').trim();
          var slug = slugify(text, slugs);
          cur = { chapter: ch, heading: text, anchor: slug, body: [] };
        } else {
          var t = line.replace(/^:::.*$/, '').replace(/[#*`>|=-]/g, ' ').trim();
          if (t) cur.body.push(t);
        }
      }
      push();
    });
    return INDEX;
  }

  function slugify(text, seen) {
    var s = String(text).toLowerCase().trim()
      .replace(/\s+/g, '-')
      .replace(/[^0-9a-z가-힣ㄱ-ㆎ-]/g, '');
    if (!s) s = 'section';
    if (seen) {
      if (seen[s]) { seen[s] += 1; s = s + '-' + seen[s]; } else { seen[s] = 1; }
    }
    return s;
  }

  function search(q) {
    var needle = q.trim().toLowerCase();
    if (needle.length < 1) return [];
    var terms = needle.split(/\s+/);
    var out = [];

    buildIndex().forEach(function (sec) {
      var hay = (sec.chapter.num + ' ' + sec.chapter.title + ' ' + sec.heading + ' ' + sec.text).toLowerCase();
      var score = 0;
      for (var i = 0; i < terms.length; i++) {
        if (hay.indexOf(terms[i]) < 0) return;         // 모든 단어가 있어야 한다
        // 등장 횟수에 상한을 둔다. 안 그러면 긴 절이 무조건 이긴다.
        score += Math.min(countOf(hay, terms[i]), 5);
        if ((sec.chapter.num + ' ' + sec.chapter.title).toLowerCase().indexOf(terms[i]) >= 0) score += 8;
        if (sec.heading.toLowerCase().indexOf(terms[i]) >= 0) score += 4;
      }
      out.push({ sec: sec, score: score });
    });

    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, 40);
  }

  function countOf(hay, needle) {
    var n = 0, i = 0;
    while ((i = hay.indexOf(needle, i)) >= 0) { n++; i += needle.length; }
    return n;
  }

  function renderSearch(q) {
    var box = $('#search-results');
    if (!box) return;
    var hits = search(q);
    if (!q.trim()) { box.innerHTML = '<div class="search-empty">본문 전체에서 찾는다.</div>'; return; }
    if (!hits.length) { box.innerHTML = '<div class="search-empty">결과 없음</div>'; return; }

    box.innerHTML = hits.map(function (h, i) {
      var s = h.sec;
      var href = '#/' + s.chapter.id + (s.anchor ? '#' + s.anchor : '');
      return '<a class="search-hit' + (i === 0 ? ' is-active' : '') + '" href="' + escapeHtml(href) + '">' +
             '<span class="search-ch">' + escapeHtml(s.chapter.num + ' ' + s.chapter.title) + '</span>' +
             (s.heading ? '<span class="search-h">' + escapeHtml(s.heading) + '</span>' : '') +
             '<span class="search-snip">' + escapeHtml(snippet(s.text, q)) + '</span></a>';
    }).join('');
  }

  function snippet(text, q) {
    var t = q.trim().split(/\s+/)[0].toLowerCase();
    var i = text.toLowerCase().indexOf(t);
    if (i < 0) return text.slice(0, 110);
    var from = Math.max(0, i - 40);
    return (from > 0 ? '…' : '') + text.slice(from, from + 120) + '…';
  }

  function moveSearchSel(delta) {
    var hits = $$('#search-results .search-hit');
    if (!hits.length) return;
    var cur = hits.findIndex(function (h) { return h.classList.contains('is-active'); });
    var next = Math.max(0, Math.min(hits.length - 1, (cur < 0 ? 0 : cur) + delta));
    hits.forEach(function (h, i) { h.classList.toggle('is-active', i === next); });
    hits[next].scrollIntoView({ block: 'nearest' });
  }

  // ---------------------------------------------------------------- 모달 · 드로어

  var lastFocus = null;

  function openModal(sel) {
    lastFocus = document.activeElement;
    var m = $(sel);
    if (!m) return;
    m.hidden = false;
    document.body.classList.add('modal-open');
    var input = m.querySelector('input');
    if (input) { input.value = ''; input.focus(); renderSearch(''); }
    else {
      var b = m.querySelector('button');
      if (b) b.focus();
    }
  }

  function closeModals() {
    $$('.modal').forEach(function (m) { m.hidden = true; });
    document.body.classList.remove('modal-open');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // 모달이 열린 동안 탭 이동이 뒤 본문으로 빠져나가면, 화면에는 모달이 떠 있는데
  // 포커스는 안 보이는 곳에 있게 된다. 키보드 사용자에게는 길을 잃는 상황이다.
  function trapTab(e) {
    var modal = $$('.modal').filter(function (m) { return !m.hidden; })[0];
    if (!modal) return;
    var items = $$('a[href], button, input, [tabindex]:not([tabindex="-1"])', modal)
      .filter(function (el) { return el.offsetParent !== null; });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function setDrawer(open) {
    // 스타일시트가 기다리는 훅은 body.nav-open 이다. 오버레이의 페이드는
    // 거기서 파생되므로 여기서 hidden 을 건드리면 전환이 죽는다.
    document.body.classList.toggle('nav-open', open);
    var b = $('#btn-menu');
    if (b) b.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  // ---------------------------------------------------------------- 이벤트 배선

  function wireChrome() {
    $('#btn-theme').addEventListener('click', function () {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    $('#btn-font').addEventListener('click', function () {
      var order = ['s', 'm', 'l'];
      var cur = document.documentElement.getAttribute('data-font') || 'm';
      applyFont(order[(order.indexOf(cur) + 1) % order.length]);
    });

    $('#btn-menu').addEventListener('click', function () {
      setDrawer(!document.body.classList.contains('drawer-open'));
    });

    $('#overlay').addEventListener('click', function () { setDrawer(false); });

    $('#btn-search').addEventListener('click', function () { openModal('#search-modal'); });
    $('#btn-review').addEventListener('click', openReview);

    $('#toc-filter').addEventListener('input', function () { filterToc(this.value); });

    $('#btn-reset').addEventListener('click', function () {
      if (!window.confirm('진도와 복습 기록을 전부 지운다. 되돌릴 수 없다.')) return;
      LS.set('progress', {});
      LS.set('srs', {});
      renderProgressLine();
      markTocDone();
      updateReviewBadge();
      if (!currentRoute()) renderHome();
    });

    $$('#lang-toggle .seg-btn').forEach(function (b) {
      b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
    });

    var si = $('#search-input');
    si.addEventListener('input', function () { renderSearch(this.value); });
    si.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSearchSel(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchSel(-1); }
      else if (e.key === 'Enter') {
        var a = $('#search-results .search-hit.is-active');
        if (a) { e.preventDefault(); location.hash = a.getAttribute('href'); closeModals(); }
      }
    });

    $('#search-results').addEventListener('click', function (e) {
      if (e.target.closest('.search-hit')) closeModals();
    });

    // 복습 모달은 내용이 매번 다시 그려지므로 위임으로 받는다.
    $('#review-modal').addEventListener('click', function (e) {
      if (e.target.closest('[data-review-close]')) { closeModals(); return; }
      if (e.target.closest('[data-reveal]')) { reviewRevealed = true; renderReview(); return; }
      var g = e.target.closest('[data-grade]');
      if (g) {
        srsGrade(reviewQueue[reviewIndex].key, parseInt(g.getAttribute('data-grade'), 10));
        reviewIndex += 1;
        reviewRevealed = false;
        renderReview();
      }
    });

    $$('.modal').forEach(function (m) {
      m.addEventListener('mousedown', function (e) { if (e.target === m) closeModals(); });
    });

    // 좁은 화면에서는 목차 링크를 누르면 드로어가 닫혀야 한다.
    $('#sidebar').addEventListener('click', function (e) {
      if (e.target.closest('a[data-id]')) setDrawer(false);
    });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

      if (e.key === 'Escape') { closeModals(); setDrawer(false); return; }
      if (e.key === 'Tab' && document.body.classList.contains('modal-open')) { trapTab(e); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); openModal('#search-modal'); return;
      }
      if (typing) return;
      if (e.key === '/') { e.preventDefault(); openModal('#search-modal'); return; }

      var id = currentRoute();
      if (!id || !CH[id]) return;
      var n = neighbors(CH[id]);
      if (e.key === '[' && n.prev) { location.hash = '#/' + n.prev.id; }
      if (e.key === ']' && n.next) { location.hash = '#/' + n.next.id; }
    });

    window.addEventListener('hashchange', render);
    window.addEventListener('scroll', spy, { passive: true });
  }

  // ---------------------------------------------------------------- 부팅

  function boot() {
    if (!MD || typeof MD.render !== 'function') {
      document.getElementById('doc').innerHTML =
        '<div class="notice"><h1>렌더러를 못 찾았다</h1>' +
        '<p><code>assets/markdown.js</code> 가 읽히지 않았다.</p></div>';
      return;
    }
    if (!BOOK.toc.length) {
      document.getElementById('doc').innerHTML =
        '<div class="notice"><h1>본문이 비어 있다</h1>' +
        '<p><code>python3 build.py</code> 를 실행해 <code>assets/bundle.js</code> 를 만들어라.</p></div>';
      return;
    }
    renderToc();
    renderProgressLine();
    updateReviewBadge();
    wireChrome();
    applyLang(currentLang());
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
