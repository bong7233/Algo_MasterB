\n`heapify`가 $O(n)$인 것은 직관에 어긋나 보인다. 이유는 **대부분의 원소가 깊은 곳에 있고 깊은 원소는 내려갈 거리가 짧기 때문**이다. 잎 절반은 아예 움직이지 않는다. 층별로 (노드 수 × 내려갈 거리)를 더하면 수렴하는 급수가 되어 $O(n)$이다.\n\n## 3. `bisect` — 정렬된 배열에서의 위치\n\n📖 `bisect.bisect_left(a, x)` — 정렬된 `a`에서 `x`를 넣어도 정렬이 유지되는 **가장 왼쪽** 위치. $O(\\log n)$.\n　 `x`가 이미 있으면 **첫 번째 `x`의 인덱스**다. 그래서 존재 여부 검사에도 쓴다.\n　 쓰는 곳: [VII-2 lower_bound/upper_bound](#/vii-2), LIS의 $O(n \\log n)$ 풀이([VIII-6](#/viii-6)), 좌표 압축([VI-5](#/vi-5)).\n　 C++ 대응: `std::lower_bound` — 이름만 다르고 의미가 같다.\n\n📖 `bisect.bisect_right(a, x)` (별칭 `bisect`) — **가장 오른쪽** 위치. 즉 마지막 `x`의 다음 칸.\n📖 `bisect.insort(a, x)` — 정렬을 유지하며 삽입. 위치 찾기는 $O(\\log n)$이지만 **삽입 자체가 $O(n)$**이다.\n\n::: dual\n```python title=\"개수 세기 — 정렬 배열에서 x가 몇 개인가\"\nimport bisect\n\na = [1, 3, 3, 3, 7, 9]\nx = 3\n\nlo = bisect.bisect_left(a, x)\nhi = bisect.bisect_right(a, x)\nprint(lo, hi, hi - lo)\n\nbisect.insort(a, 5)\nprint(*a)\n```\n```cpp title=\"개수 세기 — 정렬 배열에서 x가 몇 개인가\"\n#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> a = {1, 3, 3, 3, 7, 9};\n    int x = 3;\n\n    int lo = lower_bound(a.begin(), a.end(), x) - a.begin();\n    int hi = upper_bound(a.begin(), a.end(), x) - a.begin();\n    cout << lo << ' ' << hi << ' ' << hi - lo << '\\n';\n\n    a.insert(upper_bound(a.begin(), a.end(), 5), 5);\n    for (size_t i = 0; i < a.size(); i++) cout << a[i] << \" \\n\"[i + 1 == a.size()];\n    return 0;\n}\n```\n:::\n\n두 코드 모두 `1 4 3`과 `1 3 3 3 5 7 9`를 출력한다. **두 경계의 차가 개수**다.\n\n**복잡도:** 탐색은 시간 $O(\\log n)$ — 매 비교마다 후보 구간의 폭이 절반으로 줄고, 폭 1까지 접는 횟수가 $\\log_2 n$이다. 공간 $O(1)$. 다만 `insort`는 전체가 $O(n)$이다 — 위치는 $O(\\log n)$에 찾지만 삽입이 뒤쪽 원소를 전부 밀기 때문이다([0-3](#/0-3) §2.3).\n\n::: perf\n20만 개 배열에 20만 번 질의한 시간이다.\n\n| | 시간 |\n|---|---|\n| `bisect.bisect_left` | 0.143초 |\n| 손으로 짠 선형 탐색 | 1,019초 (400회 실측 후 환산) |\n| | **7,145배 느림** |\n\n> (같은 환경·같은 스크립트.)\n:::\n\n::: danger\n`insort`를 루프에서 n번 부르면 전체가 $O(n^2)$이다. **$\\log n$인 것은 위치 찾기뿐이고 삽입은 여전히 선형이다.**\n\n정렬 상태를 유지하며 계속 삽입해야 한다면 답은 `bisect`가 아니라 균형 트리([II-9](#/ii-9))나 [XV-5 스킵 리스트](#/xv-5)다. 다만 정렬이 다 끝난 뒤에만 조회한다면 **전부 넣고 마지막에 한 번 `sort()`** 하는 것이 거의 항상 낫다.\n:::\n\n## 4. `collections`\n\n### 4.1 `deque`\n\n[0-3](#/0-3) §2.3에서 다뤘다. 양끝 $O(1)$, 인덱싱 $O(n)$, 빈 객체가 760바이트다. BFS의 큐는 예외 없이 이것을 쓴다.\n\n📖 `deque(iterable, maxlen=None)` — `maxlen`을 주면 **고정 크기 링 버퍼**가 된다. 꽉 찬 상태에서 한쪽에 넣으면 반대쪽이 밀려 나간다.\n　 최근 N개만 들고 있는 이동 평균에 그대로 쓰인다. 이 구조 자체는 [XI-1 링 버퍼](#/xi-1)의 주제다.\n\n### 4.2 `defaultdict`\n\n📖 `collections.defaultdict(factory)` — 없는 키를 읽으면 `factory()`를 불러 만들어 넣는다.\n　 `d[k] += 1`이나 `d[k].append(x)`를 `if k not in d` 없이 쓸 수 있다.\n　 쓰는 곳: 인접 리스트 만들기([IV-1](#/iv-1)), 그룹핑. C++ 대응: `std::map`/`unordered_map`은 **없는 키를 읽으면 기본값으로 자동 생성**한다 — Python의 `dict`와 달리 원래 그렇게 동작한다.\n\n```python title=\"인접 리스트 (조각)\"\nfrom collections import defaultdict\n\ngraph = defaultdict(list)\nfor u, v in edges:\n    graph[u].append(v)      # graph[u] 가 없어도 빈 리스트가 자동으로 생긴다\n    graph[v].append(u)\n```\n\n::: danger\n`defaultdict`는 **읽기만 해도 키를 만든다.**\n\n```python title=\"읽기가 키를 만든다\"\nfrom collections import defaultdict\n\nd = defaultdict(int)\nif d[5] > 0:        # 읽었을 뿐인데\n    pass\nprint(len(d))       # 1   <- 키 5가 생겼다\n```\n\n그래프 순회 중 `if graph[v]`로 검사하면 방문하지도 않은 정점이 계속 생겨 순회 대상이 늘어난다. 존재만 확인할 때는 `if v in graph`를 쓴다. `in`은 키를 만들지 않는다.\n\nC++의 `map`도 `m[k]`로 읽으면 같은 일이 일어난다. 이쪽은 `m.count(k)`를 쓴다. **두 언어가 같은 함정을 공유하는 드문 지점**이다.\n:::\n\n### 4.3 `Counter`\n\n📖 `collections.Counter(iterable)` — 원소별 등장 횟수를 담은 `dict`의 하위 클래스. 만드는 데 $O(n)$.\n　 없는 키를 읽으면 `KeyError` 대신 **0**을 준다. 단, `defaultdict`와 달리 **키를 만들지는 않는다.**\n　 `most_common(k)`는 상위 k개를 준다. 내부에서 힙을 쓴다.\n　 쓰는 곳: 빈도 문제 전반, 애너그램 판정, [II-6 해시](#/ii-6). C++ 대응: 없다. `map<T,int>`로 직접 센다.\n\n::: dual\n```python title=\"단어 빈도 세기\"\nfrom collections import Counter\n\nwords = [\"ab\", \"cd\", \"ab\", \"ef\", \"cd\", \"ab\"]\ncnt = Counter(words)\n\nfor w, c in sorted(cnt.items()):\n    print(w, c)\nprint(\"top:\", cnt.most_common(1)[0][0], cnt.most_common(1)[0][1])\n```\n```cpp title=\"단어 빈도 세기\"\n#include <iostream>\n#include <map>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<string> words = {\"ab\", \"cd\", \"ab\", \"ef\", \"cd\", \"ab\"};\n    map<string, int> cnt;                     // map 은 키 정렬을 유지한다\n    for (const string& w : words) cnt[w]++;   // 없는 키는 0 으로 만들어진다\n\n    for (const auto& [w, c] : cnt) {\n        cout << w << ' ' << c << '\\n';\n    }\n    string best;\n    int bestc = 0;\n    for (const auto& [w, c] : cnt) if (c > bestc) { best = w; bestc = c; }\n    cout << \"top: \" << best << ' ' << bestc << '\\n';\n    return 0;\n}\n```\n:::\n\n두 코드 모두 `ab 3 / cd 2 / ef 1 / top: ab 3`을 출력한다.\n\n**복잡도:** 세기는 시간 $O(n)$ — 원소마다 해시 한 번과 갱신 한 번이다. `most_common(k)`는 $O(n \\log k)$ — 크기 k짜리 힙을 유지하며 n개를 훑는다. 인자 없이 부르면 전체 정렬이라 $O(n \\log n)$이다. 공간 $O(u)$ — u는 서로 다른 원소의 수.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 없는 키 읽기 | `Counter`는 0, `dict`는 `KeyError` | `map`은 0을 **만들어** 넣는다 |\n| 키 순서 | 삽입 순서 (정렬하려면 `sorted`) | `map`은 정렬 유지, `unordered_map`은 무순서 |\n| 상위 k개 | `most_common(k)` 내장 | 직접 훑거나 `nth_element` |\n\n::: perf\n100만 개의 빈도를 세는 세 가지 방법이다.\n\n| 방식 | 시간 |\n|---|---|\n| `Counter(data)` | 0.078초 |\n| `d[x] = d.get(x, 0) + 1` | 0.109초 (1.4배 느림) |\n| `defaultdict(int)`에 `+= 1` | 0.119초 (1.5배 느림) |\n\n> (같은 환경·같은 스크립트.)\n\n차이가 작다. `Counter`를 쓰는 이유는 속도보다 **의도가 드러나고 `most_common`이 딸려 오기 때문**이다. 세면서 다른 일도 같이 해야 한다면 직접 루프를 도는 편이 낫고, 1.4배는 그 자유를 사는 값으로 싸다.\n:::\n\n## 5. `itertools`와 `functools`\n\n### 5.1 조합 생성\n\n📖 `itertools.permutations(iterable, r)` — 길이 r의 **순열**을 사전순으로 생성. 총 $P(n,r)$개.\n📖 `itertools.combinations(iterable, r)` — 길이 r의 **조합**. 총 $C(n,r)$개.\n📖 `itertools.product(*iterables, repeat=k)` — 곱집합. 중첩 `for`문을 평평하게 만든다.\n　 전부 **지연 생성**이다. 리스트를 미리 만들지 않으므로 메모리가 $O(r)$이다.\n　 쓰는 곳: 완전탐색([III-2](#/iii-2)), 외판원 순회의 브루트포스 대조([VIII-9](#/viii-9)).\n　 C++ 대응: `std::next_permutation`만 있다. 조합은 직접 짜거나 비트마스크([III-3](#/iii-3))를 쓴다.\n\n```python title=\"4방향 델타를 곱집합으로 (조각)\"\nfrom itertools import product, combinations\n\nfor dr, dc in ((-1, 0), (1, 0), (0, -1), (0, 1)):\n    pass\n\n# 중첩 for 3개를 한 줄로\nfor a, b, c in product(range(3), repeat=3):\n    pass\n\n# n개 중 2개 고르기 — 이중 루프의 i < j 를 대신한다\nfor i, j in combinations(range(5), 2):\n    pass\n```\n\n::: warn\n`permutations(range(10))`은 362만 개지만 `permutations(range(13))`은 62억 개라 절대 끝나지 않는다. **생성기라서 메모리는 안 터지고 시간만 무한히 간다.** 쓰기 전에 개수를 먼저 계산하라. [0-9 N 범위로 알고리즘 역산하기](#/0-9)의 표가 그 판단을 준다.\n:::\n\n### 5.2 `lru_cache`\n\n📖 `functools.lru_cache(maxsize=None)` — 함수의 인자별 반환값을 캐시하는 데코레이터.\n　 인자가 **해시 가능해야** 한다. 리스트를 인자로 받는 함수에는 못 붙인다 — 튜플로 바꿔 받아야 한다.\n　 쓰는 곳: 메모이제이션 DP 전반([VIII-2](#/viii-2)). C++ 대응: 없다. `map`이나 배열로 직접 만든다.\n\n```python title=\"메모이제이션 (조각)\"\nfrom functools import lru_cache\nimport sys\n\nsys.setrecursionlimit(10 ** 6)      # 왜: 기본 재귀 한도가 1000이라 금방 넘는다\n\n@lru_cache(maxsize=None)\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\n```\n\n::: perf\n| | 시간 | 함수 호출 수 |\n|---|---|---|\n| `fib(30)` 캐시 없음 | 0.161초 | 1,664,079회 |\n| `fib(30)` `lru_cache` | 0.0001초 | **31회** |\n| | **1,422배 빠름** | |\n\n> (같은 환경·같은 스크립트.)\n:::\n\n호출 수를 보라. 지수가 선형이 됐다. 캐시가 하는 일은 **같은 부분문제를 두 번 풀지 않는 것**이고, 그것이 DP의 정의다. 이 관계는 [VIII-2](#/viii-2)에서 정면으로 다룬다.\n\n::: pitfall\n- **`maxsize=None`이 아니면 캐시가 쫓겨난다.** DP에서는 전부 남겨야 하므로 `None`을 준다. 이름의 LRU가 그 축출 정책이고, 정책 자체는 [XV-9 캐시 교체 정책](#/xv-9)의 주제다.\n- **재귀 깊이.** 기본 한도 1,000을 `sys.setrecursionlimit`으로 올려도 실제 스택이 부족하면 인터프리터가 죽는다. 안전한 답은 반복문으로 바꾸는 것이다([0-10](#/0-10)).\n- **인자가 가변이면 못 쓴다.** 인자를 키로 쓰므로 해시 가능해야 한다. `tuple(grid)` 같은 변환이 필요하고, 그 비용이 캐시 이득을 넘을 수도 있다.\n:::\n\n### 5.3 `cmp_to_key`\n\n📖 `functools.cmp_to_key(cmpfunc)` — 두 값을 받아 음수/0/양수를 돌려주는 **비교 함수**를 `key=`용 객체로 바꾼다. `key=`로 표현할 수 없는 순서 규칙에만 쓴다.\n\n::: perf\n20만 개를 정렬하는 두 방법이다.\n\n| | 시간 |\n|---|---|\n| `key=lambda p: (p[0], -p[1])` | 0.360초 |\n| `key=cmp_to_key(비교함수)` | 0.914초 (**2.5배 느림**) |\n\n> (같은 환경·같은 스크립트.)\n:::\n\n복잡도는 둘 다 $O(n \\log n)$이다. **차이는 전부 상수다.** `key=`는 원소마다 키를 한 번만 만들어 두지만, `cmp_to_key`는 비교할 때마다 Python 함수를 호출한다. 비교 횟수가 $n \\log n$이니 호출도 그만큼이다.\n\n**그래서 `key=`로 표현 가능하면 언제나 `key=`를 쓴다.** 내림차순은 값에 `-`를 붙이거나 `reverse=True`를 주고, 여러 기준이면 튜플로 묶는다. 숫자가 아니라 `-`를 못 붙이는 경우가 `cmp_to_key`가 필요한 거의 유일한 자리다.\n\n## 6. `math`와 `sys`\n\n📖 `math.gcd(a, b)` / `math.lcm(a, b)` — 최대공약수·최소공배수. $O(\\log \\min(a,b))$. 유클리드 호제법이고 원리는 [X-1 정수론](#/x-1)에 있다. C++ 대응: `std::gcd`, `std::lcm`(둘 다 `<numeric>`).\n\n📖 `math.isqrt(n)` — 정수 제곱근의 내림값. **`int(n ** 0.5)`와 다르다.** 부동소수 제곱근은 큰 수에서 오차가 나 결과가 1 어긋난다. 소수 판정과 에라토스테네스의 체([X-2](#/x-2))에서 이 차이가 오답을 만든다. 부동소수 문제 전반은 [X-7](#/x-7)이다.\n\n📖 `math.comb(n, r)` / `math.perm(n, r)` — 조합·순열의 수. 임의 정밀도라 정확하다.\n\n📖 `sys.setrecursionlimit(n)` — 재귀 깊이 한도. 기본 1,000. DFS 깊이가 10만이 될 수 있는 문제에서 필수다. 다만 한도를 올리는 것과 스택이 실제로 버티는 것은 별개다.\n\n📖 `sys.stdin.readline` / `sys.stdout.write` — 빠른 입출력. [0-2](#/0-2) §2가 그 자리다.\n\n::: tip\n**모듈러 거듭제곱은 3인자 `pow(a, b, m)`을 쓴다.** 분할 정복 거듭제곱을 C에서 돌린다. `(a ** b) % m`은 `a ** b`라는 천문학적 크기의 정수를 실제로 만든 다음 나눈다([0-2](#/0-2) §5.2의 곱셈 비용 표가 그 대가다).\n:::\n\n## 7. 정렬 — Timsort 안에서 무슨 일이 벌어지는가\n\n### 7.1 비교 정렬의 하한은 무작위 입력에 대한 것이다\n\n\"비교 기반 정렬은 $O(n \\log n)$보다 빠를 수 없다\"는 명제는 맞다. 다만 그것은 **최악의 경우**에 대한 명제이고, 실제 입력은 무작위가 아닌 경우가 많다.\n\n::: perf\n원소 200만 개를 `list.sort()`로 정렬한 시간과, 20만 개에서 실제로 일어난 **비교 횟수**다.\n\n| 입력 모양 | 시간 (200만) | 비교 횟수 (20만) |\n|---|---|---|\n| 무작위 | 0.923초 | 3,263,435 |\n| 이미 오름차순 | 0.019초 (**×0.02**) | **199,999** |\n| 이미 내림차순 | 0.023초 (×0.03) | **199,999** |\n| 앞뒤 절반씩 정렬 | 0.036초 (×0.04) | 399,999 |\n| 99% 정렬 + 1% 흐트러짐 | 0.102초 (×0.11) | 547,260 |\n| 전부 같은 값 | 0.008초 (×0.01) | 199,999 |\n| (참고) $n \\log_2 n$ | | 3,520,000 |\n\n> (Linux x86-64 / CPython 3.13 실측. 측정 스크립트는 `tools/bench/py_timsort.py` 다.)\n:::\n\n무작위 입력의 비교 횟수 326만은 $n \\log_2 n = 352$만에 거의 딱 붙는다. **이론이 맞았다.**\n\n그런데 이미 정렬된 입력은 **199,999회**, 정확히 $n - 1$이다. 인접한 쌍을 한 번씩만 비교하고 끝났다는 뜻이고 이것은 $O(n)$이다. 내림차순도, 전부 같은 값도 똑같다.\n\n이런 성질을 **적응적(adaptive)** 이라고 부른다. Timsort는 적응적이라 실전 데이터에서 이론값보다 훨씬 빠르다.\n\n### 7.2 런 — 이미 정렬된 조각을 찾는다\n\n::: deep\nTimsort의 출발점은 하나다. **실제 데이터에는 이미 정렬된 구간이 섞여 있다.** 로그는 시간순이고, 병합된 두 파일은 각각 정렬되어 있다.\n\n그래서 Timsort는 배열을 왼쪽부터 훑으며 **런(run)**, 즉 이미 정렬된 최대 구간을 찾는다.\n\n- **오름차순 런**: `a[i] <= a[i+1]`이 이어지는 동안 늘린다.\n- **내림차순 런**: `a[i] > a[i+1]`이 이어지는 동안 늘리고, 찾은 뒤 **제자리에서 뒤집는다.**\n\n내림차순 입력이 오름차순만큼 빠른 이유가 이것이다. 한 번 훑어 전체가 하나의 내림차순 런임을 확인하고($n-1$번 비교), 뒤집고, 끝난다.\n\n여기서 **엄격한** 부등호가 중요하다. 내림차순 런은 `>`로만 잇는다. 같은 값을 내림차순 런에 넣으면 뒤집을 때 순서가 바뀌어 **안정성이 깨지기** 때문이다. 그래서 `[3, 3, 3]`은 오름차순 런(`<=`)으로 잡히고, 전부 같은 값인 입력이 $n-1$번에 끝나는 것도 이 때문이다.\n\n**minrun.** 런이 짧으면 병합할 조각이 너무 많아진다. 그래서 최소 길이 `minrun`을 정하고, 찾은 런이 그보다 짧으면 뒤쪽 원소를 **이진 삽입 정렬**로 밀어 넣어 채운다. 짧은 배열에서는 삽입 정렬이 실제로 가장 빠르다.\n\n`minrun`은 32 이상 64 이하로 잡되 **`n / minrun`이 2의 거듭제곱에 가깝도록** 계산한다. 병합을 균형 잡히게 하기 위해서다 — 길이가 심하게 다른 두 런을 병합하면 짧은 쪽 원소가 여러 번 복사된다.\n:::\n\n### 7.3 병합 불변식 — 스택을 균형 있게 유지한다\n\n::: deep\n런들을 찾는 대로 스택에 쌓는다. 그리고 스택 꼭대기의 세 런 X, Y, Z(Z가 가장 아래)에 대해 **두 불변식**을 강제한다.\n\n```text nolines\n   run stack (top is right)\n   ... | Z | Y | X |\n         |   |   +-- most recent\n         |   +------ |Y| > |X|\n         +---------- |Z| > |Y| + |X|\n```\n\n불변식이 깨지면 그 자리에서 병합해 다시 세운다. 목적이 둘이다.\n\n**첫째, 병합의 균형.** $|Z| > |Y| + |X|$는 인접한 런의 크기가 지수적으로 커지도록 강제한다. 병합이 항상 비슷한 크기끼리 일어나 전체가 $O(n \\log n)$에 머문다.\n\n**둘째, 스택 깊이의 상한.** 크기가 지수적으로 커지므로 쌓이는 런의 수가 $\\log n$을 넘지 않는다.\n\n::: hist\n이 불변식에는 유명한 후일담이 있다. 2015년, 형식 검증 도구로 Java의 Timsort를 검사하던 연구진이 **꼭대기 세 개만 검사해서는 불변식을 완전히 보장하지 못한다**는 것을 발견했다. 특정 런 길이 조합에서 아래쪽 불변식이 깨진 채 남고, 그러면 미리 잡아 둔 스택 배열이 넘친다. CPython과 Java 모두 수정됐다.\n\n의미가 있는 것은 이 사실이다. **세계에서 가장 많이 실행된 정렬 코드 중 하나에 남아 있던 버그를, 테스트가 아니라 불변식의 형식적 검증이 찾아냈다.** [0-11 손추적 방법론](#/0-11)이 불변식을 열로 두라고 하는 이유가 같은 자리에 있다.\n:::\n:::\n\n### 7.4 갤러핑 — 한쪽이 계속 이기면 건너뛴다\n\n::: deep\n두 런을 병합할 때 보통은 양쪽 머리를 하나씩 비교해 작은 쪽을 가져온다. 그런데 한쪽이 **연달아** 이기는 상황이 있다. 두 런의 값 범위가 거의 겹치지 않으면 그렇다.\n\n이때 하나씩 비교하는 것은 낭비다. 그래서 Timsort는 한쪽이 연속으로 7번 이기면(`MIN_GALLOP`) **갤러핑 모드**로 전환한다. 상대 런에서 1, 3, 7, 15, ... 칸씩 지수적으로 건너뛰며 넘어설 지점을 찾고, 찾으면 그 안을 이분 탐색한다. 한 번에 여러 원소를 통째로 옮긴다.\n\n효과는 재 보면 바로 나온다. 원소 20만 개를 두 런으로 만들어 병합시킨 것이다.\n\n| 두 런의 관계 | 총 비교 횟수 |\n|---|---|\n| 값 범위가 겹치지 않음 (한쪽이 연달아 이김) | **200,042** |\n| 지퍼처럼 한 번씩 번갈아 이김 | 399,999 |\n\n> (같은 환경·같은 스크립트의 `갤러핑` 절.)\n\n읽는 법이 중요하다. 런 두 개를 찾는 데만 이미 199,998번이 든다. 그러니 **병합에 실제로 쓰인 비교는 위쪽이 44번, 아래쪽이 200,001번**이다.\n\n원소 20만 개를 44번 비교로 병합했다. 지수 탐색이 하는 일이 이것이다. 아래쪽은 매번 승자가 바뀌어 연승이 7에 도달하지 못하므로 갤러핑이 아예 발동하지 않는다.\n\n갤러핑이 공짜는 아니다. 발동했다 이득이 없으면 `MIN_GALLOP` 문턱을 올려 다음부터 덜 시도하고, 잘 맞으면 낮춘다. **입력에 맞춰 스스로 조정하는 이 부분**이 Timsort를 적응적으로 만드는 두 번째 장치다.\n:::\n\n### 7.5 안정성\n\n::: dual\n```python title=\"안정 정렬 — 같은 키의 원래 순서가 보존된다\"\ndata = [(\"b\", 1), (\"a\", 2), (\"b\", 3), (\"a\", 4)]\n\ndata.sort(key=lambda p: p[0])\n\nfor name, idx in data:\n    print(name, idx)\n```\n```cpp title=\"안정 정렬 — 같은 키의 원래 순서가 보존된다\"\n#include <algorithm>\n#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<pair<string, int>> data = {{\"b\", 1}, {\"a\", 2}, {\"b\", 3}, {\"a\", 4}};\n\n    // 왜 stable_sort 인가: std::sort 는 안정성을 보장하지 않는다.\n    // Python 의 sort 와 같은 결과를 얻으려면 이쪽을 써야 한다.\n    stable_sort(data.begin(), data.end(),\n                [](const auto& x, const auto& y) { return x.first < y.first; });\n\n    for (const auto& [name, idx] : data) {\n        cout << name << ' ' << idx << '\\n';\n    }\n    return 0;\n}\n```\n:::\n\n두 코드 모두 `a 2 / a 4 / b 1 / b 3`을 출력한다. **원래 순서 그대로다.**\n\n**복잡도:** 시간 최악 $O(n \\log n)$ — 병합 불변식이 런 크기를 지수적으로 유지해 병합 단계가 $\\log n$번이고 각 단계가 $O(n)$이다. 최선 $O(n)$ — 입력이 하나의 런이면 훑기 한 번으로 끝난다. 공간 $O(n)$ — 병합용 임시 버퍼가 필요하다. 실제로는 두 런 중 짧은 쪽만 복사하므로 $O(n/2)$이지만 표기는 $O(n)$이다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 기본 정렬 | `sort()` = Timsort, **안정** | `std::sort` = introsort, **불안정** |\n| 안정 정렬 | 기본이 이미 안정 | `std::stable_sort`를 따로 쓴다 |\n| 추가 메모리 | 항상 $O(n)$ | `sort`는 $O(\\log n)$, `stable_sort`는 $O(n)$ |\n| 적응성 | 정렬된 입력에서 $O(n)$ | introsort는 적응적이지 않다 |\n| 순서 지정 | `key=` 또는 `reverse=` | 비교자 람다 |\n\n::: danger\n안정성이 **결과를 바꾸는** 자리가 있다. 두 기준으로 정렬할 때 안정 정렬이면 **약한 기준으로 먼저, 강한 기준으로 나중에** 두 번 정렬하는 것이 통한다. 나중 정렬이 앞 정렬의 결과를 보존하기 때문이다.\n\nC++에서 같은 습관으로 `std::sort`를 두 번 부르면 조용히 틀린다. 결과는 여전히 \"정렬되어\" 있어서 눈으로는 안 보이고 채점기에서만 드러난다. **한 번에 튜플로 비교하는 것이 두 언어 모두에서 안전하다.**\n\n`std::sort`가 안정성을 포기한 대가로 받은 것은 $O(\\log n)$의 추가 메모리와 작은 상수다. 상세는 [0-7 C++ 알고리즘 함수 세트](#/0-7)에 있다.\n:::\n\n## 연습\n\n::: quiz\n전부 \"어떤 도구를 고르는가\"가 본체인 문제다.\n\n**1. 백준 11279 최대 힙 (실버 2)** — https://www.acmicpc.net/problem/11279\n- 신호: \"가장 큰 값을 출력하고 제거\". 연산 10만 번.\n- 상태: 아직 안 꺼낸 수들. 전체 순서가 아니라 최댓값만 필요하다.\n- 자료구조: 힙. **Python의 `heapq`는 최소 힙뿐이라 값에 `-1`을 곱해 넣고 꺼낼 때 다시 곱한다.** C++이면 `priority_queue`가 이미 최대 힙이라 그럴 일이 없다. §2의 언어 차이 표가 그대로 답이 되는 문제다.\n\n**2. 백준 11651 좌표 정렬하기 2 (실버 5)** — https://www.acmicpc.net/problem/11651\n- 신호: \"y좌표가 증가하는 순, y가 같으면 x가 증가하는 순\". 기준이 둘이다.\n- 상태: 없다. 정렬 키를 정하는 것이 전부다.\n- 자료구조: 리스트와 `key=lambda p: (p[1], p[0])`. §5.3이 요점이다 — **`cmp_to_key`를 쓸 이유가 없고**, 튜플 키가 더 짧고 2.5배 빠르다.\n\n**3. 백준 1181 단어 정렬 (실버 5)** — https://www.acmicpc.net/problem/1181\n- 신호: \"길이가 짧은 것부터, 같으면 사전 순, **중복은 제거**\".\n- 상태: 없다. 중복 제거와 정렬 키 두 개.\n- 자료구조: `set`으로 중복을 없애고 `sorted(key=lambda w: (len(w), w))`. **`set`의 순회 순서를 믿으면 안 된다**([0-3](#/0-3) §4.3)가 여기서 실제로 문제가 된다.\n\n**4. 측정 과제.** `tools/bench/py_timsort.py`를 돌려 비교 횟수 표를 직접 뽑아라. \"앞뒤 절반씩 정렬\" 입력이 정확히 399,999회인 이유를 §7.2와 §7.4로 설명하라. 그리고 \"무작위\"만 $n \\log_2 n$에 붙는 이유를 말하라.\n\n::: answer\n**4.** 입력은 `[0..99999] + [0..99999]`이므로 런이 두 개다.\n\n- **런 탐지**: 각 런에서 $100{,}000 - 1$번씩, 합쳐서 199,998번.\n- **병합**: 두 런의 값 범위가 **완전히 겹치므로** 승자가 계속 바뀐다. 7연승이 나오지 않아 원소마다 정직하게 비교한다. 약 200,001번.\n\n합이 399,999다. §7.4의 \"지퍼처럼 맞물린 두 런\"과 같은 수인 것이 우연이 아니다 — 둘 다 갤러핑이 발동하지 않는 배치다. 대조군인 \"값 범위가 겹치지 않는 두 런\"은 런 탐지 199,998번이 똑같이 들고 **병합만 44번**으로 끝났다. 갈린 것은 알고리즘이 아니라 **두 런의 값 배치**다.\n\n$n \\log_2 n$에 붙는 것이 무작위뿐인 이유는 그 하한이 **정보이론적 한계**이기 때문이다. n개의 순열은 $n!$가지이고 비교 한 번이 1비트를 주므로, 어느 순열인지 특정하려면 $\\log_2(n!) \\approx n \\log_2 n$번이 필요하다.\n\n이미 정렬된 입력에는 이 논증이 적용되지 않는다. 후보가 $n!$가지가 아니기 때문이다. Timsort는 $n-1$번의 비교로 \"이건 이미 정렬됨\"을 확인하고 정렬을 **아예 하지 않는다.** 하한을 깬 것이 아니라 하한이 걸리는 상황이 아닌 것이다.\n:::\n:::\n\n## 요약\n\n- `heapq`는 **최소 힙 고정**, C++의 `priority_queue`는 **최대 힙 기본**이다. `heapify`는 $O(n)$이라 `heappush` 반복보다 2.5배 빠르고, 상위 k개는 `nsmallest`가 전체 정렬보다 14배 빠르다.\n- `bisect`는 $O(\\log n)$이지만 **`insort`는 $O(n)$이다.** 두 경계의 차가 개수다.\n- `defaultdict`는 **읽기만 해도 키를 만든다.** 존재 확인은 `in`으로 한다. C++의 `map[k]`도 같은 함정이다. `Counter`는 직접 세는 것보다 1.4배 빠를 뿐이고, 쓰는 이유는 속도가 아니라 의도와 `most_common`이다.\n- `lru_cache`는 지수를 선형으로 바꾼다. `fib(30)`의 호출이 166만 회에서 **31회**가 된다. 반대로 `cmp_to_key`는 같은 $O(n \\log n)$을 **2.5배 느리게** 만든다. `key=`로 표현 가능하면 언제나 `key=`다.\n- Timsort는 **적응적**이다. 이미 정렬된 200만 개를 무작위의 **1/50 시간**에 정렬하고 비교 횟수가 정확히 $n-1$이다. 내림차순도 같다 — 하나의 런으로 찾아 뒤집기 때문이다.\n- 내부 장치는 셋이다. **런**(이미 정렬된 구간을 찾고 짧으면 삽입 정렬로 채운다), **병합 불변식**($|Z| > |Y|+|X|$, $|Y| > |X|$로 균형과 스택 깊이를 보장), **갤러핑**(한쪽이 7연승하면 지수 탐색으로 건너뛴다). 갤러핑이 걸리면 20만 개 병합이 **44번 비교**로 끝난다.\n- Python의 `sort()`는 안정, C++의 `std::sort`는 불안정이다. 두 번 정렬해 두 기준을 거는 습관은 Python에서만 통한다. **한 번에 튜플로 비교하는 것이 양쪽 모두에서 안전하다.**\n\n**다음 절**: [0-5 C++ 입출력과 기본 타입](#/0-5) — 같은 이야기의 반대편. 오버플로가 실제로 무엇을 부수는지부터.\n","0-5":"# 0-5 C++ 입출력과 기본 타입\n\n::: lead\n같은 알고리즘을 짰는데 C++에서 시간 초과가 나거나 답이 음수로 나오는 두 가지 이유.\n:::\n\n## 1. 문제\n\n정수 100만 개를 읽어 합을 구한다. 알고리즘은 $O(n)$이고 더 줄일 것이 없다. 그런데 다음 두 줄짜리 차이로 실행 시간이 네 배 갈린다.\n\n```cpp title=\"같은 알고리즘, 다른 시간 (조각)\" {2,3}\nint main() {\n    ios_base::sync_with_stdio(false);   // 이 두 줄이 있고 없고\n    cin.tie(nullptr);                   // 0.38초와 0.09초가 갈린다\n    ...\n}\n```\n\n같은 프로그램이 합을 `int`에 담으면 답도 틀린다. 100만 개의 값이 각각 10억 근처면 합은 $10^{15}$이고 `int`에는 안 들어간다. 채점기는 **틀렸습니다**를 돌려주고, 어디가 틀렸는지는 말해 주지 않는다.\n\n두 사고 모두 알고리즘의 문제가 아니다. **언어의 기본값을 모르는 데서 나온다.** 이 절은 그 기본값을 하나씩 연다.\n\n## 2. cin은 왜 느린가\n\n📖 `ios_base::sync_with_stdio(false)` — C++ 스트림(`cin`/`cout`)과 C 스트림(`scanf`/`printf`)의 버퍼 공유를 끊는다.\n   `main` 첫 줄에서, **첫 입출력 전에** 한 번만 부른다.\n   쓰는 곳: 입력이 큰 모든 문제. 특히 [IV-1 그래프 표현](#/iv-1)처럼 간선을 수십만 줄 읽는 유형.\n   Python 대응: 없다. Python은 `sys.stdin.readline`으로 함수 자체를 바꾼다([0-2](#/0-2)).\n\n📖 `cin.tie(nullptr)` — `cin`이 읽기 전에 `cout`을 자동으로 flush 하던 연결을 끊는다.\n   읽기와 쓰기를 **번갈아** 하는 프로그램에서만 효과가 있다.\n   쓰는 곳: 질의를 하나 읽고 답을 하나 출력하는 유형.\n\n기본 상태의 `cin`은 C의 `stdin` 버퍼와 **한 글자 단위로 보조를 맞춘다.** 표준이 그렇게 요구한다. `scanf`와 `cin >>`를 아무렇게나 섞어 써도 읽는 순서가 소스 순서와 같아야 하기 때문이다. 이 보장을 지키려면 C++ 스트림이 자기 버퍼를 채워 놓을 수 없다. 문자마다 C 쪽 버퍼를 들여다봐야 한다.\n\n`sync_with_stdio(false)`는 그 보장을 포기한다. 그 순간 `cin`은 **자기 버퍼를 통째로 채워 놓고** 거기서 파싱한다. 시스템 콜 횟수가 아니라 **글자당 간접 호출 횟수**가 줄어드는 것이 속도의 정체다.\n\n::: perf\n정수 100만 개(각 10자리 이하)를 읽어 합을 구하는 데 걸린 시간.\n\n| 방식 | 시간 | 기본 대비 |\n|---|---|---|\n| `cin` (기본) | 0.379초 | 1.0배 |\n| `cin` + `sync_with_stdio(false)` + `tie(nullptr)` | 0.094초 | **4.0배 빠름** |\n| `scanf` | 0.120초 | 3.2배 빠름 |\n| Python `input()` | 1.047초 | |\n| Python `sys.stdin.readline` | 0.193초 | |\n\n읽기와 쓰기를 **번갈아** 하면(1개 읽고 1개 쓰기 × 100만) `tie`가 따로 드러난다.\n\n| 방식 | 시간 |\n|---|---|\n| 동기화 해제, `tie` 그대로 | 0.835초 |\n| 동기화 해제 + `tie(nullptr)` | 0.167초 |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/cpp_io_sync.cpp`, `tools/bench/cpp_io_sync_py.py`, `tools/bench/cpp_io_tie.cpp` 이고 러너는 `tools/bench/cpp_io_sync_run.sh` 다.)\n\n주목할 것은 **동기화를 끈 `cin`이 `scanf`보다 빠르다**는 점이다. `scanf`는 매 호출마다 형식 문자열 `\"%d\"`를 런타임에 해석하지만 `cin >> x`는 `x`의 타입이 컴파일 시점에 정해져 그 해석이 없다.\n:::\n\n::: danger\n`sync_with_stdio(false)` 뒤에 `printf`와 `cout`을 섞으면 **출력 순서가 무너진다.** 소스에 적힌 순서대로\n\n```cpp title=\"동기화를 끈 뒤 두 스트림을 섞는다 (조각)\"\nprintf(\"printf: 1\\n\"); cout << \"cout: 2\\n\";\nprintf(\"printf: 3\\n\"); cout << \"cout: 4\\n\";\n```\n\n를 실행한 실제 출력은 이렇다.\n\n```console\ncout: 2\ncout: 4\nprintf: 1\nprintf: 3\n```\n\n두 스트림이 각자 버퍼를 들고 있다가 프로그램이 끝날 때 따로 비우기 때문이다. 파일로 리다이렉트해도 같다. ==동기화를 껐으면 출력은 한쪽으로 통일한다.== 재현 코드는 `tools/bench/cpp_io_tie.cpp mix` 다.\n:::\n\n::: warn\n`sync_with_stdio(false)`는 **첫 입출력보다 먼저** 불러야 한다. 이미 읽기 시작한 뒤에 부르면 표준이 동작을 정의하지 않는다. 그리고 이 설정은 `cin`에만 걸리는 것이 아니라 C++ 스트림 전체에 걸린다.\n\n멀티스레드에서 `cout`을 여러 스레드가 쓰는 코드에도 손대지 마라. 동기화를 끄면 스트림 접근이 스레드 안전에서 벗어난다. 이 문제는 [XI-3 락과 락프리](#/xi-3)에서 다룬다.\n:::\n\n## 3. `endl`은 개행이 아니다\n\n`endl`은 개행 문자를 넣고 **거기서 버퍼를 비운다**(flush). flush는 커널에 쓰기를 요청하는 일이다. 줄마다 하면 줄마다 시스템 콜이다.\n\n::: perf\n정수 100만 줄을 파일로 출력한 시간.\n\n| 방식 | 시간 | 배수 |\n|---|---|---|\n| `cout << i << endl` | 0.674초 | 10.1배 |\n| `cout << i << '\\n'` | 0.067초 | 1.0배 |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 측정 스크립트는 `tools/bench/cpp_endl_flush.cpp`. 출력을 `/dev/null`이 아니라 실제 파일로 보냈다 — `/dev/null`은 커널이 쓰기를 버려서 flush 비용이 실제보다 작게 나온다.)\n:::\n\n그렇다고 `endl`이 쓸모없는 것은 아니다. **버퍼에 있는 출력은 프로그램이 비정상 종료하면 사라진다.** 크래시 직전에 찍은 로그가 화면에 안 남는 원인이 대개 이것이다. 대화형으로 서버와 주고받는 문제, 그리고 죽을 수 있는 코드의 진단 출력에는 flush가 필요하다.\n\n**규칙은 단순하다. 기본은 `'\\n'`, flush가 필요한 자리에만 `endl`이나 `cout.flush()`.** `\"\\n\"`(큰따옴표)보다 `'\\n'`(작은따옴표)이 낫다 — 앞은 문자열이라 널 종료를 찾아 길이를 재고 뒤는 문자 하나다.\n\n## 4. 빠른 입력의 관용구\n\n두 언어의 기본 입력이 왜 느린지는 원인이 다르다. C++은 **동기화**, Python은 **줄마다 만들어지는 객체와 프롬프트 처리**다. 고치는 방법도 다르다.\n\n::: dual\n```python title=\"정수 n개를 읽어 합 구하기 — 빠른 입력\"\nimport sys\n\ndef main():\n    data = sys.stdin\n    n = int(data.readline())\n    total = 0\n    for _ in range(n):\n        total += int(data.readline())\n    print(\"total =\", total)\n\nmain()\n```\n```cpp title=\"정수 n개를 읽어 합 구하기 — 빠른 입력\"\n#include <iostream>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(nullptr);\n    int n;\n    cin >> n;\n    long long total = 0;\n    for (int i = 0; i < n; ++i) {\n        int x;\n        cin >> x;\n        total += x;\n    }\n    cout << \"total = \" << total << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(n)$ — 각 정수를 정확히 한 번 파싱한다. 공간 $O(1)$ — 한 번에 정수 하나만 들고 있고 배열에 쌓지 않는다. 상수가 이 절의 주제다. 같은 $O(n)$이 4배 갈린다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 느린 기본 입력 | `input()` — 프롬프트 처리 + 개행 제거 | `cin` — C stdio와의 문자 단위 동기화 |\n| 고치는 법 | `sys.stdin.readline`으로 함수를 바꾼다 | 함수는 그대로 두고 `sync_with_stdio(false)`로 설정을 바꾼다 |\n| 개행 | `readline()`은 `'\\n'`을 **남긴다.** `int()`는 무시하지만 문자열은 `.rstrip()` 필요 | `>>`는 공백·개행을 먼저 건너뛰고 읽는다 |\n| 누적 변수 | `total`은 임의 정밀도라 그냥 둔다 | `total`은 `long long`이어야 한다. `int`면 넘친다 |\n| 한 번에 읽기 | `sys.stdin.buffer.read().split()` (0.168초) | 드물게 `fread` + 직접 파싱. 보통은 불필요 |\n\nPython 쪽 상세는 [0-2 Python 입출력과 기본 타입](#/0-2)에 있다.\n\n## 5. `int`가 넘치는 자리\n\n| 타입 | 크기 | 범위 | 안전한 상한 |\n|---|---|---|---|\n| `int` | 4바이트 | 약 $-2.1 \\times 10^9$ ~ $2.1 \\times 10^9$ | 21억 |\n| `long long` | 8바이트 | 약 $\\pm 9.2 \\times 10^{18}$ | 900경 |\n| `unsigned int` | 4바이트 | 0 ~ 약 $4.3 \\times 10^9$ | 43억 |\n| `double` | 8바이트 | 정수는 $2^{53}$까지 정확 | 약 $9 \\times 10^{15}$ |\n\n넘치는 자리는 정해져 있다. **곱셈, 누적합, 그리고 좌표.**\n\n::: dual\n```python title=\"누적합이 int 범위를 넘는 순간\"\na = [10**9] * 5\ntotal = 0\nfor x in a:\n    total += x\nprint(\"total =\", total)\n```\n```cpp title=\"누적합이 int 범위를 넘는 순간\"\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> a(5, 1000000000);\n    int total = 0;\n    for (int x : a) total += x;\n    cout << \"total = \" << total << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(n)$, 공간 $O(1)$ — 원소를 한 번씩 더할 뿐이다. 복잡도는 같은데 **답이 다르다.**\n\n```console\nPython:  total = 5000000000\nC++:     total = 705032704\n```\n\n여기가 두 언어가 정면으로 갈리는 지점이다. Python 정수는 자릿수가 모자라면 알아서 늘어나고, C++ `int`는 늘어나지 않는다. `705032704`는 $5 \\times 10^9$에서 $2^{32}$를 뺀 값이다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 정수 범위 | 임의 정밀도. 메모리가 허락하는 한 무한 | 타입이 고정 폭. `int`는 32비트 |\n| 넘칠 때 | 자릿수가 늘어난다. 대신 큰 수 연산이 느려진다 | **미정의 동작.** 값이 잘리거나 최적화가 코드를 바꾼다 |\n| 대비 | 없어도 된다 | 상한을 손으로 계산해 `long long`을 고른다 |\n| 비용 | 큰 정수는 연산마다 자릿수 처리 | `long long`은 64비트 레지스터라 `int`와 거의 같은 속도 |\n\n::: pitfall\n- **곱셈은 대입 전에 넘친다.** `long long ans = 1000000 * 1000000;`은 `long long`에 담아도 `-727379968`이다. 오른쪽이 `int × int`로 먼저 계산되고 그 결과가 대입된다. `1LL * 1000000 * 1000000`처럼 **한쪽을 먼저 넓혀라.**\n- **`(lo + hi) / 2`.** 둘 다 20억 근처면 합이 넘어 음수 인덱스가 된다. `lo + (hi - lo) / 2`로 쓴다([0-11](#/0-11)).\n- **`1 << 31`.** `1`은 `int`라 부호 비트를 침범한다. `1LL << 31` 또는 `1u << 31`을 쓴다. 비트마스크는 [III-3 비트마스크로 집합 다루기](#/iii-3)에서 다시 나온다.\n- **좌표 제곱.** 좌표가 $10^5$면 `x*x + y*y`는 $2 \\times 10^{10}$이다. 기하([X-5](#/x-5))에서 흔히 터진다.\n- **`size()`는 부호가 없다.** `for (int i = 0; i < v.size() - 1; ++i)`는 `v`가 비었을 때 `v.size() - 1`이 `0 - 1`이 되어 약 $1.8 \\times 10^{19}$로 돈다. 루프가 통째로 폭주한다.\n:::\n\n## 6. UB는 \"쓰레기 값이 나온다\"가 아니다\n\n부호 있는 정수 오버플로에 대한 가장 흔한 오해는 **\"넘치면 음수로 돌아간다\"**이다. 관찰로는 자주 맞다. 하지만 표준은 그것을 정의하지 않았고, 컴파일러는 정의되지 않은 일이 **일어나지 않는다고 가정하고** 코드를 다시 쓴다.\n\n두 함수를 g++ 13에서 `-O0`과 `-O2`로 각각 컴파일해 돌린 결과다.\n\n```cpp title=\"UB 실험 (전문은 tools/bench/cpp_signed_overflow_ub.cpp)\"\nbool always_true(int x) {\n    return x + 1 > x;          // 오버플로가 없다면 항상 참\n}\n\nint count_up_to(int n) {\n    int cnt = 0;\n    for (int i = 0; i <= n; ++i) {   // n == INT_MAX 면 끝날 수 없는 조건\n        cnt = cnt + 1;\n        if (cnt < 0) break;          // 넘치면 빠져나가려고 둔 가드\n    }\n    return cnt;\n}\n```\n\n`x = INT_MAX`를 넣으면 `x + 1`은 `INT_MIN`이고 `INT_MIN > INT_MAX`는 거짓이다. 그런데 `always_true(INT_MAX)`는 **`-O0`에서도 `true`를 돌려준다.** 생성된 기계어를 보면 이유가 분명하다.\n\n```text nolines\n  -O0:  mov  %edi,-0x4(%rbp)     <- 인자를 스택에 저장하고\n        mov  $0x1,%eax           <- 그냥 1 을 돌려준다. 덧셈도 비교도 없다\n  -O2:  mov  $0x1,%eax           <- 같다\n```\n\n`x + 1 > x`는 **최적화를 끄든 켜든** 상수 `true`로 접힌다. \"안전하게 `-O0`으로 돌리면 되지 않느냐\"가 통하지 않는다는 뜻이다.\n\n두 번째가 더 극적이다. `count_up_to(INT_MAX)`는 `-O0`에서 21억 번을 실제로 돌고 **5.28초** 뒤에 `-2147483648`을 돌려준다. `-O2`에서는 **0.002초**에 같은 값을 돌려준다. 루프가 통째로 사라졌기 때문이다.\n\n```text nolines\n  -O2 의 count_up_to 전문:\n        test  %edi,%edi\n        mov   $0xffffffff,%eax\n        cmovs %eax,%edi          <- n 이 음수면 -1 로\n        lea   0x1(%rdi),%eax     <- 답은 n + 1\n        ret\n```\n\n컴파일러는 이렇게 추론했다. `i`는 오버플로하지 않는다(그렇게 가정해도 된다). 그러면 이 루프는 정확히 `n + 1`번 돈다. `cnt`도 오버플로하지 않으므로 `cnt < 0`은 절대 참이 아니다. **그러니 가드를 지우고 답을 `n + 1`로 계산하면 된다.**\n\n==오버플로를 막으려고 넣은 가드가, 오버플로가 없다는 가정 때문에 삭제되었다.== 이것이 UB가 부수는 방식이다. 값이 이상해지는 것이 아니라 **코드가 없어진다.**\n\n::: deep\n왜 표준은 이것을 정의하지 않았나. 정의해 버리면 위와 같은 추론이 전부 불법이 된다. `for (int i = 0; i <= n; ++i)`의 반복 횟수를 컴파일러가 `n + 1`로 확정할 수 없고, 루프 언롤링·벡터화·인덕션 변수 승격이 줄줄이 막힌다. 부호 있는 오버플로를 UB로 남긴 대가로 **정수 루프의 최적화 여지**를 산 것이다.\n\n부호 **없는** 정수는 다르다. `unsigned`의 오버플로는 $2^{32}$로 나눈 나머지로 **정의되어 있다.** 해시 함수가 `unsigned`나 `uint64_t`로 곱셈을 굴리는 이유가 이것이다 — 넘치는 것이 버그가 아니라 설계다([II-6 해시](#/ii-6)).\n\n필요하면 가정을 끌 수 있다.\n\n- `-fwrapv` — 부호 있는 오버플로를 2의 보수 순환으로 **정의**한다. 최적화 일부를 포기하는 대신 예측 가능해진다.\n- `-fsanitize=undefined` — 넘치는 순간 런타임에 잡아 위치를 찍는다. 디버그 빌드 전용이다.\n\n둘 다 근본 해법은 아니다. **타입을 제대로 고르는 것이 해법이다.**\n:::\n\n::: hist\n1996년 Ariane 5 로켓의 첫 비행은 발사 37초 뒤 파괴됐다. 원인은 64비트 부동소수 수평 속도 값을 16비트 부호 있는 정수로 변환하는 코드였다. 값이 범위를 넘었고, 예외가 처리되지 않아 관성 항법 장치가 정지했다. 그 코드는 Ariane 4에서 검증된 것이었고 Ariane 4의 속도 범위에서는 넘칠 수 없었다.\n\n==타입은 값의 크기가 아니라 값의 **가정**을 적어 놓는 자리다.== 가정이 바뀌면 검증된 코드도 틀린다.\n:::\n\n::: warn\n임베디드·제어 코드에서 실제로 자주 터지는 오버플로는 **시간 값**이다. 밀리초를 `int`(32비트 부호 있음)에 담으면 약 24.8일 만에 넘고, `unsigned`여도 49.7일이다. 장비를 재부팅 없이 오래 돌리면 그때 처음 드러난다.\n\n경과 시간을 비교할 때 `if (now > deadline)`이 아니라 `if (now - start > timeout)`으로 쓰면 부호 없는 순환에서도 옳게 동작한다. 타이머 자료구조는 [XI-8 타이머 휠과 지연 큐](#/xi-8)에서 다룬다.\n:::\n\n## 7. `auto`와 범위 기반 for\n\n`auto`는 \"아무 타입\"이 아니라 **초기값에서 타입을 유도하라**는 지시다. 유도 규칙에 하나 함정이 있다. `auto`는 참조와 최상위 `const`를 **떼어 낸다.**\n\n```cpp title=\"auto 의 유도 규칙 (조각)\"\nvector<int> v = {1, 2, 3};\nauto        x = v[0];   // int        — 복사본. x 를 바꿔도 v 는 그대로다\nauto&       r = v[0];   // int&       — 원본을 가리킨다\nconst auto& c = v[0];   // const int& — 복사 없이 읽기만\n```\n\n범위 기반 for에도 그대로 적용된다. `for (auto x : v)`는 **원소를 매번 복사한다.** `int`면 상관없지만 `string`이나 구조체면 복사 비용이 그대로 든다.\n\n```cpp title=\"범위 기반 for 의 세 가지 형태 (조각)\"\nfor (auto x : words)        { /* 복사. string 이면 매번 힙 할당 가능 */ }\nfor (const auto& x : words) { /* 읽기 전용. 기본으로 삼을 형태 */ }\nfor (auto& x : words)       { /* 수정. x 를 바꾸면 원본이 바뀐다 */ }\n```\n\n::: pitfall\n- **`for (auto& x : v)` 안에서 `v.push_back`.** 재할당이 일어나면 순회 중인 참조가 전부 죽는다. [0-6 C++ 컨테이너 세트](#/0-6)의 주제다.\n- **`vector<bool>`에는 `auto&`가 안 붙는다.** `vector<bool>`은 비트를 압축해 담는 특수화라 원소가 `bool&`가 아니라 프록시 객체다. `for (auto& b : bits)`는 컴파일되지 않는다. `for (auto b : bits)` 또는 애초에 `vector<char>`를 쓴다.\n- **`auto`로 받은 `size()`.** `auto n = v.size();`의 `n`은 `size_t`(부호 없음)다. `n - 1`을 쓰기 전에 비었는지 확인하라.\n- **`auto`가 정수 나눗셈을 숨긴다.** `auto ratio = a / b;`에서 `a`와 `b`가 `int`면 `ratio`도 `int`다. 0.5는 0이 된다.\n:::\n\n## 8. 어디에 쓰이는가\n\n**로그 라이브러리의 flush 정책이 §3 그대로다.** 운영 시스템의 로거는 대개 줄마다 flush 하지 않고 버퍼에 모았다가 일정 크기나 주기로 내보낸다. 그러면 초당 수만 줄을 감당할 수 있지만 프로세스가 죽는 순간 마지막 몇 줄이 사라진다. 그래서 로그 레벨이 `ERROR` 이상일 때만 즉시 flush 하는 절충이 흔하다. **\"성능이냐 사후 추적이냐\"의 교환이고, `endl` 대 `'\\n'`이 그 교환의 최소 형태다.** 버퍼가 넘칠 때의 대응은 [XI-7 이벤트 루프와 백프레셔](#/xi-7)에서 다룬다.\n\n**타입 폭의 선택은 프로토콜 설계의 첫 결정이다.** 장비와 주고받는 메시지에서 시퀀스 번호를 16비트로 잡을지 32비트로 잡을지, 타임스탬프를 밀리초 32비트로 둘지 마이크로초 64비트로 둘지가 여기서 갈린다. 한 번 배포되면 바꾸기 어렵고, 넘치는 시점은 대개 배포 몇 달 뒤다. 메시지 파싱은 [II-2 문자열 처리](#/ii-2)에서 이어진다.\n\n## 연습\n\n::: quiz\n코드를 짜기 전에 **어느 타입에 담아야 하는지부터** 계산하라.\n\n**1. 백준 15552 빠른 A+B (브론즈 4)** — https://www.acmicpc.net/problem/15552\n- 신호: 문제 자체가 \"입출력 방식이 느리면 시간 초과\"라고 명시한다. 테스트 케이스 100만 줄.\n- 상태: 없다. 한 줄 읽고 한 줄 쓴다.\n- 왜 이 도구인가: 알고리즘이 없는 문제라 입출력 설정만 남는다. §2·§3의 두 설정을 각각 빼고 넣으며 시간을 직접 비교해 보라.\n\n**2. 백준 10757 큰 수 A+B (브론즈 5)** — https://www.acmicpc.net/problem/10757\n- 신호: 입력이 10000자리 정수다. `long long`으로도 안 된다.\n- 상태: 자릿수 배열과 올림 하나.\n- 왜 이 도구인가: Python은 그냥 `a + b`로 끝나고 C++은 자릿수 덧셈을 직접 짜야 한다. **두 언어의 정수 모델 차이가 문제 난이도를 바꾸는 지점**이다. 이 차이를 실제로 겪어 두면 §5의 표가 지식이 아니라 감각이 된다.\n\n**3. 백준 2338 긴 자리 계산 (브론즈 1)** — https://www.acmicpc.net/problem/2338\n- 신호: 덧셈·뺄셈·곱셈을 모두 큰 수로. 곱셈에서 자릿수가 두 배가 된다.\n- 상태: 부호와 자릿수 배열.\n- 왜 이 도구인가: `int × int`가 대입 전에 넘친다는 §5의 함정이 가장 크게 드러나는 형태다.\n\n**4. 손으로 계산할 것.** `int x = 2000000000;`일 때 `x + x`, `x * 2`, `1LL * x + x`, `(long long)(x + x)` 네 표현의 값을 각각 예측하고 그 이유를 한 줄로 쓴 뒤 실제로 돌려 비교하라.\n\n::: answer\n`x + x`와 `x * 2`는 둘 다 `int` 연산이라 UB다. g++ 13 `-O2`에서 관찰되는 값은 `-294967296`이지만 **그 값에 기대면 안 된다.** §6이 보인 것처럼 최적화는 이 식을 근거로 코드를 다시 쓸 수 있다.\n\n`1LL * x + x`는 왼쪽 곱셈이 `long long`이 되고, 그러면 오른쪽 덧셈도 `long long`으로 승격된다. `4000000000`이 정확히 나온다.\n\n`(long long)(x + x)`는 **소용없다.** 괄호 안이 이미 `int` 연산으로 끝난 뒤 그 결과를 넓히는 것이라 `-294967296`이 그대로 넓혀진다. ==넓히기는 계산 **전에** 해야 한다.== 이 한 칸의 차이가 §5 첫 번째 함정의 전부다.\n:::\n:::\n\n## 요약\n\n- `ios_base::sync_with_stdio(false)`와 `cin.tie(nullptr)`는 `cin`의 C stdio 동기화를 끊는다. 정수 100만 개 읽기가 0.379초에서 0.094초로 줄었다. 대신 `printf`와 섞으면 출력 순서가 무너진다.\n- `endl`은 개행 + flush다. 줄마다 flush 하면 100만 줄에서 10배 느려진다. **기본은 `'\\n'`, 진단 출력과 대화형에만 flush.**\n- `int`는 21억, `long long`은 900경이 상한이다. 넘치는 자리는 **곱셈, 누적합, 좌표 제곱, `(lo+hi)/2`** 넷이 거의 전부다.\n- **곱셈은 대입 전에 넘친다.** `1LL *`을 곱셈의 **앞**에 붙여라. 캐스팅을 나중에 하면 아무 소용이 없다.\n- 부호 있는 오버플로는 순환이 아니라 **미정의 동작**이다. g++ 13은 `x + 1 > x`를 `-O0`에서도 상수 `true`로 접고, `-O2`에서는 오버플로 가드가 달린 루프를 통째로 지웠다.\n- `auto`는 참조와 `const`를 뗀다. 범위 기반 for의 기본형은 `for (const auto& x : v)`다.\n\n**다음 절**: [0-6 C++ 컨테이너 세트](#/0-6) — `vector`가 어떻게 자라고, 그 순간 살아 있던 참조가 왜 죽는가. 그리고 같은 $O(1)$이 왜 100배 차이 나는가.\n","0-6":"# 0-6 C++ 컨테이너 세트\n\n::: lead\n컨테이너 선택은 복잡도 표가 아니라 메모리 배치가 정한다.\n:::\n\n## 1. 문제\n\n원소 500만 개를 순회하며 전부 더한다. `vector`, `deque`, `list` 중 무엇에 담아도 알고리즘은 $O(n)$이고 명령어 수도 거의 같다. 실측은 이렇다.\n\n| 컨테이너 | 시간 | `vector` 대비 |\n|---|---|---|\n| `vector<int>` | 0.0041초 | 1.0배 |\n| `deque<int>` | 0.0046초 | 1.1배 |\n| `list<int>` (순서대로 만든 것) | 0.0236초 | 5.8배 |\n| `list<int>` (링크를 뒤섞은 것) | 0.8462초 | **206배** |\n\n마지막 줄이 이 절의 존재 이유다. **복잡도 표에는 206배가 없다.** 셋 다 $O(n)$이고, 한 원소를 처리하는 데 드는 명령어도 몇 개 차이 나지 않는다. 갈리는 것은 그 명령어들이 **메모리의 어디를 찌르느냐**뿐이다.\n\n\"삽입이 $O(1)$이니까 `list`\"라는 판단이 실전에서 거의 항상 틀리는 이유가 여기 있다.\n\n## 2. 캐시 라인이 정하는 것\n\nCPU는 메모리를 바이트 단위로 읽지 않는다. **캐시 라인**이라는 고정 크기 덩어리로 읽는다. x86-64에서 64바이트이고, `int` 하나가 4바이트이니 **한 번 읽으면 `int` 16개가 딸려 온다.**\n\n```text nolines\n  vector<int> — 연속 배치\n  ┌────┬────┬────┬────┬────┬────┬────┬────┐\n  │ 10 │ 20 │ 30 │ 40 │ 50 │ 60 │ 70 │ 80 │  <- 캐시 라인 하나에 16개가 실려 온다\n  └────┴────┴────┴────┴────┴────┴────┴────┘\n  0x1000 부터 연속. 다음 주소를 예측할 수 있다\n\n  list<int> — 노드 배치\n  ┌──────┬──────┬────┐   ┌──────┬──────┬────┐\n  │ prev │ next │ 10 │──▶│ prev │ next │ 20 │  <- 노드 하나가 24바이트(+할당자 몫)\n  └──────┴──────┴────┘   └──────┴──────┴────┘\n  0x2000                 0x7f40                <- 주소는 할당 순서가 정한다\n```\n\n차이는 세 겹이다.\n\n**첫째, 밀도.** `vector`는 캐시 라인 64바이트에 `int` 16개가 들어간다. `list`는 노드가 24바이트라 실제로 쓰는 값은 4바이트뿐이고, 라인 하나에 값이 2~3개 실린다. 같은 개수를 읽는 데 캐시 라인을 6배 넘게 소모한다.\n\n**둘째, 예측.** CPU에는 **프리페처**가 있어 순차 접근을 감지하면 다음 라인을 미리 가져온다. `vector` 순회는 여기에 정확히 걸린다. `list`는 다음 주소가 현재 노드를 읽어야 나오므로 미리 가져올 대상을 알 수 없다. 이것을 **포인터 추적**(pointer chasing)이라 하고, 메모리 지연이 계산으로 가려지지 않고 그대로 드러난다.\n\n**셋째, 순서.** 방금 만든 `list`는 노드 주소가 대체로 오르막이라 프리페처가 절반쯤 먹힌다(5.8배). 삽입·삭제를 반복해 오래 산 리스트는 노드가 힙 여기저기에 흩어진다. 그 상태를 재현한 것이 마지막 줄의 206배다.\n\n::: perf\n§1의 표를 만든 조건과 스크립트.\n\n- 원소 500만 개, 값은 1..n. 네 컨테이너 모두 같은 값을 담았다.\n- \"링크를 뒤섞은 것\"은 노드를 그대로 두고 연결 순서만 무작위로 다시 이었다. **노드 개수도 값도 같고 링크 순서만 다르다.**\n- `vector` 0.82 ns/원소, `list`(뒤섞임) 169 ns/원소.\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/cpp_container_cache.cpp`.)\n\n뒤섞은 쪽은 실행마다 0.65~0.91초로 흔들린다. 캐시와 TLB 적중이 그때그때의 메모리 배치에 좌우되기 때문이다. **이 흔들림 자체가 신호다.** 연속 배치 쪽은 0.0038~0.0041초로 거의 흔들리지 않는다.\n:::\n\n## 3. `vector`는 어떻게 자라는가\n\n`vector`에는 두 개의 크기가 있다. `size()`는 지금 들어 있는 원소 수, `capacity()`는 재할당 없이 담을 수 있는 최대 수다. `push_back`은 `size() == capacity()`인 순간에만 새 메모리를 잡고 **전부 옮긴다.**\n\n::: dual\n```python title=\"용량이 언제 늘어나는가\"\nimport sys\n\n\ndef capacity(v):\n    return (sys.getsizeof(v) - sys.getsizeof([])) // 8\n\n\nv = []\ncap = capacity(v)\nfor i in range(1, 18):\n    v.append(i)\n    if capacity(v) != cap:\n        cap = capacity(v)\n        print(f\"size={len(v):3d} capacity={cap:3d}\")\n```\n```cpp title=\"용량이 언제 늘어나는가\"\n#include <cstdio>\n#include <vector>\nusing namespace std;\n\nsize_t capacity(const vector<int>& v) { return v.capacity(); }\n\nint main() {\n    vector<int> v;\n    size_t cap = capacity(v);\n    for (int i = 1; i <= 17; ++i) {\n        v.push_back(i);\n        if (capacity(v) != cap) {\n            cap = capacity(v);\n            printf(\"size=%3zu capacity=%3zu\\n\", v.size(), cap);\n        }\n    }\n    return 0;\n}\n```\n:::\n\n**복잡도:** `push_back` 한 번은 **분할상환 $O(1)$** — 용량이 찰 때마다 2배로 잡으면 $n$개를 넣는 동안 총 복사량이 $1 + 2 + 4 + \\dots + n < 2n$이므로, 원소당 평균 상수 회 복사다. 다만 **개별 호출의 최악은 $O(n)$**이고 그 호출이 하필 실시간 루프 안에 걸리면 그때 지연이 튄다.\n\n출력이 갈린다.\n\n```console\nPython:  size=  1 capacity=  4     C++:  size=  1 capacity=  1\n         size=  5 capacity=  8           size=  2 capacity=  2\n         size=  9 capacity= 16           size=  3 capacity=  4\n         size= 17 capacity= 24           size=  5 capacity=  8\n                                         size=  9 capacity= 16\n                                         size= 17 capacity= 32\n```\n\n| 언어 차이 | Python `list` | C++ `vector` |\n|---|---|---|\n| 증가 방식 | 약 1.125배 + 상수. 원소 1000개에 재할당 **28번** | 2배(libstdc++). 원소 1000개에 재할당 **11번** |\n| 용량 조회 | 공식 API 없음. `sys.getsizeof`로 역산 | `capacity()` |\n| 미리 잡기 | 없다. `[None] * n`으로 만들어 채운다 | `reserve(n)` |\n| 저장하는 것 | 객체 **포인터** 8바이트. 값은 딴 데 있다 | 값 자체. `vector<int>`는 4바이트씩 연속 |\n| 표준 규정 | 구현 세부 | 배수는 표준이 정하지 않는다. 2배는 libstdc++의 선택 |\n\n**저장하는 것이 다르다는 마지막 줄이 §2와 이어진다.** `vector<int>`를 순회하면 값이 캐시 라인에 실려 오지만, Python `list`를 순회하면 포인터를 따라 객체로 한 번 더 가야 한다. Python 쪽 상세는 [0-3 Python 내장 자료구조의 실제 비용](#/0-3)에 있다.\n\n📖 `v.reserve(n)` — 용량을 미리 `n`으로 잡는다. `size()`는 바뀌지 않는다.\n   개수를 미리 아는 경우 재할당과 복사를 전부 없앤다. 실측으로 1000개 삽입의 재할당이 11번에서 **0번**이 됐다.\n   쓰는 곳: 입력 개수를 먼저 읽는 모든 문제, 인접 리스트 구성([IV-1](#/iv-1)).\n   Python 대응: 없다. 크기를 알면 `[0] * n`으로 만들고 인덱스로 채운다.\n\n::: tip\n`reserve`와 `resize`는 다르다. `v.reserve(10)` 뒤의 `v[0]`은 **범위 밖 접근**이다. 원소가 없기 때문이다. `v.resize(10)`은 원소를 실제로 10개 만들고 `0`으로 채운다. 인덱스로 쓰려면 `resize`, `push_back`으로 채울 거면 `reserve`다.\n\n용량을 되돌리는 방법은 `clear()`가 아니다. `clear()`는 `size()`만 0으로 만들고 메모리는 쥐고 있다. 반납하려면 `vector<int>().swap(v)` 또는 `v.shrink_to_fit()`이다.\n:::\n\n## 4. 재할당이 참조를 죽인다\n\n재할당은 새 메모리를 잡고 옮기고 옛 메모리를 해제한다. **그 순간 옛 메모리를 가리키던 포인터·참조·이터레이터가 전부 죽는다.**\n\n```cpp title=\"죽은 참조로 읽기 (전문은 tools/bench/cpp_iterator_invalidation.cpp)\"\nvector<int> v;\nv.push_back(10);\nv.push_back(20);\nint& first = v[0];                              // 지금은 유효하다\nfor (int i = 0; i < 100; ++i) v.push_back(i);   // 이 사이에 재할당\nprintf(\"first=%d  v[0]=%d\\n\", first, v[0]);     // 여기서 죽은 메모리를 읽는다\n```\n\n`-O2`로 컴파일해 돌린 실제 출력이다.\n\n```console\n재할당 전: first=10  data=0x55c4e96482d0  capacity=2\n재할당 후: data=0x55c4e9649520  capacity=128  주소 바뀜\n죽은 참조 읽기: first=1548654152  (v[0] 의 진짜 값은 10)\n```\n\n`first`는 `10`이어야 하는데 `1548654152`가 나왔다. 값은 실행마다 다르다. **프로그램은 죽지 않았고 오류 메시지도 없다.** 같은 코드를 `-fsanitize=address`로 다시 빌드하면 정체가 드러난다.\n\n```console\nERROR: AddressSanitizer: heap-use-after-free on address 0x502000000030\nREAD of size 4 at 0x502000000030 thread T0\n```\n\n::: danger\n무효화 규칙은 컨테이너마다 다르다. 외워야 하는 표다.\n\n| 컨테이너 | 삽입 시 | 삭제 시 |\n|---|---|---|\n| `vector` | 재할당되면 **전부** 무효. 아니면 삽입 위치 뒤가 무효 | 삭제 위치 뒤가 무효 |\n| `deque` | 이터레이터는 **전부** 무효. 양끝 삽입이면 **참조는 유효** | 양끝 삭제면 그 원소만, 중간 삭제면 전부 무효 |\n| `list` | 무효화 없음 | 삭제된 원소만 무효 |\n| `map` / `set` | 무효화 없음 | 삭제된 원소만 무효 |\n| `unordered_map` / `unordered_set` | 리해싱되면 **이터레이터 전부** 무효. **참조는 유효** | 삭제된 원소만 무효 |\n\n`deque`와 `unordered_map`의 \"이터레이터는 무효, 참조는 유효\"가 특히 함정이다. 노드(혹은 청크)는 그 자리에 있는데 이터레이터가 들고 있던 관리 정보가 낡기 때문이다.\n\n**실전 규칙 하나로 줄이면:** ==컨테이너를 수정하는 루프 안에서는 이터레이터·참조·포인터를 루프 밖으로 들고 나가지 마라.== `erase`는 반환값을 받아 `it = v.erase(it);`로 이어 간다.\n:::\n\n## 5. 컨테이너 카탈로그\n\n| 컨테이너 | 내부 | 조회 | 끝 삽입 | 중간 삽입 | 메모리(원소당 실측) |\n|---|---|---|---|---|---|\n| `array<T,N>` | 스택 위 고정 배열 | $O(1)$ | 불가 | 불가 | `sizeof(T)` 정확히 |\n| `vector<T>` | 힙 위 연속 배열 | $O(1)$ | 분할상환 $O(1)$ | $O(n)$ | 4.3바이트 |\n| `deque<T>` | 청크 배열 + 청크 목록 | $O(1)$ | $O(1)$ | $O(n)$ | 4.3바이트 |\n| `list<T>` | 양방향 연결 | $O(n)$ | $O(1)$ | $O(1)$(위치를 알 때) | 32.1바이트 |\n| `set` / `map` | 레드-블랙 트리 | $O(\\log n)$ | $O(\\log n)$ | $O(\\log n)$ | 48.1바이트 |\n| `unordered_set` / `unordered_map` | 버킷 배열 + 노드 체인 | 평균 $O(1)$ | 평균 $O(1)$ | 평균 $O(1)$ | 43.7바이트 |\n\n> (원소당 메모리는 `int` 100만 개를 넣고 프로세스의 상주 메모리 증가분을 잰 값이다. Linux x86-64 / g++ 13 `-O2` 실측. 측정 스크립트는 `tools/bench/cpp_container_memory.cpp`. `map`은 `map<int,int>`, `set`은 `set<int>`인데 둘 다 48.1바이트인 것은 glibc 할당자가 요청 크기를 16바이트 단위로 올려 잡기 때문이다.)\n\n**`int` 하나를 담는 데 `set`은 48바이트를 쓴다.** 값 4바이트에 색 정보와 포인터 세 개, 그리고 할당자 몫이 붙는다. 메모리 제한이 256MB인 문제에서 `set<int>`에 500만 개를 넣으려는 계획은 이 표에서 이미 실패한다.\n\n### deque의 정체\n\n`deque`는 \"양끝 삽입이 $O(1)$인 배열\"로 소개되지만 내부는 **청크의 배열**이다. libstdc++은 원소 크기가 작으면 512바이트 청크를 쓴다. 앞에 삽입할 때 전체를 미는 대신 앞쪽 청크를 하나 더 붙인다.\n\n```text nolines\n  map(청크 포인터 배열)\n  ┌────┬────┬────┬────┐\n  │ p0 │ p1 │ p2 │ p3 │\n  └─┬──┴─┬──┴─┬──┴─┬──┘\n    │    │    │    └──▶ [ ... ]                <- 각 청크는 연속 512바이트\n    │    │    └───────▶ [ ... ]\n    │    └────────────▶ [ ... ]\n    └─────────────────▶ [ ... ]\n```\n\n그래서 `&d[0] + i`는 `d[i]`가 아니다. **`deque`의 원소는 전체가 연속이 아니다.** C 함수에 넘길 버퍼로 쓸 수 없고, 순회 성능이 `vector`에 1.1배로 붙는 것은 청크 안이 연속이기 때문이다.\n\n### 어댑터: `stack`, `queue`, `priority_queue`\n\n이 셋은 컨테이너가 아니라 **어댑터**다. 자기 저장소가 없고 다른 컨테이너를 감싸 인터페이스만 제한한다. `stack`과 `queue`의 기본 저장소는 `deque`이고, `priority_queue`는 `vector`다.\n\n📖 `priority_queue<T>` — 이진 힙. `push` $O(\\log n)$, `top` $O(1)$, `pop` $O(\\log n)$.\n   **기본이 최대 힙이다.** 최소 힙은 `priority_queue<T, vector<T>, greater<T>>`.\n   쓰는 곳: 다익스트라([V-1](#/v-1)), 실시간 태스크 스케줄러([XI-5](#/xi-5)).\n   Python 대응: `heapq` — 이쪽은 **최소 힙 전용**이다. 방향이 반대다.\n\n::: warn\n`stack`과 `queue`에는 이터레이터가 없다. 순회하려면 꺼내야 하고, 꺼내면 사라진다. **BFS에서 큐 내용을 찍어 보며 디버깅하려면 `deque`를 직접 쓰는 편이 낫다.** 손추적([0-11](#/0-11))의 관찰 대상을 코드로 옮길 때 이 제약이 걸린다.\n\n`pop()`은 값을 돌려주지 않는다. `int x = q.front(); q.pop();` 두 줄로 쓴다. 예외 안전성 때문에 그렇게 설계됐다.\n:::\n\n## 6. 해시냐 트리냐\n\n빈도를 세는 코드로 둘의 차이를 본다.\n\n::: dual\n```python title=\"단어 빈도 세기 — 정렬된 출력\"\nwords = [\"pear\", \"apple\", \"pear\", \"fig\", \"apple\", \"pear\"]\n\ncount = {}\nfor w in words:\n    count[w] = count.get(w, 0) + 1\n\nfor k in sorted(count):\n    print(k, count[k])\n```\n```cpp title=\"단어 빈도 세기 — 정렬된 출력\"\n#include <iostream>\n#include <map>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<string> words = {\"pear\", \"apple\", \"pear\", \"fig\", \"apple\", \"pear\"};\n\n    map<string, int> count;\n    for (const string& w : words) count[w] += 1;\n\n    for (const auto& [k, v] : count) cout << k << \" \" << v << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(n \\log m)$ — 단어 $n$개를 각각 트리에 넣고, 트리 높이가 서로 다른 단어 수 $m$에 대해 $O(\\log m)$이다. 문자열 비교 비용이 곱해지므로 실제로는 $O(n L \\log m)$($L$은 단어 길이)이다. 공간 $O(m)$. Python `dict`로 짜면 평균 $O(n)$이지만 정렬 출력에 $O(m \\log m)$이 붙어 결과는 비슷하다.\n\n두 출력은 같다.\n\n```console\napple 2\nfig 1\npear 3\n```\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 기본 사상 | `dict` = 해시. **삽입 순서**를 유지한다 | `map` = 트리(정렬), `unordered_map` = 해시(순서 없음) |\n| 정렬 출력 | `sorted(count)`로 그때 정렬한다 | `map`이면 이미 정렬. `unordered_map`이면 따로 뽑아 정렬 |\n| 없는 키 조회 | `count[k]`는 **KeyError**. `get(k, 0)`을 쓴다 | `count[k]`는 **0을 만들어 넣는다.** 조회가 삽입이다 |\n| 존재 확인 | `if k in count` | `if (count.count(k))` 또는 `count.find(k) != count.end()` |\n\n::: danger\n`m[k]`는 **키가 없으면 만든다.** 값 타입의 기본값(정수면 0)으로 삽입하고 그 참조를 돌려준다. 그래서 다음 코드는 조회만 하는 것처럼 보이지만 `map`을 키로 채운다.\n\n```cpp title=\"조회처럼 보이는 삽입 (조각)\"\nif (m[key] > 0) { ... }   // ❌ key 가 없으면 0 으로 삽입된다\nif (m.count(key) && m.at(key) > 0) { ... }   // ✅ 삽입하지 않는다\n```\n\n인접 리스트를 `map<int, vector<int>>`로 들고 `if (!graph[v].empty())`를 돌리면 정점 수가 조용히 늘어난다. 순회 중이면 그 자체로 무효화 사고가 된다.\n\n`at()`은 없으면 예외를 던지고 삽입하지 않는다. **읽기에는 `at`, 쓰기에는 `[]`.**\n:::\n\n::: perf\n키 100만 개(짝수만), 질의 100만 번(절반은 없는 키).\n\n| 자료구조 | 시간 | 질의당 | `unordered_map` 대비 |\n|---|---|---|---|\n| 직접 인덱스 `vector` | 0.0077초 | 7.7 ns | **13.8배 빠름** |\n| `unordered_map` | 0.107초 | 107 ns | 1.0배 |\n| 정렬 `vector` + `lower_bound` | 0.228초 | 228 ns | 2.1배 느림 |\n| `map` | 1.459초 | 1459 ns | **13.7배 느림** |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 측정 스크립트는 `tools/bench/cpp_container_lookup.cpp`.)\n\n읽을 것이 셋 있다.\n\n**`map`이 `unordered_map`의 13.7배다.** $O(\\log n)$과 $O(1)$의 차이는 $\\log_2 10^6 \\approx 20$이지만 실제 배수는 그보다 작아야 정상이다. 더 벌어진 이유는 비교 횟수가 아니라 **매 비교가 다른 캐시 라인**이기 때문이다. 트리 노드는 힙에 흩어져 있고 §2의 포인터 추적이 20번 반복된다.\n\n**정렬 `vector`가 `map`의 6배 이상 빠르다.** 같은 $O(\\log n)$이고 비교 횟수도 같다. 다른 것은 배치뿐이다. 이분 탐색의 뒤쪽 절반은 좁은 구간을 훑어 같은 캐시 라인에 몰린다. ==삽입·삭제가 없고 정렬 순서만 필요하면 `map`이 아니라 정렬된 `vector`다.==\n\n**같은 $O(1)$인 직접 인덱스가 `unordered_map`의 13.8배다.** 해시 계산, 버킷 인덱스 계산, 노드 포인터 추적, 키 비교가 전부 상수에 들어 있다. **키가 조밀한 정수면 배열을 써라.** 방문 배열을 `unordered_map<int,bool>`로 잡는 것이 느린 이유가 이것이다([IV-3 BFS](#/iv-3)).\n:::\n\n::: deep\n`unordered_map`은 왜 이 이상 빨라지지 못하나. 표준이 **버킷 인터페이스**(`bucket_count`, `begin(n)`)와 **참조 안정성**을 요구하기 때문이다. 리해싱을 해도 원소의 주소가 바뀌면 안 되므로 구현이 사실상 **체이닝**으로 고정된다. 원소마다 노드를 따로 할당하고 포인터로 잇는 구조에서 캐시 지역성은 원리적으로 나올 수 없다.\n\n개방 주소법(모든 원소를 한 배열에)으로 짜면 훨씬 빠르지만 그것은 표준 인터페이스를 만족하지 않는다. 성능이 중요한 코드베이스가 표준 대신 자체 해시 맵을 쓰는 이유가 이것이다. 개방 주소법의 원리는 [0-3](#/0-3)과 [II-6 해시](#/ii-6)에 있다.\n\n`map`의 레드-블랙 트리는 [II-9 이진 탐색 트리와 균형 트리](#/ii-9)에서, 같은 문제를 디스크에서 푸는 B-Tree는 [XV-2](#/xv-2)에서 다룬다. **캐시 라인을 블록으로 바꾸면 `map`과 B-Tree는 같은 이야기다.**\n:::\n\n## 7. 무엇을 고를 것인가\n\n| 상황 | 선택 | 이유 |\n|---|---|---|\n| 개수를 알고 인덱스로 접근 | `vector` + `reserve` | 재할당 0, 캐시 최적 |\n| 크기가 컴파일 시점에 고정 | `array` | 힙 할당 없음 |\n| 양끝에서만 넣고 빼기 | `deque` | 앞 삽입 $O(1)$, 순회도 준수 |\n| 뒤에서만 넣고 빼기 | `vector` | `deque`보다 단순하고 빠르다 |\n| 키가 조밀한 정수 | `vector`를 표로 | 13.8배 |\n| 키가 희소하고 순서 불필요 | `unordered_map` | |\n| 순서가 필요하고 삽입·삭제가 잦음 | `map` / `set` | |\n| 순서가 필요하고 다 넣은 뒤 조회만 | 정렬 `vector` + `lower_bound` | `map`의 6배 |\n| 최솟값·최댓값만 반복해서 꺼냄 | `priority_queue` | 전체 정렬 불필요 |\n| 중간 삽입·삭제가 지배적이고 위치를 이미 알고 있음 | `list` | 이 조건이 전부 맞을 때만 |\n\n**`list`의 조건이 셋 다 맞는 경우는 드물다.** \"위치를 이미 알고 있다\"가 특히 그렇다. 위치를 찾는 데 $O(n)$이 들면 삽입이 $O(1)$인 것은 의미가 없다.\n\n## 8. 어디에 쓰이는가\n\n**LRU 캐시가 `list` + `unordered_map`의 교과서적 조합이다.** 접근한 항목을 목록 맨 앞으로 옮기고 넘치면 맨 뒤를 버린다. 목록 중간에서 노드를 떼어 앞으로 붙이는 것이 $O(1)$이어야 하고, 그 노드의 위치를 키로 즉시 찾아야 한다. `list`의 이터레이터가 **삽입·삭제에도 무효화되지 않는다**는 §4의 성질이 여기서 값을 한다. 교체 정책 자체는 [XV-9 캐시 교체 정책](#/xv-9)에서 다룬다.\n\n**대규모 그래프는 인접 리스트를 `vector<vector<int>>`가 아니라 CSR로 담는다.** 정점마다 `vector`를 하나씩 두면 정점 100만 개에 힙 할당이 100만 번이고 간선 순회가 §2의 포인터 추적이 된다. CSR은 모든 인접 정점을 하나의 연속 배열에 이어 붙이고 정점별 시작 위치만 따로 둔다. 같은 그래프, 같은 복잡도, 다른 배치다. [XI-10 그래프의 메모리 표현](#/xi-10)에서 다룬다.\n\n## 연습\n\n::: quiz\n전부 \"복잡도는 같은데 자료구조 선택이 결과를 가르는\" 유형이다.\n\n**1. 백준 10828 스택 (실버 4)** — https://www.acmicpc.net/problem/10828\n- 신호: 명령 5개를 그대로 구현. 명령 수 1만.\n- 상태: 스택 하나. `top`은 마지막 원소, `empty`는 크기 0.\n- 왜 이 자료구조인가: `stack`을 써도 되고 `vector`를 써도 된다. **`vector`로 짜 보고 `stack`으로 바꿔 보라.** 어댑터가 무엇을 막아 주고 무엇을 불편하게 하는지가 §5의 요점이다.\n\n**2. 백준 10866 덱 (실버 4)** — https://www.acmicpc.net/problem/10866\n- 신호: 앞뒤 양쪽에서 넣고 뺀다.\n- 상태: 덱 하나.\n- 왜 이 자료구조인가: `vector`로 앞 삽입을 흉내 내면 매번 $O(n)$이다. 청크 구조가 왜 필요한지가 여기서 나온다.\n\n**3. 백준 10815 숫자 카드 (실버 5)** — https://www.acmicpc.net/problem/10815\n- 신호: N, M이 각각 50만. \"가지고 있는 숫자인가\"를 M번 묻는다.\n- 상태: 가진 카드의 집합.\n- 왜 이 자료구조인가: 값 범위가 $\\pm 10^7$이라 직접 인덱스 배열, `unordered_set`, 정렬 후 이분 탐색이 전부 가능하다. **셋 다 짜서 시간을 비교하라.** §6의 표를 직접 재현하는 문제다.\n\n**4. 손으로 계산할 것.** `vector<int>`에 `reserve` 없이 원소 100만 개를 `push_back`했다. 재할당은 몇 번 일어났고, 그동안 **복사된 원소는 총 몇 개**인가. 그리고 그 총합이 100만의 몇 배인가.\n\n::: answer\n용량은 0에서 시작해 1, 2, 4, 8, …로 2배씩 간다. 100만은 $2^{19} = 524288$과 $2^{20} = 1048576$ 사이이므로 마지막 용량은 $2^{20}$이고 재할당은 **21번**이다.\n\n복사된 원소의 총합은 재할당 직전의 크기들을 더한 것이다.\n\n$$1 + 2 + 4 + \\dots + 2^{19} = 2^{20} - 1 = 1048575$$\n\n약 **105만 개**, 즉 원소 수의 **1.05배**다. 재할당이 무서워 보여도 총 복사량은 $2n$을 넘지 않는다. 이것이 분할상환 $O(1)$의 실체다. $1 + 2 + 4 + \\dots$가 마지막 항의 2배를 넘지 않는 등비급수이기 때문이다.\n\n**그런데도 `reserve`를 쓰는 이유는 총량이 아니라 분포다.** 21번의 재할당 중 마지막 한 번이 52만 개를 옮긴다. 그 한 번이 제어 주기 안에 걸리면 그 주기만 지연이 튄다. 평균이 좋다는 것과 최악이 없다는 것은 다른 말이고, 실시간 코드에서 문제가 되는 것은 언제나 최악이다([XI-5](#/xi-5)).\n:::\n:::\n\n## 요약\n\n- 같은 $O(n)$ 순회가 `vector`와 흩어진 `list` 사이에서 **206배** 갈린다. 원인은 캐시 라인 밀도, 프리페치 가능성, 노드 배치 순서 셋이다.\n- `vector`는 용량이 찰 때마다 2배로 늘리고 전부 복사한다. 분할상환 $O(1)$이지만 개별 호출의 최악은 $O(n)$이다. 개수를 알면 `reserve`.\n- **재할당은 그 컨테이너를 가리키던 참조·이터레이터를 전부 죽인다.** 죽은 참조를 읽어도 프로그램은 대개 죽지 않고 쓰레기를 돌려준다. 그래서 더 위험하다.\n- `m[k]`는 **없으면 만든다.** 읽기에는 `at`이나 `count`를 쓴다.\n- `int` 하나를 `set`에 담으면 48바이트다. 메모리 한도는 개수가 아니라 원소당 바이트로 계산한다.\n- $O(\\log n)$인 정렬 `vector`가 $O(\\log n)$인 `map`보다 6배 빠르고, $O(1)$인 `unordered_map`보다 $O(1)$인 배열 첨자가 13.8배 빠르다. **복잡도가 같으면 배치가 정한다.**\n\n**다음 절**: [0-7 C++ 알고리즘 함수 세트](#/0-7) — `sort`는 왜 최악에도 $O(n \\log n)$이고, `unique`는 왜 아무것도 지우지 않는가.\n","0-7":"# 0-7 C++ 알고리즘 함수 세트\n\n::: lead\n표준 알고리즘을 쓰는 이유는 짧아서가 아니라, 직접 짜면 지기 때문이다.\n:::\n\n## 1. 문제\n\n교과서에 나오는 퀵소트를 그대로 짠다. 피벗은 마지막 원소, 재귀 두 번. 무작위 입력에서는 잘 돈다. 그런데 **이미 정렬된 입력**을 넣으면 이렇게 된다.\n\n| 입력 | 순진한 퀵소트 | `std::sort` |\n|---|---|---|\n| 정렬된 10만 개 | 4.96초, 비교 **50억 회**, 재귀 깊이 10만 | 0.0010초 |\n| 정렬된 20만 개 | **Segmentation fault** (스택 초과) | 0.0021초 |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 기본 스택 8MB. 측정 스크립트는 `tools/bench/cpp_introsort_guard.cpp`.)\n\n피벗이 항상 최댓값이라 구간이 하나씩만 줄어든다. 비교는 $n(n-1)/2$회이고 재귀 깊이가 $n$이다. **정렬된 입력은 이상한 입력이 아니다.** 앞 단계에서 정렬해 넘긴 데이터, 시간순으로 쌓인 로그, 좌표 압축을 마친 배열이 전부 정렬된 입력이다.\n\n`std::sort`는 같은 입력에서 무너지지 않는다. 이유가 이 절의 첫 주제다.\n\n## 2. `sort`의 정체 — introsort\n\n📖 `std::sort(first, last)` — 구간 `[first, last)`를 오름차순 정렬. 최악 $O(n \\log n)$.\n   **안정 정렬이 아니다.** 같은 값의 원래 순서가 보존되지 않는다.\n   쓰는 곳: 거의 모든 곳. 좌표 압축([VI-5](#/vi-5)), 그리디 전처리([VI-2](#/vi-2)), 크루스칼([IX-4](#/ix-4)).\n   Python 대응: `list.sort()` / `sorted()` — 이쪽은 **안정 정렬**이다. 반대다.\n\n`std::sort`는 하나의 알고리즘이 아니라 셋의 합성이고, 이름이 **introsort**(introspective sort)다.\n\n```text nolines\n  sort(first, last)\n    │\n    ├─ size > 16, depth ok ──▶ quicksort 로 분할한다. 평균이 가장 빠르다\n    │\n    ├─ depth > 2*log2(n) ────▶ heapsort 로 전환한다. 최악을 O(n log n) 으로 묶는다\n    │\n    └─ size <= 16 ───────────▶ 건드리지 않고 남긴다\n                               마지막에 전체를 삽입 정렬로 한 번 훑는다\n```\n\n세 갈래가 각각 다른 문제를 푼다.\n\n**퀵소트는 평균이 가장 빠르다.** 추가 메모리가 없고 안쪽 루프가 단순해 캐시에 잘 맞는다. 하지만 §1처럼 최악이 $O(n^2)$다.\n\n**깊이 가드가 그 최악을 잘라 낸다.** 재귀 깊이가 $2\\log_2 n$을 넘으면 그 구간을 힙 정렬로 넘긴다. 힙 정렬은 어떤 입력에서도 $O(n \\log n)$이다. ==그래서 `std::sort`는 최악에도 이차가 될 수 없다.== 특정 입력을 골라 느리게 만드는 공격도 막힌다.\n\n**삽입 정렬이 마무리를 맡는다.** 작은 구간은 정렬하지 않고 남겨 둔 뒤, 마지막에 배열 전체를 삽입 정렬로 한 번 훑는다. 이 시점의 배열은 \"16칸 이내로만 어긋난\" 상태이고, 삽입 정렬은 그런 배열에서 $O(n + \\text{역순쌍})$이다. 재귀 호출 비용을 아끼면서 상수를 줄이는 설계다.\n\n::: perf\n같은 입력(무작위 정수 500만 개)에 대한 표준 함수들.\n\n| 함수 | 시간 | `sort` 대비 |\n|---|---|---|\n| `sort` | 0.402초 | 1.0배 |\n| `stable_sort` | 0.573초 | 1.43배 느림 |\n| `nth_element` (중앙값 하나) | 0.034초 | **11.9배 빠름** |\n| `partial_sort` (상위 100개) | 0.0033초 | **122배 빠름** |\n\n입력 모양을 바꿔 `sort`만 다시 재면 §1의 주장이 확인된다.\n\n| 입력 | `sort` |\n|---|---|\n| 무작위 500만 | 0.402초 |\n| 이미 정렬된 500만 | 0.071초 |\n| 역순 500만 | 0.052초 |\n| 전부 같은 값 500만 | 0.054초 |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 측정 스크립트는 `tools/bench/cpp_sort_bench.cpp`.)\n\n**최악의 입력이라던 것들이 오히려 빠르다.** 정렬된 입력에서 퀵소트 분할은 여전히 불균형하지만, 깊이 가드가 곧바로 힙 정렬로 넘기고 이동이 거의 없어 무작위보다 빨리 끝난다. 순진한 구현이 50억 번 비교하던 그 입력이다.\n:::\n\n::: deep\n비교 횟수를 직접 세면 두 구현의 차이가 수로 드러난다. 입력은 전부 **이미 정렬된 배열**이다.\n\n| n | 순진한 퀵소트 | `std::sort` | 순진한 쪽 재귀 깊이 |\n|---|---|---|---|\n| 1,000 | 499,500 | 10,621 | 1,000 |\n| 2,000 | 1,999,000 | 24,219 | 2,000 |\n| 4,000 | 7,998,000 | 54,413 | 4,000 |\n| 8,000 | 31,996,000 | 120,799 | 8,000 |\n\n왼쪽 열은 `n`이 2배가 될 때마다 정확히 **4배**가 된다. $n(n-1)/2$의 모양이다. 오른쪽은 2.28배, 2.25배, 2.22배로 2배에 조금씩 붙는다. $n \\log n$에서 $n$이 2배가 되면 $2n(\\log n + 1)$이므로 배수는 $2(1 + 1/\\log n)$이고, $n$이 커질수록 2에 수렴한다. **표의 배수 자체가 복잡도의 증거다.**\n\n재귀 깊이 열도 봐야 한다. 순진한 쪽은 깊이가 $n$이라 $n = 200{,}000$에서 스택 8MB를 다 쓰고 죽는다. `std::sort`의 깊이는 $2\\log_2 n$으로 묶여 있어 $n = 10^9$이어도 60 근처다. **깊이 가드는 성능 장치이면서 동시에 스택 안전 장치다.**\n:::\n\n## 3. 커스텀 정렬 — 비교자와 키\n\n::: dual\n```python title=\"점수 내림차순, 같으면 이름 오름차순\"\nstudents = [(\"bob\", 90), (\"amy\", 95), (\"cho\", 90), (\"dan\", 95)]\n\nstudents.sort(key=lambda s: (-s[1], s[0]))\n\nfor name, score in students:\n    print(name, score)\n```\n```cpp title=\"점수 내림차순, 같으면 이름 오름차순\"\n#include <algorithm>\n#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<pair<string, int>> students = {{\"bob\", 90}, {\"amy\", 95}, {\"cho\", 90}, {\"dan\", 95}};\n\n    sort(students.begin(), students.end(), [](const auto& a, const auto& b) {\n        if (a.second != b.second) return a.second > b.second;\n        return a.first < b.first;\n    });\n\n    for (const auto& [name, score] : students) cout << name << \" \" << score << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(n \\log n)$ — 비교 기반 정렬의 하한이고 두 구현 모두 이를 달성한다. 비교자 안에서 문자열을 비교하므로 실제로는 문자열 길이 $L$이 곱해져 $O(L n \\log n)$이다. 공간은 `sort`가 $O(\\log n)$(재귀 스택), Python `sort`는 $O(n)$(Timsort의 병합 버퍼)이다.\n\n출력은 같다.\n\n```console\namy 95\ndan 95\nbob 90\ncho 90\n```\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 지정 방식 | **키 함수.** 각 원소를 비교 가능한 값으로 바꾼다 | **비교자.** 두 원소 중 앞이 먼저인지 답한다 |\n| 호출 횟수 | 키는 원소당 **한 번**만 계산되고 저장된다 | 비교자는 비교마다 호출된다. $O(n \\log n)$회 |\n| 내림차순 | `reverse=True` 또는 키에 음수 | `>` 비교자 또는 `greater<>()` |\n| 다중 키 | 튜플로 묶으면 사전식 비교가 공짜 | `if`를 층층이 쌓거나 `tie(a.x, a.y) < tie(b.x, b.y)` |\n| 안정성 | `sort()`는 **안정**(Timsort) | `sort`는 **불안정**. 안정이 필요하면 `stable_sort` |\n| 알고리즘 | Timsort — 실제 데이터의 정렬된 구간을 활용 | introsort — 최악 보장 우선 |\n\n**키 함수와 비교자의 차이는 성능으로 나타난다.** 키가 비싼 계산이면(문자열 파싱, 거리 계산) Python은 한 번만 하고 C++은 매 비교마다 한다. C++에서 같은 효과를 얻으려면 키를 미리 계산해 `pair`로 묶어 정렬한다. 이 기법을 Python에서는 데코레이트-정렬-언데코레이트라 부르고, C++에서는 그냥 관용구다.\n\n::: warn\n`sort`가 불안정하다는 사실은 **다중 키 정렬을 두 번에 나눠 할 때** 드러난다.\n\n```cpp title=\"두 번 정렬로 다중 키를 만들려는 시도 (조각)\"\nsort(v.begin(), v.end(), by_name);    // 먼저 이름순\nsort(v.begin(), v.end(), by_score);   // ❌ 점수순으로 다시 — 이름 순서가 깨진다\n```\n\nPython에서는 이 방식이 동작한다. `list.sort()`가 안정이라 두 번째 정렬이 첫 번째 결과를 보존하기 때문이다. **같은 코드를 C++로 옮기면 조용히 틀린다.** C++에서는 비교자 하나에 두 조건을 다 넣거나 `stable_sort`를 쓴다.\n\n같은 값이 섞였을 때 순서가 재현되지 않으면 채점기에서 **가끔 틀리는** 형태로 나타난다. 원인을 찾기 가장 어려운 종류다.\n:::\n\n📖 `std::stable_sort(first, last)` — 같은 값의 원래 순서를 보존하는 정렬. $O(n \\log n)$.\n   추가 메모리 $O(n)$을 쓴다. **메모리 할당에 실패하면 $O(n \\log^2 n)$짜리 제자리 병합으로 물러난다.** 느려지지만 동작은 한다.\n   쓰는 곳: 여러 기준으로 차례차례 정렬해야 할 때.\n   Python 대응: `list.sort()` 자체가 이미 안정이라 따로 없다.\n\n## 4. 이분 탐색 함수\n\n📖 `std::lower_bound(first, last, x)` — `x` **이상**인 첫 원소의 이터레이터. $O(\\log n)$ 비교.\n📖 `std::upper_bound(first, last, x)` — `x` **초과**인 첫 원소의 이터레이터.\n   구간이 **정렬되어 있어야 한다.** 아니면 결과가 정의되지 않는다.\n   쓰는 곳: 좌표 압축([VI-5](#/vi-5)), LIS $O(n \\log n)$ 구현([VIII-6](#/viii-6)), 매개변수 탐색([VII-3](#/vii-3)).\n   Python 대응: `bisect.bisect_left` / `bisect.bisect_right`.\n\n::: dual\n```python title=\"정렬 배열에서 값의 개수 세기\"\nimport bisect\n\na = [1, 3, 3, 3, 5, 7, 9]\nx = 3\n\nlo = bisect.bisect_left(a, x)\nhi = bisect.bisect_right(a, x)\n\nprint(\"lower =\", lo)\nprint(\"upper =\", hi)\nprint(\"count =\", hi - lo)\n```\n```cpp title=\"정렬 배열에서 값의 개수 세기\"\n#include <algorithm>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> a = {1, 3, 3, 3, 5, 7, 9};\n    int x = 3;\n\n    int lo = lower_bound(a.begin(), a.end(), x) - a.begin();\n    int hi = upper_bound(a.begin(), a.end(), x) - a.begin();\n\n    cout << \"lower = \" << lo << \"\\n\";\n    cout << \"upper = \" << hi << \"\\n\";\n    cout << \"count = \" << hi - lo << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(\\log n)$ — 매 단계 구간이 절반으로 줄고, 폭 $n$을 1까지 접는 횟수가 $\\log_2 n$이다. 공간 $O(1)$. 다만 **비교 횟수가 $O(\\log n)$인 것과 전체가 $O(\\log n)$인 것은 다르다.** 다음 상자가 그 이야기다.\n\n두 출력은 `lower = 1`, `upper = 4`, `count = 3`으로 같다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 반환값 | **인덱스** 정수 | **이터레이터.** 인덱스는 `- a.begin()`으로 뺀다 |\n| 이름 | `bisect_left` / `bisect_right` | `lower_bound` / `upper_bound` |\n| 없는 값 | 삽입 위치를 돌려준다. 존재 확인은 따로 | 같다. `it != end() && *it == x`로 확인 |\n| 존재만 확인 | `a[i] == x` 직접 검사 | `binary_search(first, last, x)` |\n| 비교자 지정 | `key=` (Python 3.10+) | 넷째 인자로 비교자 |\n\n::: danger\n`std::lower_bound`는 **정렬된 구간이면 어떤 이터레이터에도 쓸 수 있다.** `std::set`에도 컴파일된다. 그리고 $O(n)$이 된다.\n\n| 호출 | 시간 (원소 20만, 질의 2000회) | 질의당 |\n|---|---|---|\n| `std::lower_bound(s.begin(), s.end(), x)` | 10.74초 | 5370 μs |\n| `s.lower_bound(x)` | 0.0010초 | 0.5 μs |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 5회 실행의 중앙값. 측정 스크립트는 `tools/bench/cpp_lower_bound_set.cpp`.)\n\n**약 1만 배다.** 이유는 [0-8 C++ 반복자·람다·비교자](#/0-8)의 주제인 반복자 카테고리에 있다. `std::lower_bound`는 구간의 중간으로 점프해야 하는데, `set`의 반복자는 점프를 못 하고 한 칸씩 걷는다. 비교는 여전히 $\\log n$번이지만 이동이 $O(n)$이다.\n\n==`set`과 `map`에는 반드시 **멤버 함수** `s.lower_bound(x)`를 써라.== 자유 함수는 컴파일 에러를 내지 않고 조용히 느려진다.\n:::\n\n## 5. 전부 정렬할 필요가 없을 때\n\n📖 `std::nth_element(first, nth, last)` — `nth` 위치에 **정렬했을 때 올 원소**를 놓는다. 기대 $O(n)$.\n   그 앞은 전부 그 값 이하, 뒤는 전부 이상이 되지만 **각각의 내부 순서는 정해지지 않는다.**\n   쓰는 곳: 중앙값, K번째 수, 이상치 제거.\n   Python 대응: 표준에는 없다. `heapq.nsmallest(k, it)`가 가장 가깝다.\n\n📖 `std::partial_sort(first, middle, last)` — 앞에서 `middle - first`개만 제대로 정렬한다. $O(n \\log k)$.\n   쓰는 곳: 상위 K개 추출.\n   Python 대응: `heapq.nlargest(k, it)`.\n\n**전체 정렬이 필요 없는데 정렬하는 코드는 흔하다.** 500만 개 중 중앙값 하나가 필요할 때 `sort`는 0.402초, `nth_element`는 0.034초다. 상위 100개면 `partial_sort`가 0.0033초로 122배다.\n\n$O(n)$의 근거는 이렇다. 퀵소트처럼 분할하되 **찾는 위치가 있는 쪽으로만** 재귀한다. 매번 절반씩 줄면 $n + n/2 + n/4 + \\dots < 2n$이다. `std::nth_element`는 최악에도 이차가 되지 않도록 introsort와 같은 방식의 가드를 둔다.\n\n::: warn\n`nth_element` 뒤의 배열은 정렬되어 있지 않다. `nth` 앞뒤가 \"이하/이상\"으로 갈라져 있을 뿐이다. 중앙값을 얻은 뒤 정렬된 배열이 필요하다고 착각하면 결과가 어긋난다.\n\n`n`이 짝수일 때의 중앙값처럼 **두 값이 필요하면 `nth_element`를 두 번** 부르거나, 두 번째 값은 `max_element(first, nth)`로 얻는다. 앞쪽이 전부 이하라는 성질을 쓰는 것이다.\n:::\n\n## 6. `unique`는 아무것도 지우지 않는다\n\n가장 자주 틀리는 표준 함수다. `unique`는 **인접한** 중복을 앞으로 밀어 모으고 \"여기까지가 유효하다\"는 위치를 돌려줄 뿐, 컨테이너 크기를 바꾸지 않는다.\n\n```console\n정렬 후             size=11  [1, 1, 2, 3, 3, 4, 5, 5, 5, 6, 9]\nunique 반환 위치: 앞에서 7번째\nunique 만 호출      size=11  [1, 2, 3, 4, 5, 6, 9, 5, 5, 6, 9]\nunique + erase         size=7  [1, 2, 3, 4, 5, 6, 9]\n정렬 없이 unique+erase size=11  [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]\n```\n\n> (실행 출력. 재현 스크립트는 `tools/bench/cpp_unique_erase.cpp`.)\n\n세 줄에서 세 가지를 읽는다. 첫째, `unique`만 부르면 **뒤쪽에 옛 값이 그대로 남는다.** 둘째, 크기를 줄이려면 `erase`를 붙여야 한다. 셋째, **정렬하지 않으면 인접 중복만 지운다** — 마지막 줄은 인접한 중복이 없어 하나도 지워지지 않았다.\n\n```cpp title=\"erase-remove 관용구 (조각)\"\nsort(v.begin(), v.end());\nv.erase(unique(v.begin(), v.end()), v.end());        // 중복 제거\n\nv.erase(remove(v.begin(), v.end(), 0), v.end());     // 값 0 전부 제거\nv.erase(remove_if(v.begin(), v.end(),\n                  [](int x) { return x < 0; }), v.end());   // 조건부 제거\n```\n\n**`remove`도 지우지 않는다.** 표준 알고리즘은 이터레이터 두 개만 받으므로 컨테이너에 접근할 수 없고, 따라서 크기를 바꿀 수 없다. 원소를 옮기고 새 끝 위치를 돌려주는 것이 할 수 있는 전부다. ==알고리즘과 컨테이너를 분리한 설계의 대가이고, 이 분리 자체는 [0-8](#/0-8)의 주제다.==\n\n## 7. 나머지 도구\n\n| 함수 | 하는 일 | 복잡도 | 주의 |\n|---|---|---|---|\n| `accumulate(f, l, init)` | 누적 합 | $O(n)$ | **`init`의 타입이 결과 타입이다** |\n| `max_element(f, l)` | 최댓값의 **이터레이터** | $O(n)$ | 값이 아니라 위치. `*max_element(...)` |\n| `minmax_element(f, l)` | 최소·최대를 한 번에 | $O(n)$ | 비교 횟수가 각각 부르는 것보다 적다 |\n| `fill(f, l, x)` | 구간을 `x`로 채움 | $O(n)$ | 2차원은 각 행마다 |\n| `iota(f, l, start)` | `start`부터 1씩 증가로 채움 | $O(n)$ | `<numeric>` 헤더 |\n| `reverse(f, l)` | 뒤집기 | $O(n)$ | |\n| `rotate(f, mid, l)` | `mid`가 맨 앞에 오도록 회전 | $O(n)$ | |\n| `count_if(f, l, pred)` | 조건을 만족하는 개수 | $O(n)$ | |\n| `all_of` / `any_of` / `none_of` | 조건 검사 | $O(n)$ | 조기 종료한다 |\n| `next_permutation(f, l)` | 사전순 다음 순열 | 분할상환 $O(1)$ | **정렬 상태에서 시작**해야 전부 돈다 |\n\n::: danger\n`accumulate`의 세 번째 인자는 초기값이면서 **누적 변수의 타입**이다.\n\n```cpp title=\"accumulate 의 초기값이 누적 타입이다 (조각)\"\nvector<int> v(5, 1000000000);\nlong long s1 = accumulate(v.begin(), v.end(), 0);     // ❌ 705032704\nlong long s2 = accumulate(v.begin(), v.end(), 0LL);   // ✅ 5000000000\n```\n\n`0`은 `int`라 내부 누적이 `int`로 일어난다. `long long`에 받아도 이미 넘친 값이 넓혀질 뿐이다. [0-5 §5](#/0-5)의 \"넓히기는 계산 전에\"가 그대로 재현된다. ==`accumulate`에는 `0LL`을 쓰는 것을 습관으로 만들어라.==\n:::\n\n`next_permutation`은 **현재 배열의 사전순 다음 순열**을 만들고 성공하면 `true`를 돌려준다. 이미 마지막(내림차순)이면 오름차순으로 되돌리고 `false`다. 그래서 모든 순열을 훑으려면 **정렬된 상태에서 시작해야 한다.** 정렬하지 않고 `do { ... } while (next_permutation(...))`를 돌리면 시작점 뒤쪽만 나온다. 순열 생성은 [III-2](#/iii-2)에서 재귀 구현과 함께 다룬다.\n\n## 8. 어디에 쓰이는가\n\n**중앙값 필터가 `nth_element`의 대표적인 실사용이다.** 영상에서 소금-후추 잡음을 제거할 때 각 픽셀을 주변 $3\\times3$ 또는 $5\\times5$ 창의 중앙값으로 바꾼다. 창마다 9개나 25개를 전부 정렬할 필요가 없고 가운데 하나만 있으면 된다. 픽셀이 100만 개면 이 선택이 그대로 프레임 레이트가 된다. 이미지 연산은 [XIII-8 이미지 기본 연산](#/xiii-8)에서 다룬다.\n\n**상위 K개 추출은 `partial_sort`의 자리다.** 검색 결과 상위 10개, 로그에서 가장 느린 요청 20개, 후보 경로 중 비용이 낮은 K개. 전체를 정렬해 앞 K개만 쓰는 코드는 흔하고, 데이터가 커지는 순간 그 낭비가 드러난다. 경로 후보 선별은 [V-6 A\\* 변형](#/v-6)에서 다시 나온다.\n\n**`sort` + `unique` + `lower_bound` 세 줄이 좌표 압축의 전부다.** 값의 범위는 $10^9$인데 실제로 등장하는 값은 $10^5$개일 때, 값을 순서만 보존한 채 $0 \\dots m-1$로 옮기는 기법이다. 세그먼트 트리와 스위핑이 이 전처리 위에서 돈다([VI-5 좌표 압축](#/vi-5), [IX-2 세그먼트 트리](#/ix-2)).\n\n## 연습\n\n::: quiz\n표준 함수를 **어떤 것으로 조합할지**가 핵심인 문제들이다.\n\n**1. 백준 2751 수 정렬하기 2 (실버 5)** — https://www.acmicpc.net/problem/2751\n- 신호: 100만 개 정렬. $O(n^2)$은 $10^{12}$라 불가능.\n- 상태: 없다. 배열 하나.\n- 왜 이 도구인가: `sort` 한 줄로 끝나지만 **입출력 설정이 없으면 시간 초과**다([0-5](#/0-5)). 알고리즘이 아니라 상수가 승부인 문제다.\n\n**2. 백준 11651 좌표 정렬하기 2 (실버 5)** — https://www.acmicpc.net/problem/11651\n- 신호: y좌표 우선, 같으면 x좌표. 다중 키다.\n- 상태: 점의 배열.\n- 왜 이 도구인가: 비교자를 두 층으로 쌓는 연습. **두 번 정렬하는 방식으로 짜 보고 왜 C++에서 깨지는지 확인하라**(§3의 경고).\n\n**3. 백준 18870 좌표 압축 (실버 2)** — https://www.acmicpc.net/problem/18870\n- 신호: \"자신보다 작은 서로 다른 좌표의 개수\". 값의 범위는 $10^9$, 개수는 $10^6$.\n- 상태: 정렬·중복 제거된 값 목록.\n- 왜 이 도구인가: `sort` → `unique` + `erase` → `lower_bound` 세 단계가 그대로 답이 되는 원형 문제다. §6과 §4를 한 번에 쓴다.\n\n**4. 손으로 계산할 것.** `vector<int> v = {5, 5, 1, 5, 1};`에 `sort` 없이 `v.erase(unique(v.begin(), v.end()), v.end());`를 적용하면 결과는 무엇인가. 그리고 `sort`를 먼저 하면 무엇인가. 두 결과의 크기가 다른 이유를 한 문장으로 쓰라.\n\n::: answer\n정렬 없이 적용하면 `{5, 1, 5, 1}`이다. 인접한 `5, 5`만 하나로 합쳐지고 떨어져 있는 `5`와 `1`은 그대로 남는다. 크기는 5에서 4로만 줄어든다.\n\n`sort`를 먼저 하면 `{1, 1, 5, 5, 5}`가 되고, `unique` + `erase` 후 `{1, 5}`다. 크기는 2다.\n\n이유 한 문장: ==`unique`는 전역 중복이 아니라 **인접 중복**만 제거하므로, 같은 값을 인접시키는 정렬이 전제 조건이다.== 그리고 이 성질은 결함이 아니라 설계다. 전역 중복 제거를 하려면 해시나 트리가 필요해 $O(n)$ 추가 메모리가 들지만, 인접 중복 제거는 한 번 훑기로 끝나고 추가 메모리가 $O(1)$이다. **정렬이 이미 되어 있다면 그쪽이 더 싸다.**\n:::\n:::\n\n## 요약\n\n- `std::sort`는 introsort다. 퀵소트로 달리다 재귀 깊이가 $2\\log_2 n$을 넘으면 힙 정렬로 전환하고, 16개 이하 구간은 마지막에 삽입 정렬로 마무리한다. **그래서 최악에도 이차가 되지 않는다.** 순진한 퀵소트는 정렬된 20만 개에서 스택을 다 쓰고 죽었다.\n- `sort`는 **불안정**이고 Python `sort()`는 **안정**이다. 다중 키를 두 번의 정렬로 나누는 방식은 Python에서만 동작한다.\n- `stable_sort`는 안정성을 $O(n)$ 추가 메모리와 1.43배의 시간으로 산다.\n- 전부 정렬할 필요가 없으면 `nth_element`(11.9배)나 `partial_sort`(122배)를 쓴다.\n- **`unique`와 `remove`는 지우지 않는다.** 이터레이터만 받는 알고리즘은 컨테이너 크기를 바꿀 수 없다. `erase`를 붙이는 것이 관용구다.\n- `set`·`map`에 `std::lower_bound`를 쓰면 컴파일은 되고 1만 배 느려진다. 멤버 함수를 써라.\n- `accumulate`의 초기값은 누적 타입이다. `0`이 아니라 `0LL`.\n\n**다음 절**: [0-8 C++ 반복자·람다·비교자](#/0-8) — 표준 알고리즘이 컨테이너를 모르고도 도는 이유, 그리고 비교자에 `<=`를 쓰면 왜 프로그램이 죽는가.\n","0-8":"# 0-8 C++ 반복자·람다·비교자\n\n::: lead\n표준 알고리즘이 컨테이너를 모르고도 도는 구조, 그리고 그 구조가 조용히 무너지는 두 지점.\n:::\n\n## 1. 문제\n\n정렬 비교자에 등호 하나를 더 붙인다. 내림차순도 오름차순도 아니고 그냥 실수다.\n\n```cpp title=\"등호 하나 (조각)\" {2}\nvector<int> v(n, 42);                                  // 전부 같은 값\nsort(v.begin(), v.end(), [](int a, int b) { return a <= b; });   // < 가 아니라 <=\n```\n\n`n`을 바꿔 가며 돌린 결과다. 정렬 구간 앞뒤에 감시용 칸을 16개씩 두고 그 값이 바뀌는지 확인했다.\n\n| `n` | 결과 |\n|---|---|\n| 8, 16 | 아무 일도 없음 |\n| **17** | **Segmentation fault** (3회 실행 모두) |\n| 32, 100, 1000, 100000 | 죽지 않음. **정렬 구간 밖 16칸이 덮어써짐** |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측. 재현 스크립트는 `tools/bench/cpp_strict_weak_ordering.cpp`.)\n\n가장 나쁜 줄은 세 번째다. **죽지 않았다.** 프로그램은 계속 돌고, 정렬 결과도 얼추 맞아 보이고, 대신 배열 밖의 남의 메모리 16칸이 조용히 바뀌었다. 그 메모리가 무엇이었는지에 따라 증상은 몇 시간 뒤 엉뚱한 곳에서 나타난다.\n\n`<`와 `<=`의 차이가 왜 이런 결과를 내는지가 이 절의 마지막 주제다. 먼저 그 밑에 깔린 구조부터 본다.\n\n## 2. 반복자 — 알고리즘과 컨테이너를 잇는 규약\n\n알고리즘이 $M$개, 컨테이너가 $N$개 있다. 각 알고리즘이 각 컨테이너를 직접 알면 구현이 $M \\times N$개 필요하다. 표준 라이브러리는 그 사이에 **반복자**라는 규약을 두어 $M + N$으로 줄였다. 알고리즘은 반복자만 알고, 컨테이너는 반복자만 제공한다.\n\n```text nolines\n  sort  find  accumulate  unique       <- 알고리즘: 반복자만 안다\n    │     │       │         │\n    └─────┴───┬───┴─────────┘\n              │  반복자 (규약)\n    ┌─────┬───┴───┬─────────┐\n    │     │       │         │\n  vector list    set     istream       <- 컨테이너: 반복자만 제공한다\n```\n\n대가가 두 개 있다. **첫째, 알고리즘은 컨테이너를 수정할 수 없다.** `unique`와 `remove`가 아무것도 지우지 못하는 이유가 이것이다([0-7 §6](#/0-7)). **둘째, 비용이 인터페이스에 드러나지 않는다.** 같은 함수 호출이 컨테이너에 따라 $O(\\log n)$이거나 $O(n)$이다.\n\n### 카테고리 다섯 종류\n\n| 카테고리 | 할 수 있는 것 | 대표 |\n|---|---|---|\n| 입력(input) | 한 방향 진행, **한 번만** 읽기 | `istream_iterator` |\n| 출력(output) | 한 방향 진행, 쓰기만 | `back_insert_iterator` |\n| 순방향(forward) | 한 방향 진행, 여러 번 읽기 | `forward_list`, `unordered_map` |\n| 양방향(bidirectional) | `++`와 `--` | `list`, `set`, `map` |\n| 임의 접근(random access) | `it + n`, `it2 - it1`, `it[n]` | `vector`, `deque`, `array`, 포인터 |\n\n위에서 아래로 갈수록 할 수 있는 일이 늘어난다. **표준 알고리즘은 필요한 최소 카테고리를 요구한다.** `find`는 입력 반복자로 충분하고, `sort`는 임의 접근을 요구한다. 그래서 `list.sort()`는 멤버 함수로 따로 있다 — `std::sort`에 `list`의 반복자를 넘기면 컴파일되지 않는다.\n\n::: dual\n```python title=\"한 번 쓰면 사라지는 반복자\"\ndata = (int(x) for x in \"1 2 3 4 5\".split())\n\nfirst = sum(data)\nsecond = sum(data)\n\nprint(\"first =\", first)\nprint(\"second =\", second)\n```\n```cpp title=\"한 번 쓰면 사라지는 반복자\"\n#include <iostream>\n#include <iterator>\n#include <numeric>\n#include <sstream>\nusing namespace std;\n\nint main() {\n    istringstream data(\"1 2 3 4 5\");\n\n    int first = accumulate(istream_iterator<int>(data), istream_iterator<int>(), 0);\n    int second = accumulate(istream_iterator<int>(data), istream_iterator<int>(), 0);\n\n    cout << \"first = \" << first << \"\\n\";\n    cout << \"second = \" << second << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(n)$ — 각 원소를 한 번씩 읽는다. 공간 $O(1)$ — 원소를 저장하지 않는 것이 입력 반복자의 요점이다. 그래서 두 번째 순회는 $O(1)$에 끝나고 답은 0이다.\n\n두 출력이 같다.\n\n```console\nfirst = 15\nsecond = 0\n```\n\n**두 언어가 같은 함정을 공유한다.** Python 제너레이터와 C++ 입력 반복자는 둘 다 \"한 번만 읽을 수 있는\" 자료원이다. 다 쓰고 나면 비어 있다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 한 번만 읽히는 것 | 제너레이터, `map`/`filter`/`zip`의 결과 | 입력 반복자(`istream_iterator` 등) |\n| 다시 쓰려면 | `list(...)`로 실체화 | `vector`에 담아 두기 |\n| 다 썼는지 확인 | 방법이 없다. 소진되면 조용히 빈 것이 된다 | 같다. 끝 반복자와 같아질 뿐 |\n| 카테고리 개념 | 없다. 전부 단일 패스 | 다섯 단계로 구분되고 알고리즘이 요구 수준을 정한다 |\n\n### 카테고리는 비용의 이름이다\n\n📖 `std::distance(first, last)` — 두 반복자 사이의 원소 수.\n   임의 접근이면 뺄셈 한 번, 아니면 `++`를 세면서 걷는다.\n   Python 대응: 없다. `len()`이 컨테이너에게 직접 묻는다.\n\n| 호출 | 시간 (원소 20만, 500회) | 회당 |\n|---|---|---|\n| `distance(v.begin(), v.end())` — `vector` | 0.0000초 | 뺄셈 한 번 |\n| `distance(l.begin(), l.end())` — `list` **전체** | 0.0000초 | 아래 상자 참고 |\n| `distance(l.begin(), mid)` — `list` **절반** | 0.098초 | 195 μs |\n| `distance(s.begin(), s.end())` — `set` | 1.25초 | 2509 μs |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 측정 스크립트는 `tools/bench/cpp_iterator_category.cpp`.)\n\n::: deep\n`list` 전체 구간이 0초로 나온 것은 측정 실수가 아니다. libstdc++은 `std::distance`가 **리스트 전체 길이를 재는 경우**를 따로 잡아낸다. `bits/stl_list.h`에 이런 특수화가 있다.\n\n```cpp title=\"libstdc++ 13, bits/stl_list.h (발췌)\"\n// Detect when distance is used to compute the size of the whole list.\n_List_iterator<_Tp> __beyond = __last;\n++__beyond;\nbool __whole = __first == __beyond;\nif (__builtin_constant_p (__whole) && __whole)\n  return static_cast<const _Sentinel*>(__last._M_node)->_M_size;\n```\n\nC++11부터 `list::size()`가 $O(1)$이어야 해서 리스트가 원소 수를 들고 다니는데, 전체 길이를 구하는 호출이면 그 값을 그냥 돌려준다. **부분 구간에는 이 지름길이 없고, 그때 195 μs가 나온다.** 카테고리의 진짜 비용은 그쪽에 있다.\n\n이 측정에는 함정이 하나 더 있었다. 컨테이너를 만든 함수 안에서 바로 재면 컴파일러가 \"방금 $n$개를 넣었으니 답은 $n$\"이라고 판정해 순회를 통째로 지운다. 처음 측정이 실제로 그렇게 나왔고, 어셈블리에는 저장된 크기를 읽는 명령 하나만 남아 있었다. 측정 함수를 `noinline, noipa`로 떼어 낸 뒤에야 숫자가 나왔다. ==벤치마크에서 0이 나오면 빠른 것이 아니라 지워진 것을 먼저 의심하라.==\n:::\n\n`set`이 2509 μs인 것이 [0-7 §4](#/0-7)에서 본 `std::lower_bound`의 1만 배를 설명한다. 이분 탐색은 구간 중간으로 가야 하는데, 양방향 반복자에게 \"중간으로 가라\"는 곧 \"절반만큼 한 칸씩 걸어라\"다. 비교는 여전히 $\\log n$번이고 **이동이 $O(n)$이다.**\n\n::: warn\n`v.end()`는 **마지막 원소가 아니라 마지막 다음**을 가리킨다. 역참조하면 미정의 동작이다. 반열림 구간 `[first, last)` 관례가 표준 전체에 일관되게 쓰인다([0-11 §4](#/0-11)).\n\n이 관례가 주는 이득은 세 가지다. 빈 구간이 `first == last` 하나로 표현되고, 원소 수가 `last - first`로 바로 나오며, 구간을 이어 붙일 때 경계가 중복되지 않는다.\n\n반복자를 무효화시키는 조건은 컨테이너마다 다르다. 표는 [0-6 §4](#/0-6)에 있다.\n:::\n\n## 3. 람다 — 그 자리에서 만드는 함수 객체\n\n람다는 문법 설탕이 아니다. 컴파일러가 **익명 클래스를 하나 만들고 `operator()`를 정의한 뒤 그 객체를 만드는 것**이다. 캡처한 변수는 그 클래스의 멤버가 된다.\n\n```cpp title=\"람다와 그 정체 (조각)\"\nint threshold = 10;\nauto pred = [threshold](int x) { return x > threshold; };\n\n// 컴파일러가 만드는 것과 대체로 같다\nstruct __lambda {\n    int threshold;                                   // 캡처가 멤버가 된다\n    bool operator()(int x) const { return x > threshold; }\n};\nauto pred2 = __lambda{threshold};\n```\n\n| 캡처 | 뜻 |\n|---|---|\n| `[]` | 아무것도 캡처하지 않는다. 함수 포인터로 변환 가능 |\n| `[x]` | `x`를 **값으로** 복사. 기본이 `const`라 수정 불가 |\n| `[&x]` | `x`를 **참조로**. 원본을 읽고 쓴다 |\n| `[=]` | 쓰인 것을 전부 값으로 |\n| `[&]` | 쓰인 것을 전부 참조로 |\n| `[this]` | 멤버 함수 안에서 객체 자신을 참조로 |\n| `[y = expr]` | 초기화 캡처(C++14). 새 이름에 계산 결과를 담는다 |\n| `[x]() mutable` | 값 캡처한 복사본을 수정할 수 있게 한다 |\n\n실행 결과로 확인한다.\n\n```console\n값 캡처:  pred(5)=0 pred(50)=1\n참조 캡처: pred(5)=1 pred(50)=1  (값은 실행마다 달라질 수 있다)\nmutable 값 캡처: 1 2 3, 바깥 count=0\n참조 캡처(같은 스코프): total=10\n```\n\n> (실행 출력. 재현 스크립트는 `tools/bench/cpp_lambda_capture.cpp`.)\n\n::: danger\n둘째 줄이 사고다. `threshold = 10`을 참조로 캡처한 람다를 **그 변수가 사는 함수 밖으로 반환**했다. `pred(5)`는 거짓이어야 하는데 참이 나왔다. 죽은 스택 자리에 남아 있던 쓰레기와 5를 비교한 것이다.\n\n```cpp title=\"스코프보다 오래 사는 클로저 (조각)\"\nfunction<bool(int)> make_pred() {\n    int threshold = 10;\n    return [&threshold](int x) { return x > threshold; };   // ❌ threshold 는 곧 죽는다\n}\n```\n\n`-fsanitize=address`로 빌드하면 정체가 드러난다.\n\n```console\nERROR: AddressSanitizer: stack-use-after-scope\nREAD of size 4 ... in std::_Function_handler<bool (int), make_pred()::{lambda(int)#1}>\n```\n\n규칙: ==클로저가 그것을 만든 스코프보다 오래 살면 참조 캡처를 쓰지 마라.== 콜백으로 등록하는 람다, 스레드에 넘기는 람다, 작업 큐에 넣는 람다가 전부 여기 해당한다. 그런 자리에는 값 캡처나 `[p = shared_ptr]` 초기화 캡처를 쓴다.\n\n`[&]`가 위험한 이유도 같다. 무엇을 캡처했는지 코드에 안 적혀 있어 수명 검토를 눈으로 할 수 없다.\n:::\n\n::: dual\n```python title=\"루프 변수를 담은 클로저 세 개\"\nfuncs = []\nfor i in range(3):\n    funcs.append(lambda: i)\n\nfor f in funcs:\n    print(f(), end=\" \")\nprint()\n```\n```cpp title=\"루프 변수를 담은 클로저 세 개\"\n#include <functional>\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<function<int()>> funcs;\n    for (int i = 0; i < 3; ++i) {\n        funcs.push_back([i]() { return i; });\n    }\n\n    for (const auto& f : funcs) cout << f() << \" \";\n    cout << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(k)$ — 클로저 $k$개를 만들고 각각 한 번 호출한다. 공간 $O(k)$ — 클로저마다 캡처한 값을 따로 들고 있다. 여기서 두 언어의 답이 갈린다.\n\n```console\nPython:  2 2 2\nC++:     0 1 2\n```\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 기본 캡처 | **변수 자체를 참조.** 호출 시점의 값을 본다(늦은 바인딩) | 캡처 방식을 **명시**해야 한다. `[i]`는 만든 시점의 값 |\n| 루프에서 | 세 클로저가 같은 `i`를 공유해 전부 `2` | `[i]`면 각자 복사본을 들어 `0 1 2` |\n| 값을 고정하려면 | `lambda i=i: i` — 기본 인자로 그 시점 값을 박는다 | 기본이 그 동작이다 |\n| 참조로 하려면 | 기본이 그 동작이다 | `[&i]`. 그리고 루프가 끝나면 죽는다 |\n| 수명 관리 | 참조 카운트가 알아서 살려 둔다 | **직접 책임진다.** 위 `::: danger`가 그 결과 |\n\n==Python의 기본은 C++의 `[&]`에 가깝고, C++의 관용적 기본은 `[=]`에 가깝다.== 두 언어를 오갈 때 클로저에서 사고가 나는 자리가 정확히 여기다.\n\n::: perf\n비교자를 어떤 형태로 넘기느냐가 정렬 속도를 바꾼다. 무작위 정수 500만 개, 비교 내용은 넷 다 `x < y`로 동일하다.\n\n| 비교자 | 시간 | 기본 대비 |\n|---|---|---|\n| 기본 (`operator<`) | 0.429초 | 1.00배 |\n| 람다 | 0.415초 | 0.97배 |\n| 함수 포인터 | 0.582초 | 1.36배 |\n| `std::function` | 0.763초 | **1.78배** |\n\n> (Linux x86-64 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 측정 스크립트는 `tools/bench/cpp_comparator_overhead.cpp`.)\n\n**람다가 기본과 같다.** 람다는 타입마다 고유한 클래스라 `sort` 템플릿이 그 타입으로 실체화되고 `operator()`가 통째로 인라인된다. 호출이 사라진다.\n\n**`std::function`은 1.78배다.** `std::function`은 타입 소거 장치다. 어떤 호출 가능 객체든 담을 수 있는 대신, 실제 호출은 가상 함수 호출 한 겹을 거친다. 인라인이 불가능하고 그 비용이 비교마다, 즉 $O(n \\log n)$번 든다.\n\n정렬 비교자, 우선순위 큐 비교자, 안쪽 루프의 콜백에는 `std::function`을 쓰지 마라. **`std::function`은 \"타입이 다른 것들을 한 컨테이너에 담아야 할 때\"의 도구다.**\n:::\n\n## 4. strict weak ordering — 비교자가 지켜야 하는 것\n\n이제 §1로 돌아간다. 표준은 비교자에 네 가지를 요구하고, 이것을 묶어 **strict weak ordering**이라 부른다.\n\n| 조건 | 뜻 | `<=`가 어기는가 |\n|---|---|---|\n| 비반사성 | `cmp(a, a)`는 항상 거짓 | **어긴다.** `a <= a`는 참 |\n| 비대칭성 | `cmp(a, b)`가 참이면 `cmp(b, a)`는 거짓 | **어긴다.** 같은 값이면 양쪽 다 참 |\n| 추이성 | `a < b`이고 `b < c`면 `a < c` | 지킨다 |\n| 동등의 추이성 | `a`와 `b`가 동등하고 `b`와 `c`가 동등하면 `a`와 `c`도 동등 | 지킨다 |\n\n\"동등\"은 `cmp(a, b)`와 `cmp(b, a)`가 **둘 다 거짓**인 상태로 정의된다. `<=`를 쓰면 같은 값에 대해 둘 다 참이 되어 이 정의 자체가 무너진다.\n\n::: deep\n왜 그것이 배열 밖 접근으로 이어지나. `std::sort`의 삽입 정렬 단계에는 `__unguarded_linear_insert`라는 함수가 있고, 이름 그대로 **경계 검사를 하지 않는다.**\n\n```cpp title=\"libstdc++ 의 삽입 정렬 안쪽 루프 (발췌)\"\nwhile (comp(val, *(it - 1))) { *it = *(it - 1); --it; }   // 경계 검사가 없다\n```\n\n검사를 뺄 수 있는 근거는 앞쪽 어딘가에 `val`보다 작거나 같은 원소가 반드시 있다는 것이다. 그 원소에서 `comp`가 거짓이 되어 루프가 멈춘다. 퀵소트 분할이 남긴 피벗이 그 **보초** 역할을 한다.\n\n비교자가 비반사적이지 않으면 보초에서도 `comp`가 참이 된다. 루프는 멈추지 않고 배열 앞으로 계속 걸어 나간다. 경계 검사를 넣으면 되지 않느냐는 반문에는 답이 있다 — 그 검사는 안쪽 루프에서 원소마다 든다. **표준은 \"비교자가 규약을 지킨다\"를 전제로 그 비용을 없앤 것이고, 규약을 어기면 그 전제의 대가를 치른다.**\n\n이것이 C++ 전반의 설계다. 검사할 수 있는 것을 검사하지 않고 요구 사항으로 문서화한다. 지키면 공짜, 어기면 미정의 동작이다([0-5 §6](#/0-5)).\n:::\n\n`n = 17`에서만 죽고 `n = 100`에서는 살아남은 이유도 여기서 나온다. 원소가 16개 이하면 `sort`는 경계 검사가 있는 삽입 정렬만 쓴다. 17개부터 introsort 경로로 들어가고, 어디까지 걸어 나가느냐는 그때의 메모리 배치가 정한다. **크기와 값 분포에 따라 죽기도 하고 조용히 남의 메모리를 덮기도 한다.** 재현되지 않는 버그의 전형이다.\n\n두 도구가 이것을 잡는다.\n\n```console\n$ g++ -std=c++17 -O2 -D_GLIBCXX_DEBUG swo.cpp && ./a.out\nError: comparison doesn't meet irreflexive requirements, assert(!(a < a)).\n\n$ g++ -std=c++17 -O2 -fsanitize=address swo.cpp && ./a.out\nERROR: AddressSanitizer: heap-buffer-overflow\n  in std::__introsort_loop<...>\n0x516000000290 is located 0 bytes after 528-byte region\n```\n\n`-D_GLIBCXX_DEBUG`는 **비교자 자체를 검사해 원인을 그대로 말해 준다.** 제출용 빌드에는 넣지 않지만(느려진다) 로컬에서 정렬 관련 버그를 만나면 첫 번째로 켜 볼 스위치다.\n\n::: pitfall\n실제로 나오는 위반들이다.\n\n- **`return a.score >= b.score;`** — 내림차순을 만들려다 등호를 붙인 경우. `>`만 쓰면 된다.\n- **`return a.x < b.x || a.y < b.y;`** — 다중 키를 `||`로 이었다. 추이성이 깨진다. 올바른 형태는 `if (a.x != b.x) return a.x < b.x; return a.y < b.y;`다.\n- **`double`에 NaN이 섞임.** NaN은 어떤 값과 비교해도 거짓이라 비대칭성은 지키지만 동등의 추이성이 깨진다. NaN이 있는 배열을 `sort`에 넘기지 마라. 부동소수 비교는 [X-7](#/x-7)에서 다룬다.\n- **비교자 안에서 상태를 바꿈.** 비교자는 호출 순서와 횟수가 보장되지 않는다. 카운터를 증가시키거나 캐시를 갱신하면 결과가 재현되지 않는다.\n- **`priority_queue`의 비교자 방향 착각.** `priority_queue`는 비교자가 \"우선순위가 낮다\"를 뜻해 `less`가 최대 힙이 된다. `sort`와 반대 방향으로 읽힌다.\n:::\n\n::: interview\n정렬 비교자를 짜게 한 뒤 이어지는 질문은 대개 이것이다.\n\n**\"이 비교자가 만족해야 하는 조건이 무엇입니까.\"**\n답변 뼈대는 이름과 네 조건이다. \"strict weak ordering입니다. 비반사성, 비대칭성, 추이성, 동등 관계의 추이성 넷이고, 실무에서 깨지는 것은 거의 항상 첫 번째입니다. `<=`를 쓰면 `cmp(a, a)`가 참이 되고, `std::sort`의 삽입 정렬 단계가 경계 검사를 생략하고 있어서 배열 밖으로 걸어 나갑니다.\"\n\n**\"어기면 어떻게 됩니까.\"**\n\"미정의 동작입니다. 관찰로는 크래시가 나기도 하고 정렬 구간 밖 메모리가 조용히 덮이기도 합니다. 원소가 16개 이하면 아무 일도 안 일어나서 작은 테스트로는 안 잡힙니다. `-D_GLIBCXX_DEBUG`로 빌드하면 비교자 자체를 검사해 줍니다.\"\n\n크래시 여부를 단정하지 않는 것이 중요하다. **미정의 동작의 핵심은 \"무엇이 일어나는지 정해져 있지 않다\"이지 \"크래시한다\"가 아니다.**\n:::\n\n## 5. 어디에 쓰이는가\n\n**이벤트 콜백의 수명 관리가 §3의 `::: danger` 그대로다.** 구독자가 핸들러를 등록하면 그 클로저는 구독을 해지할 때까지 살아 있다. 그 사이에 클로저가 참조로 잡은 객체가 먼저 파괴되면 이벤트가 발생하는 순간 죽은 메모리를 읽는다. 그래서 이벤트 버스 구현은 대개 약한 참조를 들고 있다가 호출 직전에 살아 있는지 확인한다. 이 구조는 [XII-7 Observer / Publish-Subscribe](#/xii-7)에서 다룬다.\n\n**스레드 풀에 넘기는 작업이 같은 문제의 더 나쁜 버전이다.** 작업 큐에 람다를 넣으면 그것은 다른 스레드에서, 넣은 함수가 이미 반환한 뒤에 실행된다. `[&]`로 캡처한 작업은 거의 확실히 죽은 스택을 읽는다. 여기서는 값 캡처가 규칙이고, 큰 객체는 소유권째로 옮긴다. 작업 큐는 [XI-4 스레드 풀과 작업 큐](#/xi-4)에서 다룬다.\n\n**우선순위 큐의 비교자가 스케줄링 정책 그 자체다.** 마감이 이른 순, 우선순위가 높은 순, 둘을 조합한 순 — 정책을 바꾸는 것이 비교자를 바꾸는 일이고, 그래서 비교자를 갈아 끼울 수 있게 만드는 것이 [XII-6 Strategy](#/xii-6) 패턴이다. 그 비교자가 strict weak ordering을 어기면 스케줄러가 미정의 동작으로 들어간다. 실시간 스케줄링은 [XI-5](#/xi-5)에 있다.\n\n## 연습\n\n::: quiz\n비교자와 반복자 선택이 그대로 정답을 가르는 유형이다.\n\n**1. 백준 1181 단어 정렬 (실버 5)** — https://www.acmicpc.net/problem/1181\n- 신호: 길이 우선, 같으면 사전순, 중복 제거.\n- 상태: 단어 배열.\n- 왜 이 도구인가: 다중 키 비교자와 `unique` + `erase`가 한 문제에 같이 나온다. **비교자를 `||`로 잇는 실수를 실제로 해 보고** 결과가 어떻게 어긋나는지 확인하라(§4의 두 번째 함정).\n\n**2. 백준 11650 좌표 정렬하기 (실버 5)** — https://www.acmicpc.net/problem/11650\n- 신호: x 우선, 같으면 y. 점 10만 개.\n- 상태: 점의 배열.\n- 왜 이 도구인가: `pair`의 기본 비교가 이미 사전식이라 비교자가 필요 없다. **필요 없는 비교자를 안 쓰는 것도 판단이다.**\n\n**3. 백준 11279 최대 힙 (실버 2)** — https://www.acmicpc.net/problem/11279\n- 신호: 최댓값을 반복해서 꺼낸다. 전체 정렬이 필요 없다.\n- 상태: 힙 하나.\n- 왜 이 도구인가: `priority_queue`의 기본이 최대 힙이라 그대로 되고, 최소 힙 문제(백준 1927)로 바꾸면 비교자를 뒤집어야 한다. **§4 마지막 함정을 몸으로 확인하는 자리**다. Python `heapq`는 정반대라 부호를 뒤집는다.\n\n**4. 손으로 판정할 것.** 다음 비교자 셋이 strict weak ordering을 만족하는지 각각 판정하고, 어기는 것은 어느 조건을 어기는지 쓰라.\n\n```cpp title=\"이 셋 중 무엇이 규약을 만족하는가 (조각)\"\nauto c1 = [](const P& a, const P& b) { return a.x <= b.x; };\nauto c2 = [](const P& a, const P& b) { return a.x < b.x || a.y < b.y; };\nauto c3 = [](const P& a, const P& b) { return abs(a.x - b.x) > 1e-9 ? a.x < b.x : a.y < b.y; };\n```\n\n::: answer\n**`c1`은 비반사성과 비대칭성을 어긴다.** `c1(a, a)`는 `a.x <= a.x`라 참이다. `x`가 같은 두 점에 대해 양방향 모두 참이 되어 동등 관계가 정의되지 않는다. §1의 크래시가 이것이다.\n\n**`c2`는 추이성을 어긴다.** `a = (1, 5)`, `b = (2, 1)`, `c = (3, 0)`을 넣어 보라. `c2(a, b)`는 `1 < 2`라 참, `c2(b, c)`는 `2 < 3`이라 참인데 `c2(c, a)`도 `0 < 5`라 **참**이다. `a < b < c < a`라는 순환이 생긴다. 순서 관계라면 있을 수 없는 상태이고, 정렬 결과는 입력 순서에 따라 달라진다.\n\n**`c3`은 동등의 추이성을 어긴다.** `x`의 차이가 `1e-9` 이하면 같은 것으로 보고 `y`를 비교한다. `a.x = 0`, `b.x = 1e-9`, `c.x = 2e-9`이면 `a`와 `b`는 `x`가 동등, `b`와 `c`도 동등인데 `a`와 `c`는 차이가 `2e-9`라 동등하지 않다. ==허용 오차로 동등을 정의하면 동등 관계의 추이성이 깨진다.== 부동소수를 정렬 키로 쓸 때 EPS 비교를 넣으면 안 되는 이유가 이것이고, 실제 해법은 값을 정수로 스케일링하거나 EPS 없이 그냥 `<`로 비교하는 것이다([X-7](#/x-7)).\n\n셋 중 둘은 \"그럴듯해 보이는\" 코드다. **비교자는 눈으로 읽어서 맞아 보이는 것과 규약을 만족하는 것이 다르고, 그 차이가 미정의 동작으로 나온다.**\n:::\n:::\n\n## 요약\n\n- 반복자는 알고리즘 $M$개와 컨테이너 $N$개를 $M \\times N$이 아니라 $M + N$으로 잇는 규약이다. 대가는 **알고리즘이 컨테이너를 수정할 수 없다는 것**과 **비용이 인터페이스에 안 보인다는 것**이다.\n- 카테고리는 성능의 이름이다. 임의 접근이 아니면 `distance`와 이분 탐색이 걷는다. `set` 전체 순회가 `vector`의 뺄셈 한 번과 같은 함수로 표현된다.\n- 람다는 컴파일러가 만든 익명 클래스이고 캡처는 그 멤버다. **클로저가 스코프보다 오래 살면 참조 캡처는 죽은 메모리를 읽는다.**\n- Python 클로저의 기본은 C++의 `[&]`에 가깝다. 같은 루프 코드가 `2 2 2`와 `0 1 2`로 갈린다.\n- `std::function`은 타입 소거의 대가로 인라인을 포기한다. 정렬 비교자에 쓰면 1.78배 느려진다. 람다는 기본과 같다.\n- 비교자는 **strict weak ordering**을 만족해야 한다. `<=`는 비반사성을 어기고, `std::sort`는 경계 검사가 없는 삽입 정렬 단계에서 배열 밖으로 걸어 나간다. 원소 17개에서 죽었고 100개에서는 **죽지 않고 남의 메모리 16칸을 덮었다.**\n- 정렬이 이상하면 `-D_GLIBCXX_DEBUG`로 다시 빌드하라. 비교자 위반을 이름 그대로 말해 준다.\n\n**다음 절**: [0-9 N 범위로 알고리즘 역산하기](#/0-9) — 제약조건의 숫자에서 허용 복잡도를 거꾸로 읽고, 그 복잡도로 알고리즘 후보를 좁힌다.\n","0-9":"# 0-9 N 범위로 알고리즘 역산하기\n\n::: lead\n지문을 다 읽기 전에, 제약조건만 보고 \"무엇을 짜면 안 되는지\"를 먼저 확정하는 절차.\n:::\n\n## 1. 문제\n\n지문에 이렇게 적혀 있다.\n\n```text nolines\n  N (1 <= N <= 100,000)\n  시간 제한: 1초\n  메모리 제한: 256MB\n```\n\n이중 루프를 짜면 $10^{10}$번이다. 이 코드는 짜기 전에 이미 죽어 있다. 그런데 제출해 봐야 그 사실을 안다면, 문제 하나에 20분을 쓰고 얻는 정보가 \"틀렸다\" 한 줄이다.\n\n이 상황이 반복되는 이유는 순서가 뒤집혀 있어서다. 지문 → 아이디어 → 구현 → 제출 → 시간 초과 → 다시 아이디어. 되돌아오는 화살표가 20분짜리다.\n\n바꿀 수 있다. **제약조건은 답의 절반을 이미 말하고 있다.** 위 조건에서 $O(n^2)$은 불가능하고 $O(n \\log n)$과 $O(n)$은 가능하다. 후보가 둘로 줄어든 상태에서 지문을 읽는 것과, 아무 제약 없이 읽는 것은 다른 작업이다. 이 챕터는 그 계산을 정확히 하는 법을 다룬다.\n\n정확히 하려면 먼저 알려진 어림 하나를 해체해야 한다.\n\n## 2. \"1초 ≈ 10^8 연산\"의 실체\n\n이 어림은 널리 통용되고, 널리 틀린다. 문제는 \"연산\"이라는 단어다. 정수 덧셈 한 번과 해시 테이블 조회 한 번을 같은 단위로 세면 자릿수가 어긋난다.\n\n그래서 산술 명령 하나가 아니라 **알고리즘의 안쪽 루프 한 바퀴**를 쟀다. 배열을 순서대로 읽는 루프, 무작위 위치를 읽는 루프, 해시 조회 루프, DP 갱신 루프, 함수 호출 루프다. 전부 \"한 바퀴 = 연산 1회\"로 맞췄다.\n\n::: perf\n| 안쪽 루프 한 바퀴 | Python 3.13 | 초당 | g++ 13 `-O2` | 초당 |\n|---|---|---|---|---|\n| 연속 접근 `s += a[i]` | 59.4 ns | $1.7 \\times 10^7$ | 1.23 ns | $8.1 \\times 10^8$ |\n| 무작위 접근 `s += a[idx[i]]` | 507.0 ns | $2.0 \\times 10^6$ | 15.74 ns | $6.4 \\times 10^7$ |\n| 해시 조회 `d[k]` (100만 키) | 507.0 ns | $2.0 \\times 10^6$ | 135.70 ns | $7.4 \\times 10^6$ |\n| DP 갱신 `dp[j] = max(...)` | 137.0 ns | $7.3 \\times 10^6$ | 1.29 ns | $7.8 \\times 10^8$ |\n| 함수 호출 `f(x)` | 72.7 ns | $1.4 \\times 10^7$ | 1.55 ns | $6.5 \\times 10^8$ |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/ops_budget.py` 와 `.cpp` 다.)\n:::\n\n한 언어 안에서만 봐도 **위아래가 100배 넘게 벌어진다.** C++에서 가장 빠른 루프는 초당 8억 바퀴이고 가장 느린 루프는 초당 740만 바퀴다. 같은 \"연산 1회\"인데 110배 차이다.\n\n$10^8$이라는 숫자가 어디서 나왔는지도 이 표에서 읽힌다. **C++의 무작위 접근 루프($6.4 \\times 10^7$)에 우연히 가깝다.** 그래서 C++로 그래프나 트리처럼 포인터를 따라다니는 코드를 짤 때는 이 어림이 그럭저럭 맞고, 연속 배열을 훑는 코드에서는 열 배 비관적이며, Python에서는 **어떤 워크로드에서도 맞지 않는다.**\n\n::: warn\n$10^8$을 버리라는 말이 아니다. 자릿수 감각의 출발점으로는 쓸 만하다. 버려야 할 것은 그 숫자를 **정밀한 경계선으로 취급하는 습관**이다. $9 \\times 10^7$이라 안전하고 $1.1 \\times 10^8$이라 위험하다는 판단에는 근거가 없다. 이 표의 폭이 그 근거 없음의 크기다.\n:::\n\n::: deep\n표에서 가장 이상해 보이는 줄은 해시 조회다. C++이 Python보다 3.7배밖에 빠르지 않다. 이유는 두 가지가 겹쳐서다.\n\n첫째, 100만 개 키에 무작위로 접근하면 버킷 배열과 노드가 각각 캐시 밖에 있다. **한 번의 조회가 캐시 미스 두 번**이고, 캐시 미스 한 번이 수십 나노초다. 언어가 아니라 메모리가 비용을 정한다.\n\n둘째, Python의 `dict`는 CPython의 C 코드다. 인터프리터는 \"조회하라\"는 명령 하나를 발행하고 실제 일은 C가 한다. ==Python이 느린 것은 인터프리터 루프이지 표준 라이브러리가 아니다.== 그래서 루프를 라이브러리 안으로 밀어 넣을수록 두 언어의 배수가 줄어든다. 이 성질은 [0-10 언어별 상수와 TLE 대응](#/0-10)의 중심 주제다.\n\n같은 이유로 정렬도 배수가 작다. $n = 10^6$ 정렬은 Python 0.369초, C++ 0.077초로 4.8배다. 반대로 DP 갱신 루프는 106배다 — 여기는 인터프리터가 전부 직접 돈다.\n:::\n\n::: danger\nC++에서 직접 벤치마크를 짤 때 흔히 나오는 결과가 있다.\n\n```text nolines\n  s += i 를 10^9 회: 0.000000s\n```\n\n`-O2`가 이 루프를 닫힌 형태로 접어 통째로 지웠다. 실측했는데 0초가 나왔다면 측정에 성공한 것이 아니라 **측정 대상이 사라진 것이다.** 누산 결과를 반드시 출력에 쓰거나, 컴파일러가 예측할 수 없는 데이터에 의존하게 만들어라. `tools/bench/ops_budget.cpp`가 결과를 전부 `g_sink`에 모아 마지막에 쓰는 이유다.\n:::\n\n## 3. 역산 표\n\n앞의 단가로 \"1초에 이 복잡도면 N이 얼마까지 되는가\"를 푼다. 단가를 하나로 정할 수 없으므로 **두 개**를 쓴다. 연속 접근을 최선, 무작위 접근을 최악으로 놓고 구간을 낸다. 실제 코드는 대개 그 사이 어딘가에 있다.\n\n::: perf\n| 복잡도 | Python 최선 | Python 최악 | C++ 최선 | C++ 최악 |\n|---|---|---|---|---|\n| $O(n)$ | $1.7 \\times 10^7$ | $2.0 \\times 10^6$ | $8.1 \\times 10^8$ | $6.4 \\times 10^7$ |\n| $O(n \\log n)$ | 854,000 | 117,000 | $3.2 \\times 10^7$ | $3.0 \\times 10^6$ |\n| $O(n^2)$ | 4,100 | 1,400 | 28,000 | 8,000 |\n| $O(n^3)$ | 256 | 125 | 932 | 399 |\n| $O(2^n)$ | 24 | 20 | 29 | 25 |\n| $O(n!)$ | 10 | 9 | 12 | 11 |\n\n> (같은 환경 실측에서 유도. `tools/bench/ops_budget.py` 가 측정한 단가로 이분 탐색해 최대 N을 역산한다.)\n:::\n\n이 표는 거꾸로 읽는 것이 본래 용도다. **N이 주어졌을 때 무엇이 허용되는가.**\n\n| N의 크기 | 허용되는 복잡도 | 떠올릴 것 |\n|---|---|---|\n| $n \\le 11$ | $O(n!)$ | 순열 전탐색([III-2](#/iii-2)) |\n| $n \\le 22$ | $O(2^n)$, $O(2^n \\cdot n)$ | 부분집합 전탐색, 비트마스크 DP([VIII-9](#/viii-9)) |\n| $n \\le 400$ | $O(n^3)$ | 플로이드-워셜([V-3](#/v-3)), 구간 DP([VIII-7](#/viii-7)) |\n| $n \\le 5{,}000$ | $O(n^2)$ | 2차원 DP([VIII-4](#/viii-4)), $O(n^2)$ LIS |\n| $n \\le 10^5$ | $O(n \\log n)$ | 정렬, 이분 탐색([VII-1](#/vii-1)), 세그먼트 트리([IX-2](#/ix-2)), 다익스트라([V-1](#/v-1)) |\n| $n \\le 10^6$ | $O(n)$, $O(n \\log \\log n)$ | 투 포인터([VI-3](#/vi-3)), 누적 합([VI-4](#/vi-4)), BFS([IV-3](#/iv-3)), 에라토스테네스([X-2](#/x-2)) |\n| $n \\ge 10^7$ | $O(n)$이되 입출력이 병목 | 읽는 방법부터 바꾼다([0-10](#/0-10)) |\n\n경계값을 외울 필요는 없다. 외울 것은 **자릿수의 계단**이다. $n^2$이 $10^8$을 넘지 않으려면 $n$이 만 언저리이고, $n^3$이면 수백이고, $2^n$이면 스물 몇이다. 이 셋만 있으면 나머지는 그 자리에서 나온다.\n\n::: tip\n표에 없는 두 줄이 실전에서 자주 나온다.\n\n**$O(n \\sqrt{n})$** — $n = 10^5$에서 $3.2 \\times 10^7$이다. C++이면 넉넉하고 Python이면 아슬아슬하다. 소인수분해([X-2](#/x-2))와 평방분할이 여기 있다.\n\n**$O(n \\cdot m)$** — 격자 문제의 기본형이다. $1000 \\times 1000$이면 $10^6$이라 어느 언어든 통과하고, $2000 \\times 2000$이면 $4 \\times 10^6$이라 Python에서 상수를 신경 써야 한다.
