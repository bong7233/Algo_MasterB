    s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)');
    s = s.replace(/\\(?:quad|qquad|,|;|!|:)/g, ' ');
    s = s.replace(/\\([{}%&#$_])/g, '$1');
    s = s.replace(/\\([A-Za-z]+)/g, function (_, w) {
      return MATH_SYM.hasOwnProperty(w) ? MATH_SYM[w] : w;
    });
    // O(n^{2}) 처럼 지수·첨자의 중괄호만 벗긴다. 나머지 중괄호는 집합 표기일 수 있어 둔다.
    s = s.replace(/([\^_])\{([^{}]*)\}/g, '$1$2');
    return s.replace(/[ \t]+/g, ' ').trim();
  }

  /* ==================== 인라인 ==================== */

  var MARK = '\u0000'; // 스태시 자리표시자 구분자. 본문에 등장할 수 없는 문자라 안전하다.

  function inline(src) {
    var stash = [];
    function keep(html) {
      stash.push(html);
      return MARK + (stash.length - 1) + MARK;
    }

    var s = String(src == null ? '' : src);

    // 1) 인라인 코드를 먼저 격리한다. 코드 안의 `*`, `$`, `<` 는 문법이 아니라 글자다.
    s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, function (_, ticks, code) {
      return keep('<code class="inline">' + esc(code.replace(/^ | $/g, '')) + '</code>');
    });

    // 2) 수식. 블록이 먼저다 — $$ 를 $ 로 먼저 먹으면 경계가 어긋난다.
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, function (_, m) {
      return keep('<div class="math-block">' + esc(tidyMath(m)) + '</div>');
    });
    s = s.replace(/\$([^$\n]+?)\$/g, function (_, m) {
      return keep('<span class="math">' + esc(tidyMath(m)) + '</span>');
    });

    // 3) 허용된 유일한 원시 HTML. 속성이 붙은 <kbd class=…> 형태는 통과시키지 않는다 —
    //    속성을 허용하는 순간 온갖 이벤트 핸들러가 같이 들어온다.
    s = s.replace(/<\/?kbd>/gi, function (m) {
      return keep(m.toLowerCase());
    });

    // 4) 나머지 원시 HTML은 전부 글자로 만든다.
    s = esc(s);

    // 5) 이미지 · 링크
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, function (_, alt, url) {
      return '<img src="' + safeUrl(url) + '" alt="' + alt + '" loading="lazy">';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, function (_, text, url) {
      var u = safeUrl(url);
      var ext = /^(?:https?:|\/\/)/i.test(u);
      if (ext) return '<a href="' + u + '" target="_blank" rel="noopener">' + text + '</a>';
      // 내부 상호참조는 라우터가 가로채야 하므로 표식을 남긴다(계약 §2.6).
      var cls = u.indexOf('#/') === 0 ? ' class="xref"' : '';
      return '<a href="' + u + '"' + cls + '>' + text + '</a>';
    });

    // 6) 강조. 긴 마커부터 처리해야 ***x*** 가 **+* 로 쪼개지지 않는다.
    s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
    s = s.replace(/~~([\s\S]+?)~~/g, '<del>$1</del>');
    s = s.replace(/==([^=\n]+?)==/g, '<mark>$1</mark>');
    // `_`는 강조로 쓰지 않는다. 식별자(`max_heap`)를 기울임으로 부수는 사고가 잦다.

    // 7) 줄 끝 공백 두 칸은 강제 개행
    s = s.replace(/ {2,}\n/g, '<br>\n');

    // 8) 스태시 복원
    return s.replace(new RegExp(MARK + '(\\d+)' + MARK, 'g'), function (_, k) {
      var v = stash[+k];
      return v == null ? '' : v;
    });
  }

  /* ==================== 코드 블록 ==================== */

  function langOf(info) {
    var t = String(info == null ? '' : info).trim().split(/\s+/)[0] || '';
    t = t.replace(/\{[\s\S]*/, '').toLowerCase();
    // 클래스명·속성에 그대로 박히는 값이라 화이트리스트 문자만 통과시킨다.
    return /^[a-z0-9+#_.-]*$/.test(t) ? t : '';
  }

  function parseHl(spec) {
    var set = {};
    String(spec == null ? '' : spec).split(',').forEach(function (part) {
      var p = part.trim();
      var m = /^(\d+)\s*-\s*(\d+)$/.exec(p);
      if (m) {
        var a = +m[1], b = +m[2];
        // {1-99999999} 같은 오타 하나로 브라우저가 멈추면 안 된다.
        if (b > a + 5000) b = a + 5000;
        for (var k = a; k <= b; k++) set[k] = true;
      } else if (/^\d+$/.test(p)) {
        set[+p] = true;
      }
    });
    return set;
  }

  function renderCode(code, info) {
    var meta = String(info == null ? '' : info).trim();
    var lang = langOf(meta);
    var tm = /title\s*=\s*"([^"]*)"/.exec(meta);
    var hm = /\{([0-9,\s-]+)\}/.exec(meta);
    var noLines = /(^|\s)nolines(\s|$)/.test(meta);
    var title = tm ? tm[1] : '';
    var hlSet = parseHl(hm ? hm[1] : '');

    var body = String(code == null ? '' : code).replace(/\n+$/, '');

    // 원문을 이스케이프하지 않고 넘긴다 — 이스케이프는 HL의 책임이다(계약 §2.1).
    // HL이 아직 로드되지 않았거나 터져도 코드는 보여야 하므로 자체 esc로 물러선다.
    var painted;
    try {
      var HL = global.HL;
      painted = (HL && typeof HL.highlight === 'function') ? HL.highlight(body, lang) : esc(body);
      if (typeof painted !== 'string') painted = esc(body);
    } catch (e) {
      painted = esc(body);
    }

    var rows = painted.split('\n').map(function (ln, k) {
      var cls = 'line' + (hlSet[k + 1] ? ' hl' : '');
      return (noLines ? '' : '<span class="ln">' + (k + 1) + '</span>') +
        '<span class="' + cls + '">' + ln + '</span>';
    }).join('\n');

    // title이 없어도 head는 남긴다 — 복사 버튼이 거기 산다(계약 §2.1).
    var head = '<div class="codeblock-head">' +
      (title ? '<span class="codeblock-title">' + esc(title) + '</span>' : '') +
      (lang ? '<span class="codeblock-lang">' + esc(lang) + '</span>' : '') +
      '<button class="codeblock-copy" type="button" aria-label="코드 복사">복사</button>' +
      '</div>';

    return '<div class="codeblock" data-lang="' + esc(lang) + '">' + head +
      '<pre class="code' + (noLines ? ' nolines' : '') + '">' +
      '<code class="lang-' + esc(lang) + '">' + rows + '</code></pre></div>';
  }

  /* ==================== ::: dual ==================== */

  var LANG_LABEL = {
    python: 'Python', cpp: 'C++', c: 'C', text: 'Text',
    bash: 'Bash', json: 'JSON', console: 'Console'
  };

  function renderDual(inner, ctx) {
    var lines = inner.split('\n');
    var panes = [];
    var slot = {};
    var stray = [];
    var i = 0;

    while (i < lines.length) {
      var f = /^\s*(`{3,}|~{3,})(.*)$/.exec(lines[i]);
      if (f) {
        var mark = f[1].charAt(0);
        var len = f[1].length;
        var meta = f[2];
        var buf = [];
        i++;
        while (i < lines.length && !isFenceClose(lines[i], mark, len)) { buf.push(lines[i]); i++; }
        i++;
        var lang = langOf(meta) || 'text';
        var html = renderCode(buf.join('\n'), meta);
        if (slot.hasOwnProperty(lang)) panes[slot[lang]].html += html;
        else { slot[lang] = panes.length; panes.push({ lang: lang, html: html }); }
        continue;
      }
      if (lines[i].trim()) stray.push(lines[i]);
      i++;
    }

    // 코드 펜스가 하나도 없으면 dual로 만들 게 없다. 본문을 버리지 말고 그대로 살린다.
    if (!panes.length) return blocks(inner, ctx, true);

    // A-04: Python이 항상 먼저, C++이 뒤. 그 외 언어는 등장 순서로 뒤에 붙인다.
    var ordered = [];
    ['python', 'cpp'].forEach(function (l) {
      panes.forEach(function (p) { if (p.lang === l) ordered.push(p); });
    });
    panes.forEach(function (p) {
      if (p.lang !== 'python' && p.lang !== 'cpp') ordered.push(p);
    });

    var tabs = ordered.map(function (p, k) {
      return '<button class="dual-tab' + (k === 0 ? ' is-active' : '') +
        '" data-dual-lang="' + esc(p.lang) + '" role="tab" type="button">' +
        esc(LANG_LABEL[p.lang] || p.lang) + '</button>';
    }).join('');

    // `둘 다` 모드에서 app.js가 컨테이너에 .is-both를 붙여 두 패널을 세로로 쌓는다.
    // 렌더러는 두 패널을 항상 다 만들어 두기만 하면 된다(계약 §2.2).
    var body = ordered.map(function (p, k) {
      return '<div class="dual-pane' + (k === 0 ? ' is-active' : '') +
        '" data-dual-lang="' + esc(p.lang) + '">' + p.html + '</div>';
    }).join('');

    var html = '<div class="dual" data-dual>' +
      '<div class="dual-tabs" role="tablist">' + tabs + '</div>' + body + '</div>';

    return stray.length ? html + '\n' + blocks(stray.join('\n'), ctx, true) : html;
  }

  /* ==================== ::: 상자 ==================== */

  // 계약 §2.3의 기본 라벨. lead는 라벨이 없다.
  var BOX_LABEL = {
    lead: '',
    note: '참고',
    tip: '요령',
    warn: '주의',
    danger: '위험',
    deep: '한 단계 아래',
    perf: '성능',
    hist: '설계 배경',
    trace: '손으로 따라가기',
    pitfall: '틀리는 지점',
    classify: '이 유형을 알아보는 법',
    interview: '면접에서는',
    quiz: '연습',
    answer: '정답'
  };

  function renderBox(kind, title, body, ctx) {
    // 클래스명에 임의 문자열이 들어가지 않게 한 번 더 거른다.
    var k = String(kind).toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (!k) k = 'note';
    var known = BOX_LABEL.hasOwnProperty(k);
    var label = title || (known ? BOX_LABEL[k] : k);

    // classify 안에서만 불릿에 data-classify-key를 붙인다(계약 §2.4).
    // build.py가 이 블록을 수집해 Anki 덱을 만들기 때문에 키는 상자 밖으로 새면 안 된다.
    if (k === 'classify') ctx.classify++;
    var inner = blocks(body, ctx, true);
    if (k === 'classify') ctx.classify--;

    if (k === 'answer') {
      return '<details class="box box-answer"><summary class="box-title">' +
        esc(label || BOX_LABEL.answer) + '</summary>' +
        '<div class="box-body">' + inner + '</div></details>';
    }
    // lead는 제목 줄 자체가 없다. 절 머리말이라 라벨이 붙으면 오히려 방해가 된다.
    if (k === 'lead') {
      return '<div class="box box-lead"><div class="box-body">' + inner + '</div></div>';
    }
    return '<div class="box box-' + k + '">' +
      (label ? '<div class="box-title">' + esc(label) + '</div>' : '') +
      '<div class="box-body">' + inner + '</div></div>';
  }

  /* ==================== ::: widget ==================== */

  function renderWidget(rest, bodyLines) {
    var m = /^([A-Za-z0-9_.-]+)\s*([\s\S]*)$/.exec(String(rest || '').trim());
    var type = m ? m[1] : '';
    var jsonText = ((m ? m[2] : '') + '\n' + bodyLines.join('\n')).trim();
    var opts = '{}';
    if (jsonText) {
      try {
        var parsed = JSON.parse(jsonText);
        // 배열·숫자를 옵션으로 넘기면 위젯 쪽 계약이 깨진다. 객체만 인정한다.
        if (parsed && typeof parsed === 'object' && !(parsed instanceof Array)) {
          opts = JSON.stringify(parsed);
        }
      } catch (e) {
        opts = '{}'; // 깨진 JSON은 조용히 버린다. 한 챕터의 오타로 책 전체가 안 뜨면 안 된다.
      }
    }
    return '<div class="widget" data-widget="' + esc(type) + '" data-opts=\'' + escSingle(opts) + '\'></div>';
  }

  /* ==================== 표 ==================== */

  function isTableDelim(s) {
    return typeof s === 'string' && /\|/.test(s) && /-/.test(s) && /^[\s|:-]+$/.test(s);
  }

  function splitRow(line) {
    var s = String(line).trim().replace(/^\|/, '').replace(/\|$/, '');
    var cells = [];
    var cur = '';
    var inCode = false;
    for (var k = 0; k < s.length; k++) {
      var ch = s.charAt(k);
      if (ch === '\\' && s.charAt(k + 1) === '|') { cur += '|'; k++; continue; }
      if (ch === '`') inCode = !inCode;
      if (ch === '|' && !inCode) { cells.push(cur); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur);
    return cells;
  }

  function alignOf(cell) {
    var c = String(cell).trim();
    if (/^:.*:$/.test(c)) return 'center';
    if (/:$/.test(c)) return 'right';
    if (/^:/.test(c)) return 'left';
    return '';
  }

  /* ==================== 목록 ==================== */

  // 그룹1=들여쓰기, 그룹2=불릿 문자(순서 있는 목록이면 undefined), 그룹3=번호.
  // /g 를 붙이면 lastIndex가 남아 .test()가 번갈아 실패하므로 절대 붙이지 않는다.
  var MARKER = /^(\s*)(?:([-*+])|(\d+)[.)])[ \t]+/;

  function classifyKey(text) {
    var t = String(text).replace(/^[\s*_`>]+/, '');
    if (/^신호어/.test(t)) return 'signals';
    if (/^제약\s*조건/.test(t)) return 'constraints';
    // 집필 현장에서 `혼동 주의`와 `혼동주의`가 섞여 들어온다. 둘 다 받는다(계약 §2.4).
    if (/^혼동\s*주의/.test(t)) return 'confusion';
    if (/^반례\s*함정/.test(t)) return 'traps';
    return '';
  }

  function renderList(lines, ctx) {
    var first = MARKER.exec(lines[0]);
    if (!first) return '<p>' + inline(lines.join('\n')) + '</p>';

    var indent = first[1].length;
    var ordered = !first[2];
    var start = ordered ? parseInt(first[3], 10) : 1;

    // 이 레벨의 '같은 종류' 마커만 항목 시작으로 인정한다. 더 깊게 들여쓴 줄은
    // 항목 본문으로 넘겨서 blocks()가 재귀로 중첩 목록을 처리하게 한다.
    var markerRe = new RegExp('^\\s{' + indent + '}' + (ordered ? '\\d+[.)]' : '[-*+]') + '[ \\t]+');
    var items = [];
    var cur = null;
    var contIndent = 0;

    lines.forEach(function (ln) {
      var m = markerRe.exec(ln);
      if (m) {
        if (cur) items.push(cur);
        cur = [ln.slice(m[0].length)];
        contIndent = m[0].length;
      } else if (cur) {
        cur.push(/^\s*$/.test(ln) ? '' : ln.replace(new RegExp('^\\s{0,' + contIndent + '}'), ''));
      }
    });
    if (cur) items.push(cur);

    var html = items.map(function (item) {
      var text = item.join('\n');
      var attrs = '';
      var prefix = '';

      var cb = /^\[([ xX])\][ \t]*([\s\S]*)$/.exec(text);
      if (cb) {
        attrs = ' class="task"';
        prefix = '<input type="checkbox" disabled' +
          (cb[1].toLowerCase() === 'x' ? ' checked' : '') + '> ';
        text = cb[2];
      } else if (ctx.classify > 0) {
        var key = classifyKey(text);
        if (key) attrs = ' data-classify-key="' + key + '"';
      }

      var inner = blocks(text, ctx, true);
      // 한 문단짜리 항목이면 <p>를 벗긴다. 안 벗기면 목록 줄 간격이 통째로 벌어진다.
      var only = /^<p>([\s\S]*)<\/p>$/.exec(inner.trim());
      if (only && only[1].indexOf('<p>') === -1) {
        inner = only[1];
      } else if (!/\n[ \t]*\n/.test(text)) {
        // 빈 줄이 없는 항목(tight)은 중첩 목록을 달고 있어도 첫 줄이 문단이 아니다.
        // 여기서 안 벗기면 `- 항목\n  - 중첩` 이 loose 목록처럼 벌어진다.
        inner = inner.replace(/^<p>([\s\S]*?)<\/p>(\n|$)/, '$1$2');
      }
      return '<li' + attrs + '>' + prefix + inner + '</li>';
    }).join('');

    return ordered
      ? '<ol' + (start !== 1 && !isNaN(start) ? ' start="' + start + '"' : '') + '>' + html + '</ol>'
      : '<ul>' + html + '</ul>';
  }

  /* ==================== 블록 상태 기계 ==================== */

  function isFenceClose(line, mark, len) {
    var m = /^\s*(`{3,}|~{3,})\s*$/.exec(line);
    if (!m) return false;
    return m[1].charAt(0) === mark && m[1].length >= len;
  }

  // 목록의 게으른 연속(lazy continuation)이 삼키면 안 되는 줄들.
  // 이게 없으면 목록 뒤에 붙은 `## 제목`이 목록 안으로 빨려 들어가고,
  // 그러면 headings()와 render()의 슬러그 번호가 어긋난다.
  function isHardBlockStart(line) {
    return /^#{1,6}[ \t]+/.test(line) ||
      /^:::/.test(line) ||
      /^(?:`{3,}|~{3,})/.test(line) ||
      /^>/.test(line);
  }

  function isBlockBreak(lines, i) {
    var l = lines[i];
    return /^\s*$/.test(l) ||
      /^#{1,6}[ \t]+/.test(l) ||
      /^:::/.test(l) ||
      /^\s{0,3}(?:`{3,}|~{3,})/.test(l) ||
      /^\s{0,3}>/.test(l) ||
      MARKER.test(l) ||
      /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l) ||
      /^\s*\$\$/.test(l) ||
      (/\|/.test(l) && i + 1 < lines.length && isTableDelim(lines[i + 1]));
  }

  function blank(s) { return /^\s*$/.test(s); }

  /**
   * @param src    마크다운 원문
   * @param ctx    { used, classify } — 슬러그 중복 사전과 classify 깊이
   * @param nested 재귀 호출 여부. 상자·인용·목록 안의 제목에는 id를 붙이지 않는다.
   *               headings()가 최상위 h2·h3만 세므로, 여기서 id를 남발하면 `-2` 접미가
   *               어긋나 인북 목차 링크가 통째로 깨진다.
   */
  function blocks(src, ctx, nested) {
    var lines = String(src == null ? '' : src).split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (blank(line)) { i++; continue; }

      /* --- 코드 펜스 --- */
      var fence = /^\s{0,3}(`{3,}|~{3,})(.*)$/.exec(line);
      if (fence) {
        var mark = fence[1].charAt(0);
        var len = fence[1].length;
        var meta = fence[2];
        var cbuf = [];
        i++;
        while (i < lines.length && !isFenceClose(lines[i], mark, len)) { cbuf.push(lines[i]); i++; }
        i++; // 닫는 펜스(없으면 EOF)
        out.push(renderCode(cbuf.join('\n'), meta));
        continue;
      }

      /* --- ::: 블록 (widget / dual / 표시 상자) --- */
      var bm = /^:::[ \t]*([A-Za-z][A-Za-z0-9_-]*)[ \t]*(.*)$/.exec(line);
      if (bm) {
        var kind = bm[1].toLowerCase();
        var rest = bm[2].trim();
        var bbuf = [];
        var depth = 1;
        var inFence = null; // 상자 안의 코드 펜스에 들어 있는 `:::`는 세면 안 된다
        i++;
        while (i < lines.length) {
          var l = lines[i];
          var fm = /^\s{0,3}(`{3,}|~{3,})/.exec(l);
          if (fm) {
            if (!inFence) inFence = fm[1];
            else if (fm[1].charAt(0) === inFence.charAt(0) && fm[1].length >= inFence.length) inFence = null;
          } else if (!inFence) {
            // 닫는 :::는 항상 홀로 있는 ::: 줄이다(계약 §2.3).
            if (/^:::[ \t]*$/.test(l)) {
              depth--;
              if (depth === 0) { i++; break; }
            } else if (/^:::[ \t]*\S/.test(l)) {
              depth++;
            }
          }
          bbuf.push(l);
          i++;
        }

        if (kind === 'widget') { out.push(renderWidget(rest, bbuf)); continue; }
        if (kind === 'dual') { out.push(renderDual(bbuf.join('\n'), ctx)); continue; }
        out.push(renderBox(kind, rest, bbuf.join('\n'), ctx));
        continue;
      }

      /* --- 제목 --- */
      var h = /^(#{1,6})[ \t]+(.*)$/.exec(line);
      if (h) {
        var lvl = h[1].length;
        var raw = h[2].replace(/\s+#+\s*$/, '').trim();
        var text = headingText(raw);
        var attr = '';
        var anchor = '';
        if (!nested && (lvl === 2 || lvl === 3)) {
          var id = uniqueSlug(slugify(text), ctx.used);
          attr = ' id="' + esc(id) + '"';
          anchor = '<a class="anchor" href="#' + esc(id) + '" aria-label="이 절 링크">#</a>';
        }
        out.push('<h' + lvl + attr + '>' + inline(raw) + anchor + '</h' + lvl + '>');
        i++;
        continue;
      }

      /* --- 수평선 --- */
      if (/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* --- 블록 수식 --- */
      var mb = /^\s*\$\$([\s\S]*)$/.exec(line);
      if (mb) {
        var acc = mb[1];
        if (/\$\$\s*$/.test(acc)) {
          acc = acc.replace(/\$\$\s*$/, '');
          i++;
        } else {
          i++;
          while (i < lines.length && lines[i].indexOf('$$') === -1) { acc += '\n' + lines[i]; i++; }
          if (i < lines.length) { acc += '\n' + lines[i].replace(/\$\$[\s\S]*$/, ''); i++; }
        }
        out.push('<div class="math-block">' + esc(tidyMath(acc)) + '</div>');
        continue;
      }

      /* --- 표 --- */
      if (/\|/.test(line) && i + 1 < lines.length && isTableDelim(lines[i + 1])) {
        var head = splitRow(line);
        var align = splitRow(lines[i + 1]).map(alignOf);
        i += 2;
        var rows = [];
        while (i < lines.length && !blank(lines[i]) && /\|/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        // 가로 스크롤 컨테이너는 필수다(계약 §2.6·§5). body에 가로 스크롤을 만들면 안 된다.
        var t = '<div class="table-wrap"><table><thead><tr>';
        head.forEach(function (c, k) {
          t += '<th' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
            inline(c.trim()) + '</th>';
        });
        t += '</tr></thead><tbody>';
        rows.forEach(function (row) {
          t += '<tr>';
          head.forEach(function (_, k) {
            t += '<td' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
              inline(String(row[k] == null ? '' : row[k]).trim()) + '</td>';
          });
          t += '</tr>';
        });
        out.push(t + '</tbody></table></div>');
        continue;
      }

      /* --- 인용 --- */
      if (/^\s{0,3}>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s{0,3}>/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^\s{0,3}>[ \t]?/, ''));
          i++;
        }
        out.push('<blockquote>' + blocks(qbuf.join('\n'), ctx, true) + '</blockquote>');
        continue;
      }

      /* --- 목록 --- */
      if (MARKER.test(line)) {
        var lm = MARKER.exec(line);
        var baseIndent = lm[1].length;
        var baseOrdered = !lm[2];
        var lbuf = [];
        while (i < lines.length) {
          if (blank(lines[i])) {
            var j = i + 1;
            while (j < lines.length && blank(lines[j])) j++;
            if (j < lines.length && /^(?:\s{2,}|\s*(?:[-*+]|\d+[.)])[ \t])/.test(lines[j])) {
              lbuf.push(''); i++; continue;
            }
            break;
          }
          var mm = MARKER.exec(lines[i]);
          // 같은 레벨에서 마커 종류가 바뀌면(- → 1.) 별개의 목록이다.
          if (mm && mm[1].length === baseIndent && (!mm[2]) !== baseOrdered) break;
          if (!mm && isHardBlockStart(lines[i])) break;
          lbuf.push(lines[i]);
          i++;
        }
        out.push(renderList(lbuf, ctx));
        continue;
      }

      /* --- 문단 --- */
      var pbuf = [line];
      i++;
      while (i < lines.length && !isBlockBreak(lines, i)) { pbuf.push(lines[i]); i++; }
      out.push('<p>' + inline(pbuf.join('\n')) + '</p>');
    }

    return out.join('\n');
  }

  /* ==================== 공개 API ==================== */

  // CRLF만 정규화한다. 탭은 건드리지 않는다 — 코드 블록 원문이 바뀌면 안 되기 때문이다.
  function norm(src) {
    return String(src == null ? '' : src).replace(/\r\n?/g, '\n');
  }

  function render(markdown) {
    try {
      return blocks(norm(markdown), { used: {}, classify: 0 }, false);
    } catch (e) {
      // 에러 경계가 없는 페이지다. 어떤 입력에서도 렌더가 죽는 것보다
      // 원문을 그대로 보여주는 쪽이 낫다.
      return '<pre class="code">' + esc(norm(markdown)) + '</pre>';
    }
  }

  // 코드 펜스 안과 ::: 상자 안의 `#`는 제외한다(계약 §2.7).
  // 슬러그 계산은 render()와 같은 함수를 쓰고, 스캔 순서도 같으므로 결과가 일치한다.
  function headings(markdown) {
    var out = [];
    try {
      var lines = norm(markdown).split('\n');
      var used = {};
      var fence = null;
      var depth = 0;

      for (var i = 0; i < lines.length; i++) {
        var l = lines[i];

        var fm = /^\s{0,3}(`{3,}|~{3,})/.exec(l);
        if (fm) {
          if (!fence) fence = fm[1];
          else if (fm[1].charAt(0) === fence.charAt(0) && fm[1].length >= fence.length) fence = null;
          continue;
        }
        if (fence) continue;

        if (/^:::[ \t]*$/.test(l)) { if (depth > 0) depth--; continue; }
        if (/^:::[ \t]*\S/.test(l)) { depth++; continue; }
        if (depth > 0) continue;

        var h = /^(#{1,6})[ \t]+(.*)$/.exec(l);
        if (!h) continue;
        var lvl = h[1].length;
        if (lvl !== 2 && lvl !== 3) continue;

        var text = headingText(h[2]);
        out.push({ level: lvl, text: text, id: uniqueSlug(slugify(text), used) });
      }
    } catch (e) {
      return out; // 목차가 비는 것은 참을 수 있다. 크래시는 안 된다.
    }
    return out;
  }

  global.MD = { render: render, headings: headings };
})(typeof window !== 'undefined' ? window : this);

변식 명시, 중간 출력"}]},{"id":"graph","num":"Part IV","title":"그래프 탐색","desc":"맵·의존성·상태공간을 전부 그래프로 보는 훈련. 격자 최단경로의 원형이 여기에 있다.","chapters":[{"id":"iv-1","num":"IV-1","title":"그래프 표현","desc":"인접 행렬·인접 리스트·암묵 그래프. 맵과 의존성과 상태공간을 그래프로 보기"},{"id":"iv-2","num":"IV-2","title":"DFS","desc":"연결 요소, 사이클 검출"},{"id":"iv-3","num":"IV-3","title":"BFS와 최단 거리","desc":"격자 최단경로의 원형"},{"id":"iv-4","num":"IV-4","title":"0-1 BFS와 다중 시작점 BFS","desc":"여러 소스에서 동시에 번지는 확산"},{"id":"iv-5","num":"IV-5","title":"플러드필과 연결 요소 라벨링","desc":"비전의 blob 검출"},{"id":"iv-6","num":"IV-6","title":"위상 정렬","desc":"빌드 시스템과 작업 의존성 스케줄링"},{"id":"iv-7","num":"IV-7","title":"이분 그래프·사이클 판정","desc":"자원 충돌 검사"},{"id":"iv-8","num":"IV-8","title":"트리에서의 DFS","desc":"서브트리 크기와 깊이"}]},{"id":"shortest-path","num":"Part V","title":"최단경로 계보","desc":"왼쪽 끝은 코딩테스트, 오른쪽 끝은 다중 로봇 관제다. 끊지 않고 간다. 이 책의 척추.","chapters":[{"id":"v-1","num":"V-1","title":"다익스트라","desc":"가중 그래프의 최단경로. 힙이 그 엔진이다"},{"id":"v-2","num":"V-2","title":"벨만-포드와 음수 간선","desc":"음수 사이클을 검출한다"},{"id":"v-3","num":"V-3","title":"플로이드-워셜","desc":"모든 쌍 최단경로를 3중 루프로"},{"id":"v-4","num":"V-4","title":"DP와 최단경로는 같은 것이다","desc":"벨만 방정식, 최적 부분구조, 세 알고리즘이 같은 점화식의 다른 순회 순서임을 보이기"},{"id":"v-5","num":"V-5","title":"A*","desc":"휴리스틱의 정의, admissible과 consistent, 다익스트라가 h=0인 A*임을 보이기"},{"id":"v-6","num":"V-6","title":"A* 변형","desc":"Weighted A*로 최적성을 속도와 교환한다. JPS, Theta*/Any-angle"},{"id":"v-7","num":"V-7","title":"D* Lite","desc":"LPA*에서 출발해, 장애물을 발견했을 때 영향 구간만 다시 푼다"},{"id":"v-8","num":"V-8","title":"시공간 A*와 예약 테이블","desc":"시간 축을 상태에 추가한다. 서로의 미래 위치를 피하는 방법"},{"id":"v-9","num":"V-9","title":"CBS와 우선순위 기반 계획","desc":"다중 에이전트 경로 계획(MAPF)"},{"id":"v-10","num":"V-10","title":"교착 검출과 회피","desc":"자원 할당 그래프의 사이클 검출, 은행가 알고리즘, 교차로 상호배제, 라이브락"},{"id":"v-11","num":"V-11","title":"할당 문제","desc":"헝가리안 알고리즘, auction, 탐욕적 할당의 한계"},{"id":"v-12","num":"V-12","title":"지역 경로계획","desc":"전역과 지역의 역할 분담, DWA와 TEB의 원리, 코스트맵 인플레이션"},{"id":"v-13","num":"V-13","title":"샘플링 기반 계획","desc":"RRT, RRT*, PRM. 격자가 불가능한 고차원 구성 공간"},{"id":"v-14","num":"V-14","title":"계보 총정리","desc":"한 장의 지도와 상황별 선택 기준"}]},{"id":"greedy","num":"Part VI","title":"그리디·구간 기법","desc":"탐욕이 성립하는 조건을 증명으로 다루고, 구간을 상수 시간에 다루는 기법을 모은다.","chapters":[{"id":"vi-1","num":"VI-1","title":"그리디가 성립하는 조건","desc":"교환 논법"},{"id":"vi-2","num":"VI-2","title":"구간 스케줄링·회의실 배정","desc":"실무의 자원 예약"},{"id":"vi-3","num":"VI-3","title":"투 포인터와 슬라이딩 윈도우","desc":"포인터가 되돌아가지 않아도 되는 조건"},{"id":"vi-4","num":"VI-4","title":"누적 합과 차분 배열","desc":"그리드 구간 갱신"},{"id":"vi-5","num":"VI-5","title":"좌표 압축","desc":"값의 크기가 아니라 순서만 필요할 때"},{"id":"vi-6","num":"VI-6","title":"스위핑","desc":"정렬된 이벤트를 한 방향으로 훑는다"}]},{"id":"binsearch","num":"Part VII","title":"이분 탐색","desc":"정렬된 배열을 넘어 \"답 자체를 이분 탐색한다\"는 발상까지. 경계 조건이 전부다.","chapters":[{"id":"vii-1","num":"VII-1","title":"정렬된 배열에서의 이분 탐색","desc":"경계 조건 완전 정복"},{"id":"vii-2","num":"VII-2","title":"lower_bound / upper_bound / bisect","desc":"표준 라이브러리가 이미 답인 경우"},{"id":"vii-3","num":"VII-3","title":"매개변수 탐색","desc":"\"답을 이분 탐색한다\"는 발상"},{"id":"vii-4","num":"VII-4","title":"실수 이분 탐색과 종료 조건","desc":"몇 번 돌려야 충분한가"},{"id":"vii-5","num":"VII-5","title":"이분 탐색 + 그리디 결합 유형","desc":"판정 함수를 그리디로 짠다"}]},{"id":"dp","num":"Part VIII","title":"동적 계획법","desc":"상태 정의 → 점화식 → 초기값 → 계산 순서. 이 절차가 전부다. 실패도 상태 정의에서 난다.","chapters":[{"id":"viii-1","num":"VIII-1","title":"DP 사고 절차","desc":"상태 정의 → 점화식 → 초기값 → 계산 순서"},{"id":"viii-2","num":"VIII-2","title":"메모이제이션 vs 타뷸레이션","desc":"위에서 내려올 것인가, 아래에서 쌓을 것인가"},{"id":"viii-3","num":"VIII-3","title":"1차원 DP","desc":"계단, 타일링, 최대 부분합"},{"id":"viii-4","num":"VIII-4","title":"2차원 DP","desc":"격자 경로, 편집 거리"},{"id":"viii-5","num":"VIII-5","title":"배낭 문제","desc":"0/1, 무한, 부분합"},{"id":"viii-6","num":"VIII-6","title":"LIS와 LCS","desc":"이분 탐색과 결합되는 지점"},{"id":"viii-7","num":"VIII-7","title":"구간 DP","desc":"구간을 쪼개는 순서가 곧 상태다"},{"id":"viii-8","num":"VIII-8","title":"트리 DP","desc":"자식에서 부모로 값을 올린다"},{"id":"viii-9","num":"VIII-9","title":"비트마스크 DP","desc":"외판원 순회(TSP), 다중 지점 순회 최적화"},{"id":"viii-10","num":"VIII-10","title":"DP 최적화 입문","desc":"슬라이딩 윈도우·누적합과의 결합"},{"id":"viii-11","num":"VIII-11","title":"DP 상태 정의 실패 사례집","desc":"상태가 부족하면 무엇이 먼저 깨지는가"}]},{"id":"advanced","num":"Part IX","title":"고급 자료구조·문자열","desc":"구간·집합·문자열을 로그 시간에 다루는 자료구조들. 실무 연결이 특히 진한 구간.","chapters":[{"id":"ix-1","num":"IX-1","title":"유니온 파인드","desc":"연결 요소 라벨링, 맵 병합"},{"id":"ix-2","num":"IX-2","title":"세그먼트 트리와 lazy propagation","desc":"구간 집계와 구간 갱신"},{"id":"ix-3","num":"IX-3","title":"펜윅 트리(BIT)","desc":"세그먼트 트리보다 짧고 빠른 경우"},{"id":"ix-4","num":"IX-4","title":"최소 신장 트리","desc":"크루스칼과 프림. 로드맵·토폴로지 맵 생성, 네트워크 설계"},{"id":"ix-5","num":"IX-5","title":"LCA와 희소 배열","desc":"좌표 프레임 트리의 공통 조상"},{"id":"ix-6","num":"IX-6","title":"트라이","desc":"명령어 자동완성, IP 라우팅 테이블"},{"id":"ix-7","num":"IX-7","title":"문자열 매칭","desc":"KMP, 라빈-카프. 로그 스캔과 grep의 정체"},{"id":"ix-8","num":"IX-8","title":"네트워크 플로우 입문","desc":"최대 유량, 이분 매칭. 작업 할당과 이어진다"}]},{"id":"math","num":"Part X","title":"수학·기하","desc":"정수론·조합론·기하. 부동소수점이 왜 배신하는지까지 끝낸다.","chapters":[{"id":"x-1","num":"X-1","title":"정수론","desc":"GCD/LCM, 유클리드 호제법"},{"id":"x-2","num":"X-2","title":"소수","desc":"에라토스테네스의 체, 소인수분해"},{"id":"x-3","num":"X-3","title":"모듈러 연산과 분할 정복 거듭제곱","desc":"나머지 연산의 규칙과 빠른 거듭제곱"},{"id":"x-4","num":"X-4","title":"조합론 기초","desc":"이항계수, 중복 조합, 포함배제"},{"id":"x-5","num":"X-5","title":"기하","desc":"CCW, 선분 교차, 다각형 내부 판정. 충돌 검사의 기초"},{"id":"x-6","num":"X-6","title":"볼록 껍질","desc":"로봇 footprint 생성"},{"id":"x-7","num":"X-7","title":"부동소수점의 함정","desc":"왜 ==로 비교하면 안 되는가, EPS 정하는 법, 정수로 우회하기"}]},{"id":"realtime","num":"Part XI","title":"실무 자료구조와 동시성","desc":"메모리 안이 아니라 시간 축 위에서 도는 자료구조. 동시성과 실시간 제약이 기준을 바꾼다.","chapters":[{"id":"xi-1","num":"XI-1","title":"링 버퍼(원형 큐)","desc":"센서 스트림, 로그 버퍼, 오버런 정책"},{"id":"xi-2","num":"XI-2","title":"생산자-소비자와 유계 큐","desc":"제어 루프와 통신 스레드를 분리한다"},{"id":"xi-3","num":"XI-3","title":"락과 락프리","desc":"뮤텍스, 조건변수, 원자적 연산, 메모리 순서, SPSC 락프리 큐"},{"id":"xi-4","num":"XI-4","title":"스레드 풀과 작업 큐","desc":"병렬 이미지 처리, 워크 스틸링"},{"id":"xi-5","num":"XI-5","title":"실시간 스케줄링 개념","desc":"우선순위, RM/EDF, 우선순위 역전"},{"id":"xi-6","num":"XI-6","title":"상태 기계","desc":"FSM, 계층적 FSM, Behavior Tree. 작업 오더 상태머신"},{"id":"xi-7","num":"XI-7","title":"이벤트 루프와 백프레셔","desc":"메시지 폭주로부터 시스템을 지키는 법"},{"id":"xi-8","num":"XI-8","title":"타이머 휠과 지연 큐","desc":"타임아웃과 재시도"},{"id":"xi-9","num":"XI-9","title":"공간 인덱스","desc":"그리드 해싱, KD 트리, 옥트리, R 트리. 최근접 탐색과 충돌 검사"},{"id":"xi-10","num":"XI-10","title":"그래프의 메모리 표현","desc":"CSR, 인접 리스트와 행렬의 실제 비용"},{"id":"xi-11","num":"XI-11","title":"순환 참조와 소유권","desc":"그래프 자료구조의 메모리 관리, 스마트 포인터 사이클"}]},{"id":"patterns","num":"Part XII","title":"설계 패턴","desc":"카탈로그를 나열하지 않는다. 실제 시스템에서 그 패턴이 박혀 있는 지점을 먼저 보이고 이름은 나중에 붙인다.","chapters":[{"id":"xii-1","num":"XII-1","title":"패턴을 왜 배우는가","desc":"이름 붙이기의 힘과 남용의 위험"},{"id":"xii-2","num":"XII-2","title":"Adapter","desc":"이기종 장비 프로토콜 변환 계층"},{"id":"xii-3","num":"XII-3","title":"Facade / Bridge / Proxy","desc":"서브시스템 단일 창구, 원격 객체 프록시, 지연 로딩"},{"id":"xii-4","num":"XII-4","title":"Decorator / Composite","desc":"Behavior Tree 노드 합성, 레이어 중첩, 미들웨어 체인"},{"id":"xii-5","num":"XII-5","title":"Factory Method / Abstract Factory / Builder","desc":"드라이버·플러그인 생성, 설정 기반 객체 조립"},{"id":"xii-6","num":"XII-6","title":"Strategy","desc":"경로 플래너·컨트롤러 교체, 압축·인코딩 교체"},{"id":"xii-7","num":"XII-7","title":"Observer / Publish-Subscribe","desc":"토픽·이벤트 버스·메시지 브로커의 정체, 콜백 지옥과 그 해법"},{"id":"xii-8","num":"XII-8","title":"State","desc":"작업 오더 상태머신. if-else 지옥과 상태 객체"},{"id":"xii-9","num":"XII-9","title":"Command","desc":"즉시 액션, 작업 큐, 실행 취소와 재시도"},{"id":"xii-10","num":"XII-10","title":"Template Method / Chain of Responsibility","desc":"알고리즘 골격 고정, 에러 핸들러 체인, 미들웨어"},{"id":"xii-11","num":"XII-11","title":"Mediator","desc":"트래픽 매니저. 개체끼리 직접 말하지 않고 중재자를 통한다"},{"id":"xii-12","num":"XII-12","title":"Singleton과 그 함정","desc":"제어 소프트웨어에서 싱글톤이 재앙이 되는 경로, 테스트 불가능성"},{"id":"xii-13","num":"XII-13","title":"동시성 패턴","desc":"Active Object, Reactor, Monitor, Half-Sync/Half-Async"},{"id":"xii-14","num":"XII-14","title":"아키텍처 패턴","desc":"계층형(Sense-Plan-Act), 포트&어댑터, 플러그인 아키텍처, 블랙보드, 파이프-필터"},{"id":"xii-15","num":"XII-15","title":"안티패턴","desc":"God Object, 싱글톤 남용, 스마트 UI, 순환 의존, 조기 추상화"},{"id":"xii-16","num":"XII-16","title":"패턴 선택 결정 트리","desc":"Part I과 같은 형식으로 접는다"}]},{"id":"perception","num":"Part XIII","title":"상태추정·인지 알고리즘","desc":"센서 값에서 상태를 복원하는 알고리즘. 자료구조 대신 확률과 최적화가 뼈대를 이룬다.","chapters":[{"id":"xiii-1","num":"XIII-1","title":"점유 격자 지도와 로그 오즈 갱신","desc":"확률을 덧셈으로 바꾸는 표현"},{"id":"xiii-2","num":"XIII-2","title":"베이즈 필터의 뼈대","desc":"예측과 보정, 두 단계가 전부다"},{"id":"xiii-3","num":"XIII-3","title":"칼만 필터와 EKF","desc":"수식 최소화, 직관 우선"},{"id":"xiii-4","num":"XIII-4","title":"파티클 필터","desc":"샘플로 분포를 대신한다"},{"id":"xiii-5","num":"XIII-5","title":"ICP","desc":"점군 정합"},{"id":"xiii-6","num":"XIII-6","title":"RANSAC","desc":"이상치에 강건한 모델 추정"},{"id":"xiii-7","num":"XIII-7","title":"포즈 그래프 최적화와 루프 클로저","desc":"누적 오차를 한 번에 되돌린다"},{"id":"xiii-8","num":"XIII-8","title":"이미지 기본 연산","desc":"컨볼루션, 형태학, 엣지"},{"id":"xiii-9","num":"XIII-9","title":"허프 변환과 특징점(ORB) 매칭","desc":"선을 찾고 대응점을 찾는다"}]},{"id":"scale","num":"Part XV","title":"시스템 규모의 자료구조","desc":"\"메모리에 다 들어간다\"는 가정이 깨지는 순간 무엇이 달라지는가. 코딩테스트에는 안 나오고 실무 시스템에는 전부 들어 있다.","chapters":[{"id":"xv-1","num":"XV-1","title":"메모리를 벗어나는 순간","desc":"캐시 계층, 페이지, 블록 I/O. 왜 인메모리 자료구조가 디스크에서 무너지는가"},{"id":"xv-2","num":"XV-2","title":"B-Tree와 B+Tree","desc":"높이를 낮춰 디스크 읽기 횟수를 줄인다. 관계형 DB 인덱스, 파일시스템"},{"id":"xv-3","num":"XV-3","title":"LSM Tree와 SSTable","desc":"쓰기를 순차화한다. RocksDB, LevelDB, Cassandra, 시계열 DB"},{"id":"xv-4","num":"XV-4","title":"블룸 필터와 쿠쿠 필터","desc":"거짓양성을 허용하고 공간을 줄인다. SSTable 스킵, 크롤러 중복 제거"},{"id":"xv-5","num":"XV-5","title":"스킵 리스트","desc":"확률로 균형을 잡는다. Redis Sorted Set, 동시성 인덱스"},{"id":"xv-6","num":"XV-6","title":"카디널리티·빈도 추정","desc":"HyperLogLog, Count-Min Sketch. 유니크 방문자 수, 핫키 검출"},{"id":"xv-7","num":"XV-7","title":"머클 트리와 해시 체인","desc":"부분만 비교해 차이를 찾는다. Git 오브젝트 그래프, 복제본 동기화"},{"id":"xv-8","num":"XV-8","title":"일관성 해싱","desc":"노드가 늘고 줄 때 재배치를 최소화한다. 샤딩, 분산 캐시, 로드 밸런서"},{"id":"xv-9","num":"XV-9","title":"캐시 교체 정책","desc":"LRU/LFU/ARC/W-TinyLFU를 직접 구현하고 히트율을 비교한다"},{"id":"xv-10","num":"XV-10","title":"레이트 리미팅","desc":"토큰 버킷, 리키 버킷, 슬라이딩 윈도우. API 게이트웨이와 백프레셔"},{"id":"xv-11","num":"XV-11","title":"복제와 합의 입문","desc":"왜 어려운가, Raft의 뼈대, 벡터 클럭, CRDT"},{"id":"xv-12","num":"XV-12","title":"메모리에 안 들어가는 데이터 처리","desc":"외부 정렬, 병합 전략, 스트리밍 집계, MapReduce의 자료구조적 정체"}]},{"id":"wrapup","num":"Part XIV","title":"종합","desc":"전 Part를 한 장의 지도로 접는다. 항상 마지막에 온다.","chapters":[{"id":"xiv-1","num":"XIV-1","title":"실전 체크리스트","desc":"시험장과 실무에서 그대로 꺼내 쓰는 목록"},{"id":"xiv-2","num":"XIV-2","title":"기술 면접 CS 총정리","desc":"전 Part의 면접 상자를 한곳에 모은다"},{"id":"xiv-3","num":"XIV-3","title":"시스템 설계형 질문 대비","desc":"자료구조 선택으로 답하는 뼈대"},{"id":"xiv-4","num":"XIV-4","title":"알고리즘 계보 한 장 지도","desc":"BFS에서 CBS까지, 해시에서 HyperLogLog까지"}]}],"docs":{"0-11":"# 0-11 손추적(dry run) 방법론\n\n::: lead\n코드를 실행하지 않고, 종이 위에서 그 코드가 무엇을 하는지 정확히 아는 방법.\n:::\n\n## 1. 문제\n\n이분 탐색은 열 줄이다. 읽으면 전부 이해된다. 그런데 직접 짜면 셋 중 하나가 일어난다. 답이 하나 어긋나거나, 배열 범위를 벗어나거나, 프로그램이 끝나지 않는다. 채점기가 돌려주는 것은 `틀렸습니다` 한 줄뿐이다.\n\n흔한 대응은 조금 고쳐서 다시 제출하는 것이다. `<`를 `<=`로, `mid`를 `mid+1`로, `hi`를 `n-1`로 바꿔 본다. 네 군데를 각각 두 가지로 바꾸면 조합이 열여섯 개다. 하나가 우연히 통과해도 그것은 통과했을 뿐 이해된 것이 아니다.\n\n디버거를 붙이면 되지 않느냐는 반문이 나온다. 붙일 수 없는 자리가 셋 있다.\n\n- **면접과 화이트보드.** 실행 환경이 없다. 종이 위에서 코드가 옳다는 것을 설명해야 한다.\n- **실시간·동시성 코드.** 브레이크포인트는 타이밍을 바꾼다. 멈춰 세우는 순간 재현되던 경합 조건이 사라진다. 이 현상은 [XI-3 락과 락프리](#/xi-3)에서 다시 다룬다.\n- **재현되지 않는 입력.** 10만 개 중 하나에서만 깨진다면, 그 하나를 찾기 전까지 디버거는 붙일 자리가 없다.\n\n더 근본적인 이유가 있다. ==디버거는 코드가 무엇을 하는지 보여주지만, 무엇을 해야 하는지는 보여주지 않는다.== 화면의 `lo = 3`이 옳은지 틀린지는 결국 사람이 판단한다. 그 판단의 근거를 만드는 것이 손추적이다.\n\n\"읽으면 이해되는데 못 짠다\"는 상태의 정체도 여기 있다. 읽을 때는 **코드가 상태를 대신 들고 있다.** 짤 때는 그 상태를 전부 머리가 들어야 한다. 읽기는 실행 모델 없이도 되지만 쓰기는 안 된다. 손추적은 그 모델을 종이에 외부화해 훈련하는 절차다.\n\n비용은 싸다. 이분 탐색은 원소가 100만 개여도 20스텝, 여섯 개면 세 스텝이다. **표 세 줄이 열여섯 번의 제출을 대체한다.**\n\n## 2. 아이디어\n\n손추적은 상태 표를 그리는 일이고, 표를 그린다는 것은 세 가지를 결정한다는 뜻이다. 무엇을 열로 둘지, 언제 한 줄을 찍을지, 언제 멈출지.\n\n### 2.1 무엇을 관찰할 것인가\n\n변수를 전부 열로 만들면 표가 죽는다. 열이 열두 개면 채우다 지치고, 채워도 무엇이 이상한지 안 보인다. 남길 것은 세 부류뿐이다.\n\n**첫째, 경계 변수.** **불변식**이 걸려 있는 변수다. 불변식은 특정 지점에서 항상 참이어야 하는 명제다. 반열림 이분 탐색이라면 \"답은 항상 `[lo, hi)` 안에 있다\"가 불변식이고 `lo`와 `hi`가 경계 변수다. BFS라면 \"큐 안의 정점들은 거리 순으로 정렬되어 있다\"가 불변식이고 큐가 경계다.\n\n**둘째, 측도.** 매 반복 반드시 줄어드는 음이 아닌 정수량이다. 이분 탐색에서는 폭 `hi - lo`가 측도다. 0 밑으로 못 내려가는데 매번 줄어드니 무한히 돌 수 없다. 반대로 **측도가 줄지 않는 반복이 한 번이라도 있으면 무한 루프에 빠질 수 있다.**\n\n**셋째, 판정에 쓰인 파생값.** `mid`, `a[mid]`, 비교 결과다. 없으면 왜 그쪽으로 갔는지 재구성할 수 없다.\n\n**불변식이 정확성을 맡고 측도가 종료를 맡는다.** 알고리즘이 옳다는 말은 이 둘이 모두 성립한다는 뜻이고, 손추적 표는 그것을 한 화면에서 확인하는 장치다.\n\n::: note\n열을 고르는 일이 손추적의 절반이다. ==열을 못 고르겠다면 그 알고리즘을 아직 이해하지 못한 것이다.== 실패가 아니라 신호다. 코드를 더 들여다볼 것이 아니라 \"이 루프가 매 바퀴 지켜야 하는 명제\"를 한 문장으로 먼저 적으라는 뜻이다.\n:::\n\n### 2.2 언제 한 줄을 찍을 것인가\n\n스냅샷 지점은 **루프 머리 한 곳으로 고정한다.** 불변식은 루프 머리에서 참인 명제이지 중간에서 참인 명제가 아니다. `lo`는 갱신했는데 `hi`는 아직인 시점을 적으면 그 줄은 어떤 불변식도 만족하지 않는 유령 상태가 된다. 표가 거짓말을 시작하는 지점이 대개 여기다.\n\n재귀 함수라면 찍는 자리는 **함수 진입 직후**이고, 열에는 인자와 깊이를 둔다. 반환값은 별도 열로 두고 되돌아올 때 채운다. [III-1 재귀 사고법](#/iii-1)에서 호출 트리로 확장된다.\n\n### 2.3 언제 멈출 것인가\n\n세 줄만 채우고 덮는 습관은 손추적의 효과를 거의 다 버린다. **끝까지 간다.** 측도가 0이 되고 루프 조건이 거짓이 되는 줄까지다.\n\n오프바이원은 거의 항상 마지막 한 줄에서 드러난다. 중간 스텝은 웬만한 구현이 다 통과한다. `lo`와 `hi`가 붙는 순간에 한쪽이 하나 어긋나거나 조건이 `<=`여서 한 바퀴를 더 도는 것이 그 자리에서 나온다. 표의 마지막 줄은 곧 반환값의 의미를 적는 줄이다.\n\n### 2.4 표의 모양\n\n```text nolines\n  step | lo | hi | width | mid | a[mid] | branch\n  -----+----+----+-------+-----+--------+-----------\n     0 |  0 |  6 |     6 |   3 |      5 | hi = mid\n     1 |  0 |  3 |     3 |   1 |      3 | lo = mid+1\n     2 |    |    |       |     |        |\n          ^            ^                    ^\n          |            |                    +-- 갱신: 어느 쪽 절반을 버렸는가\n          |            +----------------------- 측도: 반드시 단조 감소한다\n          +------------------------------------ 경계: 불변식이 걸려 있는 변수\n```\n\n왼쪽 세 덩어리가 전부다. 경계가 불변식을 지키는지, 측도가 줄어드는지, 갱신 규칙이 방금 검사한 원소를 제대로 처리했는지 본다. 세 번째가 오프바이원을 잡는다. **`mid`를 검사했으면 반드시 어느 한쪽에서 사라져야 한다.** 양쪽 다 남기면 구간이 줄지 않고, 다 버리면 답을 건너뛴다.\n\n### 2.5 어떤 입력으로 추적할 것인가\n\n크기는 **답이 나오는 최소 크기의 두 배** 정도가 좋다. 원소 여섯 개면 세 스텝을 돌아 갈림길이 양쪽 다 나온다. 세 개면 한쪽 분기만 밟고 끝나 반쪽만 검증된다.\n\n값의 배치는 셋을 돌린다.\n\n1. **답이 중간에 있는 입력.** 정상 경로.\n2. **답이 맨 끝에 있는 입력.** 오른쪽 경계가 닫힘인지 열림인지가 여기서 갈린다.\n3. **답이 없는 입력.** 루프가 빈 구간에서 어떻게 끝나고 무엇을 돌려주는지가 여기서 정해진다.\n\n중복 원소를 하나 섞는 것도 값싸다. `a = [1, 3, 3, 5, 7, 9]`에서 `3`이 둘인 이유가 그것이다. \"첫 위치\"와 \"마지막 다음 위치\"를 구분하는 구현인지가 여기서만 드러난다.\n\n### 2.6 손추적이 잡지 못하는 것\n\n::: widget complexity-plot {\"n\":1000000,\"curves\":[\"n\",\"n log n\",\"n^2\",\"2^n\"],\"budget\":100000000}\n:::\n\n위젯은 N이 커질 때 $O(n)$, $O(n \\log n)$, $O(n^2)$, $O(2^n)$이 로그 축에서 얼마나 벌어지는지와 \"1초 안에 되는 선\"이 어디를 지나는지를 보인다. 슬라이더를 밀면 $O(n^2)$이 그 선을 넘는 지점이 나오고, $O(2^n)$은 훨씬 왼쪽에서 넘어가 있다.\n\n이 그림이 여기 있는 이유는 **손추적의 한계를 긋기 위해서다.** 손추적은 정확성 도구이지 성능 도구가 아니다. 원소 여섯 개를 따라가서는 100만 개에서 시간 초과인지 알 수 없다. 성능은 [0-9 N 범위로 알고리즘 역산하기](#/0-9)의 절차로 판단한다.\n\n::: tip\n순서가 있다. **역산이 먼저, 손추적이 나중이다.** 역산으로 후보를 정하고 그 구현을 손으로 따라간다. 뒤집으면 시간 초과가 확정된 코드를 정성껏 검증하는 일이 생긴다.\n:::\n\n::: hist\n손추적은 새 기법이 아니다. 한 번의 실행에 대기 시간이 길던 시절에는 기계에 넣기 전 종이로 검증하는 것이 표준 절차였고, 그 이름이 desk checking이다. 기계가 싸지면서 \"일단 돌려 보고 고친다\"가 자리를 대신했다.\n\n그 시절의 명제 하나는 지금도 유효하다. Dijkstra는 1970년의 노트에서 테스트가 버그의 존재를 보일 수는 있어도 부재를 보일 수는 없다고 적었다. 실행은 넣어 본 입력에 대해서만 말하고, 불변식과 측도는 넣어 보지 않은 입력에 대해서도 말한다.\n:::\n\n## 3. 손으로 따라가기\n\n::: trace\n입력: `a = [1, 3, 3, 5, 7, 9]`, `x = 5`. 구할 것은 `a[i] >= 5`를 만족하는 **가장 왼쪽 인덱스** `i`.\n\n불변식: 답은 항상 반열림 구간 `[lo, hi)` 안에 있다. 시작은 `lo = 0`, `hi = 6`, 루프 조건은 `lo < hi`.\n갱신 규칙: `mid = lo + (hi - lo) // 2`. `a[mid] >= 5`이면 `hi = mid`, 아니면 `lo = mid + 1`.\n\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 2 |\n| 2 |  |  |  |  |  |  |  |\n| 3 |  |  |  |  |  |  |  |\n\n세 가지를 확인하라.\n\n- [ ] `width` 열이 매 스텝 **실제로** 줄어드는가\n- [ ] 루프가 멈추는 순간 `lo`와 `hi`는 얼마인가\n- [ ] 그때의 `lo`가 정말 답인가. 불변식이 폭 0인 구간에서 무엇을 뜻하는가\n:::\n\n::: answer\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 2 |\n| 2 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 3 |\n| 3 | 3 | 3 | 0 | — | — | — | `lo < hi`가 거짓, 종료 |\n\n답은 `lo = 3`이고 `a[3] = 5`가 맞다.\n\n`width` 열이 `6 → 3 → 1 → 0`으로 매 스텝 엄격히 줄었다. 이것이 이 루프가 반드시 끝난다는 증거다.\n\n마지막 질문의 핵심은 폭 0인 구간에서 불변식이 무엇을 뜻하느냐다. `[3, 3)`은 빈 구간이다. \"답이 이 안에 있다\"가 참이려면 답은 그 **왼쪽 끝 위치**, 즉 `lo`여야 한다. 반열림으로 짜면 `lo`와 `hi`가 만나는 지점이 곧 답이라 보정할 것이 없다. 닫힌 구간이면 `lo`인지 `lo+1`인지를 매번 다시 생각해야 한다. ==구간 표기를 반열림으로 통일하는 것이 오프바이원에 대한 가장 값싼 방어다.==\n\n**이제 규칙 하나만 바꿔 같은 표를 다시 채워 보라.** `lo = mid + 1` 대신 `lo = mid`로 두면:\n\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 1 |\n| 2 | 1 | 3 | 2 | 2 | 3 | 아니오 | lo = 2 |\n| 3 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 2 |\n| 4 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 2 |\n\n스텝 3에서 `width`가 1로 멈춘다. `mid`가 `lo`와 같아지는 순간 `lo = mid`는 아무것도 바꾸지 않고, 표는 같은 줄을 영원히 반복한다. **무한 루프가 실행 없이 표 다섯 줄에서 잡혔다.** 이것이 측도를 열로 두는 이유다.\n:::\n\n## 4. 구현\n\n손추적 표를 그대로 코드로 옮기면 추적 로그가 된다. 열 이름이 곧 출력 필드이고 출력 지점이 곧 루프 머리다. 표를 먼저 그렸다면 무엇을 찍을지 고민할 일이 없다.\n\n::: dual\n```python title=\"lower_bound — 손추적 표를 코드가 대신 찍게 하기\"\ndef lower_bound(a, x):\n    lo, hi = 0, len(a)          # 불변식: 답은 항상 [lo, hi) 안에 있다\n    step = 0\n    while lo < hi:              # 측도: hi - lo 가 매 반복 반드시 줄어든다\n        mid = lo + (hi - lo) // 2\n        print(f\"step={step} lo={lo} hi={hi} width={hi - lo} mid={mid} a[mid]={a[mid]}\")\n        if a[mid] >= x:\n            hi = mid            # mid 는 조건을 만족하므로 후보로 남긴다\n        else:\n            lo = mid + 1        # mid 는 조건을 만족하지 못하므로 버린다\n        step += 1\n    print(f\"done lo={lo} hi={hi} width={hi - lo}\")\n    return lo\n\n\na = [1, 3, 3, 5, 7, 9]\nans = lower_bound(a, 5)\nprint(\"answer =\", ans)\n```\n```cpp title=\"lower_bound — 손추적 표를 코드가 대신 찍게 하기\"\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint lower_bound(const vector<int>& a, int x) {\n    int lo = 0, hi = (int)a.size();   // 불변식: 답은 항상 [lo, hi) 안에 있다\n    int step = 0;\n    while (lo < hi) {                 // 측도: hi - lo 가 매 반복 반드시 줄어든다\n        int mid = lo + (hi - lo) / 2;\n        cout << \"step=\" << step << \" lo=\" << lo << \" hi=\" << hi\n             << \" width=\" << hi - lo << \" mid=\" << mid << \" a[mid]=\" << a[mid] << \"\\n\";\n        if (a[mid] >= x)\n            hi = mid;                 // mid 는 조건을 만족하므로 후보로 남긴다\n        else\n            lo = mid + 1;             // mid 는 조건을 만족하지 못하므로 버린다\n        step += 1;\n    }\n    cout << \"done lo=\" << lo << \" hi=\" << hi << \" width=\" << hi - lo << \"\\n\";\n    return lo;\n}\n\nint main() {\n    vector<int> a = {1, 3, 3, 5, 7, 9};\n    int ans = lower_bound(a, 5);\n    cout << \"answer = \" << ans << \"\\n\";\n    return 0;\n}\n```\n:::\n\n두 구현의 출력은 한 글자도 다르지 않다.\n\n```console\nstep=0 lo=0 hi=6 width=6 mid=3 a[mid]=5\nstep=1 lo=0 hi=3 width=3 mid=1 a[mid]=3\nstep=2 lo=2 hi=3 width=1 mid=2 a[mid]=3\ndone lo=3 hi=3 width=0\nanswer = 3\n```\n\n**복잡도:** 시간 $O(\\log n)$ — 매 반복 폭 `hi - lo`가 절반 이하로 줄고 폭이 0이면 끝나므로, 반복 횟수는 폭을 1까지 반으로 접는 횟수인 $\\log_2 n$을 넘지 않는다. 공간 $O(1)$ — 재귀 없이 정수 변수 네 개만 쓴다.\n\n상수도 말해 둔다. $O(\\log n)$은 $n = 10^6$에서 20회지만 **각 스텝이 배열의 전혀 다른 곳을 찌른다.** 위치가 매번 절반씩 뛰어 캐시 라인이 재사용되지 않으므로 초반 스텝은 사실상 매번 캐시 미스다. 같은 20회라도 연속 접근 20회와 비용이 다르다. 이 차이는 [0-6 C++ 컨테이너 세트](#/0-6)에서 다룬다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 정수 나눗셈 | `//`는 항상 내림. 음수에서 `-1 // 2 == -1` | `/`는 0 방향 절삭. `-1 / 2 == 0` |\n| `(lo + hi)` 오버플로 | 임의 정밀도라 발생하지 않는다 | `int` 범위를 넘을 수 있다. `lo + (hi - lo) / 2`로 쓰는 이유 |\n| 배열 길이 타입 | `len(a)`는 `int` | `a.size()`는 부호 없는 `size_t`. 부호 있는 값과 섞으면 비교가 뒤집힌다 |\n| 표준 대응 | `bisect.bisect_left(a, x)` | `std::lower_bound(a.begin(), a.end(), x)` |\n\n::: danger\n`mid = (lo + hi) / 2`는 C++에서 실제 장애를 만드는 코드다. `lo`와 `hi`가 20억 근처면 합이 `int` 범위를 넘어 음수가 되고, 음수 인덱스로 배열을 읽는다. 정의되지 않은 동작이라 크래시할 수도, 조용히 쓰레기 값을 읽을 수도 있다.\n\n`mid = lo + (hi - lo) / 2`로 쓰면 뺄셈이 먼저라 중간값이 커지지 않는다. **Python에서는 두 표기가 동등하지만 같은 습관을 양쪽에 들여 두는 편이 안전하다.** 언어를 오갈 때 무너지는 것은 지식이 아니라 습관이다. 오버플로는 [0-5 C++ 입출력과 기본 타입](#/0-5)에 있다.\n:::\n\n::: warn\n추적 출력은 **디버깅용이지 제출용이 아니다.** 채점기는 표준 출력을 정답과 비교하므로 로그 한 줄이 섞이면 알고리즘이 맞아도 오답이다. 지우는 것을 잊는 사고가 잦다면 `sys.stderr` / `cerr`로 보내라. 표준 에러는 채점 대상이 아니다.\n:::\n\n::: perf\n추적 출력을 켠 채로 큰 입력을 돌리는 것은 방법이 아니다. 정렬된 배열 $n = 10^6$에 질의 10만 번이면 한 질의가 약 20스텝이라 로그가 약 200만 줄이다. 전부 `/dev/null`로 버렸는데도 이렇다.\n\n| | 추적 없이 | 추적 출력 | 배수 |\n|---|---|---|---|\n| Python 3.13 | 0.45초 | 1.47초 | 3.3배 |\n| C++17 `-O2` | 0.018초 | 0.65초 | 36배 |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/dry_run_trace_cost.py` 와 `.cpp` 다.)\n\nC++ 쪽 배수가 큰 것이 핵심이다. 계산이 이미 0.018초로 끝나므로 계측 코드가 전체를 지배한다. **알고리즘이 빠를수록 로그가 프로그램이 된다.** 손추적이 입력을 여섯 개로 줄이는 데서 시작하는 이유가 이것이다.\n:::\n\n버그가 있는 쪽도 같은 형식으로 남긴다. 앞 절의 정답 상자에서 무한 루프를 만든 변형이다.\n\n```python title=\"무한 루프에 빠지는 버전 (조각)\" {2,4-5}\nwhile lo < hi:\n    mid = lo + (hi - lo) // 2\n    if a[mid] >= x:\n        hi = mid       # ✅ mid 는 조건을 만족하므로 후보로 남긴다\n    else: lo = mid     # ❌ mid 는 조건을 만족하지 않는데도 버리지 않았다\n```\n\n정수 나눗셈이 내림이라 `mid`는 폭이 1일 때 항상 `lo`와 같아지고, 그 순간 `lo = mid`는 아무 일도 하지 않는다. **이 버그는 폭이 1이 되기 전까지 드러나지 않는다.** 표를 끝까지 채우라는 §2.3이 겨냥하는 것이 이 종류다.\n\n무한 루프를 <kbd>Ctrl</kbd>+<kbd>C</kbd>로 끊었을 때 마지막 로그가 같은 값을 반복하고 있다면, 원인은 거의 항상 측도가 줄지 않는 갱신 규칙이다.\n\n::: pitfall\n- **`mid`를 양쪽 다 남긴다.** `hi = mid`와 `lo = mid`를 함께 쓰면 폭 1에서 멈춘다.\n- **구간 표기를 섞는다.** `hi = len(a)`로 시작해 놓고 `while lo <= hi`를 쓰면 첫 반복부터 `a[len(a)]`를 읽는다. 반열림이면 `<`, 닫힌 구간이면 `hi = len(a) - 1`에 `<=`다. 표기는 하나로 통일한다.\n- **끝난 뒤의 값을 확인하지 않는다.** `x`가 모든 원소보다 크면 `lo == len(a)`가 되고 그대로 `a[lo]`를 읽으면 터진다. 반환값을 쓰기 전에 범위 검사를 넣어라.\n- **관찰 대상을 잘못 고른다.** `width`를 빼면 무한 루프가 표에서 보이지 않는다. 측도 열은 선택이 아니다.\n- **중간 상태를 표에 적는다.** `lo`만 갱신하고 `hi`는 아직인 시점을 남기면 그 줄은 어떤 불변식도 만족하지 않는다. 찍는 자리는 루프 머리 하나다.\n:::\n\n::: deep\n이 형식은 즉흥적인 요령이 아니라 프로그램 검증의 표준 도구를 축소한 것이다. Hoare가 1969년에 제시한 논리에서 루프의 정확성은 사전조건, 불변식, 사후조건으로 서술된다. 루프 조건이 거짓이 된 시점에 성립하는 \"불변식 ∧ ¬루프조건\"이 곧 사후조건이어야 한다.\n\n이분 탐색에 대입하면 불변식은 \"답은 `[lo, hi)` 안에 있다\", 루프 조건의 부정은 `lo == hi`다. 둘을 결합하면 \"답은 폭 0인 구간의 위치, 즉 `lo`\"가 나온다. **`lo`를 돌려주면 된다는 결론이 코드를 보지 않고 논리만으로 나온다.** 종료는 측도가 담당한다.\n\n실전에서 값어치를 하는 것은 증명이 아니라 **문서화**다. 루프 위에 불변식 한 줄을 주석으로 적어 두면 반년 뒤 고치는 사람이 무엇을 깨면 안 되는지 안다.\n:::\n\n## 5. 어디에 쓰이는가\n\n**코드 리뷰가 손추적이다.** 리뷰어가 루프 앞에서 멈춰 \"`i`가 `n-1`까지 가나 `n`까지 가나\"를 묻는 것은 머릿속에서 표를 두어 줄 채우는 일이다. 코멘트가 \"이상한 것 같은데요\"에서 \"`n=1`이면 이 루프는 한 번도 안 돕니다\"로 바뀌는 순간, 표의 마지막 줄을 실제로 채워 봤다는 뜻이다.\n\n**로그 필드 설계가 관찰 대상 선택과 같은 문제다.** 운영 중인 시스템에서 무엇을 로그로 남길지 정하는 일은 어떤 변수를 열로 둘지 정하는 일과 같다. 전부 찍으면 디스크가 차고 정작 필요한 줄을 못 찾는다. 남길 것은 불변식이 깨졌는지 판정할 수 있는 최소 필드다. 큐 길이, 처리 지연, 재시도 횟수가 그 자리에 온다. [XI-7 이벤트 루프와 백프레셔](#/xi-7)에서 다시 쓰인다.\n\n**단위 테스트의 케이스 표가 손추적의 마지막 줄이다.** §2.5에서 고른 세 입력은 그대로 테스트 케이스 세 개가 된다. 확인한 것을 테스트로 고정하면 같은 확인을 다시 손으로 하지 않아도 된다. 제어 주기가 1밀리초인 루프처럼 브레이크포인트 자체가 동작을 바꾸는 코드에는 이 경로 말고 대안이 없다.\n\n## 6. 이 유형을 알아보는 법\n\n손추적이 필요한 코드에는 표식이 있다.\n\n::: classify\n- 신호어: \"정확히 K번\", \"이상/이하\", \"포함한다/포함하지 않는다\", \"가장 왼쪽의\", \"처음으로 ~가 되는 시점\"\n- 제약조건: 구간이 반열림인지 닫힘인지 지문이 명시하지 않을 때. 인덱스가 1부터 시작하는 입력. 원소가 1개일 수 있는 입력. 답이 없을 수 있는 입력\n- 혼동 주의: 경계가 흔들리는 것과 알고리즘 선택이 틀린 것은 다른 문제다. 손추적은 앞쪽만 고친다. 유형 자체를 잘못 잡은 경우는 [I-5 오분류 사례집](#/i-5)으로 간다\n- 반례 함정: 원소 1개, 답이 맨 끝, 답이 아예 없음. 이 세 입력에서만 깨지는 구현이 대부분이고, 중간 크기 입력만 돌려 보면 전부 통과한다\n:::\n\n::: interview\n경계가 있는 루프를 화이트보드에 짜게 한 뒤 이어지는 질문은 대개 둘이다.\n\n**\"이 루프가 무한 루프에 빠지지 않는 이유를 설명해 보세요.\"**\n답변 뼈대는 측도다. 매 반복 엄격히 줄어드는 음이 아닌 정수량을 지목한다. \"구간 폭 `hi - lo`가 매 반복 최소 1 줄고 0 밑으로는 못 갑니다. 따라서 최대 초기 폭만큼만 돌고 끝납니다.\" \"테스트해 봤는데 잘 돌았습니다\"는 답이 아니다.\n\n**\"이 함수가 옳은 값을 돌려준다는 것을 어떻게 압니까.\"**\n답변 뼈대는 불변식이다. 루프 머리에서 항상 참인 명제를 한 문장으로 말하고, 거기에 루프 조건의 부정을 결합해 무엇이 나오는지 보인다. \"답은 항상 `[lo, hi)` 안에 있고, 루프가 끝나면 `lo == hi`이므로 답은 `lo`입니다.\"\n\n두 답변 모두 코드를 다시 읽지 않고 나온다.\n:::\n\n## 연습\n\n::: quiz\n전부 경계 조건이 본체인 유형이다. **코드를 짜기 전에 손추적 표부터 그려라.**\n\n**1. 백준 1920 수 찾기 (실버 4)** — https://www.acmicpc.net/problem/1920\n- 신호: \"존재하는지 알아내시오\" + N과 M이 각각 10만. 선형 탐색이면 100억이라 넘는다.\n- 상태: 탐색 구간 `[lo, hi)` 하나.\n- 자료구조: 정렬된 배열. 순서만 필요하고 삽입·삭제가 없어 트리나 해시를 쓸 이유가 없다.\n\n**2. 백준 10816 숫자 카드 2 (실버 4)** — https://www.acmicpc.net/problem/10816\n- 신호: 존재 여부가 아니라 \"몇 개인지\"를 묻는다. 개수를 세는 것은 경계 두 개의 차다.\n- 상태: 같은 값이 놓인 구간의 왼쪽 끝과 오른쪽 끝 다음 위치. `upper_bound - lower_bound`가 답이다.\n- 자료구조: 정렬 배열 + 두 종류의 경계 탐색. 해시로도 풀리지만 훈련 가치는 두 경계의 차이를 손으로 확인하는 데 있다.\n\n**3. 백준 2805 나무 자르기 (실버 2)** — https://www.acmicpc.net/problem/2805\n- 신호: \"절단기에 설정할 수 있는 높이의 최댓값\". 답 자체가 수이고 \"높이 H면 M 이상인가\"라는 판정이 H에 대해 단조롭다.\n- 상태: 답의 후보 구간 `[lo, hi)`. 배열 인덱스가 아니라 **답의 값**을 이분 탐색한다.\n- 자료구조: 배열과 누적 합계용 정수. 합이 20억을 넘어 C++에서는 `long long`이 필수다. [VII-3 매개변수 탐색](#/vii-3)에서 다룬다.\n\n**4. 손추적 과제.** `a = [2, 4, 4, 4, 8]`, `x = 4`로 위의 `lower_bound`를 끝까지 표로 채워라. 이어서 `a[mid] >= x`를 `a[mid] > x`로만 바꾸고 같은 표를 다시 채워라. 두 표는 어디서 갈라지고, 두 결과의 차는 무엇을 뜻하는가.\n\n::: answer\n`a[mid] >= x`인 원본은 `lo = 1`에서 끝난다. `a[1] = 4`가 4 이상인 첫 위치다.\n\n`a[mid] > x`로 바꾸면 `4`들은 조건을 만족하지 못해 `lo = mid + 1`로 전부 버려지고, 루프는 `lo = 4`에서 끝난다. `a[4] = 8`이 4보다 큰 첫 위치다.\n\n두 표는 `mid`가 값 `4`를 가리키는 첫 스텝에서 갈라진다. 원본은 `hi = mid`로 왼쪽을 남기고, 변형은 `lo = mid + 1`로 오른쪽으로 간다.\n\n두 결과의 차 `4 - 1 = 3`이 배열 안 `4`의 개수다. 이것이 곧 `upper_bound - lower_bound`이고 2번 문제의 답이다. **부등호 하나가 \"첫 위치\"와 \"마지막 다음 위치\"를 가르고, 두 값의 차가 개수를 준다.** 세 결과가 같은 표에서 나온다는 것이 이 과제의 요점이다.\n:::\n:::\n\n## 요약\n\n- 손추적은 코드를 실행하지 않고 상태 표를 채워 실행 모델을 검증하는 절차다. \"읽으면 이해되는데 못 짠다\"는 상태를 겨냥한다.\n- 열로 둘 것은 셋뿐이다. 불변식이 걸린 **경계 변수**, 매 반복 줄어드는 **측도**, 판정에 쓰인 **파생값**.\n- **불변식이 정확성을 맡고 측도가 종료를 맡는다.** 측도가 줄지 않는 반복이 하나라도 있으면 무한 루프다.\n- 스냅샷은 **루프 머리 한 곳**에서만 찍고, 표는 **측도가 0이 되는 줄까지** 채운다. 오프바이원은 마지막 줄에서 드러난다.\n- 입력은 답이 중간에 있는 것, 맨 끝에 있는 것, 아예 없는 것 세 가지를 돌린다.\n- 구간 표기는 한 함수 안에서 **반열림 `[lo, hi)` 하나로 통일한다.** 폭이 `hi - lo`이고 빈 구간이 `lo == hi` 하나로 표현되는 것이 오프바이원을 줄인다.\n- 손추적은 정확성 도구다. 성능은 [0-9 N 범위로 알고리즘 역산하기](#/0-9)의 역산으로 판단하고, 역산을 먼저 한다.\n\n**다음 절**: [0-12 디버깅과 반례 찾기](#/0-12) — 손추적으로도 안 잡히는 버그를 브루트포스 대조와 랜덤 스트레스 테스트로 몰아낸다.\n"},"classify":[{"chapter":"0-11","num":"0-11","title":"손추적(dry run) 방법론","signals":"\"정확히 K번\", \"이상/이하\", \"포함한다/포함하지 않는다\", \"가장 왼쪽의\", \"처음으로 ~가 되는 시점\"","constraints":"구간이 반열림인지 닫힘인지 지문이 명시하지 않을 때. 인덱스가 1부터 시작하는 입력. 원소가 1개일 수 있는 입력. 답이 없을 수 있는 입력","confusion":"경계가 흔들리는 것과 알고리즘 선택이 틀린 것은 다른 문제다. 손추적은 앞쪽만 고친다. 유형 자체를 잘못 잡은 경우는 [I-5 오분류 사례집](#/i-5)으로 간다","traps":"원소 1개, 답이 맨 끝, 답이 아예 없음. 이 세 입력에서만 깨지는 구현이 대부분이고, 중간 크기 입력만 돌려 보면 전부 통과한다"}]};

 * 컨트롤, 고해상도 캔버스, 폭 변화 대응, 테마 색 읽기.

 *   자동 애니메이션은 지나가 버리고, 독자는 되감을 수 없다. 그래서 상태를 미리
