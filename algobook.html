    s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)');
    s = s.replace(/\\(?:quad|qquad|,|;|!|:)/g, ' ');
    s = s.replace(/\\([{}%&#$_])/g, '$1');
    s = s.replace(/\\([A-Za-z]+)/g, function (_, w) {
      return MATH_SYM.hasOwnProperty(w) ? MATH_SYM[w] : w;
    });
    // O(n^{2}) 처럼 지수·첨자의 중괄호만 벗긴다. 나머지 중괄호는 집합 표기일 수 있어 둔다.
    s = s.replace(/([\^_])\{([^{}]*)\}/g, '$1$2');
    return s.replace(/[ \t]+/g, ' ').trim();
  }

  /* ==================== 인라인 ==================== */

  var MARK = '\u0000'; // 스태시 자리표시자 구분자. 본문에 등장할 수 없는 문자라 안전하다.

  function inline(src) {
    var stash = [];
    function keep(html) {
      stash.push(html);
      return MARK + (stash.length - 1) + MARK;
    }

    var s = String(src == null ? '' : src);

    // 1) 인라인 코드를 먼저 격리한다. 코드 안의 `*`, `$`, `<` 는 문법이 아니라 글자다.
    s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, function (_, ticks, code) {
      return keep('<code class="inline">' + esc(code.replace(/^ | $/g, '')) + '</code>');
    });

    // 2) 수식. 블록이 먼저다 — $$ 를 $ 로 먼저 먹으면 경계가 어긋난다.
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, function (_, m) {
      return keep('<div class="math-block">' + esc(tidyMath(m)) + '</div>');
    });
    s = s.replace(/\$([^$\n]+?)\$/g, function (_, m) {
      return keep('<span class="math">' + esc(tidyMath(m)) + '</span>');
    });

    // 3) 허용된 유일한 원시 HTML. 속성이 붙은 <kbd class=…> 형태는 통과시키지 않는다 —
    //    속성을 허용하는 순간 온갖 이벤트 핸들러가 같이 들어온다.
    s = s.replace(/<\/?kbd>/gi, function (m) {
      return keep(m.toLowerCase());
    });

    // 4) 나머지 원시 HTML은 전부 글자로 만든다.
    s = esc(s);

    // 5) 이미지 · 링크
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, function (_, alt, url) {
      return '<img src="' + safeUrl(url) + '" alt="' + alt + '" loading="lazy">';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+[^)]*)?\)/g, function (_, text, url) {
      var u = safeUrl(url);
      var ext = /^(?:https?:|\/\/)/i.test(u);
      if (ext) return '<a href="' + u + '" target="_blank" rel="noopener">' + text + '</a>';
      // 내부 상호참조는 라우터가 가로채야 하므로 표식을 남긴다(계약 §2.6).
      var cls = u.indexOf('#/') === 0 ? ' class="xref"' : '';
      return '<a href="' + u + '"' + cls + '>' + text + '</a>';
    });

    // 6) 강조. 긴 마커부터 처리해야 ***x*** 가 **+* 로 쪼개지지 않는다.
    s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
    s = s.replace(/~~([\s\S]+?)~~/g, '<del>$1</del>');
    s = s.replace(/==([^=\n]+?)==/g, '<mark>$1</mark>');
    // `_`는 강조로 쓰지 않는다. 식별자(`max_heap`)를 기울임으로 부수는 사고가 잦다.

    // 7) 줄 끝 공백 두 칸은 강제 개행
    s = s.replace(/ {2,}\n/g, '<br>\n');

    // 8) 스태시 복원
    return s.replace(new RegExp(MARK + '(\\d+)' + MARK, 'g'), function (_, k) {
      var v = stash[+k];
      return v == null ? '' : v;
    });
  }

  /* ==================== 코드 블록 ==================== */

  function langOf(info) {
    var t = String(info == null ? '' : info).trim().split(/\s+/)[0] || '';
    t = t.replace(/\{[\s\S]*/, '').toLowerCase();
    // 클래스명·속성에 그대로 박히는 값이라 화이트리스트 문자만 통과시킨다.
    return /^[a-z0-9+#_.-]*$/.test(t) ? t : '';
  }

  function parseHl(spec) {
    var set = {};
    String(spec == null ? '' : spec).split(',').forEach(function (part) {
      var p = part.trim();
      var m = /^(\d+)\s*-\s*(\d+)$/.exec(p);
      if (m) {
        var a = +m[1], b = +m[2];
        // {1-99999999} 같은 오타 하나로 브라우저가 멈추면 안 된다.
        if (b > a + 5000) b = a + 5000;
        for (var k = a; k <= b; k++) set[k] = true;
      } else if (/^\d+$/.test(p)) {
        set[+p] = true;
      }
    });
    return set;
  }

  function renderCode(code, info) {
    var meta = String(info == null ? '' : info).trim();
    var lang = langOf(meta);
    var tm = /title\s*=\s*"([^"]*)"/.exec(meta);
    var hm = /\{([0-9,\s-]+)\}/.exec(meta);
    var noLines = /(^|\s)nolines(\s|$)/.test(meta);
    var title = tm ? tm[1] : '';
    var hlSet = parseHl(hm ? hm[1] : '');

    var body = String(code == null ? '' : code).replace(/\n+$/, '');

    // 원문을 이스케이프하지 않고 넘긴다 — 이스케이프는 HL의 책임이다(계약 §2.1).
    // HL이 아직 로드되지 않았거나 터져도 코드는 보여야 하므로 자체 esc로 물러선다.
    var painted;
    try {
      var HL = global.HL;
      painted = (HL && typeof HL.highlight === 'function') ? HL.highlight(body, lang) : esc(body);
      if (typeof painted !== 'string') painted = esc(body);
    } catch (e) {
      painted = esc(body);
    }

    var rows = painted.split('\n').map(function (ln, k) {
      var cls = 'line' + (hlSet[k + 1] ? ' hl' : '');
      return (noLines ? '' : '<span class="ln">' + (k + 1) + '</span>') +
        '<span class="' + cls + '">' + ln + '</span>';
    }).join('\n');

    // title이 없어도 head는 남긴다 — 복사 버튼이 거기 산다(계약 §2.1).
    var head = '<div class="codeblock-head">' +
      (title ? '<span class="codeblock-title">' + esc(title) + '</span>' : '') +
      (lang ? '<span class="codeblock-lang">' + esc(lang) + '</span>' : '') +
      '<button class="codeblock-copy" type="button" aria-label="코드 복사">복사</button>' +
      '</div>';

    return '<div class="codeblock" data-lang="' + esc(lang) + '">' + head +
      '<pre class="code' + (noLines ? ' nolines' : '') + '">' +
      '<code class="lang-' + esc(lang) + '">' + rows + '</code></pre></div>';
  }

  /* ==================== ::: dual ==================== */

  var LANG_LABEL = {
    python: 'Python', cpp: 'C++', c: 'C', text: 'Text',
    bash: 'Bash', json: 'JSON', console: 'Console'
  };

  function renderDual(inner, ctx) {
    var lines = inner.split('\n');
    var panes = [];
    var slot = {};
    var stray = [];
    var i = 0;

    while (i < lines.length) {
      var f = /^\s*(`{3,}|~{3,})(.*)$/.exec(lines[i]);
      if (f) {
        var mark = f[1].charAt(0);
        var len = f[1].length;
        var meta = f[2];
        var buf = [];
        i++;
        while (i < lines.length && !isFenceClose(lines[i], mark, len)) { buf.push(lines[i]); i++; }
        i++;
        var lang = langOf(meta) || 'text';
        var html = renderCode(buf.join('\n'), meta);
        if (slot.hasOwnProperty(lang)) panes[slot[lang]].html += html;
        else { slot[lang] = panes.length; panes.push({ lang: lang, html: html }); }
        continue;
      }
      if (lines[i].trim()) stray.push(lines[i]);
      i++;
    }

    // 코드 펜스가 하나도 없으면 dual로 만들 게 없다. 본문을 버리지 말고 그대로 살린다.
    if (!panes.length) return blocks(inner, ctx, true);

    // A-04: Python이 항상 먼저, C++이 뒤. 그 외 언어는 등장 순서로 뒤에 붙인다.
    var ordered = [];
    ['python', 'cpp'].forEach(function (l) {
      panes.forEach(function (p) { if (p.lang === l) ordered.push(p); });
    });
    panes.forEach(function (p) {
      if (p.lang !== 'python' && p.lang !== 'cpp') ordered.push(p);
    });

    var tabs = ordered.map(function (p, k) {
      return '<button class="dual-tab' + (k === 0 ? ' is-active' : '') +
        '" data-dual-lang="' + esc(p.lang) + '" role="tab" type="button">' +
        esc(LANG_LABEL[p.lang] || p.lang) + '</button>';
    }).join('');

    // `둘 다` 모드에서 app.js가 컨테이너에 .is-both를 붙여 두 패널을 세로로 쌓는다.
    // 렌더러는 두 패널을 항상 다 만들어 두기만 하면 된다(계약 §2.2).
    var body = ordered.map(function (p, k) {
      return '<div class="dual-pane' + (k === 0 ? ' is-active' : '') +
        '" data-dual-lang="' + esc(p.lang) + '">' + p.html + '</div>';
    }).join('');

    var html = '<div class="dual" data-dual>' +
      '<div class="dual-tabs" role="tablist">' + tabs + '</div>' + body + '</div>';

    return stray.length ? html + '\n' + blocks(stray.join('\n'), ctx, true) : html;
  }

  /* ==================== ::: 상자 ==================== */

  // 계약 §2.3의 기본 라벨. lead는 라벨이 없다.
  var BOX_LABEL = {
    lead: '',
    note: '참고',
    tip: '요령',
    warn: '주의',
    danger: '위험',
    deep: '한 단계 아래',
    perf: '성능',
    hist: '설계 배경',
    trace: '손으로 따라가기',
    pitfall: '틀리는 지점',
    classify: '이 유형을 알아보는 법',
    interview: '면접에서는',
    quiz: '연습',
    answer: '정답'
  };

  function renderBox(kind, title, body, ctx) {
    // 클래스명에 임의 문자열이 들어가지 않게 한 번 더 거른다.
    var k = String(kind).toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (!k) k = 'note';
    var known = BOX_LABEL.hasOwnProperty(k);
    var label = title || (known ? BOX_LABEL[k] : k);

    // classify 안에서만 불릿에 data-classify-key를 붙인다(계약 §2.4).
    // build.py가 이 블록을 수집해 Anki 덱을 만들기 때문에 키는 상자 밖으로 새면 안 된다.
    if (k === 'classify') ctx.classify++;
    var inner = blocks(body, ctx, true);
    if (k === 'classify') ctx.classify--;

    if (k === 'answer') {
      return '<details class="box box-answer"><summary class="box-title">' +
        esc(label || BOX_LABEL.answer) + '</summary>' +
        '<div class="box-body">' + inner + '</div></details>';
    }
    // lead는 제목 줄 자체가 없다. 절 머리말이라 라벨이 붙으면 오히려 방해가 된다.
    if (k === 'lead') {
      return '<div class="box box-lead"><div class="box-body">' + inner + '</div></div>';
    }
    return '<div class="box box-' + k + '">' +
      (label ? '<div class="box-title">' + esc(label) + '</div>' : '') +
      '<div class="box-body">' + inner + '</div></div>';
  }

  /* ==================== ::: widget ==================== */

  function renderWidget(rest, bodyLines) {
    var m = /^([A-Za-z0-9_.-]+)\s*([\s\S]*)$/.exec(String(rest || '').trim());
    var type = m ? m[1] : '';
    var jsonText = ((m ? m[2] : '') + '\n' + bodyLines.join('\n')).trim();
    var opts = '{}';
    if (jsonText) {
      try {
        var parsed = JSON.parse(jsonText);
        // 배열·숫자를 옵션으로 넘기면 위젯 쪽 계약이 깨진다. 객체만 인정한다.
        if (parsed && typeof parsed === 'object' && !(parsed instanceof Array)) {
          opts = JSON.stringify(parsed);
        }
      } catch (e) {
        opts = '{}'; // 깨진 JSON은 조용히 버린다. 한 챕터의 오타로 책 전체가 안 뜨면 안 된다.
      }
    }
    return '<div class="widget" data-widget="' + esc(type) + '" data-opts=\'' + escSingle(opts) + '\'></div>';
  }

  /* ==================== 표 ==================== */

  function isTableDelim(s) {
    return typeof s === 'string' && /\|/.test(s) && /-/.test(s) && /^[\s|:-]+$/.test(s);
  }

  function splitRow(line) {
    var s = String(line).trim().replace(/^\|/, '').replace(/\|$/, '');
    var cells = [];
    var cur = '';
    var inCode = false;
    for (var k = 0; k < s.length; k++) {
      var ch = s.charAt(k);
      if (ch === '\\' && s.charAt(k + 1) === '|') { cur += '|'; k++; continue; }
      if (ch === '`') inCode = !inCode;
      if (ch === '|' && !inCode) { cells.push(cur); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur);
    return cells;
  }

  function alignOf(cell) {
    var c = String(cell).trim();
    if (/^:.*:$/.test(c)) return 'center';
    if (/:$/.test(c)) return 'right';
    if (/^:/.test(c)) return 'left';
    return '';
  }

  /* ==================== 목록 ==================== */

  // 그룹1=들여쓰기, 그룹2=불릿 문자(순서 있는 목록이면 undefined), 그룹3=번호.
  // /g 를 붙이면 lastIndex가 남아 .test()가 번갈아 실패하므로 절대 붙이지 않는다.
  var MARKER = /^(\s*)(?:([-*+])|(\d+)[.)])[ \t]+/;

  function classifyKey(text) {
    var t = String(text).replace(/^[\s*_`>]+/, '');
    if (/^신호어/.test(t)) return 'signals';
    if (/^제약\s*조건/.test(t)) return 'constraints';
    // 집필 현장에서 `혼동 주의`와 `혼동주의`가 섞여 들어온다. 둘 다 받는다(계약 §2.4).
    if (/^혼동\s*주의/.test(t)) return 'confusion';
    if (/^반례\s*함정/.test(t)) return 'traps';
    return '';
  }

  function renderList(lines, ctx) {
    var first = MARKER.exec(lines[0]);
    if (!first) return '<p>' + inline(lines.join('\n')) + '</p>';

    var indent = first[1].length;
    var ordered = !first[2];
    var start = ordered ? parseInt(first[3], 10) : 1;

    // 이 레벨의 '같은 종류' 마커만 항목 시작으로 인정한다. 더 깊게 들여쓴 줄은
    // 항목 본문으로 넘겨서 blocks()가 재귀로 중첩 목록을 처리하게 한다.
    var markerRe = new RegExp('^\\s{' + indent + '}' + (ordered ? '\\d+[.)]' : '[-*+]') + '[ \\t]+');
    var items = [];
    var cur = null;
    var contIndent = 0;

    lines.forEach(function (ln) {
      var m = markerRe.exec(ln);
      if (m) {
        if (cur) items.push(cur);
        cur = [ln.slice(m[0].length)];
        contIndent = m[0].length;
      } else if (cur) {
        cur.push(/^\s*$/.test(ln) ? '' : ln.replace(new RegExp('^\\s{0,' + contIndent + '}'), ''));
      }
    });
    if (cur) items.push(cur);

    var html = items.map(function (item) {
      var text = item.join('\n');
      var attrs = '';
      var prefix = '';

      var cb = /^\[([ xX])\][ \t]*([\s\S]*)$/.exec(text);
      if (cb) {
        attrs = ' class="task"';
        prefix = '<input type="checkbox" disabled' +
          (cb[1].toLowerCase() === 'x' ? ' checked' : '') + '> ';
        text = cb[2];
      } else if (ctx.classify > 0) {
        var key = classifyKey(text);
        if (key) attrs = ' data-classify-key="' + key + '"';
      }

      var inner = blocks(text, ctx, true);
      // 한 문단짜리 항목이면 <p>를 벗긴다. 안 벗기면 목록 줄 간격이 통째로 벌어진다.
      var only = /^<p>([\s\S]*)<\/p>$/.exec(inner.trim());
      if (only && only[1].indexOf('<p>') === -1) {
        inner = only[1];
      } else if (!/\n[ \t]*\n/.test(text)) {
        // 빈 줄이 없는 항목(tight)은 중첩 목록을 달고 있어도 첫 줄이 문단이 아니다.
        // 여기서 안 벗기면 `- 항목\n  - 중첩` 이 loose 목록처럼 벌어진다.
        inner = inner.replace(/^<p>([\s\S]*?)<\/p>(\n|$)/, '$1$2');
      }
      return '<li' + attrs + '>' + prefix + inner + '</li>';
    }).join('');

    return ordered
      ? '<ol' + (start !== 1 && !isNaN(start) ? ' start="' + start + '"' : '') + '>' + html + '</ol>'
      : '<ul>' + html + '</ul>';
  }

  /* ==================== 블록 상태 기계 ==================== */

  function isFenceClose(line, mark, len) {
    var m = /^\s*(`{3,}|~{3,})\s*$/.exec(line);
    if (!m) return false;
    return m[1].charAt(0) === mark && m[1].length >= len;
  }

  // 목록의 게으른 연속(lazy continuation)이 삼키면 안 되는 줄들.
  // 이게 없으면 목록 뒤에 붙은 `## 제목`이 목록 안으로 빨려 들어가고,
  // 그러면 headings()와 render()의 슬러그 번호가 어긋난다.
  function isHardBlockStart(line) {
    return /^#{1,6}[ \t]+/.test(line) ||
      /^:::/.test(line) ||
      /^(?:`{3,}|~{3,})/.test(line) ||
      /^>/.test(line);
  }

  function isBlockBreak(lines, i) {
    var l = lines[i];
    return /^\s*$/.test(l) ||
      /^#{1,6}[ \t]+/.test(l) ||
      /^:::/.test(l) ||
      /^\s{0,3}(?:`{3,}|~{3,})/.test(l) ||
      /^\s{0,3}>/.test(l) ||
      MARKER.test(l) ||
      /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l) ||
      /^\s*\$\$/.test(l) ||
      (/\|/.test(l) && i + 1 < lines.length && isTableDelim(lines[i + 1]));
  }

  function blank(s) { return /^\s*$/.test(s); }

  /**
   * @param src    마크다운 원문
   * @param ctx    { used, classify } — 슬러그 중복 사전과 classify 깊이
   * @param nested 재귀 호출 여부. 상자·인용·목록 안의 제목에는 id를 붙이지 않는다.
   *               headings()가 최상위 h2·h3만 세므로, 여기서 id를 남발하면 `-2` 접미가
   *               어긋나 인북 목차 링크가 통째로 깨진다.
   */
  function blocks(src, ctx, nested) {
    var lines = String(src == null ? '' : src).split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (blank(line)) { i++; continue; }

      /* --- 코드 펜스 --- */
      var fence = /^\s{0,3}(`{3,}|~{3,})(.*)$/.exec(line);
      if (fence) {
        var mark = fence[1].charAt(0);
        var len = fence[1].length;
        var meta = fence[2];
        var cbuf = [];
        i++;
        while (i < lines.length && !isFenceClose(lines[i], mark, len)) { cbuf.push(lines[i]); i++; }
        i++; // 닫는 펜스(없으면 EOF)
        out.push(renderCode(cbuf.join('\n'), meta));
        continue;
      }

      /* --- ::: 블록 (widget / dual / 표시 상자) --- */
      var bm = /^:::[ \t]*([A-Za-z][A-Za-z0-9_-]*)[ \t]*(.*)$/.exec(line);
      if (bm) {
        var kind = bm[1].toLowerCase();
        var rest = bm[2].trim();
        var bbuf = [];
        var depth = 1;
        var inFence = null; // 상자 안의 코드 펜스에 들어 있는 `:::`는 세면 안 된다
        i++;
        while (i < lines.length) {
          var l = lines[i];
          var fm = /^\s{0,3}(`{3,}|~{3,})/.exec(l);
          if (fm) {
            if (!inFence) inFence = fm[1];
            else if (fm[1].charAt(0) === inFence.charAt(0) && fm[1].length >= inFence.length) inFence = null;
          } else if (!inFence) {
            // 닫는 :::는 항상 홀로 있는 ::: 줄이다(계약 §2.3).
            if (/^:::[ \t]*$/.test(l)) {
              depth--;
              if (depth === 0) { i++; break; }
            } else if (/^:::[ \t]*\S/.test(l)) {
              depth++;
            }
          }
          bbuf.push(l);
          i++;
        }

        if (kind === 'widget') { out.push(renderWidget(rest, bbuf)); continue; }
        if (kind === 'dual') { out.push(renderDual(bbuf.join('\n'), ctx)); continue; }
        out.push(renderBox(kind, rest, bbuf.join('\n'), ctx));
        continue;
      }

      /* --- 제목 --- */
      var h = /^(#{1,6})[ \t]+(.*)$/.exec(line);
      if (h) {
        var lvl = h[1].length;
        var raw = h[2].replace(/\s+#+\s*$/, '').trim();
        var text = headingText(raw);
        var attr = '';
        var anchor = '';
        if (!nested && (lvl === 2 || lvl === 3)) {
          var id = uniqueSlug(slugify(text), ctx.used);
          attr = ' id="' + esc(id) + '"';
          anchor = '<a class="anchor" href="#' + esc(id) + '" aria-label="이 절 링크">#</a>';
        }
        out.push('<h' + lvl + attr + '>' + inline(raw) + anchor + '</h' + lvl + '>');
        i++;
        continue;
      }

      /* --- 수평선 --- */
      if (/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      /* --- 블록 수식 --- */
      var mb = /^\s*\$\$([\s\S]*)$/.exec(line);
      if (mb) {
        var acc = mb[1];
        if (/\$\$\s*$/.test(acc)) {
          acc = acc.replace(/\$\$\s*$/, '');
          i++;
        } else {
          i++;
          while (i < lines.length && lines[i].indexOf('$$') === -1) { acc += '\n' + lines[i]; i++; }
          if (i < lines.length) { acc += '\n' + lines[i].replace(/\$\$[\s\S]*$/, ''); i++; }
        }
        out.push('<div class="math-block">' + esc(tidyMath(acc)) + '</div>');
        continue;
      }

      /* --- 표 --- */
      if (/\|/.test(line) && i + 1 < lines.length && isTableDelim(lines[i + 1])) {
        var head = splitRow(line);
        var align = splitRow(lines[i + 1]).map(alignOf);
        i += 2;
        var rows = [];
        while (i < lines.length && !blank(lines[i]) && /\|/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        // 가로 스크롤 컨테이너는 필수다(계약 §2.6·§5). body에 가로 스크롤을 만들면 안 된다.
        var t = '<div class="table-wrap"><table><thead><tr>';
        head.forEach(function (c, k) {
          t += '<th' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
            inline(c.trim()) + '</th>';
        });
        t += '</tr></thead><tbody>';
        rows.forEach(function (row) {
          t += '<tr>';
          head.forEach(function (_, k) {
            t += '<td' + (align[k] ? ' style="text-align:' + align[k] + '"' : '') + '>' +
              inline(String(row[k] == null ? '' : row[k]).trim()) + '</td>';
          });
          t += '</tr>';
        });
        out.push(t + '</tbody></table></div>');
        continue;
      }

      /* --- 인용 --- */
      if (/^\s{0,3}>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s{0,3}>/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^\s{0,3}>[ \t]?/, ''));
          i++;
        }
        out.push('<blockquote>' + blocks(qbuf.join('\n'), ctx, true) + '</blockquote>');
        continue;
      }

      /* --- 목록 --- */
      if (MARKER.test(line)) {
        var lm = MARKER.exec(line);
        var baseIndent = lm[1].length;
        var baseOrdered = !lm[2];
        var lbuf = [];
        while (i < lines.length) {
          if (blank(lines[i])) {
            var j = i + 1;
            while (j < lines.length && blank(lines[j])) j++;
            if (j < lines.length && /^(?:\s{2,}|\s*(?:[-*+]|\d+[.)])[ \t])/.test(lines[j])) {
              lbuf.push(''); i++; continue;
            }
            break;
          }
          var mm = MARKER.exec(lines[i]);
          // 같은 레벨에서 마커 종류가 바뀌면(- → 1.) 별개의 목록이다.
          if (mm && mm[1].length === baseIndent && (!mm[2]) !== baseOrdered) break;
          if (!mm && isHardBlockStart(lines[i])) break;
          lbuf.push(lines[i]);
          i++;
        }
        out.push(renderList(lbuf, ctx));
        continue;
      }

      /* --- 문단 --- */
      var pbuf = [line];
      i++;
      while (i < lines.length && !isBlockBreak(lines, i)) { pbuf.push(lines[i]); i++; }
      out.push('<p>' + inline(pbuf.join('\n')) + '</p>');
    }

    return out.join('\n');
  }

  /* ==================== 공개 API ==================== */

  // CRLF만 정규화한다. 탭은 건드리지 않는다 — 코드 블록 원문이 바뀌면 안 되기 때문이다.
  function norm(src) {
    return String(src == null ? '' : src).replace(/\r\n?/g, '\n');
  }

  function render(markdown) {
    try {
      return blocks(norm(markdown), { used: {}, classify: 0 }, false);
    } catch (e) {
      // 에러 경계가 없는 페이지다. 어떤 입력에서도 렌더가 죽는 것보다
      // 원문을 그대로 보여주는 쪽이 낫다.
      return '<pre class="code">' + esc(norm(markdown)) + '</pre>';
    }
  }

  // 코드 펜스 안과 ::: 상자 안의 `#`는 제외한다(계약 §2.7).
  // 슬러그 계산은 render()와 같은 함수를 쓰고, 스캔 순서도 같으므로 결과가 일치한다.
  function headings(markdown) {
    var out = [];
    try {
      var lines = norm(markdown).split('\n');
      var used = {};
      var fence = null;
      var depth = 0;

      for (var i = 0; i < lines.length; i++) {
        var l = lines[i];

        var fm = /^\s{0,3}(`{3,}|~{3,})/.exec(l);
        if (fm) {
          if (!fence) fence = fm[1];
          else if (fm[1].charAt(0) === fence.charAt(0) && fm[1].length >= fence.length) fence = null;
          continue;
        }
        if (fence) continue;

        if (/^:::[ \t]*$/.test(l)) { if (depth > 0) depth--; continue; }
        if (/^:::[ \t]*\S/.test(l)) { depth++; continue; }
        if (depth > 0) continue;

        var h = /^(#{1,6})[ \t]+(.*)$/.exec(l);
        if (!h) continue;
        var lvl = h[1].length;
        if (lvl !== 2 && lvl !== 3) continue;

        var text = headingText(h[2]);
        out.push({ level: lvl, text: text, id: uniqueSlug(slugify(text), used) });
      }
    } catch (e) {
      return out; // 목차가 비는 것은 참을 수 있다. 크래시는 안 된다.
    }
    return out;
  }

  global.MD = { render: render, headings: headings };
})(typeof window !== 'undefined' ? window : this);

변식 명시, 중간 출력"}]},{"id":"graph","num":"Part IV","title":"그래프 탐색","desc":"맵·의존성·상태공간을 전부 그래프로 보는 훈련. 격자 최단경로의 원형이 여기에 있다.","chapters":[{"id":"iv-1","num":"IV-1","title":"그래프 표현","desc":"인접 행렬·인접 리스트·암묵 그래프. 맵과 의존성과 상태공간을 그래프로 보기"},{"id":"iv-2","num":"IV-2","title":"DFS","desc":"연결 요소, 사이클 검출"},{"id":"iv-3","num":"IV-3","title":"BFS와 최단 거리","desc":"격자 최단경로의 원형"},{"id":"iv-4","num":"IV-4","title":"0-1 BFS와 다중 시작점 BFS","desc":"여러 소스에서 동시에 번지는 확산"},{"id":"iv-5","num":"IV-5","title":"플러드필과 연결 요소 라벨링","desc":"비전의 blob 검출"},{"id":"iv-6","num":"IV-6","title":"위상 정렬","desc":"빌드 시스템과 작업 의존성 스케줄링"},{"id":"iv-7","num":"IV-7","title":"이분 그래프·사이클 판정","desc":"자원 충돌 검사"},{"id":"iv-8","num":"IV-8","title":"트리에서의 DFS","desc":"서브트리 크기와 깊이"}]},{"id":"shortest-path","num":"Part V","title":"최단경로 계보","desc":"왼쪽 끝은 코딩테스트, 오른쪽 끝은 다중 로봇 관제다. 끊지 않고 간다. 이 책의 척추.","chapters":[{"id":"v-1","num":"V-1","title":"다익스트라","desc":"가중 그래프의 최단경로. 힙이 그 엔진이다"},{"id":"v-2","num":"V-2","title":"벨만-포드와 음수 간선","desc":"음수 사이클을 검출한다"},{"id":"v-3","num":"V-3","title":"플로이드-워셜","desc":"모든 쌍 최단경로를 3중 루프로"},{"id":"v-4","num":"V-4","title":"DP와 최단경로는 같은 것이다","desc":"벨만 방정식, 최적 부분구조, 세 알고리즘이 같은 점화식의 다른 순회 순서임을 보이기"},{"id":"v-5","num":"V-5","title":"A*","desc":"휴리스틱의 정의, admissible과 consistent, 다익스트라가 h=0인 A*임을 보이기"},{"id":"v-6","num":"V-6","title":"A* 변형","desc":"Weighted A*로 최적성을 속도와 교환한다. JPS, Theta*/Any-angle"},{"id":"v-7","num":"V-7","title":"D* Lite","desc":"LPA*에서 출발해, 장애물을 발견했을 때 영향 구간만 다시 푼다"},{"id":"v-8","num":"V-8","title":"시공간 A*와 예약 테이블","desc":"시간 축을 상태에 추가한다. 서로의 미래 위치를 피하는 방법"},{"id":"v-9","num":"V-9","title":"CBS와 우선순위 기반 계획","desc":"다중 에이전트 경로 계획(MAPF)"},{"id":"v-10","num":"V-10","title":"교착 검출과 회피","desc":"자원 할당 그래프의 사이클 검출, 은행가 알고리즘, 교차로 상호배제, 라이브락"},{"id":"v-11","num":"V-11","title":"할당 문제","desc":"헝가리안 알고리즘, auction, 탐욕적 할당의 한계"},{"id":"v-12","num":"V-12","title":"지역 경로계획","desc":"전역과 지역의 역할 분담, DWA와 TEB의 원리, 코스트맵 인플레이션"},{"id":"v-13","num":"V-13","title":"샘플링 기반 계획","desc":"RRT, RRT*, PRM. 격자가 불가능한 고차원 구성 공간"},{"id":"v-14","num":"V-14","title":"계보 총정리","desc":"한 장의 지도와 상황별 선택 기준"}]},{"id":"greedy","num":"Part VI","title":"그리디·구간 기법","desc":"탐욕이 성립하는 조건을 증명으로 다루고, 구간을 상수 시간에 다루는 기법을 모은다.","chapters":[{"id":"vi-1","num":"VI-1","title":"그리디가 성립하는 조건","desc":"교환 논법"},{"id":"vi-2","num":"VI-2","title":"구간 스케줄링·회의실 배정","desc":"실무의 자원 예약"},{"id":"vi-3","num":"VI-3","title":"투 포인터와 슬라이딩 윈도우","desc":"포인터가 되돌아가지 않아도 되는 조건"},{"id":"vi-4","num":"VI-4","title":"누적 합과 차분 배열","desc":"그리드 구간 갱신"},{"id":"vi-5","num":"VI-5","title":"좌표 압축","desc":"값의 크기가 아니라 순서만 필요할 때"},{"id":"vi-6","num":"VI-6","title":"스위핑","desc":"정렬된 이벤트를 한 방향으로 훑는다"}]},{"id":"binsearch","num":"Part VII","title":"이분 탐색","desc":"정렬된 배열을 넘어 \"답 자체를 이분 탐색한다\"는 발상까지. 경계 조건이 전부다.","chapters":[{"id":"vii-1","num":"VII-1","title":"정렬된 배열에서의 이분 탐색","desc":"경계 조건 완전 정복"},{"id":"vii-2","num":"VII-2","title":"lower_bound / upper_bound / bisect","desc":"표준 라이브러리가 이미 답인 경우"},{"id":"vii-3","num":"VII-3","title":"매개변수 탐색","desc":"\"답을 이분 탐색한다\"는 발상"},{"id":"vii-4","num":"VII-4","title":"실수 이분 탐색과 종료 조건","desc":"몇 번 돌려야 충분한가"},{"id":"vii-5","num":"VII-5","title":"이분 탐색 + 그리디 결합 유형","desc":"판정 함수를 그리디로 짠다"}]},{"id":"dp","num":"Part VIII","title":"동적 계획법","desc":"상태 정의 → 점화식 → 초기값 → 계산 순서. 이 절차가 전부다. 실패도 상태 정의에서 난다.","chapters":[{"id":"viii-1","num":"VIII-1","title":"DP 사고 절차","desc":"상태 정의 → 점화식 → 초기값 → 계산 순서"},{"id":"viii-2","num":"VIII-2","title":"메모이제이션 vs 타뷸레이션","desc":"위에서 내려올 것인가, 아래에서 쌓을 것인가"},{"id":"viii-3","num":"VIII-3","title":"1차원 DP","desc":"계단, 타일링, 최대 부분합"},{"id":"viii-4","num":"VIII-4","title":"2차원 DP","desc":"격자 경로, 편집 거리"},{"id":"viii-5","num":"VIII-5","title":"배낭 문제","desc":"0/1, 무한, 부분합"},{"id":"viii-6","num":"VIII-6","title":"LIS와 LCS","desc":"이분 탐색과 결합되는 지점"},{"id":"viii-7","num":"VIII-7","title":"구간 DP","desc":"구간을 쪼개는 순서가 곧 상태다"},{"id":"viii-8","num":"VIII-8","title":"트리 DP","desc":"자식에서 부모로 값을 올린다"},{"id":"viii-9","num":"VIII-9","title":"비트마스크 DP","desc":"외판원 순회(TSP), 다중 지점 순회 최적화"},{"id":"viii-10","num":"VIII-10","title":"DP 최적화 입문","desc":"슬라이딩 윈도우·누적합과의 결합"},{"id":"viii-11","num":"VIII-11","title":"DP 상태 정의 실패 사례집","desc":"상태가 부족하면 무엇이 먼저 깨지는가"}]},{"id":"advanced","num":"Part IX","title":"고급 자료구조·문자열","desc":"구간·집합·문자열을 로그 시간에 다루는 자료구조들. 실무 연결이 특히 진한 구간.","chapters":[{"id":"ix-1","num":"IX-1","title":"유니온 파인드","desc":"연결 요소 라벨링, 맵 병합"},{"id":"ix-2","num":"IX-2","title":"세그먼트 트리와 lazy propagation","desc":"구간 집계와 구간 갱신"},{"id":"ix-3","num":"IX-3","title":"펜윅 트리(BIT)","desc":"세그먼트 트리보다 짧고 빠른 경우"},{"id":"ix-4","num":"IX-4","title":"최소 신장 트리","desc":"크루스칼과 프림. 로드맵·토폴로지 맵 생성, 네트워크 설계"},{"id":"ix-5","num":"IX-5","title":"LCA와 희소 배열","desc":"좌표 프레임 트리의 공통 조상"},{"id":"ix-6","num":"IX-6","title":"트라이","desc":"명령어 자동완성, IP 라우팅 테이블"},{"id":"ix-7","num":"IX-7","title":"문자열 매칭","desc":"KMP, 라빈-카프. 로그 스캔과 grep의 정체"},{"id":"ix-8","num":"IX-8","title":"네트워크 플로우 입문","desc":"최대 유량, 이분 매칭. 작업 할당과 이어진다"}]},{"id":"math","num":"Part X","title":"수학·기하","desc":"정수론·조합론·기하. 부동소수점이 왜 배신하는지까지 끝낸다.","chapters":[{"id":"x-1","num":"X-1","title":"정수론","desc":"GCD/LCM, 유클리드 호제법"},{"id":"x-2","num":"X-2","title":"소수","desc":"에라토스테네스의 체, 소인수분해"},{"id":"x-3","num":"X-3","title":"모듈러 연산과 분할 정복 거듭제곱","desc":"나머지 연산의 규칙과 빠른 거듭제곱"},{"id":"x-4","num":"X-4","title":"조합론 기초","desc":"이항계수, 중복 조합, 포함배제"},{"id":"x-5","num":"X-5","title":"기하","desc":"CCW, 선분 교차, 다각형 내부 판정. 충돌 검사의 기초"},{"id":"x-6","num":"X-6","title":"볼록 껍질","desc":"로봇 footprint 생성"},{"id":"x-7","num":"X-7","title":"부동소수점의 함정","desc":"왜 ==로 비교하면 안 되는가, EPS 정하는 법, 정수로 우회하기"}]},{"id":"realtime","num":"Part XI","title":"실무 자료구조와 동시성","desc":"메모리 안이 아니라 시간 축 위에서 도는 자료구조. 동시성과 실시간 제약이 기준을 바꾼다.","chapters":[{"id":"xi-1","num":"XI-1","title":"링 버퍼(원형 큐)","desc":"센서 스트림, 로그 버퍼, 오버런 정책"},{"id":"xi-2","num":"XI-2","title":"생산자-소비자와 유계 큐","desc":"제어 루프와 통신 스레드를 분리한다"},{"id":"xi-3","num":"XI-3","title":"락과 락프리","desc":"뮤텍스, 조건변수, 원자적 연산, 메모리 순서, SPSC 락프리 큐"},{"id":"xi-4","num":"XI-4","title":"스레드 풀과 작업 큐","desc":"병렬 이미지 처리, 워크 스틸링"},{"id":"xi-5","num":"XI-5","title":"실시간 스케줄링 개념","desc":"우선순위, RM/EDF, 우선순위 역전"},{"id":"xi-6","num":"XI-6","title":"상태 기계","desc":"FSM, 계층적 FSM, Behavior Tree. 작업 오더 상태머신"},{"id":"xi-7","num":"XI-7","title":"이벤트 루프와 백프레셔","desc":"메시지 폭주로부터 시스템을 지키는 법"},{"id":"xi-8","num":"XI-8","title":"타이머 휠과 지연 큐","desc":"타임아웃과 재시도"},{"id":"xi-9","num":"XI-9","title":"공간 인덱스","desc":"그리드 해싱, KD 트리, 옥트리, R 트리. 최근접 탐색과 충돌 검사"},{"id":"xi-10","num":"XI-10","title":"그래프의 메모리 표현","desc":"CSR, 인접 리스트와 행렬의 실제 비용"},{"id":"xi-11","num":"XI-11","title":"순환 참조와 소유권","desc":"그래프 자료구조의 메모리 관리, 스마트 포인터 사이클"}]},{"id":"patterns","num":"Part XII","title":"설계 패턴","desc":"카탈로그를 나열하지 않는다. 실제 시스템에서 그 패턴이 박혀 있는 지점을 먼저 보이고 이름은 나중에 붙인다.","chapters":[{"id":"xii-1","num":"XII-1","title":"패턴을 왜 배우는가","desc":"이름 붙이기의 힘과 남용의 위험"},{"id":"xii-2","num":"XII-2","title":"Adapter","desc":"이기종 장비 프로토콜 변환 계층"},{"id":"xii-3","num":"XII-3","title":"Facade / Bridge / Proxy","desc":"서브시스템 단일 창구, 원격 객체 프록시, 지연 로딩"},{"id":"xii-4","num":"XII-4","title":"Decorator / Composite","desc":"Behavior Tree 노드 합성, 레이어 중첩, 미들웨어 체인"},{"id":"xii-5","num":"XII-5","title":"Factory Method / Abstract Factory / Builder","desc":"드라이버·플러그인 생성, 설정 기반 객체 조립"},{"id":"xii-6","num":"XII-6","title":"Strategy","desc":"경로 플래너·컨트롤러 교체, 압축·인코딩 교체"},{"id":"xii-7","num":"XII-7","title":"Observer / Publish-Subscribe","desc":"토픽·이벤트 버스·메시지 브로커의 정체, 콜백 지옥과 그 해법"},{"id":"xii-8","num":"XII-8","title":"State","desc":"작업 오더 상태머신. if-else 지옥과 상태 객체"},{"id":"xii-9","num":"XII-9","title":"Command","desc":"즉시 액션, 작업 큐, 실행 취소와 재시도"},{"id":"xii-10","num":"XII-10","title":"Template Method / Chain of Responsibility","desc":"알고리즘 골격 고정, 에러 핸들러 체인, 미들웨어"},{"id":"xii-11","num":"XII-11","title":"Mediator","desc":"트래픽 매니저. 개체끼리 직접 말하지 않고 중재자를 통한다"},{"id":"xii-12","num":"XII-12","title":"Singleton과 그 함정","desc":"제어 소프트웨어에서 싱글톤이 재앙이 되는 경로, 테스트 불가능성"},{"id":"xii-13","num":"XII-13","title":"동시성 패턴","desc":"Active Object, Reactor, Monitor, Half-Sync/Half-Async"},{"id":"xii-14","num":"XII-14","title":"아키텍처 패턴","desc":"계층형(Sense-Plan-Act), 포트&어댑터, 플러그인 아키텍처, 블랙보드, 파이프-필터"},{"id":"xii-15","num":"XII-15","title":"안티패턴","desc":"God Object, 싱글톤 남용, 스마트 UI, 순환 의존, 조기 추상화"},{"id":"xii-16","num":"XII-16","title":"패턴 선택 결정 트리","desc":"Part I과 같은 형식으로 접는다"}]},{"id":"perception","num":"Part XIII","title":"상태추정·인지 알고리즘","desc":"센서 값에서 상태를 복원하는 알고리즘. 자료구조 대신 확률과 최적화가 뼈대를 이룬다.","chapters":[{"id":"xiii-1","num":"XIII-1","title":"점유 격자 지도와 로그 오즈 갱신","desc":"확률을 덧셈으로 바꾸는 표현"},{"id":"xiii-2","num":"XIII-2","title":"베이즈 필터의 뼈대","desc":"예측과 보정, 두 단계가 전부다"},{"id":"xiii-3","num":"XIII-3","title":"칼만 필터와 EKF","desc":"수식 최소화, 직관 우선"},{"id":"xiii-4","num":"XIII-4","title":"파티클 필터","desc":"샘플로 분포를 대신한다"},{"id":"xiii-5","num":"XIII-5","title":"ICP","desc":"점군 정합"},{"id":"xiii-6","num":"XIII-6","title":"RANSAC","desc":"이상치에 강건한 모델 추정"},{"id":"xiii-7","num":"XIII-7","title":"포즈 그래프 최적화와 루프 클로저","desc":"누적 오차를 한 번에 되돌린다"},{"id":"xiii-8","num":"XIII-8","title":"이미지 기본 연산","desc":"컨볼루션, 형태학, 엣지"},{"id":"xiii-9","num":"XIII-9","title":"허프 변환과 특징점(ORB) 매칭","desc":"선을 찾고 대응점을 찾는다"}]},{"id":"scale","num":"Part XV","title":"시스템 규모의 자료구조","desc":"\"메모리에 다 들어간다\"는 가정이 깨지는 순간 무엇이 달라지는가. 코딩테스트에는 안 나오고 실무 시스템에는 전부 들어 있다.","chapters":[{"id":"xv-1","num":"XV-1","title":"메모리를 벗어나는 순간","desc":"캐시 계층, 페이지, 블록 I/O. 왜 인메모리 자료구조가 디스크에서 무너지는가"},{"id":"xv-2","num":"XV-2","title":"B-Tree와 B+Tree","desc":"높이를 낮춰 디스크 읽기 횟수를 줄인다. 관계형 DB 인덱스, 파일시스템"},{"id":"xv-3","num":"XV-3","title":"LSM Tree와 SSTable","desc":"쓰기를 순차화한다. RocksDB, LevelDB, Cassandra, 시계열 DB"},{"id":"xv-4","num":"XV-4","title":"블룸 필터와 쿠쿠 필터","desc":"거짓양성을 허용하고 공간을 줄인다. SSTable 스킵, 크롤러 중복 제거"},{"id":"xv-5","num":"XV-5","title":"스킵 리스트","desc":"확률로 균형을 잡는다. Redis Sorted Set, 동시성 인덱스"},{"id":"xv-6","num":"XV-6","title":"카디널리티·빈도 추정","desc":"HyperLogLog, Count-Min Sketch. 유니크 방문자 수, 핫키 검출"},{"id":"xv-7","num":"XV-7","title":"머클 트리와 해시 체인","desc":"부분만 비교해 차이를 찾는다. Git 오브젝트 그래프, 복제본 동기화"},{"id":"xv-8","num":"XV-8","title":"일관성 해싱","desc":"노드가 늘고 줄 때 재배치를 최소화한다. 샤딩, 분산 캐시, 로드 밸런서"},{"id":"xv-9","num":"XV-9","title":"캐시 교체 정책","desc":"LRU/LFU/ARC/W-TinyLFU를 직접 구현하고 히트율을 비교한다"},{"id":"xv-10","num":"XV-10","title":"레이트 리미팅","desc":"토큰 버킷, 리키 버킷, 슬라이딩 윈도우. API 게이트웨이와 백프레셔"},{"id":"xv-11","num":"XV-11","title":"복제와 합의 입문","desc":"왜 어려운가, Raft의 뼈대, 벡터 클럭, CRDT"},{"id":"xv-12","num":"XV-12","title":"메모리에 안 들어가는 데이터 처리","desc":"외부 정렬, 병합 전략, 스트리밍 집계, MapReduce의 자료구조적 정체"}]},{"id":"wrapup","num":"Part XIV","title":"종합","desc":"전 Part를 한 장의 지도로 접는다. 항상 마지막에 온다.","chapters":[{"id":"xiv-1","num":"XIV-1","title":"실전 체크리스트","desc":"시험장과 실무에서 그대로 꺼내 쓰는 목록"},{"id":"xiv-2","num":"XIV-2","title":"기술 면접 CS 총정리","desc":"전 Part의 면접 상자를 한곳에 모은다"},{"id":"xiv-3","num":"XIV-3","title":"시스템 설계형 질문 대비","desc":"자료구조 선택으로 답하는 뼈대"},{"id":"xiv-4","num":"XIV-4","title":"알고리즘 계보 한 장 지도","desc":"BFS에서 CBS까지, 해시에서 HyperLogLog까지"}]}],"docs":{"0-1":"# 0-1 이 책 읽는 법\n\n::: lead\n이 책을 어느 순서로, 어떤 속도로, 무엇을 손으로 하면서 읽을 것인가.\n:::\n\n## 1. 문제\n\n알고리즘 자료를 끝까지 읽고도 문제 앞에서 멈추는 일이 흔하다. BFS 설명을 읽으면 전부 이해된다. 큐를 쓰고, 방문 배열을 두고, 거리가 1씩 늘어난다. 그런데 새 문제를 받으면 두 가지 중 하나가 일어난다. **이게 BFS 문제인지 모르거나, BFS인 줄 알면서도 못 짠다.**\n\n두 실패는 원인이 다르고 처방도 다르다.\n\n- **알아보지 못한다.** 지식이 아니라 **매핑**의 문제다. 머릿속에 알고리즘은 있는데 지문에서 그 알고리즘으로 가는 길이 없다. 이 책이 Part I을 자료구조보다 앞에 둔 이유다.\n- **알면서 못 짠다.** 읽을 때는 코드가 상태를 대신 들고 있었고, 짤 때는 그 상태를 머리가 들어야 한다. 실행 모델이 없는 것이다. 이 책이 코드보다 손추적을 먼저 요구하는 이유다.\n\n여기에 세 번째 실패가 겹친다. **한 달 뒤에 사라진다.** 알고리즘은 안 쓰면 즉시 휘발한다. 그리고 휘발하는 것은 \"BFS가 무엇인가\"가 아니라 \"이 지문이 BFS인가\"다. 정의는 남고 판별이 먼저 죽는다.\n\n이 책의 구조는 이 세 실패를 각각 겨냥한다. 그래서 **읽는 방식이 결과를 바꾼다.** 처음부터 순서대로 읽는 것은 대개 최선이 아니다.\n\n## 2. 세 가지 경로\n\n목적이 다르면 읽는 순서가 다르다. 세 경로 중 하나를 고르고, 고른 경로를 끝까지 유지하라.\n\n### 2.1 코테 급행\n\n**목표가 정해진 기간 안에 코딩테스트를 통과하는 것일 때.** 실무 파트를 전부 건너뛴다.\n\n```text nolines\n   Part 0  ->  Part I  ->  II  ->  III  ->  IV  ->  VII  ->  VI  ->  VIII  ->  V(1-4)  ->  IX  ->  X\n     |          |                                                      |\n     |          |                                                      +-- 다익스트라까지만. A* 이후는 나중에\n     |          +-- 여기가 병목이다. 건너뛰지 마라\n     +-- 전부 읽지 말고 §3.1 의 최소 세트만\n```\n\n순서에 두 가지 결정이 들어 있다.\n\n**이분 탐색(VII)이 그리디(VI)보다 앞이다.** 이분 탐색은 판별이 기계적이다. \"N이 10억인데 답이 수 하나\"면 거의 확정이고, 매개변수 탐색은 신호어가 뚜렷하다. 반면 그리디는 **성립 조건을 증명해야** 하고, 성립하지 않는 경우가 DP다. 판별이 쉬운 것부터 채우는 편이 초반 정답률을 빨리 올린다.\n\n**최단경로는 V-4까지만 간다.** 다익스트라·벨만포드·플로이드워셜은 코딩테스트 범위이고, A\\* 이후는 아니다. 다만 [V-4 DP와 최단경로는 같은 것이다](#/v-4)는 건너뛰지 마라. DP와 그래프를 한 덩어리로 붙이는 챕터라 VIII의 이해가 여기서 달라진다.\n\n### 2.2 실무 급행\n\n**목표가 시스템을 설계하고 기술 면접에서 설명하는 것일 때.** 문제 풀이 훈련을 줄이고 구조로 간다.\n\n```text nolines\n   Part 0(축약)  ->  II  ->  IV  ->  XII  ->  XI  ->  XV  ->  V(5-14)  ->  IX  ->  XIV\n                     |               |         |      |        |\n                     |               |         |      |        +-- 경로계획 계보\n                     |               |         |      +-- B-Tree, LSM, 블룸 필터, 일관성 해싱\n                     |               |         +-- 링버퍼, 락, 스케줄링, 상태 기계\n                     |               +-- 설계 패턴. 알고리즘과 독립이라 언제 넣어도 된다\n                     +-- 자료구조가 전제다. 트리와 해시 없이 XV 는 안 읽힌다\n```\n\n[Part XV 시스템 규모의 자료구조](#/xv-1)를 Part II 앞에 두려는 유혹이 있다. B-Tree가 더 재미있어 보이기 때문이다. 하지만 B-Tree는 **이진 탐색 트리의 높이를 낮춘 것**이고 LSM은 **정렬된 배열의 병합**이며 일관성 해싱은 **해시 테이블의 재배치 문제**다. 밑바닥 없이 읽으면 이름만 남는다. 이 책이 존재하는 이유가 바로 그 연결이므로, 순서를 뒤집으면 책의 값어치가 사라진다.\n\n### 2.3 완주\n\n**목표가 둘 다일 때.** 목차 순서를 그대로 따르되, 두 지점에서만 예외를 둔다.\n\n- **Part 0은 통독하지 않는다.** 필요할 때 돌아오는 레퍼런스다(§3.1).\n- **Part XII(설계 패턴)는 아무 때나 끼워 넣는다.** 알고리즘 학습과 독립적이라 진도가 막힐 때 기분 전환으로 읽어도 손해가 없다.\n\n::: tip\n경로를 고르는 기준은 흥미가 아니라 **마감**이다. 마감이 있으면 코테 급행, 없으면 완주다. 마감이 있는데 완주를 고르면 절반에서 멈추고, 그 절반은 시험 범위와 겹치지 않는 쪽일 확률이 높다.\n:::\n\n## 3. 이 책의 장치들\n\n### 3.1 Part 0은 사전이다\n\n[Part 0](#/0-2)은 처음부터 끝까지 읽는 곳이 아니다. 알고리즘을 짜다가 막힌 자리에서 돌아오는 곳이다. 다만 **시작 전에 반드시 읽어야 하는 최소 세트**가 있다.\n\n| 먼저 | 이유 |\n|---|---|\n| [0-9 N 범위로 알고리즘 역산하기](#/0-9) | 이걸 모르면 유형 판별이 시작되지 않는다. 제약조건이 후보를 절반으로 줄인다 |\n| [0-11 손추적 방법론](#/0-11) | 이 책의 모든 `::: trace` 상자가 이 절차를 전제한다 |\n| 쓰는 언어 쪽 입출력 한 챕터 | Python이면 [0-2](#/0-2), C++이면 [0-5](#/0-5). 입출력이 막히면 아무것도 제출할 수 없다 |\n\n나머지는 본문에서 처음 만났을 때 배운다. 표준 라이브러리 함수가 본문에 처음 나오면 그 자리에 정의가 붙는다.\n\n```text nolines\n   📖 heapq.heappush(heap, item)      <- 시그니처\n      최소 힙에 원소 삽입. O(log n).   <- 의미와 비용\n      쓰는 곳: 다익스트라(V-1)         <- 어디서 만나는가\n      C++ 대응: std::priority_queue    <- 반대 언어\n```\n\n이 상자를 만나면 진도를 멈출 필요가 없다. **더 깊이 파고 싶을 때만** Part 0의 해당 챕터로 간다. `sort()`가 안정 정렬이라는 사실은 본문에서 배우고, Timsort가 런을 어떻게 병합하는지는 [0-4](#/0-4)에 있다.\n\n### 3.2 두 언어를 동시에 본다\n\n모든 구현은 `::: dual` 상자 안에서 Python과 C++ 탭으로 나뉜다. 두 코드는 **같은 알고리즘, 같은 변수명, 같은 줄 구조**다. 상단의 언어 토글로 한쪽만 보이게 할 수 있고, 기본값은 둘 다다.\n\n한쪽만 쓸 계획이어도 **반대쪽 탭을 닫지 마라.** 두 언어를 나란히 두는 목적은 두 언어를 배우는 것이 아니라 **알고리즘과 언어를 분리해서 보는 것**이다. 같은 줄이 두 언어에서 다르게 생겼을 때, 다른 부분이 언어이고 같은 부분이 알고리즘이다.\n\n가장 위험한 것은 \"비슷해 보이는데 다른 것\"이다. 코드 아래 **언어 차이 표**가 붙는 지점이 정확히 거기다.\n\n| 항목 | Python | C++ |\n|---|---|---|\n| 힙 기본 방향 | `heapq`는 최소 힙 고정 | `priority_queue`는 최대 힙 기본 |\n| 정수 오버플로 | 없다 | `int`는 넘친다 |\n| 나눗셈 | `//`는 내림 | `/`는 0 방향 절삭 |\n| 정렬 안정성 | `sort()` 안정 | `std::sort` 불안정 |\n\n네 줄 전부 **부호가 반대**다. 언어를 오갈 때 무너지는 것은 지식이 아니라 습관이다.\n\n### 3.3 손추적이 코드보다 먼저다\n\n모든 알고리즘 챕터는 **문제 → 아이디어 → 구현** 순서다. 그리고 아이디어와 구현 사이에 `::: trace` 상자가 있다. 입력과 상태 표의 앞 두세 행만 채워져 있고, 나머지는 빈칸이다.\n\n**빈칸을 채우고 나서 코드를 봐라.** 순서를 지키지 않으면 이 책은 다른 자료와 같아진다.\n\n이유는 §1의 두 번째 실패에 있다. 코드를 먼저 보면 그 코드가 상태를 대신 들어 준다. 읽으면 이해되고, 이해됐다고 느끼고, 빈 화면 앞에서 멈춘다. 표를 먼저 채우면 상태를 **당신이** 들게 된다. 그 상태가 곧 실행 모델이고, 실행 모델이 있어야 짤 수 있다.\n\n::: warn\n\"표를 채우는 게 귀찮으니 눈으로 따라가겠다\"는 선택지가 늘 있다. 눈으로 따라가는 것과 손으로 쓰는 것의 차이는 **틀렸을 때 드러나느냐**다. 머릿속에서는 `lo`가 슬쩍 맞는 값으로 바뀌어 있어도 아무도 모른다. 종이 위에서는 그 줄이 남는다.\n\n비용도 싸다. 이분 탐색은 원소 여섯 개면 세 스텝이다. 표 세 줄이 열 번의 제출을 대체한다.\n:::\n\n### 3.4 손으로 짜는 원칙\n\n손추적이 종이 위의 규율이라면, 손으로 짜는 것은 키보드 위의 규율이다. 셋으로 압축된다.\n\n**첫째, 복사하지 않는다.** 이 책의 `::: dual` 상자에는 복사 버튼이 있다. 실행해서 출력을 확인하는 용도지 제출용이 아니다. 같은 코드를 처음부터 타이핑하면 세미콜론과 인덱스와 초기값을 전부 한 번씩 결정하게 되고, **결정한 것만 기억에 남는다.** 복사한 코드는 읽은 코드이지 짠 코드가 아니다.\n\n**둘째, 실행 전에 예상 출력을 적는다.** 돌리기 전에 \"이 입력이면 3이 나온다\"를 먼저 적어 두라. 맞으면 실행 모델이 맞은 것이고, 틀리면 **모델과 코드 중 어느 쪽이 틀렸는지**를 그 자리에서 알 수 있다. 적어 두지 않고 돌리면 출력이 무엇이든 \"아 그렇구나\"가 되어 아무것도 검증되지 않는다.\n\n**셋째, 통과한 뒤에 한 번 더 짠다.** 정답을 맞힌 문제를 다음 날 빈 화면에서 다시 짜 보는 것이 이 책이 요구하는 유일한 반복 훈련이다. 두 번째 구현은 대개 절반의 시간이 걸리고, 그 차이가 곧 첫 번째에서 **찾느라** 쓴 시간이다.\n\n::: note\n\"타이핑은 시간 낭비 아닌가\"라는 반문이 나온다. 목표가 코드를 얻는 것이라면 맞다. 목표가 **다음에 빈 화면 앞에서 짜는 것**이라면 정반대다. 복사한 코드가 통과한 순간 얻은 것은 채점 결과 한 줄이고, 타이핑한 코드가 통과한 순간 얻은 것은 결정 스무 개다.\n:::\n\n### 3.5 정답 코드는 싣지 않는다\n\n각 챕터의 `::: quiz`에는 대표문제 3~5개가 번호·제목·난도로 실린다. **정답 코드는 없다.** 대신 세 가지가 있다.\n\n1. 어떤 신호로 이 유형임을 알아채는가\n2. 상태를 무엇으로 정의하는가\n3. 왜 이 자료구조인가\n\n목적이 사고과정의 이식이지 코드 암기가 아니기 때문이다. 답이 보이는 순간 사고과정은 죽는다. 코드가 있으면 읽고 넘어가게 되고, 읽고 넘어간 것은 남지 않는다.\n\n### 3.6 유형 판별 상자는 역방향 색인이다\n\n알고리즘 챕터 끝의 `::: classify` 상자는 그 알고리즘을 **거꾸로** 찾는 장치다.\n\n```text nolines\n   ::: classify\n   - 신호어:      \"최소 이동 횟수\", \"몇 번 만에\"\n   - 제약조건:    간선 가중치가 전부 1, 정점 <= 10^5\n   - 혼동 주의:   가중치가 다르면 -> 다익스트라(V-1)\n   - 반례 함정:   시작점이 여러 개면 다중 시작 BFS(IV-4)\n   :::\n```\n\n챕터를 정방향으로 읽으면 \"BFS는 이렇게 동작한다\"이고, 이 상자를 역방향으로 읽으면 \"이런 지문이면 BFS다\"이다. **후자가 실전에서 필요한 방향이다.** 이 상자들은 자동으로 수집되어 [Part I](#/i-1)의 결정 트리 부록과 플래시카드 덱이 된다.\n\n## 4. 복습을 설계에 넣는다\n\n### 4.1 무엇이 휘발하는가\n\n§1의 세 번째 실패로 돌아온다. 한 달 뒤에 남는 것과 사라지는 것은 정해져 있다.\n\n| 남는 것 | 사라지는 것 |\n|---|---|\n| \"BFS는 큐를 쓴다\" | \"이 지문이 BFS다\" |\n| \"DP는 점화식을 세운다\" | \"이 문제의 상태를 무엇으로 잡는가\" |\n| \"세그먼트 트리는 구간 쿼리용\" | \"누적 합으로 될 일인지 세그먼트 트리가 필요한 일인지\" |\n\n왼쪽은 한 문장이라 안 잊는다. 오른쪽은 **판단**이라서 반복하지 않으면 죽는다. 그래서 이 책의 복습 큐는 챕터 단위가 아니라 **`::: classify`와 `::: quiz` 항목 단위**로 스케줄링한다. \"0-4를 읽었다\"를 복습하는 것은 의미가 없고, \"이 제약조건을 보고 어떤 알고리즘을 떠올렸는가\"를 복습하는 것이 의미가 있다.\n\n### 4.2 복습 큐 쓰는 법\n\n앱 홈에 **\"오늘 복습할 N개\"** 진입점이 있다. 항목 하나가 뜨면 앞면은 지문 요약과 제약조건이고, 답을 떠올린 뒤 뒤집으면 알고리즘 이름과 근거 한 줄이 나온다. 그리고 네 단계로 평가한다.\n\n| 평가 | 뜻 | 다음 등장 |\n|---|---|---|\n| 모름 | 답을 못 떠올렸다 | 오늘 다시 |\n| 어려움 | 떠올렸지만 오래 걸렸다 | 간격이 줄어든다 |\n| 보통 | 떠올렸다 | 간격이 늘어난다 |\n| 쉬움 | 즉시 떠올렸다 | 간격이 크게 늘어난다 |\n\n간격은 SM-2 알고리즘으로 정해진다. 맞힐수록 간격이 배수로 늘고, 틀리면 처음으로 돌아간다. 상태는 브라우저의 `localStorage`에 저장되므로 서버도 계정도 필요 없다. 대신 **브라우저를 지우면 진도도 지워진다.**\n\n::: danger\n평가를 정직하게 하지 않으면 복습 큐는 즉시 무용지물이 된다. \"쉬움\"을 남발하면 간격이 폭발적으로 늘어 정작 필요한 항목이 몇 달 뒤로 밀린다.\n\n기준은 하나다. **답이 즉시 떠올랐는가.** 뒷면을 보고 \"아 맞다\"라고 생각했다면 그것은 \"모름\"이다. 재인(recognition)과 회상(recall)은 다른 능력이고, 시험장에서 필요한 것은 회상이다.\n:::\n\n### 4.3 폰에서 읽기\n\n`build.py --single`이 만드는 `algobook.html` 한 파일에 본문·위젯·검색이 전부 들어 있다. 외부 의존성이 0이라 파일 하나만 옮기면 오프라인에서 그대로 돈다. 위젯도 살아 있다.\n\n`::: classify` 상자는 Anki용 CSV로도 나간다(`dist/anki/`). 이동 중 복습은 이쪽이 편하다. 다만 **덱을 두 벌 굴리지 마라.** 앱의 복습 큐와 Anki 중 하나만 쓴다. 두 곳에 진도가 갈라지면 어느 쪽도 믿을 수 없게 된다.\n\n## 5. 진도가 막혔을 때\n\n막히는 지점은 대개 정해져 있고, 처방도 정해져 있다.\n\n**\"지문을 읽어도 무슨 유형인지 모르겠다.\"** 정상이고, 그것이 병목이다. [I-2 제약조건 역산법](#/i-2)으로 가서 지문보다 N을 먼저 읽는 습관부터 들여라. N이 10만이면 $O(n^2)$은 이미 탈락이고 후보가 절반으로 준다.\n\n**\"유형은 알겠는데 코드가 안 나온다.\"** 코드를 더 읽어도 나아지지 않는다. [0-11 손추적 방법론](#/0-11)의 표를 그려라. 짜지 못하는 이유는 대개 상태 정의가 안 끝났기 때문이고, 표를 그리면 무엇이 안 정해졌는지가 드러난다.\n\n**\"짰는데 틀렸다는데 어디가 틀렸는지 모르겠다.\"** [0-12 디버깅과 반례 찾기](#/0-12)의 브루트포스 대조와 랜덤 스트레스 테스트로 간다. 눈으로 코드를 다시 읽는 것은 가장 비효율적인 방법이다.\n\n**\"맞았는데 시간 초과다.\"** 알고리즘이 틀린 것과 상수가 큰 것은 다른 문제다. [0-9](#/0-9)로 복잡도를 먼저 역산해 보고, 복잡도가 맞는데 느리면 [0-10 언어별 상수와 TLE 대응](#/0-10)이다.\n\n::: note\n한 문제에 쓰는 시간의 상한을 정해 두는 편이 낫다. 30분 넘게 막히면 답을 보는 것이 아니라 **유형만 확인하고 다시 덮는다.** 유형을 알고도 못 짜는 것과 유형을 몰라서 못 짜는 것은 다른 훈련이 필요하고, 무엇이 막힌 것인지 모른 채 두 시간을 쓰면 둘 다 훈련되지 않는다.\n:::\n\n## 연습\n\n::: quiz\n읽기 전에 자기 상태를 정하는 문제다. 코드를 짜는 문제가 아니다.\n\n**1. 경로 결정.** 다음 세 상황에서 §2의 어느 경로를 고르고, 첫 세 챕터가 무엇인지 적어라.\n- (가) 6주 뒤 코딩테스트가 있고 그래프 문제를 한 번도 풀어 본 적이 없다\n- (나) 마감은 없고 B-Tree와 LSM이 어떻게 다른지 설명할 수 있게 되고 싶다\n- (다) 마감도 없고 목표도 둘 다다\n\n**2. 순서 판단.** [Part XV](#/xv-1)를 [Part II](#/ii-1)보다 먼저 읽으면 무엇을 잃는가. §2.2의 근거를 한 문장으로 다시 써라.\n\n**3. 복습 평가.** 복습 큐에 \"간선 가중치가 전부 1, 정점 10만, 최소 이동 횟수\"라는 앞면이 떴다. 뒷면을 보고 \"아 BFS였지\"라고 생각했다면 네 단계 중 무엇을 눌러야 하는가. 근거는 §4.2에 있다.\n\n**4. 상자 구분.** `::: trace`와 `::: classify`는 각각 §1의 어느 실패를 겨냥하는가. 둘의 순서를 바꾸면 왜 안 되는가.\n\n::: answer\n**1.** (가) 코테 급행. 0-9 → 0-11 → 언어별 입출력 한 챕터를 먼저 훑고 [I-1](#/i-1)로 간다. 그래프 경험이 없다는 것은 지식의 공백이지만, 6주라는 마감이 있으므로 판별 훈련을 뒤로 미루면 안 된다.\n(나) 실무 급행. Part 0 축약 → [II-6 해시](#/ii-6)·[II-9 이진 탐색 트리와 균형 트리](#/ii-9) → [IV](#/iv-1). B-Tree와 LSM의 차이는 결국 \"트리 높이를 낮췄나, 쓰기를 순차화했나\"이고 둘 다 밑바닥이 Part II다.\n(다) 완주. 목차 순서 그대로.\n\n**2.** B-Tree는 이진 탐색 트리의 높이를 낮춘 것이고 LSM은 정렬된 배열의 병합이며 일관성 해싱은 해시 테이블의 재배치다. 밑바닥을 모르면 **이름과 API만 남고 계보가 사라진다.** 그 계보가 이 책의 존재 이유다.\n\n**3.** \"모름\"이다. 뒷면을 보고 납득한 것은 재인이고, 앞면만 보고 떠올리는 것이 회상이다. 시험장에는 뒷면이 없다.\n\n**4.** `::: trace`는 \"알면서 못 짠다\"(실행 모델의 부재)를, `::: classify`는 \"알아보지 못한다\"(매핑의 실패)를 겨냥한다. 순서는 바꿀 수 없다. `::: classify`는 그 알고리즘을 **이미 이해한 상태**에서만 역방향 색인으로 기능한다. 동작을 모르는 채 \"이런 신호어면 BFS\"만 외우면 지문이 조금만 변형돼도 무너진다.\n:::\n:::\n\n## 요약\n\n- 알고리즘 학습의 실패는 셋으로 나뉜다. **알아보지 못한다**(매핑), **알면서 못 짠다**(실행 모델), **한 달 뒤 사라진다**(휘발). 이 책의 구조는 각각을 겨냥한다.\n- 경로는 셋이다. **코테 급행**은 실무 파트를 버리고 판별→기초→탐색→이분탐색→DP로, **실무 급행**은 자료구조 위에서 패턴·동시성·시스템 규모로, **완주**는 목차 순서다. 기준은 흥미가 아니라 마감이다.\n- **Part 0은 통독하지 않는다.** [0-9](#/0-9), [0-11](#/0-11), 쓰는 언어의 입출력 한 챕터만 먼저 읽고 나머지는 막혔을 때 돌아온다.\n- **`::: trace`를 채우고 나서 코드를 봐라.** 순서를 뒤집으면 코드가 상태를 대신 들어 주고, \"읽으면 이해되는데 못 짜는\" 상태가 그대로 재생산된다.\n- `::: dual`의 반대 언어 탭을 닫지 마라. **다른 부분이 언어이고 같은 부분이 알고리즘이다.** 언어 차이 표는 부호가 반대인 지점만 모아 둔 것이다.\n- 휘발하는 것은 정의가 아니라 **판단**이다. 그래서 복습 큐는 챕터가 아니라 `::: classify` 항목 단위로 돈다. 평가는 정직하게 하고, 재인은 회상이 아니다.\n- 막혔을 때의 처방은 정해져 있다. 유형을 모르면 [I-2](#/i-2), 못 짜면 [0-11](#/0-11), 틀렸으면 [0-12](#/0-12), 느리면 [0-9](#/0-9)와 [0-10](#/0-10)이다.\n\n**다음 절**: [0-2 Python 입출력과 기본 타입](#/0-2) — `input()`을 쓰면 왜 시간 초과가 나는지, 그리고 `[[0]*n]*m`이 왜 같은 행을 가리키는지.\n","0-2":"# 0-2 Python 입출력과 기본 타입\n\n::: lead\n알고리즘이 맞는데 시간 초과가 나는 자리는 대개 입출력이고, 답이 이상한 자리는 대개 리스트 초기화다.\n:::\n\n## 1. 문제\n\n정수 100만 개를 읽어 합을 구하는 문제가 있다. 복잡도는 $O(n)$이고, 이보다 나은 방법은 없다. 그런데 다음 코드가 시간 초과로 떨어진다.\n\n```python title=\"시간 초과가 나는 코드 (조각)\"\nn = int(input())\ntotal = 0\nfor _ in range(n):\n    total += int(input())\nprint(total)\n```\n\n알고리즘을 아무리 들여다봐도 고칠 곳이 없다. 고칠 곳은 알고리즘이 아니라 `input()`이다. 이 한 줄을 바꾸면 통과한다.\n\n같은 종류의 사고가 하나 더 있다. 3×2 격자를 만들어 한 칸만 바꿨는데 두 줄이 함께 바뀐다.\n\n```python title=\"답이 이상한 코드 (조각)\"\ngrid = [[0] * 3] * 2\ngrid[0][0] = 9\nprint(grid)          # [[9, 0, 0], [9, 0, 0]]  <- 두 행이 같이 바뀌었다\n```\n\n둘 다 알고리즘 지식으로는 잡히지 않는다. **언어가 실제로 무엇을 하는지**를 알아야 잡힌다. 이 챕터가 그 자리다.\n\n## 2. 입력이 병목이 되는 지점\n\n### 2.1 얼마나 차이 나는가\n\n정수 100만 줄(약 3.9MB)을 읽어 합을 구하는 데 걸리는 시간이다.\n\n::: perf\n| 방식 | 시간 | 배수 |\n|---|---|---|\n| `input()` | 1.105초 | 기준 |\n| `sys.stdin.readline` | 0.289초 | **3.8배 빠름** |\n| `sys.stdin.buffer.read().split()` | 0.331초 | 3.3배 빠름 |\n| (참고) C++ `cin` 기본값 | 0.186초 | |\n| (참고) C++ `cin` + `sync_with_stdio(false)` | 0.062초 | |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측, 3회 실행의 최솟값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/py_input_readline.py` 다.)\n\n제한 시간이 1초인 문제에서 1.105초와 0.289초는 통과와 실패다. **알고리즘을 한 글자도 안 고치고 0.8초가 사라진다.**\n:::\n\n### 2.2 왜 느린가\n\n\"`input()`은 개행을 떼고 `readline`은 안 떼니까 그만큼 느리다\"는 설명이 흔하다. 측정하면 틀렸다는 것이 바로 나온다. 읽기만 하고 계산은 빼서 순수 비용만 남긴 것이다.\n\n::: perf\n| 하는 일 | 시간 |\n|---|---|\n| `readline()` 만 | 0.127초 |\n| `readline().rstrip()` | 0.172초 |\n| `input()` | 0.945초 |\n\n> (같은 환경·같은 스크립트의 `[분해]` 절.)\n\n개행을 떼는 비용은 0.045초다. **전체 차이 0.82초 중 5%밖에 설명하지 못한다.** 나머지 0.77초는 `input()` 자신의 호출 비용이다.\n:::\n\n::: deep\n`input()`이 하는 일은 한 줄 읽기가 아니다. 호출될 때마다 다음을 한다.\n\n1. **`sys.stdin`과 `sys.stdout`을 이름으로 찾는다.** 사용자가 이 둘을 다른 객체로 갈아 끼웠을 수 있으므로 캐시할 수 없다.\n2. **둘이 터미널인지 검사한다.** 터미널이면 대화형 편집(방향키·히스토리)을 지원하는 경로로 가고, 파이프나 파일이면 일반 경로로 간다. 이 판정을 **매 호출** 한다.\n3. 프롬프트 인자가 있으면 출력하고 버퍼를 비운다.\n4. 한 줄을 읽고, 끝의 개행을 뗀다.\n5. 빈 결과면 `EOFError`를 던진다. `readline`은 이때 빈 문자열 `''`을 돌려준다.\n\n`readline`은 이 중 4번만 한다. 그것도 파일 객체의 메서드를 미리 이름으로 붙잡아 두면(`rl = sys.stdin.readline`) 속성 조회조차 반복하지 않는다.\n\n`input()`이 이렇게 설계된 이유는 **대화형 셸을 위한 함수**이기 때문이다. 사람이 한 줄 치고 기다리는 상황에서 매 호출 몇 마이크로초는 아무 의미가 없다. 100만 번 부르는 것은 이 함수의 용도가 아니다.\n:::\n\n### 2.3 표준 관용구\n\n::: dual\n```python title=\"빠른 입출력 — n개의 (a, b)를 읽어 a*b의 합\"\nimport sys\ninput = sys.stdin.readline          # 왜: 이름을 바꿔 두면 기존 코드를 그대로 쓴다\n\nn = int(input())\ntotal = 0\nfor _ in range(n):\n    a, b = map(int, input().split())\n    total += a * b\nprint(total)\n```\n```cpp title=\"빠른 입출력 — n개의 (a, b)를 읽어 a*b의 합\"\n#include <iostream>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);   // 왜: C 표준 입출력과의 동기화를 끊는다\n    cin.tie(nullptr);                   // 왜: cin 앞에서 cout 을 자동으로 비우지 않는다\n\n    int n;\n    cin >> n;\n    long long total = 0;\n    for (int i = 0; i < n; i++) {\n        long long a, b;\n        cin >> a >> b;\n        total += a * b;\n    }\n    cout << total << \"\\n\";\n    return 0;\n}\n```\n:::\n\n입력 `3 / 2 3 / 4 5 / 1000000 1000000`에 대해 두 코드 모두 `1000000000026`을 출력한다.\n\n**복잡도:** 시간 $O(n)$ — 줄마다 상수 번의 읽기·분해·변환이므로 줄 수에 비례한다. 공간 $O(1)$ — 한 줄씩 처리하고 버리므로 입력 전체를 들고 있지 않는다. 다만 상수가 크다. 위 실측에서 보듯 같은 $O(n)$ 안에서 방식에 따라 4배가 갈린다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 느린 기본값의 정체 | `input()`의 대화형 처리 | `cin`의 C 입출력 동기화 |\n| 해제 방법 | `sys.stdin.readline`으로 교체 | `sync_with_stdio(false)` |\n| 부작용 | 개행이 남는다 | `printf`와 `cout`을 섞어 쓰면 순서가 깨진다 |\n| 누적 합의 타입 | `int`가 알아서 커진다 | `long long`을 직접 써야 한다 |\n\n::: danger\n`input = sys.stdin.readline`은 **내장 함수를 가리는(shadowing) 코드**다. 코딩테스트에서는 표준 관용구이고 안전하지만, 그 이유는 제출 파일이 한 개이고 수명이 5분이기 때문이다.\n\n여러 사람이 고치는 코드에서 같은 일을 하면 `input()`을 부르는 다른 모든 코드의 동작이 조용히 바뀐다. 개행이 남는 것과 EOF에서 예외 대신 `''`이 나오는 것, 둘 다 조용한 변화다. 실무 코드에서는 `readline = sys.stdin.readline`처럼 **다른 이름**을 쓴다.\n:::\n\n### 2.4 출력도 같은 병목이다\n\n입력만 고치고 출력을 방치하면 절반만 고친 것이다. 100만 줄을 쓰는 세 가지 방식이다.\n\n::: perf\n| 방식 | 시간 | 배수 |\n|---|---|---|\n| `print(x)`를 100만 번 | 1.438초 | 기준 |\n| `sys.stdout.write` | 0.726초 | 2.0배 빠름 |\n| `'\\n'.join(...)`으로 한 번에 | 0.178초 | **8.1배 빠름** |\n\n> (같은 환경·같은 스크립트. 출력은 `/dev/null`로 버려 디스크 비용을 뺀 순수 계산 비용이다.)\n:::\n\n`print()`가 느린 이유는 `input()`과 같은 계열이다. 호출마다 인자를 문자열로 바꾸고, 구분자와 끝 문자를 붙이고, 파일 객체를 찾아 쓴다. **한 번에 몰아서 쓰면 이 비용이 100만분의 1로 준다.**\n\n```python title=\"출력 몰아쓰기 (조각)\"\nimport sys\n\nans = [i * i for i in range(5)]\n\n# ❌ 줄마다 부른다\nfor x in ans:\n    print(x)\n\n# ✅ 한 번에 만들어 한 번에 쓴다\nsys.stdout.write('\\n'.join(map(str, ans)) + '\\n')\n```\n\n::: warn\n몰아쓰기에는 메모리 대가가 있다. 출력이 100만 줄이면 그 문자열 전체를 메모리에 들고 있어야 한다. 출력이 수천만 줄이라면 적당한 크기로 끊어 쓰거나 `sys.stdout.write`를 반복하는 쪽이 낫다. **시간과 공간을 바꾸는 거래**이지 공짜가 아니다.\n:::\n\n## 3. 개행과 분해\n\n### 3.1 `readline`은 개행을 남긴다\n\n`sys.stdin.readline()`이 돌려주는 것은 **줄바꿈 문자를 포함한** 문자열이다. 이 사실이 어디서 문제가 되고 어디서 안 되는지가 갈린다.\n\n```python title=\"개행이 어디서 문제가 되는가 (조각)\"\nline = sys.stdin.readline()      # '41\\n'\nint(line) + 1                    # 42     <- int() 는 앞뒤 공백·개행을 무시한다\n\nname = sys.stdin.readline()      # 'kim\\n'\nname == \"kim\"                    # False  <- 문자열 비교는 개행을 무시하지 않는다\nname.rstrip() == \"kim\"           # True\n\nrow = sys.stdin.readline()       # ' 10  20   30 \\n'\nrow.split()                      # ['10', '20', '30']   <- split() 도 알아서 버린다\n```\n\n규칙은 하나로 정리된다. **숫자로 바꾸거나 `split()`을 거치면 개행은 저절로 사라진다. 문자열을 그대로 쓸 때만 `rstrip()`이 필요하다.**\n\n::: pitfall\n- **격자를 읽을 때.** `grid.append(input())`으로 읽으면 각 행 끝에 `'\\n'`이 붙어 열 개수가 하나씩 많아진다. `input().rstrip()`으로 읽어야 `'#.#.'`이 네 글자다.\n- **`rstrip()`과 `rstrip('\\n')`은 다르다.** 인자 없는 `rstrip()`은 공백도 뗀다. 뒤쪽 공백이 의미를 갖는 입력이라면 `rstrip('\\n')`을 써야 한다.\n- **줄 끝이 `\\r\\n`인 입력.** Windows에서 만든 파일이 그렇다. `rstrip()`은 `\\r`도 떼지만 `rstrip('\\n')`은 `\\r`을 남긴다. 이때 `int()`는 통과하고 문자열 비교만 조용히 실패한다.\n:::\n\n### 3.2 `map`과 `split`\n\n한 줄에 여러 수가 있을 때의 표준 관용구다.\n\n📖 `str.split()` — 문자열을 공백 기준으로 잘라 리스트로 만든다. $O(n)$, n은 문자열 길이.\n　 인자 없이 부르면 **연속된 공백을 하나로 보고 앞뒤 공백을 버린다.** `split(' ')`는 다르다 — 공백 하나마다 자르므로 빈 문자열이 생긴다.\n　 쓰는 곳: 거의 모든 입력 처리. C++ 대응: `cin >>`가 공백 구분을 알아서 한다.\n\n📖 `map(f, iterable)` — 각 원소에 `f`를 적용하는 **지연 반복자**를 돌려준다. 리스트가 아니다.\n　 리스트가 필요하면 `list(map(...))`로 감싼다. 한 번만 순회할 것이면 감싸지 않는 편이 빠르고 메모리도 덜 쓴다.\n　 쓰는 곳: 입력 파싱 전반. C++ 대응: 없다. `cin >>`가 타입에 맞춰 직접 변환한다.\n\n```python title=\"입력 형태별 관용구 (조각)\"\na, b = map(int, input().split())          # 한 줄에 두 수\narr = list(map(int, input().split()))     # 한 줄에 n개\nmat = [list(map(int, input().split()))    # n줄 x m열 정수 격자\n       for _ in range(n)]\ngrid = [input().rstrip() for _ in range(n)]   # n줄 문자 격자\ndata = sys.stdin.buffer.read().split()    # 전체를 한 번에 (줄 구분 무시)\n```\n\n마지막 줄은 **줄 구분이 의미 없을 때** 쓴다. 입력 전체를 한 번의 시스템 호출로 읽고 공백 단위로 자른다. 줄 수가 매우 많고 줄바꿈 위치가 상관없는 문제에서 가장 빠르다. 대신 입력 전체가 메모리에 올라온다.\n\n::: tip\n`sys.stdin.buffer`는 **바이트**를 읽는다. `sys.stdin`이 유니코드 디코딩을 거치는 것과 달리 그 단계가 없어서 빠르다. 대신 나오는 원소가 `b'10'` 같은 바이트열이다. `int()`는 바이트열도 받으므로 정수 입력에는 문제가 없지만, 문자열로 쓰려면 `.decode()`가 필요하다.\n:::\n\n## 4. 다차원 리스트 초기화\n\n### 4.1 `[[0]*n]*m`이 부수는 것\n\n§1의 두 번째 사고로 돌아온다.\n\n```python title=\"같은 행을 m번 가리킨다\"\nn, m = 3, 2\n\nbad = [[0] * n] * m\nbad[0][0] = 9\nprint(bad)                    # [[9, 0, 0], [9, 0, 0]]\nprint(bad[0] is bad[1])       # True   <- 같은 객체다\n\ngood = [[0] * n for _ in range(m)]\ngood[0][0] = 9\nprint(good)                   # [[9, 0, 0], [0, 0, 0]]\nprint(good[0] is good[1])     # False\n```\n\n`*`는 **원소를 복사하지 않는다. 참조를 복사한다.** `[[0]*n] * m`은 리스트 하나를 만들고 그것을 가리키는 포인터를 m개 늘어놓는다. 그래서 `bad[0]`과 `bad[1]`은 같은 객체이고, 한쪽을 고치면 다른 쪽도 고쳐진다.\n\n```text nolines\n   bad = [ ptr, ptr ]                good = [ ptr, ptr ]\n            |    |                            |     |\n            +----+                            |     +--> [0, 0, 0]\n            |                                 +-------> [0, 0, 0]\n            v\n          [9, 0, 0]                        <- 서로 다른 객체 2개\n```\n\n`[[0]*n for _ in range(m)]`은 **표현식을 m번 실행**한다. `[0]*n`이 m번 평가되므로 매번 새 리스트가 생긴다.\n\n::: danger\n1차원에서는 이 함정이 드러나지 않는다. `[0] * n`은 완벽히 안전하다. `0`이 불변 객체라 공유되어도 아무 문제가 없기 때문이다.\n\n그래서 `[0] * n`으로 성공한 경험이 `[[0] * n] * m`으로 그대로 확장된다. **얕은 복사가 문제가 되는 것은 원소가 가변일 때뿐이고, 리스트는 가변이다.** 같은 이유로 `[[]] * n`, `[{}] * n`, `[set()] * n`이 전부 같은 사고를 낸다.\n\n증상이 고약하다. 격자를 채우는 도중까지는 멀쩡해 보이고, 값이 여러 행에 번지기 시작한 뒤에야 이상해진다. 그때는 이미 알고리즘을 의심하고 있다.\n:::\n\n### 4.2 어느 쪽을 쓸 것인가\n\n::: dual\n```python title=\"2차원 격자 만들기 — m행 n열을 0으로\"\nn, m = 4, 3\n\ngrid = [[0] * n for _ in range(m)]\ngrid[1][2] = 7\n\nfor row in grid:\n    for x in row:\n        print(x, end=' ')\n    print()\n```\n```cpp title=\"2차원 격자 만들기 — m행 n열을 0으로\"\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n = 4, m = 3;\n\n    vector<vector<int>> grid(m, vector<int>(n, 0));\n    grid[1][2] = 7;\n\n    for (const auto& row : grid) {\n        for (int x : row) cout << x << ' ';\n        cout << '\\n';\n    }\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(nm)$ — 칸 하나마다 한 번 초기화하므로 칸 수에 비례한다. 공간 $O(nm)$ — 정수 nm개와 행 포인터 m개. Python 쪽은 여기에 더해 **각 칸이 객체 참조**라 실제 메모리가 C++의 `vector<vector<int>>`보다 여러 배 크다. 이 차이는 [0-3 Python 내장 자료구조의 실제 비용](#/0-3)에서 다룬다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 얕은 복사 함정 | `[[0]*n]*m`이 행을 공유한다 | `vector`는 값 복사라 함정이 없다 |\n| 안전한 표기 | `[[0]*n for _ in range(m)]` | `vector<vector<int>>(m, vector<int>(n, 0))` |\n| 원소 접근 비용 | 참조를 따라가므로 캐시 미스가 잦다 | 행 안은 연속 메모리 |\n| 범위 밖 인덱스 | `IndexError` 예외 | 정의되지 않은 동작 |\n\n::: tip\n행 수가 매우 많거나 성능이 급하면 **1차원 리스트를 2차원처럼 쓰는 방법**이 있다. `flat = [0] * (n * m)`으로 잡고 `flat[r * n + c]`로 접근한다. 참조를 한 번만 따라가므로 메모리도 적고 캐시에도 유리하다. 인덱스 계산을 직접 해야 하는 것이 대가다.\n:::\n\n## 5. 정수는 넘치지 않는다\n\n### 5.1 자릿수 제한이 없다\n\nPython의 `int`는 **임의 정밀도**다. 값이 커지면 자릿수를 더 쓴다. 오버플로가 존재하지 않는다.\n\n::: dual\n```python title=\"큰 수 — 20억 두 개를 더하고 곱한다\"\na = 2_000_000_000\nb = 2_000_000_000\nprint(\"a + b =\", a + b)\nprint(\"a * b =\", a * b)\n```\n```cpp title=\"큰 수 — 20억 두 개를 더하고 곱한다\"\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 2000000000;\n    int b = 2000000000;\n    cout << \"a + b = \" << a + b << \"\\n\";\n    cout << \"a * b = \" << (long long)a * b << \"\\n\";\n    return 0;\n}\n```\n:::\n\n**여기서 두 출력이 갈린다.** 의도적이다.\n\n```console\nPython:  a + b = 4000000000            a * b = 4000000000000000000\nC++   :  a + b = -294967296            a * b = 4000000000000000000\n```\n\n`a + b`가 C++에서 음수다. `int`는 약 21억까지라 40억이 들어가지 않는다. 부호 있는 정수의 오버플로는 **정의되지 않은 동작**이고, 위 값은 이 컴파일러·이 최적화 수준에서 관측된 결과일 뿐 보장된 값이 아니다. `a * b` 쪽이 맞은 것은 한쪽을 `long long`으로 올려 곱셈 자체를 64비트로 했기 때문이다. 상세는 [0-5 C++ 입출력과 기본 타입](#/0-5)에 있다.\n\n**복잡도:** 덧셈은 자릿수 $d$에 대해 $O(d)$ — 자리마다 한 번씩 더하고 올림을 넘긴다. 곱셈은 교과서 방식이면 $O(d^2)$다. C++의 `int` 연산은 $d$가 고정이라 $O(1)$이다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 최댓값 | 없다 (메모리까지) | `int` 약 21억, `long long` 약 922경 |\n| 오버플로 | 발생하지 않는다 | 부호 있는 타입은 **정의되지 않은 동작** |\n| 정수 하나의 크기 | 28바이트부터 시작해 자란다 | `int` 4바이트, `long long` 8바이트 고정 |\n| 연산 비용 | 자릿수에 비례 | 자릿수와 무관하게 상수 |\n| 나눗셈 | `//`는 내림 (`-7 // 2 == -4`) | `/`는 0 방향 절삭 (`-7 / 2 == -3`) |\n\n### 5.2 그 편의의 값\n\n공짜가 아니다. 정수 하나가 객체이고, 크기가 자란다.\n\n::: perf\n| 값 | `sys.getsizeof` |\n|---|---|\n| `0`, `1`, `2^30 - 1` | 28바이트 |\n| `2^30` | 32바이트 |\n| `2^63 - 1`, `2^64` | 36바이트 |\n| `2^1000` | 160바이트 |\n\n곱셈 20만 번에 걸리는 시간이다.\n\n| 피연산자 크기 | 시간 | 30비트 대비 |\n|---|---|---|\n| 30비트 | 0.010초 | 기준 |\n| 64비트 | 0.013초 | 1.3배 |\n| 1024비트 | 0.348초 | **34.6배** |\n| 8192비트 | 4.81초 | **478배** |\n\n> (Linux x86-64 / CPython 3.13 실측. 측정 스크립트는 `tools/bench/py_bigint_cost.py` 다.)\n:::\n\n읽는 법이 중요하다. **64비트까지는 사실상 공짜다.** 코딩테스트에서 다루는 값은 거의 전부 이 구간이라, \"Python은 큰 수 연산이 느리다\"는 걱정은 대개 근거가 없다. 비용이 드러나는 것은 **1024비트를 넘어가는 진짜 큰 수**이고, 그런 값이 나오는 곳은 조합론·거듭제곱·팩토리얼이다.\n\n덧셈은 더 완만하다. 같은 스크립트에서 30비트와 1024비트의 덧셈 차이는 1.4배에 그친다. 자릿수 비용보다 인터프리터의 반복 비용이 크기 때문이다.\n\n::: note\n오버플로가 없다는 것이 값어치를 하는 자리가 있다. `math.factorial(2000)`은 5,736자리 정수를 0.0002초에 정확히 돌려준다. C++에서 같은 것을 하려면 큰 수 라이브러리를 직접 짜야 한다. `unsigned long long`은 **21!에서 이미 넘친다.**\n\n모듈러 거듭제곱과 조합론은 [X-3 모듈러 연산과 분할 정복 거듭제곱](#/x-3), [X-4 조합론 기초](#/x-4)에서 다룬다. 거기서 Python은 `pow(a, b, m)`이라는 3인자 내장 함수로 끝난다.\n:::\n\n::: warn\nCPython 3.11부터 **큰 정수를 문자열로 바꾸는 데 자릿수 제한**이 걸렸다. 기본값은 4,300자리이고, 넘으면 `ValueError`가 난다.\n\n```python title=\"이 한 줄이 실제로 예외를 던진다\"\nstr(2 ** 100000)     # ValueError: Exceeds the limit (4300 digits)...\n```\n\n2진수를 10진수로 바꾸는 것은 진법이 서로의 거듭제곱이 아니라 자릿수 전체를 건드리는 작업이고, 교과서적 알고리즘은 자릿수의 제곱에 비례한다. 악의적 입력으로 서비스를 멈출 수 있어 기본 제한이 생겼다. 푸는 방법은 `sys.set_int_max_str_digits(n)`이다.\n\n다만 3.13의 실제 증가율은 제곱보다 훨씬 완만하다. 같은 스크립트 실측에서 `2^800000`(0.052초)과 `2^1600000`(0.113초)의 비는 2.2배다. 제곱이면 4배여야 한다.\n:::\n\n## 연습\n\n::: quiz\n전부 손으로 확인하는 문제다. 답을 먼저 적고 나서 돌려라(§0-1의 손으로 짜는 원칙).\n\n**1. 예측.** 다음 각각의 출력을 적어라. 돌리기 전에 적는 것이 요점이다.\n```python\na = [[0] * 2] * 2\nb = [[0] * 2 for _ in range(2)]\na[0][0] = 1\nb[0][0] = 1\nprint(a, b, a[0] is a[1], b[0] is b[1])\n```\n\n**2. 백준 15552 빠른 A+B (브론즈 4)** — https://www.acmicpc.net/problem/15552\n- 신호: 지문이 대놓고 \"입출력 방식이 느리면 시간초과\"라고 알려 준다. 유일하게 입출력 자체가 주제인 문제다.\n- 상태: 없다. 한 줄 읽어 한 줄 쓰는 것이 전부다.\n- 자료구조: 없다. 대신 §2.3과 §2.4를 둘 다 적용해야 한다. 입력만 고치고 출력을 `print` 반복으로 두면 절반만 고친 것이다.\n\n**3. 백준 10951 A+B - 4 (브론즈 2)** — https://www.acmicpc.net/problem/10951\n- 신호: \"입력의 마지막 줄이 언제인지 주어지지 않는다\". 몇 줄인지 모른 채 EOF까지 읽어야 한다.\n- 상태: 없다. 다만 **종료 조건**이 상태다.\n- 자료구조: 없다. §2.2의 5번이 핵심이다. `input()`은 EOF에서 `EOFError`를 던지고 `readline`은 빈 문자열을 돌려준다. 어느 쪽을 쓰느냐에 따라 루프를 끝내는 코드가 완전히 달라진다.\n\n**4. 백준 2338 긴 자리 계산 (브론즈 5)** — https://www.acmicpc.net/problem/2338\n- 신호: 입력이 100자리 정수다. C++이면 큰 수 덧셈·뺄셈·곱셈을 직접 짜야 한다.\n- 상태: 없다.\n- 자료구조: Python에서는 `int`가 그대로 답이다. §5.1이 그대로 값어치를 하는 자리이고, 같은 문제의 두 언어 난도가 얼마나 벌어지는지 보는 데 의미가 있다.\n\n::: answer\n**1.** `[[1, 1... ` 이 아니다. 정확히는 이렇다.\n\n```console\n[[1, 0], [1, 0]] [[1, 0], [0, 0]] True False\n```\n\n`a`는 행을 공유하므로 `a[0][0] = 1`이 두 행에 동시에 보인다. `a[0] is a[1]`이 `True`인 것이 그 증거다. `b`는 리스트 컴프리헨션이 `[0] * 2`를 두 번 평가해 서로 다른 객체를 만들었다.\n\n**3의 보충.** 두 방식의 종료 코드는 이렇게 갈린다. 어느 쪽도 틀리지 않지만 **섞으면 틀린다.**\n\n```python title=\"EOF까지 읽는 두 가지 방법 (조각)\"\nimport sys\n\n# readline: 빈 문자열이 EOF 신호\nwhile True:\n    line = sys.stdin.readline()\n    if not line:\n        break\n\n# input(): 예외가 EOF 신호\nwhile True:\n    try:\n        line = input()\n    except EOFError:\n        break\n```\n\n`input = sys.stdin.readline`으로 이름만 바꿔 두고 아래쪽 `try/except` 구조를 그대로 쓰면 **예외가 영원히 안 나서 무한 루프**가 된다. §2.3의 `::: danger`가 겨냥한 사고가 이것이다.\n:::\n:::\n\n## 요약\n\n- `input()`은 대화형 셸용 함수다. 호출마다 스트림을 찾고 터미널인지 검사한다. 100만 줄에서 `sys.stdin.readline`보다 **3.8배 느리고**, 그 차이의 95%는 개행 제거가 아니라 호출 비용 자체다.\n- 출력도 같다. `print()` 반복은 `'\\n'.join`으로 몰아쓰기보다 **8.1배 느리다.** 입력만 고치는 것은 절반만 고치는 것이다.\n- `readline`은 개행을 남긴다. **`int()`와 `split()`은 알아서 무시하고, 문자열을 그대로 쓸 때만 `rstrip()`이 필요하다.** 격자 입력이 대표적인 자리다.\n- `[[0]*n]*m`은 행 하나를 m번 가리킨다. `*`는 참조를 복제하지 실제 값을 복제하지 않는다. **`[[0]*n for _ in range(m)]`을 쓴다.** 1차원 `[0]*n`이 안전한 것은 `0`이 불변이기 때문이지 `*`가 안전해서가 아니다.\n- Python 정수는 임의 정밀도라 오버플로가 없다. C++에서 같은 코드가 `int` 오버플로로 음수를 내는 자리에서 Python은 그냥 맞는다. **64비트까지는 비용도 사실상 없다.** 1024비트를 넘어야 곱셈이 34배로 벌어진다.\n- 큰 정수를 `str()`로 바꿀 때 4,300자리 기본 제한이 있다. `sys.set_int_max_str_digits`로 푼다.\n\n**다음 절**: [0-3 Python 내장 자료구조의 실제 비용](#/0-3) — `list.insert(0, x)`가 왜 `deque.appendleft`보다 177배 느린지, 그리고 `dict`가 언제 커지는지.\n","0-3":"# 0-3 Python 내장 자료구조의 실제 비용\n\n::: lead\n`list`, `dict`, `set`, `tuple`, `str`이 메모리에서 실제로 어떻게 생겼고, 어느 연산이 조용히 $O(n)$인가.\n:::\n\n## 1. 문제\n\n큐가 필요해서 리스트를 썼다. 뒤에 넣고 앞에서 꺼낸다. 논리적으로 완벽하다.\n\n```python title=\"시간 초과가 나는 BFS (조각)\"\nqueue = [start]\nwhile queue:\n    cur = queue.pop(0)      # 앞에서 꺼낸다\n    for nxt in graph[cur]:\n        queue.append(nxt)   # 뒤에 넣는다\n```\n\n정점이 10만 개면 이 코드는 통과하지 못한다. `append`는 $O(1)$인데 `pop(0)`은 $O(n)$이기 때문이다. **둘 다 \"원소 하나를 다루는 연산\"으로 보이는데 비용이 다르다.** 코드만 봐서는 어느 쪽이 어느 쪽인지 알 수 없다.\n\n같은 종류의 함정이 문자열에도 있다.\n\n```python title=\"답을 만드는 두 가지 방법 (조각)\"\ns = \"\"\nfor x in items:\n    s += str(x)         # 이게 위험한가?\n```\n\n\"문자열은 불변이니 매번 전체를 복사한다. 그러니 $O(n^2)$이다\"라는 설명이 널리 퍼져 있다. **측정하면 절반만 맞다.** 어느 절반이 맞는지 아는 것이 이 챕터의 목적이다.\n\n내장 자료구조는 이름이 짧고 문법이 편해서 비용이 없는 것처럼 보인다. 비용은 전부 있고, 다만 보이지 않을 뿐이다.\n\n## 2. `list` — 연속된 포인터 배열\n\n### 2.1 무엇이 연속인가\n\nPython의 `list`는 연결 리스트가 아니다. **포인터의 연속 배열**이다. 이름이 오해를 부른다.\n\n```text nolines\n   a = [10, 20, 30]\n\n   list 객체      ob_size = 3\n                  allocated = 4        <- 실제로 잡아 둔 슬롯\n                  ob_item ---+\n                             |\n                             v\n   포인터 배열   [ ptr, ptr, ptr, --- ]\n                    |    |    |     ^\n                    |    |    |     +-- 남는 슬롯 1개\n                    v    v    v\n   정수 객체       10   20   30        <- 각각 28바이트짜리 객체\n```\n\n두 가지가 따라온다. **인덱싱이 $O(1)$이다** — 시작 주소에 `i * 8`을 더하면 끝난다. 그리고 **원소는 값이 아니라 참조다** — 정수 하나가 28바이트 객체이고 리스트는 그 주소만 들고 있다.\n\n📖 `sys.getsizeof(obj)` — 객체 자신이 차지하는 바이트 수. $O(1)$.\n　 **참조하는 다른 객체의 크기는 포함하지 않는다.** 리스트라면 헤더와 포인터 배열의 크기이고, 원소 객체들의 크기는 빠져 있다.\n　 쓰는 곳: 메모리 제한이 걸린 문제의 진단. C++ 대응: `sizeof`는 정적 크기만 준다 — `vector`의 `sizeof`는 원소 수와 무관하게 24바이트다.\n\n### 2.2 언제 커지는가\n\n리스트는 꽉 찰 때마다 더 큰 배열을 새로 잡고 통째로 옮긴다. 그 시점을 `getsizeof`의 계단이 그대로 드러낸다.\n\n::: perf\n빈 리스트에 `append`를 반복하며 크기가 바뀌는 순간만 찍은 것이다. 빈 리스트의 헤더는 56바이트이고, 포인터 하나는 8바이트다.\n\n| 원소 수 | `getsizeof` | 확보된 슬롯 | 직전 대비 |\n|---|---|---|---|\n| 1 | 88 | 4 | +4 |\n| 5 | 120 | 8 | +4 |\n| 9 | 184 | 16 | +8 |\n| 17 | 248 | 24 | +8 |\n| 33 | 376 | 40 | +8 |\n| 41 | 472 | 52 | +12 |\n| 77 | 792 | 92 | +16 |\n| 109 | 1080 | 128 | +20 |\n| 173 | 1656 | 200 | +28 |\n\n> (Linux x86-64 / CPython 3.13 실측. 측정 스크립트는 `tools/bench/py_list_growth.py` 다.)\n:::\n\n읽는 법이 있다. **슬롯 수의 증가폭 자체가 늘어난다.** 4 → 8 → 16 → 24 → 40 → 52 → 92 → 128 → 200이다. 두 배씩은 아니고 대략 1.125배씩 늘린다.\n\n::: deep\nCPython의 과할당 규칙은 새 크기를 `n + (n >> 3) + 6` 근처로 잡고 4나 8의 배수로 맞추는 식이다. `n >> 3`이 곧 12.5%다.\n\n두 배로 늘리지 않는 이유가 있다. 두 배 정책은 원소가 100만 개일 때 200만 개짜리 배열을 잡아 절반을 놀린다. 12.5%면 낭비가 훨씬 적다. 대신 재할당 횟수가 늘어난다.\n\n그런데도 `append`가 **분할 상환 $O(1)$**인 것은 변하지 않는다. 증가폭이 현재 크기에 비례하기 때문이다. 크기 $n$까지 가는 동안의 총 복사량이 $n$에 비례하는 등비급수라 원소 하나당 상수로 나뉜다. 증가폭이 상수(예: 매번 +8)라면 이야기가 달라진다 — 재할당 횟수가 $n/8$번이고 총 복사량이 $O(n^2)$이 된다. **비율로 늘리는가 상수로 늘리는가가 갈림길이다.**\n\n`list.append`의 상수를 더 줄이고 싶으면 크기를 미리 아는 경우 `[0] * n`으로 한 번에 잡는다. 재할당이 0번이다. C++의 `reserve`에 해당하고, 그쪽은 [0-6 C++ 컨테이너 세트](#/0-6)에 있다.\n:::\n\n### 2.3 앞쪽 연산이 $O(n)$인 이유\n\n연속 배열이라는 사실에서 곧바로 나온다. **앞에 넣으려면 뒤의 모든 원소를 한 칸씩 밀어야 한다.**\n\n```text nolines\n   insert(0, 99)\n\n   before   [ 10, 20, 30, 40, -- ]\n                 \\    \\    \\    \\        <- n개를 전부 오른쪽으로 옮긴다\n                  v    v    v    v\n   after    [ 99, 10, 20, 30, 40 ]\n```\n\n`deque`는 다른 구조다. 고정 크기 블록들을 양방향 연결 리스트로 엮어 두고, 양 끝 블록에만 손을 댄다. 그래서 양쪽 끝이 $O(1)$이다. 대신 **인덱싱이 $O(n)$**이다 — 블록을 세어 가야 한다.\n\n::: perf\n| 연산 (10만 회) | 시간 | 배수 |\n|---|---|---|\n| `list.insert(0, x)` | 1.326초 | 기준 |\n| `deque.appendleft(x)` | 0.0075초 | **177배 빠름** |\n| `list.append(x)` | 0.0053초 | 248배 빠름 |\n| `list.pop(0)` | 0.738초 | 기준 |\n| `deque.popleft()` | 0.0045초 | **165배 빠름** |\n\n정말 $O(n^2)$인지 확인하려면 n을 두 배로 늘려 보면 된다.\n\n| n | `insert(0, x)` 총 시간 | 직전 대비 |\n|---|---|---|\n| 25,000 | 0.081초 | |\n| 50,000 | 0.327초 | ×4.0 |\n| 100,000 | 1.325초 | ×4.0 |\n| 200,000 | 5.873초 | ×4.4 |\n\n> (같은 환경·같은 스크립트.)\n\n**n이 2배가 될 때 시간이 4배다.** 이것이 $O(n^2)$의 정의다. 복잡도 표기를 실측으로 확인하는 가장 값싼 방법이 이 표다.\n:::\n\n📖 `collections.deque([iterable])` — 양쪽 끝 삽입·삭제가 $O(1)$인 양방향 큐.\n　 `append`, `appendleft`, `pop`, `popleft`가 전부 $O(1)$. 대신 `d[i]` 인덱싱이 $O(n)$이고 슬라이싱은 아예 안 된다.\n　 쓰는 곳: BFS의 큐([IV-3](#/iv-3)), 슬라이딩 윈도우([VI-3](#/vi-3)), 명령 버퍼([II-5](#/ii-5)).\n　 C++ 대응: `std::deque` — 이쪽은 인덱싱도 $O(1)$이다. 구조가 다르다.\n\n::: warn\n`deque`가 언제나 낫다는 뜻이 아니다. **빈 `deque`는 760바이트, 빈 `list`는 56바이트다.** 작은 컨테이너를 수만 개 만드는 상황이라면 이 차이가 지배한다.\n\n판단 기준은 하나다. **앞쪽에 손을 대는가.** 뒤에서만 넣고 빼면(스택) `list`가 낫다. 앞뒤 양쪽을 쓰면(큐) `deque`다. 중간에 자주 넣고 뺀다면 둘 다 답이 아니고 자료구조를 다시 골라야 한다.\n:::\n\n::: pitfall\n- **`list.pop()`과 `list.pop(0)`은 완전히 다른 연산이다.** 인자 없는 쪽은 $O(1)$, `0`을 주는 쪽은 $O(n)$이다. 글자 하나 차이로 복잡도가 바뀐다.\n- **`del a[0]`도 `a.pop(0)`과 같은 비용이다.** 문법이 달라도 하는 일이 같다.\n- **`a.remove(x)`는 $O(n)$이다.** 값을 찾느라 한 번 훑고, 지운 뒤 밀면서 또 훑는다.\n- **`x in a`는 리스트에서 $O(n)$이다.** `set`에서는 $O(1)$이다. 문법이 똑같아서 가장 놓치기 쉽다(§4.4).\n:::\n\n## 3. `tuple` — 불변이라 얻는 것\n\n`tuple`은 크기가 고정된 `list`다. 차이가 셋 있다.\n\n::: perf\n| 원소 수 | `list` | `tuple` |\n|---|---|---|\n| 0 | 56 | 40 |\n| 1 | 72 | 48 |\n| 1,000 | 8,056 | 8,040 |\n\n> (같은 환경, `tools/bench/py_dict_set_resize.py` 의 마지막 절.)\n:::\n\n**첫째, 조금 작다.** 여유 슬롯을 잡지 않으므로 딱 필요한 만큼이다. 1,000개에서 16바이트 차이니 크지는 않다.\n\n**둘째, 해시 가능하다.** 이게 진짜 이유다. `dict`의 키와 `set`의 원소가 되려면 해시 가능해야 하고, 리스트는 안 된다.\n\n```python title=\"좌표를 키로 쓰기 (조각)\"\nvisited = set()\nvisited.add((3, 4))          # ✅ 튜플은 된다\n# visited.add([3, 4])        # ❌ TypeError: unhashable type: 'list'\n```\n\n격자 문제에서 방문 표시를 `set`으로 할 때 이 성질이 필수다. 다만 격자가 작으면 2차원 리스트가 더 빠르다 — 해시 계산이 없기 때문이다.\n\n**셋째, 의도를 드러낸다.** 튜플이면 \"이건 안 바뀐다\"가 코드에 적힌다. 좌표 `(r, c)`, 간선 `(비용, 정점)` 같은 것이 그렇다.\n\n::: danger\n불변인 것은 **튜플 자신**이지 그 안의 객체가 아니다.\n\n```python title=\"마지막 줄은 실제로 예외를 던진다\"\nt = ([1, 2], 3)\nt[0].append(9)      # 된다. 튜플이 가리키는 리스트는 가변이다\nprint(t)            # ([1, 2, 9], 3)\nhash(t)             # TypeError: unhashable type: 'list'\n```\n\n리스트를 품은 튜플은 해시할 수 없다. 좌표를 `set`에 넣다가 이 예외가 나면 원소 중에 리스트가 섞인 것이다.\n:::\n\n## 4. `dict`와 `set` — 개방 주소법\n\n### 4.1 충돌을 어떻게 처리하는가\n\n해시 테이블은 키를 해시해 그 값으로 슬롯을 정한다. 두 키가 같은 슬롯을 원하면 **충돌**이다. 처리 방식은 크게 둘이다.\n\n- **체이닝** — 슬롯마다 연결 리스트를 달고 충돌한 키를 이어 붙인다.\n- **개방 주소법** — 다른 빈 슬롯을 찾아 옮겨 간다. 테이블 밖으로 나가지 않는다.\n\n**CPython은 개방 주소법을 쓴다.** 슬롯 배열 하나만 있고 곁가지가 없어 캐시에 유리하다. 대신 테이블이 꽉 차면 빈 슬롯을 찾는 탐색이 길어져 급격히 느려진다. 그래서 채움률에 상한을 두고, 넘으면 테이블을 키운다.\n\n::: perf\n`getsizeof`의 계단이 그 시점이다.\n\n| `dict` 원소 수 | 바이트 | | `set` 원소 수 | 바이트 |\n|---|---|---|---|---|\n| 5 | 224 | | 5 | 728 |\n| 6 | 352 | | 19 | 2,264 |\n| 11 | 632 | | 77 | 8,408 |\n| 22 | 1,168 | | 307 | 32,984 |\n| 43 | 2,264 | | 1,229 | 131,288 |\n| 86 | 4,688 | | 4,915 | 524,504 |\n| 171 | 9,304 | | 19,661 | 2,097,368 |\n| 342 | 18,512 | | | |\n\n> (같은 환경, `tools/bench/py_dict_set_resize.py`.)\n:::\n\n`dict`가 커지는 지점은 6 → 11 → 22 → 43 → 86 → 171 → 342로 **매번 약 2배**다. 슬롯이 8개일 때 6번째 원소에서, 16개일 때 11번째에서 커진다. 8의 2/3이 5.33이고 16의 2/3이 10.67이다. **채움률 2/3이 상한이다.**\n\n`set`이 커지는 지점은 5 → 19 → 77 → 307 → 1,229로 **매번 약 4배**다. 상한도 다르다 — 슬롯 8개에 5번째, 32개에 19번째에서 커지므로 **3/5가 상한**이고, 늘릴 때는 네 배로 늘린다.\n\n계단의 모양이 다르니 어느 쪽이 더 큰지는 **계단의 어디에 서 있느냐**에 달렸다. 원소 5개면 `set`이 728바이트, `dict`가 224바이트로 `set`이 세 배 넘게 크다. 원소 1,000개면 `set`이 32,984바이트, `dict`가 36,952바이트로 뒤집힌다. 어느 한쪽이 항상 작다는 규칙은 없다.\n\n::: deep\n리사이즈는 **테이블을 새로 잡고 모든 키를 다시 넣는 것**이다. 슬롯 위치가 테이블 크기의 나머지로 정해지므로 크기가 바뀌면 위치가 전부 바뀐다. 비용이 $O(n)$이다.\n\n그런데도 `d[k] = v`가 **분할 상환 $O(1)$**인 것은 리스트와 같은 논리다. 크기가 배수로 늘어나므로 리사이즈 사이의 간격이 지수적으로 벌어지고, 총 재삽입 비용이 등비급수로 $O(n)$에 머문다. 원소 하나당 상수다.\n\n같은 이유로 **크기를 미리 알면 미리 만드는 편이 낫다.** `dict.fromkeys(keys)`나 `set(iterable)`은 원소 수를 알고 시작하므로 중간 리사이즈를 건너뛴다.\n\n이 계보는 여기서 끝나지 않는다. 테이블이 메모리에 안 들어가면 [XV-8 일관성 해싱](#/xv-8)의 문제가 되고, 원소가 있는지만 알면 될 때는 [XV-4 블룸 필터](#/xv-4)로 공간을 줄인다. 해시 테이블 자체의 전모는 [II-6 해시](#/ii-6)에 있다.\n:::\n\n### 4.2 해시가 무너지면 어떻게 되는가\n\n$O(1)$은 **해시가 고르게 흩어진다는 전제** 위에 있다. 전제가 깨지면 어떻게 되는지는 재 볼 수 있다. 모든 키의 해시를 같은 값으로 만든 클래스로 4,000개를 넣는다.\n\n::: perf\n| | 시간 |\n|---|---|\n| 정상 해시 | 0.00028초 |\n| 모든 키의 해시가 동일 | 0.787초 |\n| | **2,793배 느림** |\n\n> (같은 환경, `tools/bench/py_dict_set_resize.py`.)\n:::\n\n전부 한 슬롯을 원하니 삽입할 때마다 빈 자리를 찾아 훑는다. 삽입 하나가 $O(n)$이고 전체가 $O(n^2)$이다. **$O(1)$이 $O(n)$으로 바뀌었다.**\n\n::: note\n이것이 이론적 우려만은 아니다. 웹 서버가 요청 파라미터를 `dict`에 담을 때, 공격자가 해시가 충돌하도록 계산된 키를 수만 개 보내면 서버 한 대가 CPU를 다 쓴다. **해시 DoS**라고 부른다.\n\n방어는 **해시 시드 무작위화**다. Python은 프로세스가 뜰 때마다 무작위 시드를 정해 문자열 해시에 섞는다. 공격자가 충돌 키를 미리 계산할 수 없다.\n\n부작용이 하나 따라온다. `hash(\"abc\")`는 **실행할 때마다 다른 값**이다. 재현이 필요하면 `PYTHONHASHSEED` 환경 변수로 고정한다. 문자열을 해시해 무언가를 결정하는 코드가 어제와 다르게 동작한다면 원인이 대개 이것이다.\n:::\n\n### 4.3 순회 순서\n\n`dict`는 **삽입 순서를 유지한다.** Python 3.7부터 언어 명세다.\n\n```python title=\"순회 순서 (조각)\"\nd = {}\nfor k in (\"banana\", \"apple\", \"cherry\"):\n    d[k] = 1\nlist(d)                  # ['banana', 'apple', 'cherry']   <- 삽입 순서\n\ndel d[\"apple\"]\nd[\"apple\"] = 1\nlist(d)                  # ['banana', 'cherry', 'apple']   <- 지웠다 넣으면 맨 뒤로\n```\n\n`set`은 다르다. **순서 보장이 없다.**\n\n```python title=\"set 의 순서는 보장이 아니다 (조각)\"\ns = set()\nfor k in (\"banana\", \"apple\", \"cherry\"):\n    s.add(k)\nlist(s)                  # ['cherry', 'apple', 'banana']   <- 삽입 순서가 아니다\n\nlist(set(range(10)))     # [0, 1, 2, ..., 9]   <- 정렬되어 보인다. 우연이다\n```\n\n::: danger\n마지막 줄이 함정이다. `set(range(10))`은 정렬된 것처럼 나온다. **작은 정수의 해시가 자기 자신이기 때문**이다. `hash(7) == 7`이라 7번 슬롯에 들어가고, 순회하면 슬롯 순서대로 나온다.\n\n이걸 보고 \"`set`은 정렬해서 준다\"로 배우면 다음 셋 중 하나에서 무너진다.\n\n- 원소가 문자열이면 순서가 뒤죽박죽이다(위의 `banana` 예).\n- 정수라도 테이블 크기보다 큰 값이 섞이면 나머지 연산 때문에 순서가 깨진다.\n- 같은 코드가 실행할 때마다 다른 순서를 낸다(§4.2의 해시 시드).\n\n**정렬이 필요하면 `sorted(s)`라고 쓴다.** $O(n \\log n)$을 내는 대신 보장을 산다. 순서에 의존하는 코드가 \"내 컴퓨터에서는 되는데\"가 되는 전형적인 경로가 이것이다.\n:::\n\n### 4.4 포함 검사는 어디에 넣느냐가 전부다\n\n`x in a`는 리스트와 집합에서 **문법이 완전히 같고 비용이 완전히 다르다.**\n\n::: perf\n20만 개짜리 컨테이너에 2,000번 포함 검사를 한 시간이다.\n\n| | 시간 |\n|---|---|\n| `x in set` | 0.00079초 |\n| `x in list` | 1.834초 |\n| | **2,311배 느림** |\n\n> (같은 환경, `tools/bench/py_dict_set_resize.py`.)\n:::\n\n`list` 쪽은 원소를 하나씩 비교하므로 $O(n)$이고, `set` 쪽은 해시로 슬롯을 한 번에 찾으므로 $O(1)$이다. 루프 안에 있으면 $O(n^2)$과 $O(n)$의 차이가 된다.\n\n::: tip\n**방문 배열을 `list`로 두고 `if nxt not in visited`를 쓰는 것**이 이 사고의 가장 흔한 형태다. BFS가 통과하지 못하는 두 번째 이유이고(첫 번째는 §2.3의 `pop(0)`), 둘 다 코드만 보면 멀쩡하다.\n\n`visited`는 `set`으로 두거나, 정점 번호가 0부터 연속이면 `[False] * n` 불리언 리스트로 둔다. 후자가 더 빠르다 — 해시 계산조차 없이 인덱싱 한 번이다.\n:::\n\n## 5. `str` — 불변성의 대가\n\n### 5.1 널리 퍼진 설명과 실측\n\n문자열은 불변이다. `s += t`는 `s`를 고치는 것이 아니라 **새 문자열을 만들어 `s`가 그것을 가리키게 하는 것**이다. 그러면 매번 전체를 복사하니 루프에서 $O(n^2)$이라는 결론이 나온다.\n\n재 보면 이렇다.\n\n::: perf\n10글자 조각을 이어 붙인다.\n\n| 방식 | 5만 개 | 10만 개 | 20만 개 |\n|---|---|---|---|\n| `s += t` (참조 1개) | 0.0042초 | 0.0086초 | 0.0165초 |\n| `s += t` (참조 2개) | 1.100초 | 4.756초 | 18.199초 |\n| `''.join(parts)` | 0.0026초 | 0.0052초 | 0.0104초 |\n| `io.StringIO` | 0.0035초 | 0.0066초 | 0.0130초 |\n\n> (Linux x86-64 / CPython 3.13 실측. 측정 스크립트는 `tools/bench/py_str_concat.py` 다.)\n:::\n\n두 줄이 1,000배 넘게 갈린다. **같은 `s += t`인데 그렇다.** 그리고 그 위쪽 줄은 `join`과 겨우 1.6배 차이다.\n\n증가율을 보면 정체가 나온다. 조각 수가 2배가 될 때 위쪽은 1.9배(선형), 아래쪽은 3.8배(제곱)다.\n\n### 5.2 무엇이 갈랐는가\n\n::: deep\nCPython에는 문자열 이어 붙이기에 대한 특수한 최적화가 있다. `s = s + t` 또는 `s += t`를 실행할 때, **왼쪽 문자열의 참조 수가 1이면** 새 객체를 만들지 않고 기존 버퍼를 `realloc`으로 늘려 뒤에 이어 붙인다.\n\n참조 수가 1이라는 것은 **`s`라는 이름 말고 그 문자열을 가리키는 것이 없다**는 뜻이고, 그러면 제자리에서 고쳐도 아무도 눈치채지 못한다. 불변성은 관측 가능한 성질에 대한 약속이지 메모리에 대한 약속이 아니다.\n\n이 조건이 깨지는 순간이 두 번째 줄이다. 벤치마크는 `keep = s`로 참조를 하나 더 만들어 이 경로를 막았다. 실제 코드에서 조건이 깨지는 경우는 이렇다.\n\n- 리스트나 딕셔너리에 중간 결과를 같이 담을 때\n- 함수에 넘기는 등으로 참조가 살아 있을 때\n- 다른 구현(PyPy 등)에서 돌릴 때 — **이 최적화는 CPython 구현 세부사항이지 언어 명세가 아니다**\n\n::: warn\n그래서 결론은 \"`+=`를 써도 된다\"가 아니다. **`+=`는 조건부로 빠르고, 그 조건은 코드에 안 보인다.** 한 줄 추가로 1,000배가 되는 코드는 위험하다.\n\n`''.join(parts)`은 조건이 없다. 전체 길이를 먼저 재고 한 번에 잡아 한 번에 복사하므로 항상 $O(n)$이다. **보장된 것을 쓴다.**\n:::\n:::\n\n### 5.3 표준 관용구\n\n::: dual\n```python title=\"조각을 모아 한 줄 만들기\"\nparts = []\nfor i in range(5):\n    parts.append(str(i * i))\n\ns = ' '.join(parts)\nprint(s)\nprint(len(s))\n```\n```cpp title=\"조각을 모아 한 줄 만들기\"\n#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<string> parts;\n    for (int i = 0; i < 5; i++) {\n        parts.push_back(to_string(i * i));\n    }\n\n    string s;\n    for (size_t i = 0; i < parts.size(); i++) {\n        if (i) s += ' ';\n        s += parts[i];\n    }\n    cout << s << \"\\n\";\n    cout << s.size() << \"\\n\";\n    return 0;\n}\n```\n:::\n\n두 코드 모두 `0 1 4 9 16`과 `10`을 출력한다.\n\n**복잡도:** 시간 $O(L)$ — L은 결과 전체 길이다. `join`은 조각들의 길이를 먼저 합해 버퍼를 한 번 잡고 각 조각을 한 번씩 복사하므로 전체 복사량이 L이다. 공간 $O(L)$ — 결과 버퍼 하나. 조각들을 담은 리스트가 따로 L만큼 더 든다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 가변성 | `str`은 불변 | `std::string`은 가변 |\n| 이어 붙이기 | `+=`는 참조 수에 따라 갈린다 | `+=`는 항상 제자리 추가 (분할 상환 $O(1)$) |\n| 표준 방법 | `''.join(parts)` | 루프로 `+=`, 또는 `reserve` 후 추가 |\n| 한 글자 | 길이 1인 `str` | `char` — 다른 타입이다 |\n\nC++의 `std::string`은 가변이라 이 함정이 없다. `+=`가 `vector`처럼 과할당된 버퍼에 덧붙이므로 분할 상환 $O(1)$이다. **Python에서 위험한 관용구가 C++에서는 표준 관용구**인 드문 지점이다.\n\n::: pitfall\n- **`s[0] = 'x'`는 안 된다.** `TypeError`다. 문자열의 한 글자를 바꾸려면 `list(s)`로 풀어 고치고 `''.join()`으로 되돌린다.\n- **`s.replace(...)`는 새 문자열을 만든다.** 원본은 그대로다. `s.replace('a','b')`만 쓰고 결과를 안 받으면 아무 일도 일어나지 않는다.\n- **`+` 두 개짜리는 아무 문제 없다.** `a + b + c`처럼 고정된 개수를 붙이는 것은 루프가 아니라서 $O(n^2)$이 될 수 없다. 위험한 것은 **루프 안의 누적**뿐이다.\n- **`s in t`는 부분 문자열 검사다.** 리스트의 `in`과 의미가 다르다. 비용은 최악 $O(|s| \\times |t|)$이고, 진짜 문자열 검색은 [IX-7 문자열 매칭](#/ix-7)의 KMP다.\n:::\n\n## 6. 한 장 요약표\n\n| 연산 | `list` | `deque` | `dict` / `set` | `str` |\n|---|---|---|---|---|\n| 인덱싱 `a[i]` | $O(1)$ | $O(n)$ | — | $O(1)$ |\n| 키 조회 `d[k]` | — | — | $O(1)$ 평균 | — |\n| 뒤에 추가 | $O(1)$ 분할상환 | $O(1)$ | $O(1)$ 분할상환 | 조건부 |\n| 앞에 추가 | **$O(n)$** | $O(1)$ | — | — |\n| 뒤에서 제거 | $O(1)$ | $O(1)$ | — | — |\n| 앞에서 제거 | **$O(n)$** | $O(1)$ | — | — |\n| 포함 검사 `x in c` | **$O(n)$** | $O(n)$ | $O(1)$ 평균 | $O(nm)$ |\n| 값으로 제거 | $O(n)$ | $O(n)$ | $O(1)$ | — |\n| 길이 `len` | $O(1)$ | $O(1)$ | $O(1)$ | $O(1)$ |\n| 정렬 | $O(n \\log n)$ | — | — | — |\n\n굵은 칸이 사고가 나는 자리다. 셋 다 **문법이 짧아서 싸 보인다**는 공통점이 있다.\n\n## 연습\n\n::: quiz\n전부 자료구조 선택이 본체인 문제다. 코드를 짜기 전에 **어느 연산이 몇 번 일어나는지**를 먼저 세어라.\n\n**1. 백준 10845 큐 (실버 4)** — https://www.acmicpc.net/problem/10845\n- 신호: `push`, `pop`, `front`, `back`이 명령으로 들어온다. 명령이 1만 개다.\n- 상태: 큐 하나. 앞과 뒤 양쪽에 손을 댄다.\n- 자료구조: `deque`다. `list`로 `pop(0)`을 쓰면 $O(n^2)$이고, 명령 1만 개면 아슬아슬하게 통과할 수도 있다. **통과 여부와 무관하게 §2.3의 표를 보고 골라라** — 명령이 10배가 되는 순간 갈린다.\n\n**2. 백준 1764 듣보잡 (실버 4)** — https://www.acmicpc.net/problem/1764\n- 신호: \"듣지도 보지도 못한 사람\". 두 명단의 교집합이고 각각 50만이다.\n- 상태: 두 집합.\n- 자료구조: `set` 두 개와 `&` 연산. `list`에 담고 이중 루프를 돌면 2,500억 번이라 §4.4의 2,311배가 그대로 나타난다. 출력이 사전순이라 마지막에 `sorted()`가 필요하고, **`set`의 순서를 믿으면 안 되는 이유**(§4.3)가 바로 여기서 드러난다.\n\n**3. 백준 1927 최소 힙 (실버 2)** — https://www.acmicpc.net/problem/1927\n- 신호: \"가장 작은 값을 출력하고 배열에서 제거\". 연산이 10만 번이다.\n- 상태: 아직 안 꺼낸 수들의 모음. 전체 정렬이 아니라 **최솟값만** 필요하다.\n- 자료구조: 힙이다. 매번 `sorted()`를 부르면 $O(n^2 \\log n)$이고, `min()` + `remove()`도 $O(n^2)$이다. 힙은 [0-4](#/0-4)의 `heapq`이고 내부는 [II-8](#/ii-8)에 있다.\n\n**4. 측정 과제.** `tools/bench/py_list_growth.py`의 마지막 절을 참고해, `s += t`를 참조 1개와 2개 각각으로 n을 2배씩 늘려 가며 재라. 어느 쪽이 2배, 어느 쪽이 4배로 늘어나는가. 그 배수가 각각 무슨 복잡도를 뜻하는가.\n\n::: answer\n**4.** 참조 1개는 n이 2배일 때 시간이 약 **2배**로 는다. 선형, 즉 $O(n)$이다. `realloc`으로 제자리 확장이 되므로 조각마다 상수 작업이다.\n\n참조 2개는 약 **4배**로 는다. 제곱, 즉 $O(n^2)$이다. 매번 새 버퍼를 잡고 이미 만들어진 부분 전체를 복사하므로, 총 복사량이 $10 + 20 + 30 + \\cdots$이라 $n^2$에 비례한다.\n\n§5.1의 실측이 정확히 이 모양이다. 20만 개에서 0.0165초와 18.199초, 1,100배 차이다. **차이를 만든 것은 알고리즘이 아니라 참조 수 한 개**이고, 그래서 `join`을 쓴다.\n\nn을 2배로 늘려 시간 배수를 보는 것은 복잡도 표기를 실측으로 검증하는 일반적인 방법이다. 2배면 $O(n)$, 4배면 $O(n^2)$, 8배면 $O(n^3)$이고, 2배보다 조금 크면 $O(n \\log n)$이다.\n:::\n:::\n\n## 요약\n\n- `list`는 **포인터의 연속 배열**이다. 인덱싱이 $O(1)$인 것과 앞쪽 삽입이 $O(n)$인 것이 같은 사실에서 나온다.\n- 리스트는 꽉 차면 약 **12.5%씩** 키운다. 두 배가 아닌데도 `append`가 분할 상환 $O(1)$인 것은 증가폭이 **현재 크기에 비례**하기 때문이다. 상수로 늘리면 $O(n^2)$이 된다.\n- `insert(0, x)`는 `deque.appendleft`보다 **177배**, `pop(0)`은 `popleft`보다 **165배** 느리다. n을 2배로 늘리면 시간이 4배가 되는 것으로 $O(n^2)$을 확인할 수 있다.\n- `dict`와 `set`은 **개방 주소법**이고 채움률이 각각 2/3, 3/5를 넘으면 커진다. 리사이즈는 $O(n)$이지만 배수로 늘어 분할 상환 $O(1)$이 유지된다.\n- 해시가 전부 충돌하면 $O(1)$이 $O(n)$이 된다. 실측 **2,793배**다. 해시 시드 무작위화가 그 방어이고, 그래서 `hash(\"abc\")`는 실행마다 다르다.\n- `dict`는 삽입 순서를 유지하지만 **`set`은 순서 보장이 없다.** `set(range(10))`이 정렬되어 보이는 것은 작은 정수의 해시가 자기 자신이라서 생기는 우연이다. 정렬이 필요하면 `sorted()`라고 쓴다.\n- `x in list`는 $O(n)$, `x in set`은 $O(1)$이다. **문법이 같고 비용이 2,311배 다르다.**\n- `s += t`는 참조 수가 1일 때만 빠르다. 참조가 하나 더 생기면 **1,100배 느려지고** $O(n^2)$이 된다. 조건이 코드에 안 보이므로 `''.join()`을 쓴다.\n\n**다음 절**: [0-4 Python 표준 라이브러리 세트](#/0-4) — 이 비용들을 우회하는 도구 상자. `heapq`, `bisect`, `Counter`, 그리고 `sort()`가 이미 정렬된 입력을 알아보는 방법.\n","0-4":"# 0-4 Python 표준 라이브러리 세트\n\n::: lead\n알고리즘을 짜는 데 실제로 쓰이는 표준 라이브러리 전부와, `sort()`가 이미 정렬된 입력을 알아보는 방법.\n:::\n\n## 1. 문제\n\n[0-3](#/0-3)이 남긴 결론은 \"이 연산은 비싸다\"였다. 그러면 무엇을 쓸 것인가. 답의 대부분은 이미 표준 라이브러리에 있고, 문제는 **있는 줄 모르고 다시 짜는 것**이다.\n\n다시 짜면 둘을 잃는다. **시간**과 **정확성**이다. 표준 라이브러리의 상당수는 C로 구현되어 있어 복잡도가 같아도 상수가 자릿수로 갈리고, 이분 탐색을 직접 짜면 경계 조건에서 틀린다([0-11](#/0-11)이 그 이야기다).\n\n```python title=\"같은 O(n log n), 다른 결과 (조각)\"\nsorted(data)[:100]           # 0.180초\nheapq.nsmallest(100, data)   # 0.013초   <- 14배 빠르다\n```\n\n그런데 정반대의 함정도 있다. **표준 라이브러리라고 다 빠르지는 않다.** `functools.cmp_to_key`는 같은 정렬을 2.5배 느리게 만든다. 무엇이 왜 빠른지 알아야 고를 수 있다.\n\n이 챕터는 그 목록이고, 마지막 절은 `sort()` 안을 연다.\n\n## 2. `heapq` — 최솟값만 필요할 때\n\n전체를 정렬할 필요 없이 **가장 작은 것 하나**만 반복해서 꺼내는 상황이 있다. 다익스트라, 이벤트 시뮬레이션, 작업 스케줄러가 전부 그렇다.\n\n📖 `heapq.heappush(heap, item)` — 최소 힙에 원소 삽입. $O(\\log n)$.\n　 리스트를 힙으로 취급하는 함수 모음이다. 별도 타입이 아니라 **그냥 `list`**이고, `heap[0]`이 항상 최솟값이다.\n　 쓰는 곳: 다익스트라([V-1](#/v-1)), 최소 신장 트리의 프림([IX-4](#/ix-4)), 실시간 스케줄러([XI-5](#/xi-5)).\n　 C++ 대응: `std::priority_queue` — 이쪽은 **최대 힙이 기본**이다. 반대다.\n\n📖 `heapq.heappop(heap)` — 최솟값을 꺼내 돌려준다. $O(\\log n)$.\n📖 `heapq.heapify(a)` — 기존 리스트를 제자리에서 힙으로 만든다. **$O(n)$**이다.\n📖 `heapq.nsmallest(k, iterable)` / `nlargest(k, iterable)` — 가장 작은/큰 k개. $O(n \\log k)$.\n\n::: dual\n```python title=\"최소 힙 — 넣은 순서와 무관하게 작은 것부터\"\nimport heapq\n\nheap = []\nfor x in (5, 1, 8, 3):\n    heapq.heappush(heap, x)\n\nwhile heap:\n    print(heapq.heappop(heap), end=' ')\nprint()\n```\n```cpp title=\"최소 힙 — 넣은 순서와 무관하게 작은 것부터\"\n#include <iostream>\n#include <queue>\n#include <vector>\nusing namespace std;\n\nint main() {\n    // 왜 greater<int> 인가: priority_queue 는 최대 힙이 기본이다.\n    // heapq 와 같은 최소 힙으로 맞추려면 비교자를 뒤집어야 한다.\n    priority_queue<int, vector<int>, greater<int>> heap;\n    for (int x : {5, 1, 8, 3}) {\n        heap.push(x);\n    }\n\n    while (!heap.empty()) {\n        cout << heap.top() << ' ';\n        heap.pop();\n    }\n    cout << '\\n';\n    return 0;\n}\n```\n:::\n\n두 코드 모두 `1 3 5 8`을 출력한다.\n\n**복잡도:** `heappush`/`heappop`이 각각 시간 $O(\\log n)$ — 완전 이진 트리의 높이가 $\\log n$이고, 삽입은 새 잎에서 뿌리 방향으로, 삭제는 뿌리에서 잎 방향으로 한 층씩만 교환하기 때문이다. 공간 $O(n)$ — 배열 하나뿐이고 포인터가 없다. 내부는 [II-8 힙과 우선순위 큐](#/ii-8)에 있다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 기본 방향 | **최소 힙 고정** | **최대 힙 기본** |\n| 뒤집는 법 | 값에 `-1`을 곱해 넣는다 | 비교자를 `greater<T>`로 준다 |\n| 타입 | 별도 타입 없음. `list`를 함수로 다룬다 | `priority_queue`라는 독립 타입 |\n| 최솟값 보기 | `heap[0]` | `heap.top()` |\n| 임의 원소 접근 | `heap[i]`로 가능 (의미는 없다) | 불가능 |\n\n::: warn\n`heapq`에 튜플을 넣으면 **첫 원소로 비교하고, 같으면 다음 원소로 넘어간다.** 다익스트라에서 `(거리, 정점)` 순서로 넣는 이유다. `(정점, 거리)`로 뒤집으면 정점 번호로 정렬되어 전혀 다른 알고리즘이 된다.\n\n두 번째 원소가 비교 불가능한 객체이면 첫 원소가 같을 때 `TypeError`가 난다. `(거리, 카운터, 객체)`처럼 절대 겹치지 않는 정수를 중간에 끼워 넣는다.\n:::\n\n::: perf\n| 하는 일 | 시간 | 복잡도 |\n|---|---|---|\n| 50만 개에서 최소 100개 — `sorted(data)[:100]` | 0.180초 | $O(n \\log n)$ |\n| 50만 개에서 최소 100개 — `heapq.nsmallest(100, data)` | 0.013초 | $O(n \\log k)$, **14배 빠름** |\n| 50만 개로 힙 만들기 — `heapify` | 0.020초 | $O(n)$ |\n| 50만 개로 힙 만들기 — `heappush` 50만 번 | 0.050초 | $O(n \\log n)$, 2.5배 느림 |\n\n> (Linux x86-64 / CPython 3.13 실측. 측정 스크립트는 `tools/bench/py_stdlib_ops.py` 다.)\n:::\n
