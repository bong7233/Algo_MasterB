<!doctype html>
<html lang="ko" data-theme="dark" data-font="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Algorithmic</title>
<meta name="description" content="알고리즘과 자료구조를 Python과 C++로 동시에, 코딩테스트부터 실제 시스템까지.">
<style>
/* ===================================================================
   『Algorithmic』 — 스타일시트
   설계 컨셉: "탐색 지도(search map)"

   왜 이 컨셉인가
   - 이 책의 척추는 BFS → 다익스트라 → A* → D* Lite 계보다(CLAUDE.md §0).
     그 계보를 관통하는 그림은 언제나 "경계면이 퍼지고, 경로가 확정된다"이다.
   - 그래서 UI 액센트를 --w-frontier(탐색 경계면, 청록)와 같은 색으로 두고,
     "확정된 답"에 해당하는 것(형광펜, 강조된 코드 줄, 현재 위치)에만
     --w-path 계열의 금색을 쓴다. 색이 두 가지 역할만 하므로 화면이 조용하다.
   - 둥근 모서리·큰 그림자·보라 그라데이션은 쓰지 않는다. 4px radius, 1px 보더,
     그림자는 떠 있는 것(드로어·모달)에만. 책은 몇 시간씩 읽는 물건이라
     장식이 시선을 뺏으면 그 자체가 결함이다.

   구조
   1. 폰트·치수 토큰   2. 색 토큰(다크/라이트/OS)   3. 리셋
   4. 레이아웃 골격    5. 상단바                    6. 사이드바 목차
   7. 인북 목차        8. 본문 타이포                9. 표
   10. 코드 블록       11. 구문 강조                 12. dual 탭
   13. 표시 상자       14. 위젯                      15. 페이저
   16. 모달            17. 반응형                    18. 인쇄·접근성
   =================================================================== */

/* ===================================================================
   1. 폰트·치수 토큰
   =================================================================== */

:root {
  /* 외부 폰트를 한 개도 받지 않는다(의존성 제로, file:// 로 열린다).
     한글이 먼저 걸리도록 한글 폰트를 스택 앞쪽에 둔다. Pretendard 는
     설치돼 있으면 쓰고, 없으면 OS 기본 한글 폰트로 자연스럽게 떨어진다. */
  --font-sans:
    "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "맑은 고딕",
    "Segoe UI", Roboto, system-ui, sans-serif;

  /* 고정폭도 한글 안전 스택이다. 코드 블록에 한글 주석이 섞이는데
     라틴 전용 고정폭만 지정하면 한글이 폴백 폰트로 갈리면서 줄이 흔들린다.
     D2Coding·나눔고딕코딩은 한글 글리프를 가진 고정폭이라 먼저 시도한다. */
  --font-mono:
    "D2Coding", "JetBrains Mono", "Cascadia Mono", "Sarasa Mono K",
    "나눔고딕코딩", "NanumGothicCoding", "SF Mono", Menlo, Consolas,
    "Noto Sans Mono CJK KR", ui-monospace, monospace;

  /* 글자 크기: html[data-font] 가 갈아끼운다(§4). ch 단위인 --measure 도
     같이 움직이므로 줄당 글자 수는 어느 크기에서나 일정하다. */
  --fs-root: 16.5px;

  --lh-body: 1.8;      /* 한글 본문은 라틴보다 행간을 넉넉히 줘야 읽힌다 */
  --lh-tight: 1.45;
  --measure: 74ch;     /* 68~78ch 권장 구간의 가운데 */

  --sidebar-w: 300px;
  --inbook-w: 232px;
  --topbar-h: 56px;
  --ln-w: 3.4em;       /* 코드 줄번호 거터 폭 */

  --r: 4px;
  --r-sm: 3px;
  --r-lg: 8px;

  --dur: .15s;
  --ease: cubic-bezier(.32, .72, .35, 1);

  --z-topbar: 40;
  --z-drawer: 70;
  --z-overlay: 65;
  --z-modal: 90;
}

/* 글자 크기 3단. 루트 폰트만 바꾸면 rem·ch·em 이 전부 따라온다. */
:root[data-font="s"] { --fs-root: 15px; }
:root[data-font="m"] { --fs-root: 16.5px; }
:root[data-font="l"] { --fs-root: 18.5px; }

/* ===================================================================
   2. 색 토큰
   계약 §6 의 이름이 공개 토큰이다. 위젯(M2)도 이 이름만 쓴다.
   --box-* 와 --hl-* 는 "그 종류의 정체성 색" 하나만 정의하고,
   배경 틴트는 color-mix 로 그 자리에서 만든다. 종류가 14개라
   틴트까지 토큰으로 두면 토큰이 40개를 넘어 아무도 못 외운다.
   =================================================================== */

/* ---- 라이트: 기본값이자 명시 지정 ----
   순백(#fff)을 쓰지 않는다. 몇 시간 읽는 화면에서 순백 배경은
   대비가 과해 눈이 먼저 지친다. 살짝 따뜻한 종이색으로 낮춘다. */
:root,
:root[data-theme="light"] {
  color-scheme: light;

  --bg:        #f6f5f2;
  --bg-elev:   #fffefb;
  --bg-code:   #edeae3;
  --fg:        #1b2126;
  --fg-dim:    #4e5a63;
  --fg-faint:  #83909a;
  --border:    #dcd8cf;
  --accent:    #0f7d92;
  --accent-dim:#63a5b1;

  --box-lead:      #64788a;
  --box-note:      #1f6fae;
  --box-tip:       #1c7f52;
  --box-warn:      #9a6a10;
  --box-danger:    #b53129;
  --box-deep:      #6a4bbf;
  --box-perf:      #0d7d72;
  --box-hist:      #86664a;
  --box-trace:     #0e7ea8;
  --box-pitfall:   #bd5320;
  --box-classify:  #9a3fa0;
  --box-interview: #4560a8;
  --box-quiz:      #9c7a08;
  --box-answer:    #1f8a52;

  --hl-kw:   #b3225c;
  --hl-str:  #2f7a1f;
  --hl-num:  #9a5f10;
  --hl-com:  #7b8894;
  --hl-fn:   #1668a8;
  --hl-type: #0b7a6b;
  --hl-op:   #55636e;
  --hl-pre:  #6b3fb0;

  --w-visited:  #b9d3e2;
  --w-frontier: #1a91ab;
  --w-path:     #c98a12;
  --w-wall:     #47535d;
  --w-start:    #1f8f45;
  --w-goal:     #c4265a;

  /* 내부 전용 파생값. §6 공개 토큰이 아니다 — 위젯은 쓰지 않는다. */
  --accent-fg: #ffffff;   /* 액센트 위에 얹는 글자색 */
  --shadow:    0 6px 24px rgba(30, 36, 42, .14), 0 1px 3px rgba(30, 36, 42, .10);
  --scrim:     rgba(24, 28, 32, .42);
  --code-hl-bg:  color-mix(in srgb, var(--w-path) 16%, var(--bg-code));
  --code-hl-bar: var(--w-path);
}

/* ---- 다크 ----
   순흑(#000)도 쓰지 않는다. 흑색 배경 + 흰 글자는 헤일로가 생겨
   장문에서 글자가 번져 보인다. 청회색 계열로 한 단계 띄운다. */
:root[data-theme="dark"] {
  color-scheme: dark;

  --bg:        #0f1419;
  --bg-elev:   #161d24;
  --bg-code:   #0b1015;
  --fg:        #dbe3e9;
  --fg-dim:    #9cadb9;
  --fg-faint:  #6a7b88;
  --border:    #253038;
  --accent:    #4fc3d9;
  --accent-dim:#2d7c8c;

  --box-lead:      #8fa2b2;
  --box-note:      #5aa9e6;
  --box-tip:       #4fbf87;
  --box-warn:      #e0a33c;
  --box-danger:    #ea6259;
  --box-deep:      #a488ea;
  --box-perf:      #35c2b1;
  --box-hist:      #b8926a;
  --box-trace:     #7fd0f0;
  --box-pitfall:   #f0834e;
  --box-classify:  #d488d8;
  --box-interview: #8ba3dd;
  --box-quiz:      #e8c752;
  --box-answer:    #63c489;

  --hl-kw:   #f07fa8;
  --hl-str:  #9ed86f;
  --hl-num:  #f2b45e;
  --hl-com:  #64798a;
  --hl-fn:   #7dc8f0;
  --hl-type: #63d6c4;
  --hl-op:   #a8b7c2;
  --hl-pre:  #c39bf0;

  --w-visited:  #35566b;
  --w-frontier: #4fc3d9;
  --w-path:     #f2c14e;
  --w-wall:     #2b333b;
  --w-start:    #56c273;
  --w-goal:     #ee6f8e;

  --accent-fg: #06171c;
  --shadow:    0 10px 34px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .40);
  --scrim:     rgba(4, 8, 11, .62);
  --code-hl-bg:  color-mix(in srgb, var(--w-path) 13%, var(--bg-code));
  --code-hl-bar: var(--w-path);
}

/* ---- JS 가 data-theme 을 찍기 전의 첫 페인트 ----
   app.js 는 localStorage 를 읽고 <html data-theme> 을 세운다. 그 전 한 프레임
   동안 라이트가 번쩍이면(다크 사용자에게) 눈이 아프다. 속성이 아직 없는
   동안만 OS 설정을 따르게 한다. data-theme 이 붙는 순간 이 규칙은 매칭에서
   빠지므로 사용자의 명시 선택을 절대 덮어쓰지 않는다.
   같은 값을 두 번 쓰는 이유는 이것뿐이다 — CSS 에는 팔레트를 참조로
   재사용할 방법이 없고, 인디렉션 토큰을 한 겹 더 두면 오히려 읽기 어렵다. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;

    --bg:        #0f1419;
    --bg-elev:   #161d24;
    --bg-code:   #0b1015;
    --fg:        #dbe3e9;
    --fg-dim:    #9cadb9;
    --fg-faint:  #6a7b88;
    --border:    #253038;
    --accent:    #4fc3d9;
    --accent-dim:#2d7c8c;

    --box-lead:      #8fa2b2;
    --box-note:      #5aa9e6;
    --box-tip:       #4fbf87;
    --box-warn:      #e0a33c;
    --box-danger:    #ea6259;
    --box-deep:      #a488ea;
    --box-perf:      #35c2b1;
    --box-hist:      #b8926a;
    --box-trace:     #7fd0f0;
    --box-pitfall:   #f0834e;
    --box-classify:  #d488d8;
    --box-interview: #8ba3dd;
    --box-quiz:      #e8c752;
    --box-answer:    #63c489;

    --hl-kw:   #f07fa8;
    --hl-str:  #9ed86f;
    --hl-num:  #f2b45e;
    --hl-com:  #64798a;
    --hl-fn:   #7dc8f0;
    --hl-type: #63d6c4;
    --hl-op:   #a8b7c2;
    --hl-pre:  #c39bf0;

    --w-visited:  #35566b;
    --w-frontier: #4fc3d9;
    --w-path:     #f2c14e;
    --w-wall:     #2b333b;
    --w-start:    #56c273;
    --w-goal:     #ee6f8e;

    --accent-fg: #06171c;
    --shadow:    0 10px 34px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .40);
    --scrim:     rgba(4, 8, 11, .62);
    --code-hl-bg:  color-mix(in srgb, var(--w-path) 13%, var(--bg-code));
    --code-hl-bar: var(--w-path);
  }
}

/* ===================================================================
   3. 리셋 · 기본 요소
   =================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html {
  font-size: var(--fs-root);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  /* 가로 스크롤 최후 방어선. hidden 이 아니라 clip 을 쓰는 이유:
     hidden 은 스크롤 컨테이너를 만들어 안쪽 position:sticky 를 망가뜨린다.
     실제 방어는 아래의 min-width:0 · overflow-wrap · 각 컨테이너의
     overflow-x:auto 가 하고, 이건 예상 못 한 넘침을 막는 안전망이다. */
  overflow-x: clip;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: var(--lh-body);
  /* body 에는 overflow 를 걸지 않는다. html 한 곳에서만 자르는 편이
     #topbar·#sidebar 의 position:sticky 와 부딪힐 여지가 적다. */
  /* 한글은 단어 중간에서 끊으면 안 읽힌다(keep-all). 그러나 긴 라틴
     식별자(std::priority_queue 같은 것)는 끊어주지 않으면 좁은 폭에서
     그대로 넘쳐 body 에 가로 스크롤을 만든다. 둘을 같이 건다. */
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

[hidden] { display: none !important; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: .2em; }

button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }

img, svg, canvas, video { max-width: 100%; height: auto; }

::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }

/* 스크롤바를 본문 색조에 맞춘다. 기본 스크롤바는 다크에서 너무 밝다. */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--border);
  border: 3px solid transparent;
  background-clip: padding-box;
  border-radius: 99px;
}
*::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); background-clip: padding-box; }

/* 키보드 포커스는 전역 규칙 하나로 보장한다. 개별 컴포넌트에서
   outline:none 을 쓰지 않는다 — 한 군데만 빠져도 키보드 사용자는 길을 잃는다. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}
:is(a, button, summary, input, [tabindex]):focus-visible { outline: 2px solid var(--accent); }

/* ===================================================================
   4. 레이아웃 골격 (계약 §4)
   =================================================================== */

#layout {
  display: grid;
  /* 본문 칼럼에 minmax(0, 1fr) 을 쓰는 것이 가로 스크롤 방지의 핵심이다.
     grid item 의 기본 min-width 는 auto(=콘텐츠 최소 폭)라, 안에 긴 코드
     한 줄만 있어도 칼럼이 그만큼 벌어지면서 body 가 넘친다. */
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--inbook-w);
  align-items: start;
}

#sidebar,
#inbook {
  position: sticky;
  top: var(--topbar-h);
  height: calc(100dvh - var(--topbar-h));
  min-width: 0;
  display: flex;
  flex-direction: column;
  overscroll-behavior: contain;
}

#sidebar {
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
}

#main {
  min-width: 0;              /* 위와 같은 이유. 빠뜨리면 전부 무너진다. */
  padding: 0 clamp(18px, 3.5vw, 52px);
}

#doc {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 40px 0 8px;
}

/* 좁은 화면에서 사이드바 뒤를 덮는 딤. 기본은 완전 비활성이며
   레이아웃에 영향을 주지 않도록 fixed + pointer-events:none 로 둔다. */
#overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease);
}
/* 열림 상태 훅은 두 가지를 모두 받는다: body.nav-open(권장) 또는
   요소 자신의 .is-open/.is-active. app.js 구현이 어느 쪽이든 동작한다. */
:is(body.nav-open) #overlay,
#overlay.is-active { opacity: 1; pointer-events: auto; }

/* ===================================================================
   5. 상단바
   =================================================================== */

#topbar {
  position: sticky;
  top: 0;
  z-index: var(--z-topbar);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 clamp(10px, 2vw, 18px);
  padding-left: max(clamp(10px, 2vw, 18px), env(safe-area-inset-left));
  padding-right: max(clamp(10px, 2vw, 18px), env(safe-area-inset-right));
  background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}

/* 브랜드 뒤에 auto 마진 하나만 두면 나머지가 전부 오른쪽으로 몰린다.
   스페이서 <div> 를 DOM 에 추가하지 않기 위한 선택 — 계약 §4 골격을
   그대로 두고 CSS 로만 정렬한다. */
#brand {
  margin-inline-end: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;              /* 좁은 폭에서 오른쪽 버튼들을 밀어내지 않게 */
  overflow: hidden;
  padding: 4px 6px;
  font-size: .98rem;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--fg);
  white-space: nowrap;
}
#brand:hover { text-decoration: none; color: var(--accent); }

/* 오른쪽 아이콘 묶음. .icon-btn 은 display:grid 라서 이 래퍼에 flex 를 주지
   않으면 버튼들이 세로로 쌓여 상단바 높이를 넘어간다. */
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

/* 브랜드 앞의 작은 표식 = 확장 중인 탐색 경계면. 두 겹 사각형. */
#brand::before {
  content: "";
  width: 13px;
  height: 13px;
  flex: none;
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent);
}

.icon-btn {
  flex: none;
  position: relative;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: var(--r);
  color: var(--fg-dim);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.icon-btn:active { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.icon-btn.is-active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.icon-btn svg {
  width: 18px; height: 18px;
  fill: none; stroke: currentColor;
  stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}

/* 복습 큐 개수 뱃지. 비어 있으면 안 보인다 — app.js 가 0 일 때
   빈 문자열만 넣어도 알아서 사라지게 해서 분기를 줄인다. */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 99px;
  background: var(--w-goal);
  color: #fff;
  font-size: .62rem;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.badge:empty { display: none; }
#btn-review .badge {
  position: absolute;
  top: 1px;
  right: 0;
  box-shadow: 0 0 0 2px var(--bg-elev);
}

/* 언어 토글 (Python | C++ | 둘 다) */
.seg {
  flex: none;
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-code);
}
.seg-btn {
  padding: 4px 11px;
  border-radius: var(--r-sm);
  font-size: .76rem;
  font-weight: 600;
  color: var(--fg-dim);
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent); }
.seg-btn.is-active {
  background: var(--accent);
  color: var(--accent-fg);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 40%, transparent);
}

/* 오른쪽 아이콘 3종은 .icon-btn 규칙을 그대로 쓴다. 상단바가 flex 라
   좁은 폭에서 눌리지 않도록 축소만 막아 둔다. */
#btn-search, #btn-font, #btn-theme { flex: none; }

/* 테마 버튼만 예외 처리가 필요하다. 아이콘 두 개(해·달)를 미리 넣어 두고
   "누르면 이렇게 된다" 쪽만 보인다 — 현재 상태를 보이는 쪽보다 덜 헷갈린다.
   app.js 가 innerHTML 을 통째로 갈아끼우는 구현이면 이 규칙은 매칭되지
   않을 뿐 아무것도 깨뜨리지 않는다. */
#btn-theme .ico-moon { display: none; }
:root[data-theme="dark"] #btn-theme .ico-sun { display: none; }
:root[data-theme="dark"] #btn-theme .ico-moon { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) #btn-theme .ico-sun { display: none; }
  :root:not([data-theme]) #btn-theme .ico-moon { display: block; }
}

/* ===================================================================
   6. 사이드바 목차
   계약이 내부 마크업을 규정하지 않는 부분이다. 아래 클래스명을
   확장 규약으로 삼되, 클래스가 없어도 모양이 깨지지 않도록
   요소 선택자(#sidebar nav a 등)로도 같이 받는다.
   활성 표시는 계약이 쓰는 관례 그대로 .is-active 다.
   =================================================================== */

#toc-filter {
  flex: none;
  width: 100%;
  margin: 0;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg);
  color: var(--fg);
  font-size: .82rem;
}
#toc-filter::placeholder { color: var(--fg-faint); }
#toc-filter:focus-visible { border-color: var(--accent); }
/* 필터 입력은 사이드바 맨 위에 고정, 목록만 스크롤한다. */
#sidebar > :is(input, .toc-head, form) { flex: none; margin: 12px 12px 8px; width: auto; }
#sidebar > :is(nav, ul, ol, div:not(.toc-head)) {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px 8px 32px;
}

.toc-part { margin-top: 14px; }
.toc-part:first-child { margin-top: 2px; }
.toc-part-title {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 6px 8px;
  text-align: left;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--fg-faint);
  text-transform: uppercase;
}
.toc-part-title:hover { color: var(--accent); }
.toc-part-desc { padding: 0 8px 4px; font-size: .7rem; color: var(--fg-faint); }

/* 챕터 목록. 왼쪽 세로선이 파트의 범위를 시각적으로 묶는다. */
.toc-chapters,
#sidebar nav ul {
  list-style: none;
  margin: 0;
  padding: 0 0 0 8px;
  border-left: 1px solid var(--border);
  margin-left: 9px;
}
.toc-chapters li, #sidebar nav li { margin: 0; }

.toc-link,
#sidebar nav a {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 9px;
  border-radius: var(--r-sm);
  font-size: .82rem;
  line-height: var(--lh-tight);
  color: var(--fg-dim);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
:is(.toc-link, #sidebar nav a):hover {
  background: color-mix(in srgb, var(--fg) 6%, transparent);
  color: var(--fg);
  text-decoration: none;
}
:is(.toc-link, #sidebar nav a).is-active {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
  font-weight: 600;
}
.toc-num {
  flex: none;
  min-width: 3.2em;
  font-family: var(--font-mono);
  font-size: .72em;
  color: var(--fg-faint);
  font-variant-numeric: tabular-nums;
}
:is(.toc-link, #sidebar nav a).is-active .toc-num { color: var(--accent); }
.toc-text { min-width: 0; }
/* 읽음 표시. app.js 가 진도에서 붙인다. */
:is(.toc-link, #sidebar nav a).is-done .toc-text { color: var(--fg-faint); }
:is(.toc-link, #sidebar nav a).is-done .toc-text::after {
  content: "✓";
  margin-left: .4em;
  color: var(--w-start);
  font-size: .85em;
}
.toc-empty { padding: 26px 12px; text-align: center; font-size: .8rem; color: var(--fg-faint); }

/* ===================================================================
   7. 인북 목차 (우측, 현재 절 안의 h2/h3)
   =================================================================== */

#inbook {
  padding: 38px 14px 40px 2px;
  overflow-y: auto;
  font-size: .78rem;
}
#inbook:empty { display: none; }
.inbook-title {
  padding-left: 12px;
  margin-bottom: 9px;
  font-size: .64rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-faint);
}
#inbook ul, #inbook ol { list-style: none; margin: 0; padding: 0; }

.inbook-link,
#inbook a {
  display: block;
  padding: 4px 11px;
  border-left: 2px solid var(--border);
  line-height: var(--lh-tight);
  color: var(--fg-faint);
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
:is(.inbook-link, #inbook a):hover { color: var(--fg); text-decoration: none; }
/* 현재 보고 있는 절. 왼쪽 선을 액센트로 갈아끼워 "지금 여기"를 표시한다. */
:is(.inbook-link, #inbook a).is-active {
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}
/* h3 는 한 단계 들여쓴다 */
.inbook-link.lv3, #inbook a.lv3, #inbook li li a { padding-left: 24px; font-size: .95em; }

/* ===================================================================
   8. 본문 타이포그래피
   =================================================================== */

#doc :is(h1, h2, h3, h4, h5, h6) {
  position: relative;
  line-height: 1.35;
  letter-spacing: -.015em;
  font-weight: 700;
  /* 앵커로 점프했을 때 제목이 상단바 밑에 숨지 않게 한다. */
  scroll-margin-top: calc(var(--topbar-h) + 18px);
}
#doc h1 { font-size: clamp(1.62rem, 1.2rem + 1.8vw, 2.1rem); margin: 0 0 .7em; font-weight: 800; }
#doc h2 {
  font-size: clamp(1.24rem, 1.05rem + .9vw, 1.5rem);
  margin: 2.6em 0 .8em;
  padding-bottom: .32em;
  border-bottom: 1px solid var(--border);
}
/* 밑줄 왼쪽 끝의 짧은 액센트 — 절의 시작점 표시 */
#doc h2::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 2.2em;
  height: 2px;
  background: var(--accent);
}
#doc h3 { font-size: 1.1rem; margin: 2.1em 0 .6em; }
#doc h4 { font-size: 1rem; margin: 1.7em 0 .5em; color: var(--fg-dim); }
#doc h5, #doc h6 { font-size: .92rem; margin: 1.4em 0 .4em; color: var(--fg-dim); }

/* 앵커(#) 는 평소 숨어 있다가 제목에 마우스를 얹으면 나타난다.
   항상 보이면 목차처럼 생긴 잡음이 제목마다 붙는다. */
.anchor {
  margin-left: .4em;
  color: var(--fg-faint);
  font-weight: 400;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
}
#doc :is(h1, h2, h3, h4, h5, h6):hover .anchor { opacity: .55; }
.anchor:hover, .anchor:focus-visible { opacity: 1; text-decoration: none; color: var(--accent); }

#doc p { margin: 0 0 1.05em; }
#doc :is(ul, ol) { margin: 0 0 1.05em; padding-left: 1.5em; }
#doc li { margin: .32em 0; }
#doc li > :is(ul, ol) { margin: .35em 0 .1em; }
#doc li::marker { color: var(--accent-dim); }
#doc strong { font-weight: 700; color: var(--fg); }
#doc em { font-style: italic; }
#doc del { color: var(--fg-faint); text-decoration-thickness: 1px; }

#doc hr {
  border: 0;
  height: 1px;
  margin: 2.8em 0;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* 태스크 리스트. 마크다운이 <input> 을 넣는 구현일 수도, 아닐 수도 있어
   둘 다 받는다: input 이 있으면 ::before 표식을 끈다. */
li.task { list-style: none; position: relative; padding-left: 1.5em; }
li.task::before {
  content: "";
  position: absolute;
  left: 0;
  top: .5em;
  width: .82em;
  height: .82em;
  border: 1.5px solid var(--fg-faint);
  border-radius: 2px;
}
li.task:has(input)::before { content: none; }
li.task > input[type="checkbox"] { margin-right: .45em; accent-color: var(--accent); }
li.task:has(input:checked) { color: var(--fg-dim); }
li.task.is-done::before, li.task:has(input:checked)::before {
  border-color: var(--w-start);
  background: var(--w-start);
}

blockquote {
  margin: 1.5em 0;
  padding: .1em 0 .1em 1.15em;
  border-left: 3px solid var(--accent-dim);
  color: var(--fg-dim);
}
blockquote > :last-child { margin-bottom: 0; }

/* 형광펜. 확정된 것에만 쓰는 금색(= --w-path)이다. */
mark {
  background: color-mix(in srgb, var(--w-path) 34%, transparent);
  color: inherit;
  padding: .06em .18em;
  border-radius: 2px;
}

code.inline {
  font-family: var(--font-mono);
  font-size: .87em;
  padding: .12em .36em;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg-code);
  color: var(--fg);
  /* 인라인 코드는 긴 식별자가 자주 온다. 여기서 안 끊으면 좁은 폭에서 넘친다. */
  word-break: break-all;
}
a code.inline { color: inherit; border-color: currentColor; }

kbd {
  font-family: var(--font-mono);
  font-size: .78em;
  padding: .12em .42em;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: var(--r-sm);
  background: var(--bg-elev);
  color: var(--fg-dim);
  white-space: nowrap;
}

/* 수식: 렌더링 엔진이 없다(계약 §2.6). 원문을 고정폭으로 조판해
   "이건 수식이다"만 표시한다. 나중에 엔진이 붙어도 이 훅은 유지된다. */
.math {
  font-family: var(--font-mono);
  font-size: .92em;
  padding: .04em .3em;
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--fg-dim);
}
.math-block {
  display: block;
  margin: 1.4em 0;
  padding: .9em 1.1em;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
  color: var(--fg-dim);
  font-family: var(--font-mono);
  font-size: .92em;
  text-align: center;
  /* 긴 수식은 자기 안에서 스크롤한다. body 로 넘기지 않는다. */
  overflow-x: auto;
  white-space: nowrap;
}

/* 내부 상호참조 링크. 외부 링크와 구분되게 점선 밑줄을 준다. */
.xref {
  color: var(--accent);
  border-bottom: 1px dotted var(--accent-dim);
}
.xref:hover { text-decoration: none; border-bottom-style: solid; }
/* 외부 링크에는 작은 표식. 클릭 전에 창이 바뀔 것을 알린다. */
#doc a[target="_blank"]::after {
  content: "↗";
  font-size: .8em;
  margin-left: .15em;
  color: var(--fg-faint);
}

/* ===================================================================
   9. 표
   =================================================================== */

.table-wrap {
  margin: 1.6em 0;
  /* 표는 절대 본문 폭에 맞춰 줄이지 않는다. 자기 안에서 가로 스크롤한다.
     열이 눌려 글자가 세로로 쌓이면 비교표로서의 가치가 없어진다. */
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
}
.table-wrap table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.table-wrap :is(th, td) {
  padding: .58em .85em;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--border);
  line-height: 1.6;
}
.table-wrap th {
  background: var(--bg-code);
  font-weight: 700;
  font-size: .82rem;
  color: var(--fg);
  white-space: nowrap;
}
.table-wrap tbody tr:last-child :is(th, td) { border-bottom: 0; }
.table-wrap tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.table-wrap td code.inline { white-space: nowrap; }

/* ===================================================================
   10. 코드 블록
   =================================================================== */

.codeblock {
  margin: 1.5em 0;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-code);
  /* 모서리 안쪽에서 코드가 삐져나오지 않게 자른다. */
  overflow: hidden;
}

.codeblock-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 6px 12px;
  background: color-mix(in srgb, var(--fg) 5%, var(--bg-code));
  border-bottom: 1px solid var(--border);
  font-size: .74rem;
}
/* title 이 없어도 head 는 남는다(복사 버튼 때문). 그때는 lang 배지가
   왼쪽으로 붙고 버튼이 오른쪽으로 밀리도록 lang 에 auto 마진을 준다. */
.codeblock-title {
  flex: 1 1 auto;
  min-width: 0;
  font-weight: 600;
  color: var(--fg-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.codeblock-lang {
  flex: none;
  margin-left: auto;
  padding: 1px 7px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: .66rem;
  font-weight: 600;
  letter-spacing: .02em;
}
.codeblock-title ~ .codeblock-lang { margin-left: 0; }
.codeblock-copy {
  flex: none;
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg-elev);
  color: var(--fg-dim);
  font-size: .7rem;
  font-weight: 600;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.codeblock-copy:hover { color: var(--accent); border-color: var(--accent); }
.codeblock-copy.is-copied { color: var(--w-start); border-color: var(--w-start); }

pre.code {
  margin: 0;
  padding: 12px 0;
  /* 코드는 절대 줄바꿈하지 않는다. 알고리즘 코드에서 줄이 접히면
     들여쓰기 구조가 무너져 읽는 의미가 사라진다. 대신 여기서 스크롤한다. */
  overflow-x: auto;
  overscroll-behavior-x: contain;
  white-space: pre;
  word-break: normal;
  overflow-wrap: normal;
  tab-size: 4;
  font-family: var(--font-mono);
  font-size: .84rem;
  line-height: 1.65;
  color: var(--fg);
}
/* code 를 max-content 로 두되 최소 100% 를 보장한다. 이래야 강조된 줄의
   배경이 컨테이너 끝(또는 가장 긴 줄 끝)까지 꽉 찬다. */
pre.code > code {
  display: block;
  width: max-content;
  min-width: 100%;
  font: inherit;
}

/* code.lang-<언어> 는 markdown.js 가 붙이는 훅이다(계약 §2.1). 언어별로
   다르게 보일 이유가 없으므로 — 색은 highlight.js 가 --hl-* 로 칠한다 —
   공통 규칙 하나만 건다. 합자를 끄는 이유: 고정폭 폰트가 `!=` `->` `>=` 를
   한 글자(≠ → ≥)로 합쳐 버리면 연산자를 처음 배우는 독자가 원문을
   되짚을 수 없다. 알고리즘 책에서 이건 미관 문제가 아니다. */
pre.code > code[class*="lang-"] { font-variant-ligatures: none; }

/* 줄번호. user-select:none 이 핵심이다 — 코드를 드래그 복사할 때
   줄번호가 같이 딸려오면 붙여넣은 코드가 컴파일되지 않는다. */
.ln {
  display: inline-block;
  width: var(--ln-w);
  padding-right: .9em;
  text-align: right;
  color: var(--fg-faint);
  opacity: .6;
  user-select: none;
  -webkit-user-select: none;
  font-variant-numeric: tabular-nums;
}

/* .line 은 inline-block + min-width 로 "한 줄 = 한 행 상자"를 만든다.
   마크업이 줄마다 래퍼를 주지 않으므로(계약 §2.1) flex 행을 쓸 수 없다.
   min-width 를 100% - 거터 로 두면 강조 배경이 오른쪽 끝까지 이어진다. */
.line {
  display: inline-block;
  min-width: calc(100% - var(--ln-w));
  padding-right: 14px;
}
.line.hl { background: var(--code-hl-bg); }
/* 강조 줄의 배경을 줄번호 거터까지 잇는다. .ln 에는 hl 클래스가 없으므로
   :has(+ .line.hl) 로 "다음 형제가 강조 줄인 번호"를 집어낸다. */
.ln:has(+ .line.hl) {
  background: var(--code-hl-bg);
  box-shadow: inset 3px 0 0 var(--code-hl-bar);
  opacity: 1;
  color: var(--code-hl-bar);
}

/* 줄번호 없는 모드(```text nolines```). 거터가 없으니 왼쪽 여백을 직접 준다. */
pre.code.nolines .line { min-width: 100%; padding-left: 14px; }
pre.code.nolines .line.hl { box-shadow: inset 3px 0 0 var(--code-hl-bar); }

/* 상자 안의 코드 블록은 여백을 줄인다. 상자가 이미 여백을 갖고 있다. */
.box-body .codeblock, .dual-pane .codeblock { margin: .9em 0; }
.box-body > .codeblock:first-child, .dual-pane > .codeblock:first-child { margin-top: 0; }
.box-body > .codeblock:last-child, .dual-pane > .codeblock:last-child { margin-bottom: 0; }

/* ===================================================================
   11. 구문 강조 (계약 §6: 토큰명 = 클래스명)
   =================================================================== */

.hl-kw   { color: var(--hl-kw); font-weight: 600; }
.hl-str  { color: var(--hl-str); }
.hl-num  { color: var(--hl-num); }
.hl-com  { color: var(--hl-com); font-style: italic; }
.hl-fn   { color: var(--hl-fn); }
.hl-type { color: var(--hl-type); }
.hl-op   { color: var(--hl-op); }
.hl-pre  { color: var(--hl-pre); }
/* 셸·콘솔 프롬프트는 복사에서 빼야 붙여넣은 명령이 그대로 돈다. */
.hl-pre[data-prompt], .codeblock[data-lang="console"] .hl-pre {
  user-select: none;
  -webkit-user-select: none;
}

/* ===================================================================
   12. ::: dual — 이중 언어 탭 (이 책의 간판 컴포넌트)
   Python 과 C++ 를 같은 자리에서 갈아끼우는 것이 이 책의 정체성이라
   "탭 하나 얹은 코드블록"이 아니라 하나의 부품으로 보이게 짠다.
   =================================================================== */

.dual {
  margin: 1.6em 0;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
  overflow: hidden;
}

.dual-tabs {
  display: flex;
  gap: 0;
  padding: 0 6px;
  background: color-mix(in srgb, var(--fg) 4%, var(--bg-elev));
  border-bottom: 1px solid var(--border);
}
.dual-tab {
  position: relative;
  padding: 9px 15px 8px;
  font-size: .82rem;
  font-weight: 600;
  color: var(--fg-faint);
  transition: color var(--dur) var(--ease);
}
.dual-tab:hover { color: var(--fg); }
/* 활성 탭은 밑줄 하나로만 표시한다. 배경까지 칠하면 탭 줄이 무거워져
   본문에서 코드블록이 두 겹 상자로 보인다. */
.dual-tab.is-active { color: var(--accent); }
.dual-tab.is-active::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
}

.dual-pane { display: none; padding: 10px 10px; }
.dual-pane.is-active { display: block; }
/* 패널 안의 코드블록은 이미 dual 컨테이너가 테두리를 갖고 있으므로
   테두리를 지워 이중 테두리를 막는다. */
.dual-pane .codeblock { border: 0; border-radius: var(--r-sm); }
.dual-pane .codeblock-head { border-radius: var(--r-sm) var(--r-sm) 0 0; }

/* ---- "둘 다" 모드 ----
   탭 줄을 숨기고 두 패널을 세로로 쌓는다. 어느 쪽이 어느 언어인지
   즉시 알아야 하므로 패널마다 작은 언어 라벨을 붙인다. */
.dual.is-both .dual-tabs { display: none; }
.dual.is-both .dual-pane { display: block; }
.dual.is-both .dual-pane + .dual-pane { border-top: 1px solid var(--border); }
.dual.is-both .dual-pane::before {
  content: attr(data-dual-lang);
  display: block;
  margin: 2px 2px 8px;
  font-family: var(--font-mono);
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-faint);
}
/* attr() 은 "python"/"cpp" 를 그대로 준다. 사람이 읽는 표기로 바꾼다. */
.dual.is-both .dual-pane[data-dual-lang="python"]::before { content: "Python"; }
.dual.is-both .dual-pane[data-dual-lang="cpp"]::before { content: "C++"; }

/* ===================================================================
   13. 표시 상자 ::: <kind>
   패턴: 왼쪽 3px 액센트 바 + 그 색의 아주 옅은 배경 틴트.
   14종이 한 화면에 여러 개 뜨므로 장식을 더하면 지면이 시끄러워진다.
   종류 구분은 "색 + 라벨" 로만 한다. 예외는 연습 상자(§아래)뿐이다.
   =================================================================== */

.box {
  --box: var(--fg-faint);          /* 종류별로 갈아끼우는 정체성 색 */
  margin: 1.6em 0;
  border: 1px solid color-mix(in srgb, var(--box) 26%, var(--border));
  border-left: 3px solid var(--box);
  border-radius: var(--r);
  background: color-mix(in srgb, var(--box) 7%, var(--bg));
  overflow: hidden;
}
.box-title {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px 6px;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--box);
}
.box-body { padding: 2px 14px 12px; font-size: .96em; }
.box-body > :first-child { margin-top: 0; }
.box-body > :last-child { margin-bottom: 0; }
/* 중첩 상자(::: quiz 안의 ::: answer)는 바깥 여백을 줄여 계단이 되지 않게 한다. */
.box .box { margin: 1em 0; }

.box-lead      { --box: var(--box-lead); }
.box-note      { --box: var(--box-note); }
.box-tip       { --box: var(--box-tip); }
.box-warn      { --box: var(--box-warn); }
.box-danger    { --box: var(--box-danger); }
.box-deep      { --box: var(--box-deep); }
.box-perf      { --box: var(--box-perf); }
.box-hist      { --box: var(--box-hist); }
.box-trace     { --box: var(--box-trace); }
.box-pitfall   { --box: var(--box-pitfall); }
.box-classify  { --box: var(--box-classify); }
.box-interview { --box: var(--box-interview); }
.box-quiz      { --box: var(--box-quiz); }
.box-answer    { --box: var(--box-answer); }

/* ---- lead: 제목 줄이 없는 도입부 ----
   챕터 맨 앞에서 "이 챕터가 답하는 질문"을 던진다. 다른 상자와 달리
   본문의 일부처럼 읽혀야 하므로 왼쪽 바를 빼고 위아래 선으로 감싼다. */
.box-lead {
  margin: 0 0 2.2em;
  padding: 0;
  border: 0;
  border-top: 2px solid var(--box);
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: none;
}
.box-lead .box-body {
  padding: 1.1em 0 1.2em;
  font-size: 1.06em;
  line-height: 1.78;
  color: var(--fg-dim);
}
.box-lead .box-body > p:first-child { margin-top: 0; }

/* ---- 위험은 한 단계 더 무겁게 ----
   danger 만 배경 틴트를 올린다. "여기서 틀리면 실제로 부서진다"가
   note 와 같은 무게로 보이면 경고가 작동하지 않는다. */
.box-danger { background: color-mix(in srgb, var(--box) 12%, var(--bg)); }

/* ---- 연습 상자: trace / classify / quiz ----
   나머지는 "읽는" 상자고 이 셋은 "손을 움직이는" 상자다. 그 차이를
   점선 테두리로 표시한다 — 점선은 "아직 채워지지 않은 칸"의 관습이다. */
.box-trace,
.box-classify,
.box-quiz {
  border-style: dashed;
  border-left-style: solid;
  background: color-mix(in srgb, var(--box) 5%, var(--bg-elev));
}
.box-trace .box-title::after,
.box-classify .box-title::after,
.box-quiz .box-title::after {
  content: "연습";
  margin-left: auto;
  padding: 1px 7px;
  border: 1px solid currentColor;
  border-radius: 99px;
  font-size: .62rem;
  font-weight: 700;
  opacity: .75;
}
/* 손추적 상자에만 아주 옅은 괘선을 깐다. 종이에 표를 채우는 행위를
   화면에서 흉내내는 것이라 배경으로 그 은유를 남긴다. */
.box-trace .box-body {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0 calc(1.8em - 1px),
    color-mix(in srgb, var(--box) 14%, transparent) calc(1.8em - 1px) 1.8em
  );
  background-attachment: local;
}
/* 표가 들어오면 괘선이 표와 겹쳐 지저분해진다. 표 자신은 불투명하게. */
.box-trace .table-wrap { background: var(--bg-elev); }

/* ---- classify: 4항목 불릿에 키별 색 표식 ----
   신호어/제약조건/혼동 주의/반례 함정을 색으로 구분하면 스캔이 빨라진다.
   같은 뜻의 축을 쓰는 위젯 토큰을 재사용해 책 전체의 색 문법을 맞춘다. */
.box-classify li[data-classify-key] {
  list-style: none;
  position: relative;
  padding-left: 1.15em;
}
.box-classify li[data-classify-key]::before {
  content: "";
  position: absolute;
  left: 0;
  top: .62em;
  width: .5em;
  height: .5em;
  border-radius: 1px;
  background: var(--key);
}
li[data-classify-key="signals"]     { --key: var(--w-frontier); }
li[data-classify-key="constraints"] { --key: var(--box-warn); }
li[data-classify-key="confusion"]   { --key: var(--box-pitfall); }
li[data-classify-key="traps"]       { --key: var(--box-danger); }

/* ---- answer: <details>/<summary> ---- */
details.box-answer { padding: 0; }
details.box-answer > summary.box-title {
  cursor: pointer;
  list-style: none;
  padding: 9px 14px;
  user-select: none;
  -webkit-user-select: none;
}
details.box-answer > summary::-webkit-details-marker { display: none; }
/* 접힘/펼침 삼각형. summary 를 flex 로 두고 앞에 붙인다. */
details.box-answer > summary.box-title::before {
  content: "";
  flex: none;
  width: 0;
  height: 0;
  border-left: 6px solid currentColor;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform var(--dur) var(--ease);
}
details.box-answer[open] > summary.box-title::before { transform: rotate(90deg); }
/* 접혀 있을 때 "펼치면 정답이 나온다"를 말해 준다. 안 그러면 그냥
   제목 줄로 보여서 클릭할 생각을 못 한다. */
details.box-answer > summary.box-title::after {
  content: "펼치기";
  margin-left: auto;
  font-size: .68rem;
  font-weight: 600;
  opacity: .7;
}
details.box-answer[open] > summary.box-title::after { content: "접기"; }
details.box-answer > summary:hover { background: color-mix(in srgb, var(--box) 10%, transparent); }
details.box-answer[open] > summary.box-title { border-bottom: 1px dashed color-mix(in srgb, var(--box) 40%, transparent); }
details.box-answer > .box-body { padding-top: 10px; }

/* ===================================================================
   14. 위젯 (M2 에서 채워진다)
   data-opts 는 위젯에 넘기는 JSON 페이로드일 뿐 표시 의미가 없다.
   일부러 스타일을 걸지 않는다 — 데이터에 모양을 걸면 옵션이 바뀔 때마다
   CSS 가 따라 바뀌어야 한다.
   =================================================================== */

.widget {
  margin: 1.7em 0;
  min-width: 0;
  min-height: 120px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
  /* 위젯 내부가 넓어지면 위젯이 스크롤한다. 본문이 넘치면 안 된다. */
  overflow-x: auto;
  overscroll-behavior-x: contain;
}
/* 아직 구현되지 않은 타입의 자리표시자. app.js 가 텍스트를 넣지 못한
   경우에도(빈 div) 무엇이 빠졌는지 화면에 남는다. */
.widget:empty {
  display: grid;
  place-items: center;
  border-style: dashed;
  color: var(--fg-faint);
  font-size: .82rem;
}
.widget:empty::after {
  content: "위젯 " attr(data-widget) " — 준비 중";
  font-family: var(--font-mono);
}
.widget canvas, .widget svg { display: block; max-width: 100%; }

/* 넓은 위젯. grid-search 4분할처럼 넓을수록 좋은 것에만 붙인다.
   1400px 미만에서는 그냥 본문 폭이다(아래 반응형 §17 에서만 벌어진다). */
.widget.wide { width: 100%; }

/* ===================================================================
   15. 페이저 (이전 절 / 다음 절)
   =================================================================== */

#pager {
  max-width: var(--measure);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 30px 0 64px;
  border-top: 1px solid var(--border);
  margin-top: 3em;
}
#pager:empty { display: none; }

.pager-link,
#pager > a {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-elev);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
:is(.pager-link, #pager > a):hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, var(--bg-elev));
  text-decoration: none;
}
:is(.pager-link, #pager > a).next { text-align: right; }
:is(.pager-link, #pager > a).next { grid-column: 2; }
.pager-dir { font-size: .68rem; font-weight: 700; letter-spacing: .05em; color: var(--accent); }
.pager-title {
  font-size: .88rem;
  font-weight: 600;
  color: var(--fg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ===================================================================
   16. 모달 — 검색 / 복습
   계약은 컨테이너 id 와 hidden 속성만 규정한다. 안쪽은 아래 훅을
   확장 규약으로 삼되, 클래스가 없어도 최소한 읽히도록 요소로도 받는다.
   =================================================================== */

#search-modal,
#review-modal {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: clamp(12px, 7vh, 84px) 14px 14px;
  background: var(--scrim);
  backdrop-filter: blur(2px);
}
#review-modal { align-items: center; padding-block: 14px; }

.modal-panel,
#search-modal > div,
#review-modal > div {
  display: flex;
  flex-direction: column;
  width: min(680px, 100%);
  max-height: min(74dvh, 640px);
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg-elev);
  box-shadow: var(--shadow);
  overflow: hidden;
}
#review-modal .modal-panel, #review-modal > div { width: min(560px, 100%); }

.modal-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: .84rem; font-weight: 700; color: var(--fg-dim); }
.modal-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px;
}
.modal-foot {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-top: 1px solid var(--border);
  font-size: .7rem;
  color: var(--fg-faint);
}

/* 검색 입력 */
#search-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 10px 12px;
  border: 0;
  background: none;
  color: var(--fg);
  font-size: 1rem;
}
#search-input::placeholder { color: var(--fg-faint); }
#search-modal .modal-head { padding: 4px 12px; }

#search-results { list-style: none; margin: 0; padding: 0; }
.sr-item {
  display: block;
  padding: 9px 11px;
  border-radius: var(--r);
  border: 1px solid transparent;
  color: inherit;
}
/* 마우스 hover 와 키보드 선택(.is-active)이 같은 모양이어야
   ↑↓ 로 훑을 때 "지금 어디"가 흔들리지 않는다. */
.sr-item:hover,
.sr-item.is-active {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border-color: color-mix(in srgb, var(--accent) 34%, transparent);
  text-decoration: none;
}
.sr-crumb { font-size: .68rem; font-weight: 600; color: var(--fg-faint); margin-bottom: 2px; }
.sr-title { font-size: .88rem; font-weight: 600; color: var(--fg); }
.sr-snippet {
  margin-top: 3px;
  font-size: .78rem;
  line-height: 1.55;
  color: var(--fg-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sr-empty { padding: 40px 14px; text-align: center; color: var(--fg-faint); font-size: .84rem; }

/* 복습(SRS) 카드 */
.srs-card { padding: 18px 18px 14px; }
.srs-meta { font-size: .68rem; font-weight: 600; letter-spacing: .05em; color: var(--fg-faint); text-transform: uppercase; }
.srs-front { margin: 10px 0 0; font-size: 1.02rem; line-height: 1.7; }
.srs-back {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
  color: var(--fg-dim);
}
/* 평가 4단계: 모름 / 어려움 / 보통 / 쉬움. 좁은 화면에서 두 줄로 접힌다. */
.srs-grade {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--border);
}
.grade-btn {
  padding: 9px 6px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg);
  font-size: .8rem;
  font-weight: 600;
  color: var(--fg-dim);
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.grade-btn:hover { color: var(--fg); border-color: var(--fg-faint); }
/* 난이도를 색으로 예고한다 — 누르기 전에 무슨 버튼인지 알아야 한다. */
.grade-btn[data-grade="0"]:hover { border-color: var(--w-goal); color: var(--w-goal); }
.grade-btn[data-grade="1"]:hover { border-color: var(--box-warn); color: var(--box-warn); }
.grade-btn[data-grade="2"]:hover { border-color: var(--accent); color: var(--accent); }
.grade-btn[data-grade="3"]:hover { border-color: var(--w-start); color: var(--w-start); }

/* ===================================================================
   17. 반응형 (계약 §5)

   ≥1400px  3단 + .widget.wide 가 본문 폭을 넘는다
   1000~1400px  인북 목차 숨김, 2단
   700~1000px   사이드바를 오버레이 드로어로, 본문 1단
   <700px       단일 컬럼, 상단바 압축, 언어 토글 축소

   어느 폭에서도 body 에 가로 스크롤이 생기지 않는다. 방어선은 네 겹이다:
   (1) grid 칼럼 minmax(0,1fr) + #main{min-width:0}
   (2) body{overflow-wrap:anywhere} 로 긴 라틴 토큰 강제 분해
   (3) .table-wrap / pre.code / .widget / .math-block 각자 overflow-x:auto
   (4) html,body{overflow-x:clip} 안전망
   =================================================================== */

/* ---- ≥1400px: 넓은 위젯 breakout ----
   #doc 은 --measure 로 좁혀져 있다. .widget.wide 만 좌우로 벌린다.
   벌림폭을 뷰포트 기준으로 계산하는 이유: 여유 공간은 (뷰포트 - 1400px)
   만큼만 늘어나므로 그 절반 이하로 잡으면 #main 을 절대 넘지 않는다.
   140px 상한을 둬 아무리 넓어도 위젯이 화면을 지배하지 않게 한다. */
@media (min-width: 1400px) {
  .widget.wide {
    --bleed: min(140px, max(0px, (100vw - 1400px) / 2));
    width: calc(100% + var(--bleed) * 2);
    margin-left: calc(var(--bleed) * -1);
  }
}

/* ---- 1000~1400px: 인북 목차 접기 ----
   3단을 유지하면 본문이 60ch 아래로 눌린다. 읽는 폭이 우선이다. */
@media (max-width: 1399.98px) {
  #layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  #inbook { display: none; }
}

/* ---- <1000px: 사이드바를 드로어로 ---- */
@media (max-width: 999.98px) {
  #layout { grid-template-columns: minmax(0, 1fr); }

  #btn-menu { display: grid; }

  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: var(--z-drawer);
    width: min(320px, 86vw);
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    border-right: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: translateX(-101%);
    transition: transform var(--dur) var(--ease);
    /* -101% 로 미는 이유: 정확히 -100% 면 그림자가 화면 왼쪽에 1px 걸쳐
       보이는 브라우저가 있다. */
  }
  :is(body.nav-open) #sidebar,
  #sidebar.is-open { transform: none; }
  /* 드로어가 열린 동안 뒤 본문이 스크롤되면 방향 감각을 잃는다. */
  body.nav-open { overflow: hidden; }

  #main { padding: 0 clamp(16px, 4vw, 32px); }
  #doc { padding-top: 28px; }
  #pager { grid-template-columns: 1fr; }
  :is(.pager-link, #pager > a).next { grid-column: 1; text-align: left; }
}
/* 1000px 이상에서는 메뉴 버튼이 필요 없다(사이드바가 늘 보인다). */
@media (min-width: 1000px) { #btn-menu { display: none; } }

/* ---- <700px: 폰 ---- */
@media (max-width: 699.98px) {
  :root {
    --topbar-h: 50px;
    --measure: 100%;      /* ch 제한이 의미 없는 폭. 여백만 남긴다. */
    --ln-w: 2.6em;
  }

  /* 360px 기준 상단바 폭 예산:
     좌우 패딩 20 + 갭 12 + 브랜드 ~100 + 언어 토글 ~90 + 아이콘 4×30 = 342.
     이 예산을 넘기면 브랜드 글자가 잘리도록(#brand{overflow:hidden}) 해 뒀고,
     그래도 body 에 가로 스크롤은 생기지 않는다. */
  #topbar { gap: 2px; padding-inline: 10px; }
  #brand { font-size: .9rem; padding-inline: 2px; gap: 6px; }
  #brand::before { width: 11px; height: 11px; box-shadow: none; }
  .icon-btn { width: 30px; height: 30px; }
  .icon-btn svg { width: 17px; height: 17px; }

  /* 언어 토글을 아이콘 폭으로 줄인다. DOM 의 글자("Python")는 그대로 두고
     화면에만 짧은 라벨을 씌운다 — 스크린리더는 원래 텍스트를 계속 읽는다. */
  .seg { padding: 1px; }
  #lang-toggle .seg-btn {
    width: 28px;
    padding: 5px 0;
    font-size: 0;
    text-align: center;
  }
  #lang-toggle .seg-btn::before { font-size: .68rem; font-weight: 700; }
  #lang-toggle .seg-btn[data-lang="python"]::before { content: "Py"; }
  #lang-toggle .seg-btn[data-lang="cpp"]::before { content: "C++"; }
  #lang-toggle .seg-btn[data-lang="both"]::before { content: "둘"; }

  #main { padding: 0 14px; }
  #doc { padding-top: 22px; }

  #doc h2 { margin-top: 2.1em; }
  pre.code { font-size: .78rem; }
  .table-wrap table { font-size: .82rem; }
  .box-title { padding-inline: 11px; }
  .box-body { padding-inline: 11px; }
  .dual-pane { padding: 8px 7px; }
  .dual-tab { padding: 8px 11px; font-size: .78rem; }
  .widget { padding: 8px; }

  /* 모달은 폰에서 화면 전체를 쓴다. 가운데 떠 있는 작은 창은
     엄지로 닫기 어렵고 목록도 몇 줄 안 보인다. */
  #search-modal, #review-modal { padding: 0; }
  .modal-panel, #search-modal > div, #review-modal > div {
    width: 100%;
    max-height: 100dvh;
    height: 100dvh;
    border: 0;
    border-radius: 0;
  }
  #review-modal .modal-panel, #review-modal > div { height: auto; max-height: 100dvh; }
}

/* ===================================================================
   18. 인쇄 · 접근성
   =================================================================== */

/* 움직임 최소화 요청은 장식보다 우선한다. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

@media print {
  /* 종이에는 색 틴트가 잘 안 나온다. 상자의 정체는 왼쪽 굵은 선 + 라벨로
     유지하고, 배경은 강제 출력에 의존하지 않도록 흰색으로 둔다. */
  :root, :root[data-theme="dark"], :root[data-theme="light"] {
    --bg: #fff;
    --bg-elev: #fff;
    --bg-code: #f4f4f4;
    --fg: #000;
    --fg-dim: #333;
    --fg-faint: #666;
    --border: #bbb;
  }

  #topbar, #sidebar, #inbook, #overlay,
  #search-modal, #review-modal, #pager,
  .codeblock-copy, .anchor { display: none !important; }

  #layout { display: block; }
  #main { padding: 0; }
  #doc { max-width: none; padding: 0; }

  body { font-size: 10.5pt; line-height: 1.55; }

  /* 코드가 잘리면 안 된다. 화면에서는 가로 스크롤이 답이지만
     종이에는 스크롤이 없으므로 여기서만 줄바꿈을 허용한다. */
  pre.code {
    overflow: visible !important;
    white-space: pre-wrap !important;
    word-break: break-all;
  }
  pre.code > code { width: auto; min-width: 0; }
  .line { display: inline; min-width: 0; }
  .table-wrap, .widget, .math-block { overflow: visible !important; }

  /* dual 은 종이에서 탭이 무의미하다. 두 언어를 다 찍는다. */
  .dual-tabs { display: none !important; }
  .dual-pane { display: block !important; }
  .dual-pane + .dual-pane { border-top: 1px solid #bbb; }
  .dual-pane::before {
    content: attr(data-dual-lang);
    display: block;
    font-weight: 700;
    font-size: 9pt;
    margin-bottom: 4pt;
  }
  .dual-pane[data-dual-lang="python"]::before { content: "Python"; }
  .dual-pane[data-dual-lang="cpp"]::before { content: "C++"; }

  /* 접힌 정답은 종이에서 펼쳐 둔다. 인쇄본은 나중에 혼자 읽는 물건이라
     "펼치기"를 누를 방법이 없다. */
  details.box-answer > .box-body { display: block !important; }
  details.box-answer > summary::after { content: "" !important; }

  .box { border-left-width: 4px; break-inside: avoid; }
  .box-trace .box-body { background-image: none; }
  .codeblock, .table-wrap, .box, .widget { break-inside: avoid; }
  :is(h1, h2, h3) { break-after: avoid; }

  a { color: #000; text-decoration: underline; }
  /* 외부 링크는 URL 을 펼쳐 준다. 내부 해시 링크는 종이에서 의미가 없다. */
  #doc a[target="_blank"]::after { content: " (" attr(href) ")"; font-size: .8em; }
  .xref { border-bottom: 0; }
}

/* ===================================================================
   19. 앱 크롬 — app.js 가 만들어 내는 마크업

   앞 절들은 마크다운 렌더 결과(계약 §2)와 index.html 골격(계약 §4)을 다뤘다.
   이 절은 app.js 가 실행 시점에 만드는 것들이다: 목차 트리, 진도 표시,
   검색 결과, 복습 카드, 표지. 계약서에 열거되지 않았던 부분이라 뒤에 붙인다.
   =================================================================== */

/* ---- 건너뛰기 링크: 키보드 사용자가 상단바를 매번 지나치지 않게 ---- */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: calc(var(--z-modal) + 1);
  padding: 10px 16px;
  background: var(--accent);
  color: var(--accent-fg);
  border-radius: 0 0 var(--r) 0;
  font-weight: 700;
}
.skip-link:focus { left: 0; }

/* ---- 공용 버튼 ---- */
.btn {
  font: inherit;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 9px 16px;
  cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:active { background: color-mix(in srgb, var(--accent) 14%, var(--bg-elev)); }

.text-btn {
  font: inherit;
  font-size: .82rem;
  color: var(--fg-faint);
  background: none;
  border: 0;
  padding: 4px 2px;
  cursor: pointer;
}
.text-btn:hover { color: var(--box-danger); }

/* ---- 사이드바: 목차 트리 ---- */
.sidebar-head { flex: none; padding: 12px 12px 8px; }
.sidebar-head #toc-filter { margin: 0; width: 100%; }

#toc-tree {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;   /* 목차 끝에서 본문이 따라 스크롤되지 않게 */
  padding: 0 8px 16px;
}

.toc-part { margin-bottom: 14px; }
.toc-part[hidden] { display: none; }

.toc-part-title {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0;
  padding: 9px 8px 6px;
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .02em;
  color: var(--fg-faint);
  background: var(--bg-elev);
  /* sticky 헤더가 반투명하면 아래 글자가 비쳐 읽기 어렵다. 불투명하게 둔다. */
}
.toc-part-num { color: var(--accent); }

.toc-list { list-style: none; margin: 0; padding: 0; }
.toc-list li[hidden] { display: none; }

.toc-link {
  display: grid;
  grid-template-columns: 3.1em 1fr;
  gap: 8px;
  align-items: baseline;
  padding: 6px 8px;
  border-radius: var(--r-sm);
  color: var(--fg-dim);
  font-size: .855rem;
  line-height: 1.45;
  text-decoration: none;
  border-left: 2px solid transparent;
}
.toc-link:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); text-decoration: none; }

.toc-num { color: var(--fg-faint); font-size: .78rem; font-variant-numeric: tabular-nums; }
.toc-title { word-break: keep-all; }

/* 아직 안 쓰인 절. 목차에는 두되 클릭 대상으로 보이지 않게 낮춘다 —
   무엇이 남았는지가 보여야 진행 상황을 알 수 있다. */
.toc-link.is-empty { opacity: .42; }

.toc-link.is-done .toc-num::after {
  content: "·";
  margin-left: 3px;
  color: var(--w-path);
  font-weight: 900;
}

.toc-link.is-current {
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  border-left-color: var(--accent);
  color: var(--fg);
  font-weight: 700;
}

/* ---- 사이드바: 진도 ---- */
.sidebar-foot {
  flex: none;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#progress-line { display: flex; flex-direction: column; gap: 5px; }
.progress-bar {
  height: 4px;
  border-radius: 2px;
  background: color-mix(in srgb, var(--fg) 12%, transparent);
  overflow: hidden;
}
.progress-bar > span {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width var(--dur) var(--ease);
}
.progress-text { font-size: .76rem; color: var(--fg-faint); font-variant-numeric: tabular-nums; }

/* ---- 본문 끝: 완료 버튼 ---- */
.done-row { margin: 3em 0 1em; display: flex; justify-content: center; }
.done-btn.is-done {
  border-color: var(--w-path);
  color: var(--w-path);
  background: color-mix(in srgb, var(--w-path) 12%, transparent);
}

/* ---- 안내 화면 (없는 절 / 빌드 안 됨) ---- */
.notice {
  margin: 3em 0;
  padding: 24px;
  border: 1px dashed var(--border);
  border-radius: var(--r-lg);
  color: var(--fg-dim);
}
.notice h1 { margin-top: 0; }

/* ---- 위젯 자리표시자 ---- */
.widget-placeholder {
  padding: 26px 16px;
  text-align: center;
  color: var(--fg-faint);
  font-size: .86rem;
}
.widget.is-error .widget-placeholder { color: var(--box-danger); }

/* ---- 검색 결과 ---- */
.search-results { overflow-y: auto; max-height: min(58vh, 460px); }
.search-empty { padding: 28px 16px; text-align: center; color: var(--fg-faint); font-size: .88rem; }

.search-hit {
  display: block;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--fg-dim);
  text-decoration: none;
  border-left: 2px solid transparent;
}
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover,
.search-hit.is-active {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border-left-color: var(--accent);
  text-decoration: none;
}
.search-ch { display: block; font-size: .76rem; color: var(--accent); font-weight: 700; }
.search-h { display: block; font-size: .9rem; color: var(--fg); font-weight: 600; margin-top: 1px; }
.search-snip {
  display: block;
  margin-top: 3px;
  font-size: .8rem;
  color: var(--fg-faint);
  line-height: 1.5;
  /* 스니펫이 길어져도 결과 목록의 리듬이 깨지지 않게 두 줄로 자른다. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.modal-hint {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  font-size: .74rem;
  color: var(--fg-faint);
  display: flex;
  gap: 6px;
  align-items: center;
}

/* ---- 복습 큐 ---- */
.review-body { padding: 22px; }
.review-count {
  font-size: .76rem;
  color: var(--fg-faint);
  font-variant-numeric: tabular-nums;
  margin-bottom: 14px;
}
.review-front { font-size: 1.05rem; line-height: 1.7; }
.review-back {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
  color: var(--fg-dim);
}
.review-grades { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.review-grades .btn { flex: 1 1 0; min-width: 74px; padding: 10px 8px; }

/* 채점 버튼은 색으로 난이도를 구분한다. 넷을 같은 색으로 두면
   손이 기억하지 못해 매번 글자를 읽어야 한다. */
.grade-0 { border-color: var(--box-danger); color: var(--box-danger); }
.grade-1 { border-color: var(--box-warn); color: var(--box-warn); }
.grade-2 { border-color: var(--fg-dim); }
.grade-3 { border-color: var(--w-path); color: var(--w-path); }

.review-jump { display: inline-block; margin-top: 16px; font-size: .84rem; }
.review-empty { text-align: center; padding: 18px 4px; }
.review-empty h2 { margin: 0 0 8px; font-size: 1.15rem; }
.review-empty p { color: var(--fg-dim); margin-bottom: 20px; }

/* ---- 표지 ---- */
.home { padding-top: 12px; }
.home-title { font-size: clamp(2rem, 1.4rem + 2.6vw, 2.9rem); margin: 0 0 .2em; font-weight: 800; letter-spacing: -.01em; }
.home-sub { color: var(--fg-dim); font-size: 1.02rem; margin: 0 0 2em; }

.home-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 2em; }
.stat {
  flex: 1 1 108px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg-elev);
}
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .76rem; color: var(--fg-faint); }

.home-review { margin-bottom: 2.4em; }

.home-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.home-part {
  display: grid;
  gap: 3px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg-elev);
  color: inherit;
  text-decoration: none;
  border-left: 3px solid var(--accent);
}
.home-part:hover { border-color: var(--accent); text-decoration: none; }
.home-part-num { font-size: .74rem; font-weight: 800; color: var(--accent); }
.home-part-title { font-weight: 700; }
.home-part-desc { font-size: .8rem; color: var(--fg-faint); line-height: 1.55; word-break: keep-all; }
.home-part-count { font-size: .74rem; color: var(--fg-faint); font-variant-numeric: tabular-nums; margin-top: 4px; }

@media (max-width: 699.98px) {
  .review-body { padding: 16px; }
  .review-grades .btn { min-width: 0; padding: 10px 4px; font-size: .84rem; }
  .home-parts { grid-template-columns: 1fr; }
}

@media print {
  .skip-link, .done-row, .home-stats, .home-review { display: none; }
}

/* 모달이 열린 동안 뒤 본문이 스크롤되면 닫았을 때 읽던 자리를 잃는다. */
body.modal-open { overflow: hidden; }
.review-card { min-height: 0; }

/* ===================================================================
   20. 위젯 런타임 크롬 (assets/widgets/_runtime.js 가 만드는 DOM)

   위젯 본체가 무엇을 그리든 껍데기·재생 컨트롤·상태 줄은 공통이다.
   여기서 한 번만 정의하고 위젯 20여 종이 재사용한다.
   =================================================================== */

.wk { display: flex; flex-direction: column; gap: 8px; }
.wk:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: var(--r); }

.wk-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wk-title { font-size: .82rem; font-weight: 700; color: var(--fg-dim); }
.wk-slot { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.wk-stage {
  position: relative;
  min-width: 0;
  overflow-x: auto;      /* 격자가 좁은 화면보다 넓어도 body 를 밀지 않는다 */
  overscroll-behavior-x: contain;
}
.wk-canvas { display: block; max-width: 100%; }

/* ---- 재생 컨트롤 ---- */
.wk-ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.wk-btn {
  font: inherit;
  font-size: .82rem;
  line-height: 1;
  min-width: 32px;
  height: 30px;
  padding: 0 9px;
  color: var(--fg-dim);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
}
.wk-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.wk-btn:disabled { opacity: .35; cursor: default; }
/* ◀ 는 유니코드에 좌향 삼각형이 따로 있지만 폰트마다 폭이 들쭉날쭉하다.
   같은 글리프를 뒤집어 쓰면 두 버튼의 크기가 확실히 같아진다. */
.wk-ctl .wk-btn:nth-child(2) { transform: scaleX(-1); }
.wk-play.is-playing { color: var(--accent); border-color: var(--accent); }

.wk-range { flex: 1 1 120px; min-width: 80px; accent-color: var(--accent); }
.wk-count { font-size: .76rem; color: var(--fg-faint); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }

.wk-speed {
  font: inherit;
  font-size: .76rem;
  height: 30px;
  padding: 0 4px;
  color: var(--fg-dim);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}

/* ---- 상태 줄: 이번 스텝에 무슨 일이 일어났는지 ----
   색만으로 전달하면 색을 구분하지 못하는 독자에게 위젯이 통째로 사라진다.
   그래서 이 줄은 장식이 아니라 본문이다. min-height 로 자리를 미리 잡아
   글자가 들어올 때 아래 내용이 튀지 않게 한다. */
.wk-status {
  min-height: 2.6em;
  font-size: .8rem;
  line-height: 1.55;
  color: var(--fg-dim);
  padding: 7px 10px;
  background: var(--bg-code);
  border-radius: var(--r-sm);
  word-break: keep-all;
}
.wk-status:empty::before { content: "재생하거나 ▶ 를 눌러 한 스텝씩 본다."; color: var(--fg-faint); }

/* ---- 위젯 안의 작은 세그먼트 선택기 ---- */
.wk-seg { display: inline-flex; gap: 1px; padding: 1px; background: var(--bg-code); border-radius: var(--r-sm); }
.wk-seg-btn {
  font: inherit;
  font-size: .74rem;
  padding: 5px 9px;
  color: var(--fg-faint);
  background: none;
  border: 0;
  border-radius: 2px;
  cursor: pointer;
}
.wk-seg-btn:hover { color: var(--fg); }
.wk-seg-btn.is-active { color: var(--accent-fg); background: var(--accent); font-weight: 700; }

/* ---- 범례: 색이 무엇을 뜻하는지 ---- */
.wk-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .74rem; color: var(--fg-faint); }
.wk-legend span { display: inline-flex; align-items: center; gap: 5px; }
.wk-legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }

@media (max-width: 699.98px) {
  .wk-count { min-width: 0; font-size: .72rem; }
  .wk-range { flex-basis: 60px; }
  .wk-title { font-size: .78rem; }
}

</style>

<script>
/* highlight.js — 의존성 없는 구문 강조기 (Algorithmic)
 *
 * window.HL.highlight(code, lang) -> HTML 문자열. 이스케이프까지 여기서 책임진다.
 * 지원 lang: python cpp text bash json console (+ 몇 가지 별칭). 그 외는 이스케이프만.
 *
 * 설계 두 가지가 이 파일 전체를 결정한다.
 *
 * 1) 스캐너는 "정규식 규칙 나열"이 아니라 첫 글자로 분기하는 손수 짠 루프다.
 *    문자열 안의 `#`/`//`, 주석 안의 `"`, 이스케이프된 따옴표 같은 함정은
 *    "문자열을 만나면 끝까지 통째로 소비한다"는 순서 보장이 있어야만 안 깨진다.
 *    규칙 테이블은 이 순서를 사람이 눈으로 지켜야 해서 실수가 나기 쉽다.
 *
 * 2) 토큰을 만들 때는 개행을 품은 채로 두고, HTML로 뱉을 때 개행에서 span을 끊는다.
 *    호출자(markdown.js)가 결과 HTML을 `\n`으로 잘라 줄 번호를 붙이기 때문에
 *    span이 개행을 가로지르면 각 줄이 깨진 HTML이 된다. 파이썬 삼중따옴표나
 *    C++ 블록 주석처럼 여러 줄짜리 토큰은 줄마다 span을 닫고 다시 연다.
 */
(function (global) {
  'use strict';

  /* ---------- 이스케이프 ---------- */

  // 큰따옴표까지 escape 하는 이유: 나중에 이 결과를 속성값 안에 넣는 실수가 나도 안전하게.
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ---------- 토큰 목록 → HTML ---------- */

  function push(out, cls, text) {
    if (text) out.push({ c: cls, t: text });
  }

  // 토큰의 개행마다 span을 끊는다. 이게 "줄 단위로 HTML이 온전하다"는 계약의 핵심.
  function render(tokens) {
    var buf = [];
    for (var i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      var parts = tok.t.split('\n');
      for (var j = 0; j < parts.length; j++) {
        if (j > 0) buf.push('\n');
        var seg = parts[j];
        if (!seg) continue; // 빈 조각에 빈 span을 만들 이유가 없다
        buf.push(tok.c ? '<span class="hl-' + tok.c + '">' + esc(seg) + '</span>' : esc(seg));
      }
    }
    return buf.join('');
  }

  /* ---------- 공용 헬퍼 ---------- */

  function setOf(words) {
    var o = Object.create(null), a = words.split(' ');
    for (var i = 0; i < a.length; i++) if (a[i]) o[a[i]] = true;
    return o;
  }

  var RE_WS = /[ \t\f\v]+/;
  var RE_IDENT = /[A-Za-z_$][A-Za-z0-9_$]*/;

  function isSpace(ch) { return ch === ' ' || ch === '\t' || ch === '\f' || ch === '\v'; }
  function isDigit(ch) { return ch >= '0' && ch <= '9'; }
  function isIdentStart(ch) {
    return (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || ch === '_' || ch === '$';
  }
  function isIdentChar(ch) { return isIdentStart(ch) || isDigit(ch); }

  // 앞쪽이 공백뿐인가. 파이썬 데코레이터(@)와 C++ 전처리기(#) 판정에 쓴다.
  // 뒤돌아보기 정규식(lookbehind)은 구형 사파리에서 문법 에러로 파일 전체를 죽이므로 안 쓴다.
  function atLineStart(src, i) {
    for (var p = i - 1; p >= 0; p--) {
      var ch = src.charAt(p);
      if (ch === '\n') return true;
      if (!isSpace(ch)) return false;
    }
    return true;
  }

  // 식별자 다음에 (공백을 건너뛰고) 여는 괄호가 오면 호출/정의 지점이다.
  function callsAhead(src, i) {
    while (i < src.length && isSpace(src.charAt(i))) i++;
    return src.charAt(i) === '(';
  }

  // 창(window)을 잘라 매칭한다. 매 토큰마다 문자열 끝까지 slice 하면 O(n^2)가 되고,
  // 400자를 넘는 식별자·숫자·공백 덩어리는 실제 코드에 없다.
  function matchAt(src, i, re) {
    var m = re.exec(src.slice(i, i + 400));
    if (m && m.index === 0 && m[0].length) return m[0];
    return null;
  }

  // 긴 연산자부터 시도해야 `<<=` 가 `<`+`<`+`=` 로 쪼개지지 않는다.
  function matchOp(src, i, ops) {
    for (var k = 0; k < ops.length; k++) {
      var op = ops[k];
      if (src.substr(i, op.length) === op) return op;
    }
    return null;
  }

  /* ---------- 문자열 스캐너 ---------- */

  // 여는 따옴표 위치 i에서 시작해 닫는 위치(배타적)를 돌려준다.
  // 역슬래시는 다음 한 글자를 무조건 삼킨다 → "\"" 가 문자열을 조기 종료시키지 않는다.
  // (파이썬 raw 문자열도 값에는 역슬래시가 남을 뿐, 종료 판정은 동일하다.)
  function scanQuoted(src, i, quote, triple) {
    var n = src.length;
    var p = i + (triple ? 3 : 1);
    var close = triple ? quote + quote + quote : quote;
    while (p < n) {
      var ch = src.charAt(p);
      if (ch === '\\') { p += 2; continue; }
      // 한 줄 문자열이 닫히지 않은 채 개행을 만나면 거기서 끊는다.
      // 안 그러면 오타 하나가 파일 끝까지 전부 문자열로 물들인다.
      if (!triple && ch === '\n') return p;
      if (ch === quote && src.substr(p, close.length) === close) return p + close.length;
      p++;
    }
    return n; // 끝까지 안 닫히면 남은 전부가 문자열
  }

  // C++ 원시 문자열 R"delim( ... )delim" — 안쪽 따옴표/역슬래시가 전부 리터럴이다.
  function scanRawString(src, i, quoteIdx) {
    var open = src.indexOf('(', quoteIdx + 1);
    if (open < 0) return src.length;
    var close = ')' + src.slice(quoteIdx + 1, open) + '"';
    var end = src.indexOf(close, open + 1);
    return end < 0 ? src.length : end + close.length;
  }

  /* ---------- Python ---------- */

  var PY_KW = setOf(
    'False None True and as assert async await break class continue def del elif else ' +
    'except finally for from global if import in is lambda nonlocal not or pass raise ' +
    'return try while with yield ' +
    // self/cls는 문법상 키워드가 아니지만 사실상 예약어처럼 읽힌다.
    // 팔레트에 변수 전용 토큰이 없어 kw로 묶는다.
    'self cls'
  );
  // match/case는 소프트 키워드다. 변수명으로도 흔해서(`case = ...`) 일부러 뺐다.

  var PY_TYPE = setOf(
    'abs aiter all any anext ascii bin bool bytearray bytes callable chr classmethod ' +
    'complex delattr dict dir divmod enumerate eval filter float format frozenset ' +
    'getattr globals hasattr hash hex id input int isinstance issubclass iter len list ' +
    'locals map max memoryview min next object oct open ord pow print property range ' +
    'repr reversed round set setattr slice sorted staticmethod str sum super tuple type ' +
    'vars zip ' +
    // 표준 라이브러리 컨테이너. 이 책 코드에 상시 등장해서 타입처럼 취급하는 편이 읽기 좋다.
    'deque defaultdict Counter OrderedDict namedtuple heapdict ' +
    'Exception ValueError IndexError KeyError TypeError RuntimeError StopIteration ' +
    'ZeroDivisionError OverflowError RecursionError NotImplementedError AssertionError'
  );

  var PY_OPS = ['**=', '//=', '>>=', '<<=', '==', '!=', '<=', '>=', '//', '**', '->', ':=',
    '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '>>', '<<',
    '+', '-', '*', '/', '%', '<', '>', '=', '&', '|', '^', '~'];

  var RE_PY_NUM = /(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|(?:\d[\d_]*(?:\.[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d+)?[jJ]?)/;
  var RE_PY_PREFIX = /^[rRbBuUfF]{1,3}(?=['"])/;

  function scanPython(src, out) {
    var n = src.length, i = 0;
    while (i < n) {
      var ch = src.charAt(i), ws, m;

      if (ch === '\n') { push(out, null, '\n'); i++; continue; }
      if (isSpace(ch)) { ws = matchAt(src, i, RE_WS); push(out, null, ws); i += ws.length; continue; }

      // 주석. 문자열 분기보다 뒤에 와도 되는 이유: 문자열은 통째로 소비되므로
      // 문자열 안의 #는 애초에 여기까지 오지 않는다.
      if (ch === '#') {
        var eol = src.indexOf('\n', i); if (eol < 0) eol = n;
        push(out, 'com', src.slice(i, eol)); i = eol; continue;
      }

      // 문자열 접두사(r, f, rb, ...) + 따옴표
      var pre = '';
      var pm = RE_PY_PREFIX.exec(src.substr(i, 4));
      if (pm) pre = pm[0];
      var q = src.charAt(i + pre.length);
      if (q === '"' || q === "'") {
        var qi = i + pre.length;
        var triple = src.substr(qi, 3) === q + q + q;
        var end = scanQuoted(src, qi, q, triple);
        push(out, 'str', src.slice(i, end)); i = end; continue;
      }

      // 데코레이터. 줄 머리에 있을 때만. (a @ b 행렬곱과 구분하려면 이 조건이 필요하다.)
      if (ch === '@' && atLineStart(src, i)) {
        var dm = matchAt(src, i + 1, /[A-Za-z_][A-Za-z0-9_.]*/);
        if (dm) { push(out, 'pre', '@' + dm); i += 1 + dm.length; continue; }
      }

      if (isDigit(ch) || (ch === '.' && isDigit(src.charAt(i + 1)))) {
        m = matchAt(src, i, RE_PY_NUM);
        if (m) { push(out, 'num', m); i += m.length; continue; }
      }

      if (isIdentStart(ch)) {
        m = matchAt(src, i, RE_IDENT);
        var cls = null;
        if (PY_KW[m]) cls = 'kw';
        // 빌트인이 호출 규칙보다 먼저다. len(...) 은 fn이 아니라 type으로 칠한다(계약 §6 표).
        else if (PY_TYPE[m]) cls = 'type';
        else if (callsAhead(src, i + m.length)) cls = 'fn';
        push(out, cls, m); i += m.length; continue;
      }

      var op = matchOp(src, i, PY_OPS);
      if (op) { push(out, 'op', op); i += op.length; continue; }

      // 괄호·콤마·콜론·점은 일부러 칠하지 않는다. 다 칠하면 코드가 크리스마스 트리가 된다.
      push(out, null, ch); i++;
    }
  }

  /* ---------- C++ ---------- */

  var CPP_KW = setOf(
    'alignas alignof and and_eq asm bitand bitor break case catch class compl concept ' +
    'const consteval constexpr constinit const_cast continue co_await co_return co_yield ' +
    'decltype default delete do dynamic_cast else enum explicit export extern false for ' +
    'friend goto if inline mutable namespace new noexcept not not_eq nullptr operator or ' +
    'or_eq private protected public register reinterpret_cast requires return sizeof ' +
    'static static_assert static_cast struct switch template this thread_local throw true ' +
    'try typedef typeid typename union using virtual volatile while xor xor_eq auto'
  );

  var CPP_TYPE = setOf(
    // 내장 스칼라
    'void bool char char8_t char16_t char32_t wchar_t short int long float double ' +
    'signed unsigned size_t ssize_t ptrdiff_t intptr_t uintptr_t nullptr_t ' +
    'int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t ' +
    // 표준 라이브러리 컨테이너/유틸 — 이 책에서 자료구조 이름이 곧 알고리즘의 뼈대다
    'std string wstring string_view vector array deque list forward_list ' +
    'set multiset map multimap unordered_set unordered_map unordered_multiset ' +
    'unordered_multimap stack queue priority_queue pair tuple bitset optional variant ' +
    'span initializer_list shared_ptr unique_ptr weak_ptr function ' +
    'greater less hash numeric_limits iterator ostream istream ostringstream ' +
    'istringstream stringstream ifstream ofstream fstream complex valarray ' +
    'true_type false_type'
  );

  var CPP_OPS = ['<<=', '>>=', '->*', '::', '->', '++', '--', '<=', '>=', '==',

    '+', '-', '/', '%', '=', '!', '|', '^', '~'];

  // 꼬리 [a-zA-Z_]* 가 LL/ULL/f/z 같은 접미사와 사용자 정의 리터럴을 함께 먹는다.

    cpp: scanCpp,

    'c++': 'cpp', cxx: 'cpp', cc: 'cpp', c: 'cpp', cplusplus: 'cpp',
    sh: 'bash', shell: 'bash', zsh: 'bash',
