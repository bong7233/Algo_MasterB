\n:::\n\n::: widget complexity-plot {\"n\":1000000,\"curves\":[\"n\",\"n log n\",\"n^2\",\"2^n\"],\"budget\":100000000}\n:::\n\n위젯은 N을 밀어 가며 $O(n)$, $O(n \\log n)$, $O(n^2)$, $O(2^n)$이 로그 축에서 벌어지는 모습과 \"1초 안에 되는 선\"이 어디를 지나는지를 보인다. 두 가지가 눈에 남는다. 첫째, $O(n)$과 $O(n \\log n)$은 로그 축에서 거의 붙어 있다 — $n = 10^6$에서도 20배 차이일 뿐이다. 둘째, $O(n^2)$은 $n$이 만 근처에서 선을 뚫고 $O(2^n)$은 그보다 훨씬 왼쪽에서 이미 뚫려 있다. ==실전에서 갈리는 것은 대개 $O(n \\log n)$과 $O(n^2)$ 사이 하나뿐이다.==\n\n## 4. 손으로 따라가기\n\n복잡도를 코드에서 세지 못할 때가 있다. 라이브러리를 부르고 있거나, 루프가 여러 겹이거나, 조기 종료가 섞여 있을 때다. 그때 쓰는 것이 **두 배 실험**이다. $n$을 두 배로 늘리며 시간을 재고 직전 대비 배수를 본다. $T(n) = c \\cdot n^k$이면 $T(2n)/T(n) = 2^k$이므로 **지수는 배수의 로그로 바로 읽힌다.**\n\n::: trace\n아래 두 함수는 줄 수가 같고 하는 일도 \"리스트에 원소를 하나씩 넣는다\"로 같다. 코드를 읽지 말고 시간만으로 판정하라.\n\n측정값(실측, `tools/bench/doubling_test.py`):\n\n**A: 뒤에 붙이기**\n\n| n | T(n) 초 | T(n)/T(n/2) | log2(배수) | 판정 |\n|---|---|---|---|---|\n| 50,000 | 0.0023 | — | — | (기준) |\n| 100,000 | 0.0052 | 2.33 | 1.22 | $O(n)$ |\n| 200,000 | 0.0114 |  |  |  |\n| 400,000 | 0.0249 |  |  |  |\n\n**B: 앞에 붙이기**\n\n| n | T(n) 초 | T(n)/T(n/2) | log2(배수) | 판정 |\n|---|---|---|---|---|\n| 12,500 | 0.0213 | — | — | (기준) |\n| 25,000 | 0.0807 | 3.78 | 1.92 | $O(n^2)$ |\n| 50,000 | 0.3153 |  |  |  |\n| 100,000 | 1.2692 |  |  |  |\n\n빈칸을 채운 뒤 세 가지에 답하라.\n\n- [ ] B의 $n = 100{,}000$은 A의 $n = 100{,}000$보다 몇 배 느린가\n- [ ] B가 이 추세대로 $n = 10^6$까지 가면 몇 초인가\n- [ ] A의 배수가 정확히 2가 아니라 2.2 근처인 이유는 무엇인가\n:::\n\n::: answer\n| n | T(n) 초 | T(n)/T(n/2) | log2(배수) | 판정 |\n|---|---|---|---|---|\n| 50,000 | 0.0023 | — | — | (기준) |\n| 100,000 | 0.0052 | 2.33 | 1.22 | $O(n)$ |\n| 200,000 | 0.0114 | 2.18 | 1.12 | $O(n)$ |\n| 400,000 | 0.0249 | 2.18 | 1.12 | $O(n)$ |\n\n| n | T(n) 초 | T(n)/T(n/2) | log2(배수) | 판정 |\n|---|---|---|---|---|\n| 12,500 | 0.0213 | — | — | (기준) |\n| 25,000 | 0.0807 | 3.78 | 1.92 | $O(n^2)$ |\n| 50,000 | 0.3153 | 3.91 | 1.97 | $O(n^2)$ |\n| 100,000 | 1.2692 | 4.03 | 2.01 | $O(n^2)$ |\n\nA는 `list.append`, B는 `list.insert(0, x)`다. 앞에 넣으면 뒤의 원소를 전부 한 칸씩 밀어야 한다. 왜 그런지는 [0-3 Python 내장 자료구조의 실제 비용](#/0-3)에 있다.\n\n**답 1.** 0.0052초 대 1.2692초로 244배다. 코드 한 줄 차이다.\n\n**답 2.** $n$이 10배면 $n^2$은 100배이므로 약 127초다. 1초 제한 문제라면 127배 초과다. ==두 배 실험은 이 예측을 코드를 읽지 않고 30초 만에 준다.==\n\n**답 3.** 측정에 고정 비용이 섞여 있다. 인터프리터 기동, 리스트 재할당, 첫 접근의 캐시 미스는 $n$에 비례하지 않는다. 그래서 작은 $n$일수록 배수가 2에서 위로 벗어난다. **배수의 절대값이 아니라 배수가 수렴하는 값을 봐야 한다.** A는 2.18로 수렴하고 B는 4.0으로 수렴한다.\n\n여기에 이 방법의 한계가 있다. $O(n \\log n)$의 이론 배수는 $2 + 2/\\log_2 n$이고 $n = 10^6$에서 2.1이다. **$O(n)$의 2.18과 구분되지 않는다.** 실제로 같은 스크립트에서 `sort`를 재면 배수 2.0~2.4가 나와 $O(n)$으로 판정된다. 두 배 실험은 $O(n)$과 $O(n \\log n)$을 가르지 못한다. 대신 ==$O(n)$과 $O(n^2)$은 한 번에 가른다.== 실전에서 필요한 것이 거의 항상 후자다.\n:::\n\n## 5. 구현\n\n두 배 실험을 코드로 굳혀 두면 매번 손으로 잴 일이 없다.\n\n::: dual\n```python title=\"두 배 실험 하네스\"\nimport math\nimport time\n\nREPS = 3\n\n\ndef median(xs):\n    return sorted(xs)[len(xs) // 2]\n\n\ndef run(name, fn, sizes):\n    print(f\"--- {name} ---\")\n    prev = None\n    for n in sizes:\n        ts = []\n        for _ in range(REPS):          # 한 번만 재면 첫 실행의 캐시 미스가 섞인다\n            t = time.perf_counter()\n            fn(n)\n            ts.append(time.perf_counter() - t)\n        el = median(ts)\n        if prev is None:\n            print(f\"n={n:>9} T={el:.4f}s  (기준)\")\n        else:\n            r = el / prev\n            k = math.log2(r)           # T(2n)/T(n) = 2^k 이므로 지수는 로그로 읽힌다\n            print(f\"n={n:>9} T={el:.4f}s  x{r:.2f}  k={k:.2f}\")\n        prev = el\n\n\ndef build_insert_front(n):\n    a = []\n    for i in range(n):\n        a.insert(0, i)                 # 앞에 넣으면 뒤를 통째로 민다\n    return len(a)\n\n\nrun(\"insert(0)\", build_insert_front, [12500, 25000, 50000, 100000])\n```\n```cpp title=\"두 배 실험 하네스\"\n#include <algorithm>\n#include <chrono>\n#include <cmath>\n#include <cstdio>\n#include <initializer_list>\n#include <vector>\nusing namespace std;\n\nconst int REPS = 3;\n\ndouble median(double* v) {\n    sort(v, v + REPS);\n    return v[REPS / 2];\n}\n\ntemplate <typename F>\nvoid run(const char* name, F fn, vector<int> sizes) {\n    printf(\"--- %s ---\\n\", name);\n    double prev = -1;\n    for (int n : sizes) {\n        double ts[REPS];\n        for (int r = 0; r < REPS; ++r) {   // 한 번만 재면 첫 실행의 캐시 미스가 섞인다\n            auto t0 = chrono::steady_clock::now();\n            fn(n);\n            auto t1 = chrono::steady_clock::now();\n            ts[r] = chrono::duration<double>(t1 - t0).count();\n        }\n        double el = median(ts);\n        if (prev < 0) {\n            printf(\"n=%9d T=%.4fs  (기준)\\n\", n, el);\n        } else {\n            double r = el / prev;\n            double k = log2(r);           // T(2n)/T(n) = 2^k 이므로 지수는 로그로 읽힌다\n            printf(\"n=%9d T=%.4fs  x%.2f  k=%.2f\\n\", n, el, r, k);\n        }\n        prev = el;\n    }\n}\n\nlong long build_insert_front(int n) {\n    vector<int> a;\n    for (int i = 0; i < n; ++i)\n        a.insert(a.begin(), i);           // 앞에 넣으면 뒤를 통째로 민다\n    return (long long)a.size();\n}\n\nint main() {\n    run(\"insert(begin)\", build_insert_front, {25000, 50000, 100000, 200000});\n    return 0;\n}\n```\n:::\n\n**복잡도:** 하네스 자체는 시간 $O(\\sum_i T(n_i))$ — 마지막 크기가 전체를 지배하므로 사실상 $O(T(n_{\\max}))$이고, 크기를 두 배씩 키우면 그 앞의 항 전부를 합쳐도 마지막 항 하나를 넘지 않는다. 공간은 측정 대상이 쓰는 만큼 — 하네스가 따로 잡는 것은 시간 배열 `REPS`개뿐이라 $O(1)$이다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 고해상도 시계 | `time.perf_counter()` — 단조 증가, 초 단위 `float` | `chrono::steady_clock` — 단조 증가. `system_clock`은 시각 보정 때 뒤로 갈 수 있다 |\n| 앞쪽 삽입 | `list.insert(0, x)` | `vector::insert(begin(), x)` — 둘 다 $O(n)$ |\n| 로그 | `math.log2` | `std::log2` (`<cmath>`) |\n| 측정 대상 소거 | 인터프리터는 루프를 지우지 않는다 | `-O2`가 결과를 안 쓰는 루프를 통째로 지운다. 반환값을 반드시 소비하라 |\n| 시작 크기 | 12,500부터 | 25,000부터 — 같은 크기에서 5밀리초를 밑돌아 시계 오차가 결과를 지배한다. **아래 `::: pitfall`의 세 번째 항목이 그대로 적용된 결과다** |\n\n::: pitfall\n- **한 번만 잰다.** 첫 실행은 캐시가 차갑고 페이지 폴트가 섞인다. 3회 중앙값이 최소선이다.\n- **크기를 두 배가 아니라 조금씩 늘린다.** 1000, 1200, 1400으로는 배수가 흐려 지수가 안 나온다. 반드시 두 배씩이다.\n- **너무 작은 n에서 시작한다.** $T(n)$이 밀리초 미만이면 시계 오차와 고정 비용이 결과를 지배한다. 기준 크기는 최소 10밀리초가 나오는 지점으로 잡는다.\n- **최악 입력이 아닌 것으로 잰다.** 퀵 정렬을 이미 정렬된 배열로 재면 $O(n^2)$을 놓친다. 복잡도는 최악 입력에서 정의된다.\n- **메모리를 안 본다.** 시간이 남아도 메모리 제한에서 죽는다. $n = 10^6$짜리 `int` 배열은 C++에서 4MB지만 Python `list`는 원소마다 포인터 8바이트에 정수 객체가 따로 붙어 30MB를 넘는다. [0-3](#/0-3)에 있다.\n:::\n\n## 6. 어림이 깨지는 다섯 자리\n\n역산은 상한을 준다. 상한이 안전을 뜻하지는 않는다. **같은 복잡도인데 통과와 초과가 갈리는 자리**가 다섯 군데 있다.\n\n**첫째, 메모리 접근 패턴.** §2의 표가 그대로 답이다. 연속 접근과 무작위 접근은 같은 $O(n)$인데 Python에서 8.5배, C++에서 13배 차이가 난다. 인접 리스트를 따라가는 그래프 탐색은 무작위 접근 쪽이고, 배열을 훑는 누적 합은 연속 접근 쪽이다. **$O(n)$이라고 다 같은 $O(n)$이 아니다.**\n\n**둘째, 숨은 상수가 큰 자료구조.** 세그먼트 트리의 구간 질의는 $O(\\log n)$이지만 한 번에 노드 $2\\log n$개를 만지고 포인터를 따라간다. 같은 문제를 누적 합으로 풀 수 있으면 $O(1)$이고 상수도 작다. ==갱신이 없으면 세그먼트 트리를 쓸 이유가 없다.== 판단 기준은 [IX-2](#/ix-2)에 있다.\n\n**셋째, 입출력.** $n \\ge 10^6$이면 읽는 시간이 계산 시간을 넘긴다. Python에서 `input()`으로 정수 100만 개를 읽으면 1.181초로 그 자체가 시간 제한이고, `sys.stdin.readline`이면 0.305초다. 알고리즘을 바꾸기 전에 읽는 방법부터 본다. [0-10](#/0-10)에서 전부 잰다.\n\n**넷째, 최악이 오지 않는 알고리즘.** 유니온 파인드의 상한은 역아커만 함수라 사실상 상수이고([IX-1](#/ix-1)), 가지치기가 잘 드는 백트래킹은 $O(2^n)$ 상한과 실제 탐색량이 자릿수로 다르다([III-4](#/iii-4)). 반대 방향도 있다 — 해시는 평균 $O(1)$이지만 키가 의도적으로 충돌하도록 만들어지면 $O(n)$으로 무너진다([II-6](#/ii-6)).\n\n**다섯째, 제한이 시간이 아닌 경우.** 메모리 256MB에 $O(n^2)$ 테이블을 잡으면 $n = 10^4$에서 이미 `int` 기준 400MB다. 시간은 통과하는데 메모리에서 죽는다. **$O(n^2)$ 시간을 허용하는 N과 $O(n^2)$ 공간을 허용하는 N은 다르다.**\n\n::: note\n다섯 자리를 한 문장으로 줄이면 이렇다. **역산은 후보를 지우는 도구이지 확정하는 도구가 아니다.** $O(n^2)$을 지우는 데는 확실하고, 남은 $O(n \\log n)$이 통과한다는 보장은 주지 않는다. 확정은 두 배 실험이나 실제 제출이 한다.\n:::\n\n## 7. 어디에 쓰이는가\n\n**용량 산정이 같은 계산이다.** \"초당 요청 5,000건을 받는 서비스에서 요청마다 이 처리를 해도 되는가\"는 단가 곱하기 횟수가 예산 안에 들어오는지를 묻는 질문이고, 형태가 §3의 표와 같다. 다른 것은 예산이 1초가 아니라 SLO(응답 시간 목표)라는 것뿐이다. 요청당 20밀리초 예산에 $O(n^2)$ 정합 루프를 넣으면 $n$의 상한이 그 자리에서 나온다.\n\n**제어 주기 예산도 그렇다.** 100Hz로 도는 루프는 한 바퀴에 10밀리초를 쓴다. 그 안에서 경로를 다시 계획해야 한다면 계획 알고리즘의 허용 복잡도가 10밀리초에서 역산된다. 전역 계획을 매 주기 다시 돌릴 수 없어 지역 계획을 따로 두는 구조([V-12](#/v-12))가 이 계산의 산물이고, 장애물이 하나 늘 때마다 전체를 다시 풀지 않는 증분 알고리즘([V-7](#/v-7))이 나온 이유도 같다.\n\n**데이터 크기가 메모리를 넘는 순간의 판단도 역산이다.** 단가가 나노초에서 밀리초로 바뀌면 — 디스크 접근 한 번이 그렇다 — 같은 $O(\\log n)$이라도 상수가 백만 배다. 이 지점에서 자료구조 자체가 갈린다. [XV-1 메모리를 벗어나는 순간](#/xv-1)이 그 계산으로 시작한다.\n\n## 8. 이 판단을 언제 하는가\n\n::: classify\n- 신호어: 지문 맨 아래의 \"N (1 ≤ N ≤ ...)\", \"시간 제한 1초\", \"메모리 제한 256MB\". 본문의 \"총 M개의 쿼리\", \"최대 100,000개의 간선\"\n- 제약조건: N이 명시된 모든 문제. 제약이 이상하게 작으면($n \\le 20$) 지수 시간을 허용한다는 신호이고, 이상하게 크면($n \\ge 10^7$) 입출력이 본체라는 신호다\n- 혼동 주의: 변수가 둘 이상이면 곱을 본다. $N \\le 1000$, $M \\le 1000$에 $O(NM)$은 $10^6$이라 안전하지만 $O(NM \\log M)$은 $10^7$이라 Python에서 위험하다. 쿼리 수 $Q$가 따로 있으면 반드시 $Q$를 곱한다\n- 반례 함정: 상한이 여러 개일 때 최악의 조합을 쓰지 않는 것. \"정점 $10^5$, 간선 $2 \\times 10^5$\"에서 인접 행렬을 잡으면 $10^{10}$칸이라 메모리에서 죽는다. 시간만 보고 공간을 안 보는 것이 이 유형의 대표 실패다\n:::\n\n::: interview\n**\"이 코드의 복잡도는 얼마입니까.\"** 뒤에 거의 항상 따라붙는 질문이 있다.\n\n**\"입력이 100만 개면 실제로 몇 초 걸립니까.\"** 여기서 갈린다. \"$O(n \\log n)$이니까 빠릅니다\"는 답이 아니다. 답의 뼈대는 단가와 횟수다. \"안쪽 루프가 배열을 순서대로 훑으니 한 바퀴가 나노초 단위입니다. $n \\log n$이 $2 \\times 10^7$이니 C++이면 0.1초 안쪽, Python이면 인터프리터 상수가 50배쯤 붙어 수 초입니다.\" 숫자가 틀려도 **계산의 구조가 있으면 통과한다.**\n\n**\"어떻게 확인했습니까.\"** 두 배 실험을 말하면 된다. $n$을 두 배로 늘려 시간 배수를 보고 지수를 읽었다고 답한다. 프로파일러 이름을 대는 것보다 강하다 — 도구 없이도 판정했다는 뜻이기 때문이다.\n:::\n\n## 연습\n\n::: quiz\n전부 **지문을 읽기 전에 제약조건만으로 후보를 좁히는** 훈련이다. 코드를 짜지 말고 복잡도부터 확정하라.\n\n**1. 백준 2110 공유기 설치 (골드 4)** — https://www.acmicpc.net/problem/2110\n- 신호: 집 $N \\le 200{,}000$, 좌표 $\\le 10^9$. 좌표를 훑는 것은 불가능하고 집을 훑는 것은 가능하다. **좌표 크기와 개수의 차이가 곧 답의 방향이다.**\n- 상태: 답인 \"최소 거리\"를 값으로 두고 그 값을 이분 탐색한다. 판정은 \"거리 $d$로 $C$개를 놓을 수 있는가\"이고 $O(N)$이다.\n- 자료구조: 정렬된 좌표 배열 하나. 전체가 $O(N \\log N + N \\log(10^9))$이고 $\\log(10^9) \\approx 30$이라 $6 \\times 10^6$이다. [VII-3 매개변수 탐색](#/vii-3).\n\n**2. 백준 11729 하노이 탑 이동 순서 (실버 1)** — https://www.acmicpc.net/problem/11729\n- 신호: $N \\le 20$. §3 표에서 $n \\le 22$는 $O(2^n)$을 허용한다. **제약이 이상하게 작으면 지수 시간이 정답이라는 신호다.**\n- 상태: 원판 $k$개를 출발에서 목표로 옮기는 문제를 $k-1$개 문제 둘로 쪼갠다. 출력 줄 수가 $2^{20} - 1 \\approx 10^6$이라 출력 방법이 병목이다.\n- 자료구조: 재귀 호출 스택과 출력 버퍼. 줄마다 출력하면 [0-10](#/0-10)에서 재는 대로 초를 넘긴다.\n\n**3. 백준 1929 소수 구하기 (실버 3)** — https://www.acmicpc.net/problem/1929\n- 신호: $M, N \\le 1{,}000{,}000$. 수마다 나눗셈으로 판정하면 $O(N\\sqrt{N}) = 10^9$이라 표에서 이미 탈락이다.\n- 상태: 크기 $N+1$의 불리언 배열. 소수를 하나 찾을 때마다 그 배수를 전부 지운다. 총 연산이 $O(N \\log \\log N)$인 근거는 소수의 역수 합에서 나온다.\n- 자료구조: 배열 하나. **연속 접근이라 §2 표의 최선 단가 쪽이다.** 같은 $O(N)$이라도 여기가 빠른 이유다. [X-2 소수](#/x-2).\n\n**4. 역산 과제.** 다음 제약에서 허용 복잡도와 알고리즘 후보를 각각 두 개씩 적어라. 언어는 C++로 가정한다.\n(가) $N \\le 500$, 시간 1초, \"모든 쌍 사이의 최단 거리\"\n(나) $N \\le 10^5$, $M \\le 10^5$, 시간 2초, \"쿼리마다 구간 합\"\n(다) $N \\le 16$, 시간 1초, \"모든 도시를 한 번씩 방문하는 최소 비용\"\n\n::: answer\n**(가)** $N^3 = 1.25 \\times 10^8$. §3 표에서 C++ $O(n^3)$의 상한이 400~900이므로 500은 통과권이다. 후보는 플로이드-워셜([V-3](#/v-3)) 하나, 다익스트라를 모든 정점에서 돌리기($O(N \\cdot M \\log N)$)가 다른 하나다. 간선이 조밀하면 전자, 희소하면 후자다.\n\n**(나)** 쿼리가 $10^5$개이므로 **쿼리당 비용에 $10^5$을 곱해야 한다.** 쿼리당 $O(N)$이면 $10^{10}$이라 탈락이다. 쿼리당 $O(\\log N)$이면 $1.7 \\times 10^6$으로 여유롭다. 후보는 갱신이 없으면 누적 합([VI-4](#/vi-4))으로 쿼리당 $O(1)$, 갱신이 있으면 세그먼트 트리나 펜윅 트리([IX-3](#/ix-3))로 $O(\\log N)$이다. ==갱신 유무가 자료구조를 가른다.==\n\n**(다)** $N \\le 16$은 $2^{16} = 65{,}536$이다. 순열 전탐색은 $16! \\approx 2 \\times 10^{13}$이라 표에서 즉시 탈락한다. 후보는 비트마스크 DP([VIII-9](#/viii-9))로 상태가 $2^N \\cdot N \\approx 10^6$개이고 전이가 $O(N)$이라 $1.7 \\times 10^7$, 다른 하나는 가지치기를 건 백트래킹([III-4](#/iii-4))이다. **$n \\le 22$를 보면 비트마스크를 먼저 떠올리는 것이 이 표를 쓰는 방식이다.**\n:::\n:::\n\n## 요약\n\n- 제약조건은 답의 절반이다. **지문을 읽기 전에 무엇이 불가능한지부터 확정한다.**\n- \"1초 ≈ $10^8$\"은 C++의 무작위 접근 루프에 우연히 맞는 값이다. 한 언어 안에서도 워크로드에 따라 초당 처리량이 **100배 넘게** 벌어진다.\n- 실측 단가는 Python 59.4~507 ns, C++ 1.23~135.7 ns다. 단가를 하나로 정할 수 없으므로 역산은 **최선·최악 두 값으로 구간**을 낸다.\n- 외울 것은 경계값이 아니라 자릿수의 계단이다. $n^2$은 만, $n^3$은 수백, $2^n$은 스물 몇.\n- 복잡도를 코드에서 못 세면 **두 배 실험**을 한다. $n$을 두 배로 늘려 시간 배수를 보고 $\\log_2$로 지수를 읽는다. $O(n)$과 $O(n^2)$은 즉시 갈리고 $O(n)$과 $O(n \\log n)$은 갈리지 않는다.\n- 같은 복잡도가 갈리는 다섯 자리: 메모리 접근 패턴, 자료구조의 숨은 상수, 입출력, 최악이 오지 않는 알고리즘, 시간이 아니라 메모리가 진짜 제약인 경우.\n- **역산은 후보를 지우는 도구다.** 확정은 두 배 실험과 실제 실행이 한다.\n\n**다음 절**: [0-10 언어별 상수와 TLE 대응](#/0-10) — 같은 알고리즘이 Python과 C++에서 몇 배 벌어지는지를 워크로드별로 재고, 언제 갈아타야 하는지 판단한다.\n","0-10":"# 0-10 언어별 상수와 TLE 대응\n\n::: lead\n같은 알고리즘이 Python과 C++에서 몇 배 벌어지는가, 그리고 그 배수를 언제 코드로 줄이고 언제 언어로 줄이는가.\n:::\n\n## 1. 문제\n\n$O(n \\log n)$ 알고리즘을 맞게 짰다. C++로 낸 사람은 통과했고 Python으로 낸 같은 코드는 시간 초과다. 여기서 두 가지 결론이 나오는데 둘 다 틀렸다.\n\n첫째, \"Python은 100배 느리니까 어차피 안 된다.\" 둘째, \"언어 탓이 아니라 내 코드가 나쁘다.\"\n\n배수는 하나가 아니기 때문이다. 같은 환경에서 워크로드만 바꿔 재면 **2.7배에서 106배까지** 나온다. 어느 쪽 끝에 서 있느냐에 따라 해야 할 일이 정반대다. 3배짜리 자리에서 언어를 갈아타는 것은 헛수고이고, 100배짜리 자리에서 코드를 다듬는 것도 헛수고다.\n\n그래서 먼저 재야 한다.\n\n## 2. 배수는 하나가 아니다\n\n같은 일을 두 언어에서 같은 구조로 짜고 잰 결과다.\n\n::: perf\n| 워크로드 | Python 3.13 | g++ 13 `-O2` | 배수 |\n|---|---|---|---|\n| DP 갱신 `dp[j] = max(dp[j], ...)` 1회 | 137.0 ns | 1.29 ns | **106×** |\n| 재귀 `fib(30)` 전체 | 0.147 s | 0.0025 s | 59× |\n| 연속 배열 접근 `s += a[i]` 1회 | 59.4 ns | 1.23 ns | 48× |\n| 함수 호출 1회 | 72.7 ns | 1.55 ns | 47× |\n| 무작위 배열 접근 `s += a[idx[i]]` 1회 | 507.0 ns | 15.74 ns | 32× |\n| 문자 100만 개 누적 (각 언어 최선) | 0.0537 s | 0.0018 s | 30× |\n| 정렬 $10^6$개 | 0.369 s | 0.077 s | **4.8×** |\n| 해시 조회 1회 (100만 키) | 507.0 ns | 135.70 ns | **3.7×** |\n| 정수 100만 개 입력 (각 언어 최선) | 0.305 s | 0.093 s | 3.3× |\n| 100만 줄 출력 (각 언어 최선) | 0.173 s | 0.063 s | **2.7×** |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/ops_budget.py|.cpp` 와 `tools/bench/lang_constant.py|.cpp` 다.)\n:::\n\n표를 위에서 아래로 읽으면 규칙이 하나 보인다. **인터프리터가 직접 도는 루프일수록 배수가 크고, 일을 라이브러리에 넘길수록 배수가 작다.**\n\nDP 갱신은 인덱스 계산, 비교, 대입이 전부 Python 바이트코드다. 한 바퀴마다 인터프리터가 명령을 열 개 남짓 해석한다. 배수 106배가 그 값이다.\n\n정렬은 반대다. `list.sort()`는 호출 한 번이고, 그 뒤의 비교와 이동은 전부 CPython의 C 코드가 한다. 인터프리터는 시작할 때 한 번 관여하고 끝이다. 배수 4.8배가 그 값이다.\n\n::: note\n==Python이 느린 것은 표준 라이브러리가 아니라 인터프리터 루프다.== 이 한 문장이 이 챕터의 전부다. 최적화의 방향이 여기서 나온다. **루프를 줄이는 것이 아니라 루프를 라이브러리 안으로 옮기는 것이 Python 최적화다.**\n\nC++에서는 반대다. 라이브러리 호출이 이미 기계어라 옮길 곳이 없다. C++의 최적화는 메모리 접근 패턴과 할당 횟수를 손보는 쪽이다.\n:::\n\n## 3. 배수를 코드로 줄이는 네 자리\n\n### 3.1 입출력\n\n$n \\ge 10^6$이면 읽는 시간이 계산 시간을 넘긴다. 정수 100만 개를 읽는 데 걸린 시간이다.\n\n::: perf\n| Python | 초 | | C++ | 초 |\n|---|---|---|---|---|\n| `input()` | 1.181 | | `cin` (기본) | 0.367 |\n| `sys.stdin.readline` | 0.305 | | `cin` + `sync_with_stdio(false)` | 0.093 |\n| `sys.stdin.buffer.read().split()` | 0.367 | | `scanf` | 0.115 |\n\n100만 줄 출력:\n\n| Python | 초 | | C++ | 초 |\n|---|---|---|---|---|\n| `print()` 줄마다 | 1.486 | | `cout << endl` | 0.382 |\n| `sys.stdout.write` + `join` | 0.173 | | `cout << '\\n'` | 0.063 |\n| | | | `printf` | 0.067 |\n\n> (같은 환경 실측. 별도 프로세스에서 측정해 프로세스 기동 시간이 포함되어 있다. 측정 스크립트는 `tools/bench/lang_constant.py` 와 `.cpp` 다.)\n:::\n\n**같은 언어 안에서 3.9배와 4.0배가 공짜로 있다.** 언어를 바꿔서 얻는 3.3배보다 크다. 시간 초과가 났을 때 알고리즘을 의심하기 전에 여기부터 본다.\n\n📖 `sys.stdin.readline()` — 표준 입력에서 개행까지 한 줄을 읽어 문자열로 돌려준다. 개행 문자가 **포함된 채** 온다. `int()`는 앞뒤 공백을 무시하므로 정수 변환에는 그대로 써도 되지만, 문자열로 쓸 때는 `.rstrip()`이 필요하다.\n   `input()`보다 빠른 이유는 프롬프트 처리와 인코딩 협상 계층을 건너뛰기 때문이다. 자세한 내부는 [0-2 Python 입출력과 기본 타입](#/0-2)에 있다.\n   쓰는 곳: 입력이 $10^5$줄을 넘는 모든 문제.\n   C++ 대응: `cin >> x` — 단, `ios_base::sync_with_stdio(false)`를 먼저 부르지 않으면 위 표의 0.367초 쪽이다.\n\n::: danger\n`ios_base::sync_with_stdio(false)`를 부른 뒤에는 `scanf`/`printf`와 `cin`/`cout`을 **섞어 쓰면 안 된다.** 동기화를 껐다는 것은 두 버퍼가 따로 논다는 뜻이고, 출력 순서가 뒤섞인다. 로컬에서는 멀쩡하다가 채점기에서 깨지는 경로가 이것이다.\n\n`cin.tie(nullptr)`도 같은 종류다. 이것을 끄면 입력 전에 출력이 자동으로 비워지지 않는다. 대화형 문제(입력과 출력을 주고받는 문제)에서는 **끄면 안 된다.** 끄고 나서 직접 `flush`를 부르거나, 대화형에서는 아예 손대지 않는다.\n:::\n\n### 3.2 재귀\n\n`fib(30)`은 논리 호출이 2,692,537회다. Python 0.147초, C++ 0.0025초로 59배다. 호출 하나당 Python 72.7 ns, C++ 1.55 ns다.\n\nPython의 함수 호출이 비싼 이유는 프레임 객체를 만들고, 인자를 묶고, 예외 처리 상태를 쌓기 때문이다. C++은 인자를 레지스터에 넣고 `call` 명령 하나다. 게다가 `-O2`는 `fib`의 두 재귀 호출 중 하나를 반복문으로 바꿔 실제 기계어 호출 횟수를 절반으로 줄인다. **컴파일러가 알고리즘을 조금 바꾼다.**\n\n깊이 한계도 다르다.\n\n::: perf\n| | Python 3.13 | C++ (`ulimit -s` 8MB) |\n|---|---|---|\n| 기본 한계 | `sys.getrecursionlimit()` = 1,000 | 스택이 찰 때까지 |\n| 한계 + 100 | `RecursionError` | — |\n| 깊이 200,000 | `setrecursionlimit(300000)` 후 통과 | 통과 |\n\n> (같은 환경 실측. `tools/bench/lang_constant.py` 와 `.cpp`.)\n:::\n\n::: deep\nCPython 3.12부터 순수 Python 함수의 재귀는 **C 스택을 쓰지 않는다.** 프레임이 힙에 있는 청크로 관리되어 `setrecursionlimit`만 올리면 깊이 20만이 실제로 통과한다. 3.11 이하에서는 같은 코드가 세그멘테이션 폴트로 죽었다 — 인터프리터의 `RecursionError`를 피해 한계를 올리면 그다음에 OS의 스택 한계에 부딪혔기 때문이다.\n\n그래도 `setrecursionlimit`을 크게 올리는 것은 안전한 조치가 아니다. C 확장이 끼어드는 경로(예: `__repr__`가 재귀 호출되는 자료구조)는 여전히 C 스택을 쓴다. **깊이가 $10^5$을 넘는 DFS는 반복으로 바꾸는 것이 맞다.** 변환 방법은 [IV-2 DFS](#/iv-2)에 있다.\n:::\n\n### 3.3 문자열 누적\n\nPython의 `s += \"x\"` 100만 회가 0.0649초, `\"\".join(...)`이 0.0537초로 1.2배 차이밖에 안 났다. 교과서가 말하는 $O(n^2)$이 나오지 않았다.\n\n::: deep\nCPython에는 문자열 `+=`에 대한 특수 최적화가 있다. 좌변 문자열의 참조 카운트가 1이고 그 결과를 같은 이름에 다시 대입하는 형태이면, 새 객체를 만드는 대신 **버퍼를 그 자리에서 늘린다.** 그래서 이 특정 패턴만 상환 $O(n)$이 된다.\n\n조건이 깨지면 그대로 $O(n^2)$이다. 다른 이름이 같은 문자열을 참조하고 있거나, 리스트 원소에 누적하거나(`parts[i] += x`), CPython이 아닌 구현이면 최적화가 걸리지 않는다.\n\n==특정 구현의 최적화에 복잡도를 맡기지 마라.== `join`은 어디서나 $O(n)$이고 조건이 없다. C++에서도 같은 논리로 `reserve`를 먼저 부르면 재할당이 사라져 1.8배 빨라진다(0.0032초 → 0.0018초). 예측 가능한 쪽을 쓰는 것이 규율이다.\n:::\n\n### 3.4 자료구조 선택\n\n배수 표의 아래쪽 세 줄(정렬 4.8배, 해시 3.7배, 입출력 2.7배)이 알려 주는 것은 이것이다. **Python에서 할 일은 안쪽 루프를 라이브러리 호출로 바꾸는 것이다.**\n\n| 손으로 짠 루프 | 라이브러리로 옮긴 형태 | 어디에 |\n|---|---|---|\n| 최솟값 찾는 `for` | `min(a)` | [0-3](#/0-3) |\n| 정렬 직접 구현 | `a.sort(key=...)` | [II-7](#/ii-7) |\n| 이분 탐색 직접 구현 | `bisect.bisect_left` | [0-4](#/0-4) |\n| 카운팅 `for` | `collections.Counter` | [0-4](#/0-4) |\n| 누적 합 `for` | `itertools.accumulate` | [VI-4](#/vi-4) |\n| 앞쪽 삽입·삭제 | `collections.deque` | [II-5](#/ii-5) |\n\n억지로 밀어 넣으라는 말은 아니다. 판단 기준은 하나다. **그 루프가 안쪽 루프이고 $10^6$번 이상 도는가.** 바깥 루프를 라이브러리로 바꿔 봐야 얻는 것이 없다.\n\n## 4. 손으로 따라가기\n\n배수 표를 그대로 쓰면 \"이 코드가 Python에서 몇 초일지\"를 코드를 돌리기 전에 낼 수 있다. 계산의 형태는 항상 같다. **연산 횟수 × 단가.**\n\n::: trace\n문제: 정점 $V = 10^5$, 간선 $E = 3 \\times 10^5$인 그래프에서 다익스트라. 시간 제한 2초.\n\n다익스트라의 연산은 세 종류다([V-1](#/v-1)). 각각 §2 표의 어느 줄에 해당하는지 정하고 시간을 채워라.\n\n| 연산 | 횟수 | 어느 단가인가 | Python (ns) | Python 소계 | C++ (ns) | C++ 소계 |\n|---|---|---|---|---|---|---|\n| 힙 push/pop ($\\log$ 포함) | $E \\log E \\approx 5.5 \\times 10^6$ | 무작위 접근 | 507.0 | 2.79 s | 15.74 | 0.087 s |\n| 인접 리스트 순회 | $2E = 6 \\times 10^5$ | 연속 접근 | 59.4 | 0.036 s | 1.23 | 0.001 s |\n| 거리 배열 갱신 | $E = 3 \\times 10^5$ |  |  |  |  |  |\n| 입력 읽기 |  |  |  |  |  |  |\n| **합계** | | | | | | |\n\n- [ ] 거리 갱신은 `dist[v]`를 정점 번호로 찌른다. 어느 단가인가\n- [ ] 입력은 간선 $3 \\times 10^5$줄, 즉 정수 $9 \\times 10^5$개다. §3.1 표에서 각 언어의 최선을 가져오라\n- [ ] 합계를 낸 뒤, 2초 제한을 어느 쪽이 통과하는가\n:::\n\n::: answer\n| 연산 | 횟수 | 어느 단가인가 | Python (ns) | Python 소계 | C++ (ns) | C++ 소계 |\n|---|---|---|---|---|---|---|\n| 힙 push/pop | $5.5 \\times 10^6$ | 무작위 접근 | 507.0 | 2.79 s | 15.74 | 0.087 s |\n| 인접 리스트 순회 | $6 \\times 10^5$ | 연속 접근 | 59.4 | 0.036 s | 1.23 | 0.001 s |\n| 거리 배열 갱신 | $3 \\times 10^5$ | 무작위 접근 | 507.0 | 0.152 s | 15.74 | 0.005 s |\n| 입력 읽기 | 정수 $9 \\times 10^5$개 | §3.1 최선 | — | 0.275 s | — | 0.084 s |\n| **합계** | | | | **3.25 s** | | **0.18 s** |\n\n**거리 갱신은 무작위 접근이다.** 정점 번호에 순서가 없어 `dist[v]`가 배열 어디를 찌를지 예측되지 않는다. 인접 리스트 순회는 반대로 한 정점의 이웃이 메모리에 붙어 있어 연속 접근이다. ==같은 배열 인덱싱인데 접근 패턴이 달라 단가가 8.5배 갈린다.==\n\n입력은 §3.1의 100만 개 기준을 0.9배 해서 Python 0.275초, C++ 0.084초다.\n\n2초 제한에서 C++은 0.18초로 여유롭고 Python은 3.25초로 초과다. **1.6배가 모자란다.**\n\n여기서 나오는 판단이 중요하다. 3.25초 대 2초는 자릿수 문제가 아니다. 힙 연산이 전체의 86%를 차지하므로 여기만 줄이면 된다. 실제로 `heapq`는 C 구현이라 push/pop 자체는 빠르고, 비용의 상당 부분은 튜플 생성과 비교에서 나온다. 거리를 상위 비트에, 정점 번호를 하위 비트에 넣어 **정수 하나로 힙에 넣으면** 튜플 할당과 원소별 비교가 사라진다. 이런 종류의 손질로 1.6배는 대체로 회수된다.\n\n**106배가 모자란 상황이었다면 얘기가 다르다.** 그때는 언어를 바꾸는 것이 유일한 길이다. 판단 기준을 다음 절에서 정리한다.\n:::\n\n## 5. 구현\n\n같은 계산을 반복하지 않도록 두 언어의 \"빠른 입출력 골격\"을 하나로 고정해 둔다. 이것을 매번 새로 떠올리는 것은 순손실이다.\n\n::: dual\n```python title=\"빠른 입출력 골격 — 정수 n개를 읽어 합을 낸다\"\nimport sys\n\n\ndef main():\n    data = sys.stdin.buffer.read().split()   # 전부 한 번에 읽고 공백으로 쪼갠다\n    n = int(data[0])\n    total = 0\n    for i in range(1, n + 1):\n        total += int(data[i])                # 필요한 것만 그때 정수로 바꾼다\n    out = []\n    out.append(str(total))\n    out.append(str(total * 2))\n    sys.stdout.write(\"\\n\".join(out) + \"\\n\")  # 줄마다 print 하지 않는다\n\n\nmain()\n```\n```cpp title=\"빠른 입출력 골격 — 정수 n개를 읽어 합을 낸다\"\n#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);        // C 표준 입출력과의 동기화를 끊는다\n    cin.tie(nullptr);                        // 입력 전 자동 flush 를 끈다\n    int n;\n    cin >> n;\n    long long total = 0;                     // int 로 두면 넘칠 수 있다\n    for (int i = 0; i < n; ++i) {\n        long long x;\n        cin >> x;\n        total += x;\n    }\n    vector<string> out;\n    out.push_back(to_string(total));\n    out.push_back(to_string(total * 2));\n    string buf;\n    for (auto& s : out) buf += s + \"\\n\";\n    cout << buf;                             // 줄마다 endl 을 쓰지 않는다\n    return 0;\n}\n```\n:::\n\n**복잡도:** 시간 $O(n)$ — 입력 토큰마다 정수 변환 한 번, 덧셈 한 번이므로 토큰 수에 비례한다. 공간 $O(n)$ — Python 쪽은 `split()`이 토큰 전부를 바이트열 리스트로 들고 있어 입력 크기에 비례하는 메모리를 쓴다. C++ 쪽은 한 번에 하나씩 읽어 $O(1)$이다. **이 차이가 Python에서 메모리 초과를 만드는 자리다.** 입력이 수백 MB면 `readline` 반복으로 바꾼다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 통째로 읽기 | `sys.stdin.buffer.read().split()` — 가장 빠르지만 메모리를 입력 크기만큼 쓴다 | 대응이 필요 없다. `cin`이 이미 버퍼링한다 |\n| 줄 단위 | `sys.stdin.readline` — 메모리 $O(1)$, 이 워크로드에서는 오히려 더 빨랐다(0.305 s vs 0.367 s) | `getline(cin, s)` |\n| 개행 | `readline`은 개행을 포함해 돌려준다 | `cin >> x`는 공백을 건너뛴다 |\n| 출력 모으기 | `\"\\n\".join(out)` | `string buf`에 누적. `reserve`를 부르면 더 빠르다 |\n| 위험한 단축 | 없음 | `sync_with_stdio(false)` 후 `printf` 혼용 금지, 대화형에서 `tie(nullptr)` 금지 |\n| 정수 크기 | 임의 정밀도라 합이 넘치지 않는다 | `int` 합은 넘친다. `long long` 필수([0-5](#/0-5)) |\n\n::: pitfall\n- **`sys.stdin.buffer.read()`를 대화형 문제에 쓴다.** EOF까지 기다리므로 영원히 멈춘다.\n- **`readline`으로 읽고 `.rstrip()`을 잊는다.** 문자열 비교가 개행 때문에 전부 실패한다.\n- **출력을 모으다 메모리를 넘긴다.** 출력이 수천만 줄이면 `join`할 리스트 자체가 크다. 그때는 적당한 크기로 나눠 흘려보낸다.\n- **C++에서 `endl`을 습관으로 쓴다.** `endl`은 개행 + `flush`다. 100만 줄에서 0.382초 대 0.063초, 6배다.\n- **입력 형식을 잘못 가정한다.** 한 줄에 여러 정수가 오는데 `readline`을 정수 하나로 읽으면 토큰이 밀린다. `split()`으로 통일하는 편이 안전하다.\n:::\n\n## 6. 언제 언어를 갈아탈 것인가\n\n배수를 코드로 줄이는 데에도 한계가 있다. 판단 순서를 고정해 둔다.\n\n```text nolines\n  1. 입출력을 고쳤는가                       -> 최대 4배, 공짜\n  2. 안쪽 루프를 라이브러리로 옮겼는가       -> 최대 30배, 코드 몇 줄\n  3. 알고리즘의 복잡도가 최선인가            -> 자릿수, 재설계\n  4. 그래도 모자라면                         -> 언어를 바꾼다\n```\n\n1번과 2번을 건너뛰고 4번으로 가는 것이 가장 흔한 낭비다. 반대로 **1~3을 다 했는데 여전히 10배가 모자라면 더 다듬어도 나오지 않는다.**\n\n::: tip\n언어를 바꿔야 하는 신호는 구체적이다.\n\n- **안쪽 루프가 순수 산술이고 $10^7$번 이상 돈다.** DP 갱신, 시뮬레이션 스텝, 격자 순회가 여기다. 배수가 100배 쪽 끝이다.\n- **재귀 호출이 $10^6$번 이상이다.** 호출당 72.7 ns면 $10^7$회에 0.7초다.\n- **라이브러리로 옮길 수 있는 부분이 이미 없다.** 남은 것이 전부 인터프리터가 직접 도는 코드다.\n\n반대로 **바꿔도 소용없는 신호**도 있다.\n\n- 시간의 대부분이 정렬이나 해시에 있다. 배수가 4배 언저리라 언어를 바꿔도 4배다.\n- 복잡도가 한 단계 높다. $O(n^2)$을 C++로 옮겨 봐야 $O(n^2)$이다. **언어는 상수를 바꾸고 알고리즘은 지수를 바꾼다.**\n:::\n\n::: note\n**PyPy에 대해.** PyPy는 CPython과 다른 Python 구현이고, 추적 JIT 컴파일러가 뜨거운 루프를 기계어로 바꾼다. 그래서 위 표에서 **배수가 큰 줄들, 즉 순수 Python 루프가 지배하는 워크로드에서만 크게 이득이 난다.** 반대로 정렬·해시·입출력처럼 이미 C가 하는 일은 바꿀 것이 없고, JIT 예열 시간과 더 큰 메모리 사용이 붙어 오히려 불리해질 수 있다.\n\n이 레포의 기준 환경(§1-3)에는 PyPy가 없다. **그래서 이 챕터의 모든 수치는 CPython 3.13이고, PyPy 수치는 싣지 않는다.** 재현할 수 없는 숫자를 적는 것보다 없는 편이 낫다.\n\n판단 기준만 적어 둔다. **채점기가 PyPy를 제공하고, 병목이 순수 Python 루프이고, 메모리 제한에 여유가 있으면** 후보다. 병목이 라이브러리 호출이거나 메모리가 빠듯하면 후보가 아니다. 어느 쪽인지는 프로파일이 말해 준다 — §4의 계산을 항목별로 해 보면 어디에 시간이 몰려 있는지가 나온다.\n:::\n\n::: interview\n**\"Python으로 짜셨는데 성능이 걱정되지 않습니까.\"** 실무 면접에서 자주 나오고, \"느리다고 알고 있습니다\"는 답이 아니다.\n\n답의 뼈대는 **배수가 워크로드에 따라 다르다**는 사실이다. \"인터프리터가 직접 도는 루프는 50~100배지만, 정렬이나 해시처럼 C 구현으로 내려가는 부분은 3~5배입니다. 그래서 병목이 어디인지에 따라 판단이 달라집니다. 프로파일을 떠서 뜨거운 루프가 순수 Python이면 그 부분만 C 확장이나 다른 언어로 내리고, 라이브러리 호출이면 언어를 바꿀 이유가 없습니다.\"\n\n**\"그러면 언제 다른 언어를 씁니까.\"** 위의 4단계를 그대로 말하면 된다. 숫자를 근거로 순서를 정했다는 것이 답의 핵심이지 특정 언어에 대한 선호가 아니다.\n:::\n\n## 7. 어디에 쓰이는가\n\n**혼합 언어 시스템의 경계가 이 표에서 결정된다.** 수치 계산 라이브러리, 머신러닝 프레임워크, 데이터 처리 도구가 전부 같은 형태를 하고 있다 — 얇은 Python 층이 배열 하나를 통째로 넘기고, 무거운 루프는 C나 포트란이 돈다. 이 구조가 나온 이유가 §2의 표다. **경계를 어디에 그을지는 \"루프를 몇 번 도는가\"로 정해진다.**\n\n같은 판단이 서비스 코드에도 있다. 요청 처리는 Python으로 두고 초당 수백만 번 도는 정합 루프만 확장 모듈로 내리는 구조가 표준이다. 전부 내리면 개발 속도를 잃고, 아무것도 안 내리면 처리량을 잃는다.\n\n**제어 소프트웨어의 언어 분리도 같다.** 주기가 밀리초인 제어 루프는 C++이고, 그 위의 임무 관리와 설정은 Python인 구조가 흔하다. 경계선은 취향이 아니라 **주기 안에 들어오는가**로 그어진다. 100Hz 루프의 10밀리초 예산에 72.7 ns짜리 호출이 $10^5$번 들어가면 7.3밀리초로 예산의 73%다.\n\n## 8. 이 판단이 필요한 신호\n\n::: classify\n- 신호어: \"시간 초과\", \"$N \\le 10^6$\", \"$10^7$번의 연산\", 채점 결과의 \"1.9초 / 2초\"처럼 아슬아슬한 통과\n- 제약조건: 안쪽 루프의 반복 횟수가 $10^6$을 넘는 모든 코드. 재귀 호출이 $10^6$을 넘는 코드. 입력 줄 수가 $10^5$을 넘는 코드\n- 혼동 주의: 복잡도가 틀린 것과 상수가 큰 것은 다른 문제다. 앞쪽은 언어를 바꿔도 안 되고 뒤쪽은 언어를 바꾸면 된다. 어느 쪽인지는 [0-9](#/0-9)의 두 배 실험이 가른다 — **지수가 예상보다 크면 알고리즘 문제이고, 지수는 맞는데 절대 시간이 크면 상수 문제다**\n- 반례 함정: 시간 초과를 전부 언어 탓으로 돌리는 것. 실제로는 입출력 방식 하나로 4배가 나오는 경우가 가장 많다. 반대로 라이브러리 호출이 지배하는 코드를 언어만 바꿔 다시 짜는 것도 같은 종류의 실패다\n:::\n\n## 연습\n\n::: quiz\n전부 **\"어디에 시간이 있는가\"를 먼저 계산하는** 훈련이다. 코드를 고치기 전에 §4의 표를 그려라.\n\n**1. 백준 11003 최솟값 찾기 (플래티넘 5)** — https://www.acmicpc.net/problem/11003\n- 신호: $N \\le 5{,}000{,}000$. 입력 정수만 500만 개다. §3.1 표에서 Python의 최선이 100만 개에 0.305초이므로 **읽기만 1.5초**다. 알고리즘을 정하기 전에 입출력 방식이 정해진다.\n- 상태: 크기 $L$의 창 안에서 최솟값. 창이 밀릴 때마다 다시 훑으면 $O(NL)$이라 탈락이고, 덱에 후보만 남기면 각 원소가 한 번 들어가고 한 번 나와 $O(N)$이다.\n- 자료구조: `collections.deque` / `std::deque`. 인덱스를 넣고 값으로 비교한다. **Python에서 이 루프는 순수 인터프리터라 배수가 50배 쪽이다.** 출력도 500만 개라 `join`이 필수다. [VI-3 투 포인터와 슬라이딩 윈도우](#/vi-3).\n\n**2. 백준 1753 최단경로 (골드 4)** — https://www.acmicpc.net/problem/1753\n- 신호: $V \\le 20{,}000$, $E \\le 300{,}000$. §4의 손추적이 그대로 이 문제다.\n- 상태: `dist[v]` 배열 하나와 우선순위 큐. 큐에 들어가는 것은 (거리, 정점) 쌍이고, 꺼낸 거리가 현재 `dist`보다 크면 버린다.\n- 자료구조: `heapq` / `priority_queue`. **Python에서 튜플 대신 정수 하나로 인코딩하면 힙 비교가 싸진다.** 그 판단의 근거가 §4의 소계 표다. [V-1 다익스트라](#/v-1).\n\n**3. 백준 2447 별 찍기 - 10 (골드 5)** — https://www.acmicpc.net/problem/2447\n- 신호: $N \\le 3^7 = 2187$. 출력이 $2187^2 \\approx 4.8 \\times 10^6$자다. 계산은 가볍고 **출력이 전부다.**\n- 상태: 재귀로 $(r, c)$가 별인지 판정하거나, 크기를 3배씩 키우며 격자를 조립한다. 어느 쪽이든 결과는 문자 격자 하나다.\n- 자료구조: 문자 배열. 줄마다 `print`하면 2187줄이라 견디지만, 문자마다 `+=`로 붙이면 §3.3의 최적화 조건을 벗어나 $O(n^2)$이 될 수 있다. **줄을 리스트에 모아 `join` 한 번**이 안전하다. [III-1 재귀 사고법](#/iii-1).\n\n**4. 계산 과제.** $N = 10^6$인 배열에서 $O(N \\log N)$ 정렬 한 번과 $O(N)$ 순회 세 번을 하는 코드가 있다. §2 표의 단가로 Python과 C++의 예상 시간을 각각 내고, 1초 제한을 통과하는지 판정하라. 순회는 전부 연속 접근이다.\n\n::: answer\n**정렬.** §2 표에 $n = 10^6$ 정렬의 실측이 있다. Python 0.369초, C++ 0.077초다.\n\n**순회 세 번.** $3 \\times 10^6$회, 연속 접근 단가다.\n- Python: $3 \\times 10^6 \\times 59.4\\,\\text{ns} = 0.178$초\n- C++: $3 \\times 10^6 \\times 1.23\\,\\text{ns} = 0.004$초\n\n**합계.** Python 0.547초, C++ 0.081초. 둘 다 1초를 통과한다.\n\n여기서 볼 것은 **비중이 뒤집혀 있다는 점**이다. Python은 정렬이 67%, 순회가 33%다. C++은 정렬이 95%다. 즉 ==Python에서 이 코드를 빠르게 만들려면 순회를 손봐야 하고, C++에서는 손볼 것이 없다.== 같은 코드인데 최적화 대상이 다르다.\n\n그리고 입력을 빠뜨리지 않았는지 확인하라. $10^6$개를 읽는 데 Python 0.305초, C++ 0.093초가 더 붙는다. 합계가 Python 0.852초로 1초에 바짝 붙는다. **입출력을 계산에 넣지 않는 것이 §4 손추적에서 가장 자주 나오는 누락이다.**\n:::\n:::\n\n## 요약\n\n- **배수는 하나가 아니다.** 같은 환경 실측에서 2.7배(출력)부터 106배(DP 갱신)까지 나온다.\n- 규칙은 하나다. **인터프리터가 직접 도는 루프일수록 배수가 크고, 일을 라이브러리에 넘길수록 작다.** Python이 느린 것은 표준 라이브러리가 아니라 인터프리터 루프다.\n- 입출력만 고쳐도 같은 언어 안에서 Python 3.9배, C++ 4.0배가 나온다. **언어를 바꿔서 얻는 3.3배보다 크다.**\n- 재귀는 호출당 Python 72.7 ns, C++ 1.55 ns다. 깊이도 다르다 — Python 기본 한계는 1,000이고 올려야 쓸 수 있다.\n- 순서를 지킨다. **입출력 → 라이브러리로 옮기기 → 복잡도 재설계 → 언어 교체.** 앞의 셋을 건너뛰고 언어부터 바꾸는 것이 가장 흔한 낭비다.\n- **언어는 상수를 바꾸고 알고리즘은 지수를 바꾼다.** $O(n^2)$은 어느 언어로 옮겨도 $O(n^2)$이다.\n- PyPy는 순수 Python 루프가 병목일 때만 후보다. 이 레포 환경에 없으므로 **수치는 싣지 않고 판단 기준만 남긴다.**\n\n**다음 절**: [0-11 손추적(dry run) 방법론](#/0-11) — 시간이 아니라 정확성이 문제일 때, 코드를 실행하지 않고 상태 표로 검증한다.\n","0-11":"# 0-11 손추적(dry run) 방법론\n\n::: lead\n코드를 실행하지 않고, 종이 위에서 그 코드가 무엇을 하는지 정확히 아는 방법.\n:::\n\n## 1. 문제\n\n이분 탐색은 열 줄이다. 읽으면 전부 이해된다. 그런데 직접 짜면 셋 중 하나가 일어난다. 답이 하나 어긋나거나, 배열 범위를 벗어나거나, 프로그램이 끝나지 않는다. 채점기가 돌려주는 것은 `틀렸습니다` 한 줄뿐이다.\n\n흔한 대응은 조금 고쳐서 다시 제출하는 것이다. `<`를 `<=`로, `mid`를 `mid+1`로, `hi`를 `n-1`로 바꿔 본다. 네 군데를 각각 두 가지로 바꾸면 조합이 열여섯 개다. 하나가 우연히 통과해도 그것은 통과했을 뿐 이해된 것이 아니다.\n\n디버거를 붙이면 되지 않느냐는 반문이 나온다. 붙일 수 없는 자리가 셋 있다.\n\n- **면접과 화이트보드.** 실행 환경이 없다. 종이 위에서 코드가 옳다는 것을 설명해야 한다.\n- **실시간·동시성 코드.** 브레이크포인트는 타이밍을 바꾼다. 멈춰 세우는 순간 재현되던 경합 조건이 사라진다. 이 현상은 [XI-3 락과 락프리](#/xi-3)에서 다시 다룬다.\n- **재현되지 않는 입력.** 10만 개 중 하나에서만 깨진다면, 그 하나를 찾기 전까지 디버거는 붙일 자리가 없다.\n\n더 근본적인 이유가 있다. ==디버거는 코드가 무엇을 하는지 보여주지만, 무엇을 해야 하는지는 보여주지 않는다.== 화면의 `lo = 3`이 옳은지 틀린지는 결국 사람이 판단한다. 그 판단의 근거를 만드는 것이 손추적이다.\n\n\"읽으면 이해되는데 못 짠다\"는 상태의 정체도 여기 있다. 읽을 때는 **코드가 상태를 대신 들고 있다.** 짤 때는 그 상태를 전부 머리가 들어야 한다. 읽기는 실행 모델 없이도 되지만 쓰기는 안 된다. 손추적은 그 모델을 종이에 외부화해 훈련하는 절차다.\n\n비용은 싸다. 이분 탐색은 원소가 100만 개여도 20스텝, 여섯 개면 세 스텝이다. **표 세 줄이 열여섯 번의 제출을 대체한다.**\n\n## 2. 아이디어\n\n손추적은 상태 표를 그리는 일이고, 표를 그린다는 것은 세 가지를 결정한다는 뜻이다. 무엇을 열로 둘지, 언제 한 줄을 찍을지, 언제 멈출지.\n\n### 2.1 무엇을 관찰할 것인가\n\n변수를 전부 열로 만들면 표가 죽는다. 열이 열두 개면 채우다 지치고, 채워도 무엇이 이상한지 안 보인다. 남길 것은 세 부류뿐이다.\n\n**첫째, 경계 변수.** **불변식**이 걸려 있는 변수다. 불변식은 특정 지점에서 항상 참이어야 하는 명제다. 반열림 이분 탐색이라면 \"답은 항상 `[lo, hi)` 안에 있다\"가 불변식이고 `lo`와 `hi`가 경계 변수다. BFS라면 \"큐 안의 정점들은 거리 순으로 정렬되어 있다\"가 불변식이고 큐가 경계다.\n\n**둘째, 측도.** 매 반복 반드시 줄어드는 음이 아닌 정수량이다. 이분 탐색에서는 폭 `hi - lo`가 측도다. 0 밑으로 못 내려가는데 매번 줄어드니 무한히 돌 수 없다. 반대로 **측도가 줄지 않는 반복이 한 번이라도 있으면 무한 루프에 빠질 수 있다.**\n\n**셋째, 판정에 쓰인 파생값.** `mid`, `a[mid]`, 비교 결과다. 없으면 왜 그쪽으로 갔는지 재구성할 수 없다.\n\n**불변식이 정확성을 맡고 측도가 종료를 맡는다.** 알고리즘이 옳다는 말은 이 둘이 모두 성립한다는 뜻이고, 손추적 표는 그것을 한 화면에서 확인하는 장치다.\n\n::: note\n열을 고르는 일이 손추적의 절반이다. ==열을 못 고르겠다면 그 알고리즘을 아직 이해하지 못한 것이다.== 실패가 아니라 신호다. 코드를 더 들여다볼 것이 아니라 \"이 루프가 매 바퀴 지켜야 하는 명제\"를 한 문장으로 먼저 적으라는 뜻이다.\n:::\n\n### 2.2 언제 한 줄을 찍을 것인가\n\n스냅샷 지점은 **루프 머리 한 곳으로 고정한다.** 불변식은 루프 머리에서 참인 명제이지 중간에서 참인 명제가 아니다. `lo`는 갱신했는데 `hi`는 아직인 시점을 적으면 그 줄은 어떤 불변식도 만족하지 않는 유령 상태가 된다. 표가 거짓말을 시작하는 지점이 대개 여기다.\n\n재귀 함수라면 찍는 자리는 **함수 진입 직후**이고, 열에는 인자와 깊이를 둔다. 반환값은 별도 열로 두고 되돌아올 때 채운다. [III-1 재귀 사고법](#/iii-1)에서 호출 트리로 확장된다.\n\n### 2.3 언제 멈출 것인가\n\n세 줄만 채우고 덮는 습관은 손추적의 효과를 거의 다 버린다. **끝까지 간다.** 측도가 0이 되고 루프 조건이 거짓이 되는 줄까지다.\n\n오프바이원은 거의 항상 마지막 한 줄에서 드러난다. 중간 스텝은 웬만한 구현이 다 통과한다. `lo`와 `hi`가 붙는 순간에 한쪽이 하나 어긋나거나 조건이 `<=`여서 한 바퀴를 더 도는 것이 그 자리에서 나온다. 표의 마지막 줄은 곧 반환값의 의미를 적는 줄이다.\n\n### 2.4 표의 모양\n\n```text nolines\n  step | lo | hi | width | mid | a[mid] | branch\n  -----+----+----+-------+-----+--------+-----------\n     0 |  0 |  6 |     6 |   3 |      5 | hi = mid\n     1 |  0 |  3 |     3 |   1 |      3 | lo = mid+1\n     2 |    |    |       |     |        |\n          ^            ^                    ^\n          |            |                    +-- 갱신: 어느 쪽 절반을 버렸는가\n          |            +----------------------- 측도: 반드시 단조 감소한다\n          +------------------------------------ 경계: 불변식이 걸려 있는 변수\n```\n\n왼쪽 세 덩어리가 전부다. 경계가 불변식을 지키는지, 측도가 줄어드는지, 갱신 규칙이 방금 검사한 원소를 제대로 처리했는지 본다. 세 번째가 오프바이원을 잡는다. **`mid`를 검사했으면 반드시 어느 한쪽에서 사라져야 한다.** 양쪽 다 남기면 구간이 줄지 않고, 다 버리면 답을 건너뛴다.\n\n### 2.5 어떤 입력으로 추적할 것인가\n\n크기는 **답이 나오는 최소 크기의 두 배** 정도가 좋다. 원소 여섯 개면 세 스텝을 돌아 갈림길이 양쪽 다 나온다. 세 개면 한쪽 분기만 밟고 끝나 반쪽만 검증된다.\n\n값의 배치는 셋을 돌린다.\n\n1. **답이 중간에 있는 입력.** 정상 경로.\n2. **답이 맨 끝에 있는 입력.** 오른쪽 경계가 닫힘인지 열림인지가 여기서 갈린다.\n3. **답이 없는 입력.** 루프가 빈 구간에서 어떻게 끝나고 무엇을 돌려주는지가 여기서 정해진다.\n\n중복 원소를 하나 섞는 것도 값싸다. `a = [1, 3, 3, 5, 7, 9]`에서 `3`이 둘인 이유가 그것이다. \"첫 위치\"와 \"마지막 다음 위치\"를 구분하는 구현인지가 여기서만 드러난다.\n\n### 2.6 손추적이 잡지 못하는 것\n\n::: widget complexity-plot {\"n\":1000000,\"curves\":[\"n\",\"n log n\",\"n^2\",\"2^n\"],\"budget\":100000000}\n:::\n\n위젯은 N이 커질 때 $O(n)$, $O(n \\log n)$, $O(n^2)$, $O(2^n)$이 로그 축에서 얼마나 벌어지는지와 \"1초 안에 되는 선\"이 어디를 지나는지를 보인다. 슬라이더를 밀면 $O(n^2)$이 그 선을 넘는 지점이 나오고, $O(2^n)$은 훨씬 왼쪽에서 넘어가 있다.\n\n이 그림이 여기 있는 이유는 **손추적의 한계를 긋기 위해서다.** 손추적은 정확성 도구이지 성능 도구가 아니다. 원소 여섯 개를 따라가서는 100만 개에서 시간 초과인지 알 수 없다. 성능은 [0-9 N 범위로 알고리즘 역산하기](#/0-9)의 절차로 판단한다.\n\n::: tip\n순서가 있다. **역산이 먼저, 손추적이 나중이다.** 역산으로 후보를 정하고 그 구현을 손으로 따라간다. 뒤집으면 시간 초과가 확정된 코드를 정성껏 검증하는 일이 생긴다.\n:::\n\n::: hist\n손추적은 새 기법이 아니다. 한 번의 실행에 대기 시간이 길던 시절에는 기계에 넣기 전 종이로 검증하는 것이 표준 절차였고, 그 이름이 desk checking이다. 기계가 싸지면서 \"일단 돌려 보고 고친다\"가 자리를 대신했다.\n\n그 시절의 명제 하나는 지금도 유효하다. Dijkstra는 1970년의 노트에서 테스트가 버그의 존재를 보일 수는 있어도 부재를 보일 수는 없다고 적었다. 실행은 넣어 본 입력에 대해서만 말하고, 불변식과 측도는 넣어 보지 않은 입력에 대해서도 말한다.\n:::\n\n## 3. 손으로 따라가기\n\n::: trace\n입력: `a = [1, 3, 3, 5, 7, 9]`, `x = 5`. 구할 것은 `a[i] >= 5`를 만족하는 **가장 왼쪽 인덱스** `i`.\n\n불변식: 답은 항상 반열림 구간 `[lo, hi)` 안에 있다. 시작은 `lo = 0`, `hi = 6`, 루프 조건은 `lo < hi`.\n갱신 규칙: `mid = lo + (hi - lo) // 2`. `a[mid] >= 5`이면 `hi = mid`, 아니면 `lo = mid + 1`.\n\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 2 |\n| 2 |  |  |  |  |  |  |  |\n| 3 |  |  |  |  |  |  |  |\n\n세 가지를 확인하라.\n\n- [ ] `width` 열이 매 스텝 **실제로** 줄어드는가\n- [ ] 루프가 멈추는 순간 `lo`와 `hi`는 얼마인가\n- [ ] 그때의 `lo`가 정말 답인가. 불변식이 폭 0인 구간에서 무엇을 뜻하는가\n:::\n\n::: answer\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 2 |\n| 2 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 3 |\n| 3 | 3 | 3 | 0 | — | — | — | `lo < hi`가 거짓, 종료 |\n\n답은 `lo = 3`이고 `a[3] = 5`가 맞다.\n\n`width` 열이 `6 → 3 → 1 → 0`으로 매 스텝 엄격히 줄었다. 이것이 이 루프가 반드시 끝난다는 증거다.\n\n마지막 질문의 핵심은 폭 0인 구간에서 불변식이 무엇을 뜻하느냐다. `[3, 3)`은 빈 구간이다. \"답이 이 안에 있다\"가 참이려면 답은 그 **왼쪽 끝 위치**, 즉 `lo`여야 한다. 반열림으로 짜면 `lo`와 `hi`가 만나는 지점이 곧 답이라 보정할 것이 없다. 닫힌 구간이면 `lo`인지 `lo+1`인지를 매번 다시 생각해야 한다. ==구간 표기를 반열림으로 통일하는 것이 오프바이원에 대한 가장 값싼 방어다.==\n\n**이제 규칙 하나만 바꿔 같은 표를 다시 채워 보라.** `lo = mid + 1` 대신 `lo = mid`로 두면:\n\n| 스텝 | lo | hi | width | mid | a[mid] | a[mid] >= 5 | 갱신 |\n|---|---|---|---|---|---|---|---|\n| 0 | 0 | 6 | 6 | 3 | 5 | 예 | hi = 3 |\n| 1 | 0 | 3 | 3 | 1 | 3 | 아니오 | lo = 1 |\n| 2 | 1 | 3 | 2 | 2 | 3 | 아니오 | lo = 2 |\n| 3 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 2 |\n| 4 | 2 | 3 | 1 | 2 | 3 | 아니오 | lo = 2 |\n\n스텝 3에서 `width`가 1로 멈춘다. `mid`가 `lo`와 같아지는 순간 `lo = mid`는 아무것도 바꾸지 않고, 표는 같은 줄을 영원히 반복한다. **무한 루프가 실행 없이 표 다섯 줄에서 잡혔다.** 이것이 측도를 열로 두는 이유다.\n:::\n\n## 4. 구현\n\n손추적 표를 그대로 코드로 옮기면 추적 로그가 된다. 열 이름이 곧 출력 필드이고 출력 지점이 곧 루프 머리다. 표를 먼저 그렸다면 무엇을 찍을지 고민할 일이 없다.\n\n::: dual\n```python title=\"lower_bound — 손추적 표를 코드가 대신 찍게 하기\"\ndef lower_bound(a, x):\n    lo, hi = 0, len(a)          # 불변식: 답은 항상 [lo, hi) 안에 있다\n    step = 0\n    while lo < hi:              # 측도: hi - lo 가 매 반복 반드시 줄어든다\n        mid = lo + (hi - lo) // 2\n        print(f\"step={step} lo={lo} hi={hi} width={hi - lo} mid={mid} a[mid]={a[mid]}\")\n        if a[mid] >= x:\n            hi = mid            # mid 는 조건을 만족하므로 후보로 남긴다\n        else:\n            lo = mid + 1        # mid 는 조건을 만족하지 못하므로 버린다\n        step += 1\n    print(f\"done lo={lo} hi={hi} width={hi - lo}\")\n    return lo\n\n\na = [1, 3, 3, 5, 7, 9]\nans = lower_bound(a, 5)\nprint(\"answer =\", ans)\n```\n```cpp title=\"lower_bound — 손추적 표를 코드가 대신 찍게 하기\"\n#include <iostream>\n#include <vector>\nusing namespace std;\n\nint lower_bound(const vector<int>& a, int x) {\n    int lo = 0, hi = (int)a.size();   // 불변식: 답은 항상 [lo, hi) 안에 있다\n    int step = 0;\n    while (lo < hi) {                 // 측도: hi - lo 가 매 반복 반드시 줄어든다\n        int mid = lo + (hi - lo) / 2;\n        cout << \"step=\" << step << \" lo=\" << lo << \" hi=\" << hi\n             << \" width=\" << hi - lo << \" mid=\" << mid << \" a[mid]=\" << a[mid] << \"\\n\";\n        if (a[mid] >= x)\n            hi = mid;                 // mid 는 조건을 만족하므로 후보로 남긴다\n        else\n            lo = mid + 1;             // mid 는 조건을 만족하지 못하므로 버린다\n        step += 1;\n    }\n    cout << \"done lo=\" << lo << \" hi=\" << hi << \" width=\" << hi - lo << \"\\n\";\n    return lo;\n}\n\nint main() {\n    vector<int> a = {1, 3, 3, 5, 7, 9};\n    int ans = lower_bound(a, 5);\n    cout << \"answer = \" << ans << \"\\n\";\n    return 0;\n}\n```\n:::\n\n두 구현의 출력은 한 글자도 다르지 않다.\n\n```console\nstep=0 lo=0 hi=6 width=6 mid=3 a[mid]=5\nstep=1 lo=0 hi=3 width=3 mid=1 a[mid]=3\nstep=2 lo=2 hi=3 width=1 mid=2 a[mid]=3\ndone lo=3 hi=3 width=0\nanswer = 3\n```\n\n**복잡도:** 시간 $O(\\log n)$ — 매 반복 폭 `hi - lo`가 절반 이하로 줄고 폭이 0이면 끝나므로, 반복 횟수는 폭을 1까지 반으로 접는 횟수인 $\\log_2 n$을 넘지 않는다. 공간 $O(1)$ — 재귀 없이 정수 변수 네 개만 쓴다.\n\n상수도 말해 둔다. $O(\\log n)$은 $n = 10^6$에서 20회지만 **각 스텝이 배열의 전혀 다른 곳을 찌른다.** 위치가 매번 절반씩 뛰어 캐시 라인이 재사용되지 않으므로 초반 스텝은 사실상 매번 캐시 미스다. 같은 20회라도 연속 접근 20회와 비용이 다르다. 이 차이는 [0-6 C++ 컨테이너 세트](#/0-6)에서 다룬다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 정수 나눗셈 | `//`는 항상 내림. 음수에서 `-1 // 2 == -1` | `/`는 0 방향 절삭. `-1 / 2 == 0` |\n| `(lo + hi)` 오버플로 | 임의 정밀도라 발생하지 않는다 | `int` 범위를 넘을 수 있다. `lo + (hi - lo) / 2`로 쓰는 이유 |\n| 배열 길이 타입 | `len(a)`는 `int` | `a.size()`는 부호 없는 `size_t`. 부호 있는 값과 섞으면 비교가 뒤집힌다 |\n| 표준 대응 | `bisect.bisect_left(a, x)` | `std::lower_bound(a.begin(), a.end(), x)` |\n\n::: danger\n`mid = (lo + hi) / 2`는 C++에서 실제 장애를 만드는 코드다. `lo`와 `hi`가 20억 근처면 합이 `int` 범위를 넘어 음수가 되고, 음수 인덱스로 배열을 읽는다. 정의되지 않은 동작이라 크래시할 수도, 조용히 쓰레기 값을 읽을 수도 있다.\n\n`mid = lo + (hi - lo) / 2`로 쓰면 뺄셈이 먼저라 중간값이 커지지 않는다. **Python에서는 두 표기가 동등하지만 같은 습관을 양쪽에 들여 두는 편이 안전하다.** 언어를 오갈 때 무너지는 것은 지식이 아니라 습관이다. 오버플로는 [0-5 C++ 입출력과 기본 타입](#/0-5)에 있다.\n:::\n\n::: warn\n추적 출력은 **디버깅용이지 제출용이 아니다.** 채점기는 표준 출력을 정답과 비교하므로 로그 한 줄이 섞이면 알고리즘이 맞아도 오답이다. 지우는 것을 잊는 사고가 잦다면 `sys.stderr` / `cerr`로 보내라. 표준 에러는 채점 대상이 아니다.\n:::\n\n::: perf\n추적 출력을 켠 채로 큰 입력을 돌리는 것은 방법이 아니다. 정렬된 배열 $n = 10^6$에 질의 10만 번이면 한 질의가 약 20스텝이라 로그가 약 200만 줄이다. 전부 `/dev/null`로 버렸는데도 이렇다.\n\n| | 추적 없이 | 추적 출력 | 배수 |\n|---|---|---|---|\n| Python 3.13 | 0.45초 | 1.47초 | 3.3배 |\n| C++17 `-O2` | 0.018초 | 0.65초 | 36배 |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측, 3회 실행의 중앙값. 절대값은 기기마다 다르지만 자릿수 차이는 어디서나 같다. 측정 스크립트는 `tools/bench/dry_run_trace_cost.py` 와 `.cpp` 다.)\n\nC++ 쪽 배수가 큰 것이 핵심이다. 계산이 이미 0.018초로 끝나므로 계측 코드가 전체를 지배한다. **알고리즘이 빠를수록 로그가 프로그램이 된다.** 손추적이 입력을 여섯 개로 줄이는 데서 시작하는 이유가 이것이다.\n:::\n\n버그가 있는 쪽도 같은 형식으로 남긴다. 앞 절의 정답 상자에서 무한 루프를 만든 변형이다.\n\n```python title=\"무한 루프에 빠지는 버전 (조각)\" {2,4-5}\nwhile lo < hi:\n    mid = lo + (hi - lo) // 2\n    if a[mid] >= x:\n        hi = mid       # ✅ mid 는 조건을 만족하므로 후보로 남긴다\n    else: lo = mid     # ❌ mid 는 조건을 만족하지 않는데도 버리지 않았다\n```\n\n정수 나눗셈이 내림이라 `mid`는 폭이 1일 때 항상 `lo`와 같아지고, 그 순간 `lo = mid`는 아무 일도 하지 않는다. **이 버그는 폭이 1이 되기 전까지 드러나지 않는다.** 표를 끝까지 채우라는 §2.3이 겨냥하는 것이 이 종류다.\n\n무한 루프를 <kbd>Ctrl</kbd>+<kbd>C</kbd>로 끊었을 때 마지막 로그가 같은 값을 반복하고 있다면, 원인은 거의 항상 측도가 줄지 않는 갱신 규칙이다.\n\n::: pitfall\n- **`mid`를 양쪽 다 남긴다.** `hi = mid`와 `lo = mid`를 함께 쓰면 폭 1에서 멈춘다.\n- **구간 표기를 섞는다.** `hi = len(a)`로 시작해 놓고 `while lo <= hi`를 쓰면 첫 반복부터 `a[len(a)]`를 읽는다. 반열림이면 `<`, 닫힌 구간이면 `hi = len(a) - 1`에 `<=`다. 표기는 하나로 통일한다.\n- **끝난 뒤의 값을 확인하지 않는다.** `x`가 모든 원소보다 크면 `lo == len(a)`가 되고 그대로 `a[lo]`를 읽으면 터진다. 반환값을 쓰기 전에 범위 검사를 넣어라.\n- **관찰 대상을 잘못 고른다.** `width`를 빼면 무한 루프가 표에서 보이지 않는다. 측도 열은 선택이 아니다.\n- **중간 상태를 표에 적는다.** `lo`만 갱신하고 `hi`는 아직인 시점을 남기면 그 줄은 어떤 불변식도 만족하지 않는다. 찍는 자리는 루프 머리 하나다.\n:::\n\n::: deep\n이 형식은 즉흥적인 요령이 아니라 프로그램 검증의 표준 도구를 축소한 것이다. Hoare가 1969년에 제시한 논리에서 루프의 정확성은 사전조건, 불변식, 사후조건으로 서술된다. 루프 조건이 거짓이 된 시점에 성립하는 \"불변식 ∧ ¬루프조건\"이 곧 사후조건이어야 한다.\n\n이분 탐색에 대입하면 불변식은 \"답은 `[lo, hi)` 안에 있다\", 루프 조건의 부정은 `lo == hi`다. 둘을 결합하면 \"답은 폭 0인 구간의 위치, 즉 `lo`\"가 나온다. **`lo`를 돌려주면 된다는 결론이 코드를 보지 않고 논리만으로 나온다.** 종료는 측도가 담당한다.\n\n실전에서 값어치를 하는 것은 증명이 아니라 **문서화**다. 루프 위에 불변식 한 줄을 주석으로 적어 두면 반년 뒤 고치는 사람이 무엇을 깨면 안 되는지 안다.\n:::\n\n## 5. 어디에 쓰이는가\n\n**코드 리뷰가 손추적이다.** 리뷰어가 루프 앞에서 멈춰 \"`i`가 `n-1`까지 가나 `n`까지 가나\"를 묻는 것은 머릿속에서 표를 두어 줄 채우는 일이다. 코멘트가 \"이상한 것 같은데요\"에서 \"`n=1`이면 이 루프는 한 번도 안 돕니다\"로 바뀌는 순간, 표의 마지막 줄을 실제로 채워 봤다는 뜻이다.\n\n**로그 필드 설계가 관찰 대상 선택과 같은 문제다.** 운영 중인 시스템에서 무엇을 로그로 남길지 정하는 일은 어떤 변수를 열로 둘지 정하는 일과 같다. 전부 찍으면 디스크가 차고 정작 필요한 줄을 못 찾는다. 남길 것은 불변식이 깨졌는지 판정할 수 있는 최소 필드다. 큐 길이, 처리 지연, 재시도 횟수가 그 자리에 온다. [XI-7 이벤트 루프와 백프레셔](#/xi-7)에서 다시 쓰인다.\n\n**단위 테스트의 케이스 표가 손추적의 마지막 줄이다.** §2.5에서 고른 세 입력은 그대로 테스트 케이스 세 개가 된다. 확인한 것을 테스트로 고정하면 같은 확인을 다시 손으로 하지 않아도 된다. 제어 주기가 1밀리초인 루프처럼 브레이크포인트 자체가 동작을 바꾸는 코드에는 이 경로 말고 대안이 없다.\n\n## 6. 이 유형을 알아보는 법\n\n손추적이 필요한 코드에는 표식이 있다.\n\n::: classify\n- 신호어: \"정확히 K번\", \"이상/이하\", \"포함한다/포함하지 않는다\", \"가장 왼쪽의\", \"처음으로 ~가 되는 시점\"\n- 제약조건: 구간이 반열림인지 닫힘인지 지문이 명시하지 않을 때. 인덱스가 1부터 시작하는 입력. 원소가 1개일 수 있는 입력. 답이 없을 수 있는 입력\n- 혼동 주의: 경계가 흔들리는 것과 알고리즘 선택이 틀린 것은 다른 문제다. 손추적은 앞쪽만 고친다. 유형 자체를 잘못 잡은 경우는 [I-5 오분류 사례집](#/i-5)으로 간다\n- 반례 함정: 원소 1개, 답이 맨 끝, 답이 아예 없음. 이 세 입력에서만 깨지는 구현이 대부분이고, 중간 크기 입력만 돌려 보면 전부 통과한다\n:::\n\n::: interview\n경계가 있는 루프를 화이트보드에 짜게 한 뒤 이어지는 질문은 대개 둘이다.\n\n**\"이 루프가 무한 루프에 빠지지 않는 이유를 설명해 보세요.\"**\n답변 뼈대는 측도다. 매 반복 엄격히 줄어드는 음이 아닌 정수량을 지목한다. \"구간 폭 `hi - lo`가 매 반복 최소 1 줄고 0 밑으로는 못 갑니다. 따라서 최대 초기 폭만큼만 돌고 끝납니다.\" \"테스트해 봤는데 잘 돌았습니다\"는 답이 아니다.\n\n**\"이 함수가 옳은 값을 돌려준다는 것을 어떻게 압니까.\"**\n답변 뼈대는 불변식이다. 루프 머리에서 항상 참인 명제를 한 문장으로 말하고, 거기에 루프 조건의 부정을 결합해 무엇이 나오는지 보인다. \"답은 항상 `[lo, hi)` 안에 있고, 루프가 끝나면 `lo == hi`이므로 답은 `lo`입니다.\"\n\n두 답변 모두 코드를 다시 읽지 않고 나온다.\n:::\n\n## 연습\n\n::: quiz\n전부 경계 조건이 본체인 유형이다. **코드를 짜기 전에 손추적 표부터 그려라.**\n\n**1. 백준 1920 수 찾기 (실버 4)** — https://www.acmicpc.net/problem/1920\n- 신호: \"존재하는지 알아내시오\" + N과 M이 각각 10만. 선형 탐색이면 100억이라 넘는다.\n- 상태: 탐색 구간 `[lo, hi)` 하나.\n- 자료구조: 정렬된 배열. 순서만 필요하고 삽입·삭제가 없어 트리나 해시를 쓸 이유가 없다.\n\n**2. 백준 10816 숫자 카드 2 (실버 4)** — https://www.acmicpc.net/problem/10816\n- 신호: 존재 여부가 아니라 \"몇 개인지\"를 묻는다. 개수를 세는 것은 경계 두 개의 차다.\n- 상태: 같은 값이 놓인 구간의 왼쪽 끝과 오른쪽 끝 다음 위치. `upper_bound - lower_bound`가 답이다.\n- 자료구조: 정렬 배열 + 두 종류의 경계 탐색. 해시로도 풀리지만 훈련 가치는 두 경계의 차이를 손으로 확인하는 데 있다.\n\n**3. 백준 2805 나무 자르기 (실버 2)** — https://www.acmicpc.net/problem/2805\n- 신호: \"절단기에 설정할 수 있는 높이의 최댓값\". 답 자체가 수이고 \"높이 H면 M 이상인가\"라는 판정이 H에 대해 단조롭다.\n- 상태: 답의 후보 구간 `[lo, hi)`. 배열 인덱스가 아니라 **답의 값**을 이분 탐색한다.\n- 자료구조: 배열과 누적 합계용 정수. 합이 20억을 넘어 C++에서는 `long long`이 필수다. [VII-3 매개변수 탐색](#/vii-3)에서 다룬다.\n\n**4. 손추적 과제.** `a = [2, 4, 4, 4, 8]`, `x = 4`로 위의 `lower_bound`를 끝까지 표로 채워라. 이어서 `a[mid] >= x`를 `a[mid] > x`로만 바꾸고 같은 표를 다시 채워라. 두 표는 어디서 갈라지고, 두 결과의 차는 무엇을 뜻하는가.\n\n::: answer\n`a[mid] >= x`인 원본은 `lo = 1`에서 끝난다. `a[1] = 4`가 4 이상인 첫 위치다.\n\n`a[mid] > x`로 바꾸면 `4`들은 조건을 만족하지 못해 `lo = mid + 1`로 전부 버려지고, 루프는 `lo = 4`에서 끝난다. `a[4] = 8`이 4보다 큰 첫 위치다.\n\n두 표는 `mid`가 값 `4`를 가리키는 첫 스텝에서 갈라진다. 원본은 `hi = mid`로 왼쪽을 남기고, 변형은 `lo = mid + 1`로 오른쪽으로 간다.\n\n두 결과의 차 `4 - 1 = 3`이 배열 안 `4`의 개수다. 이것이 곧 `upper_bound - lower_bound`이고 2번 문제의 답이다. **부등호 하나가 \"첫 위치\"와 \"마지막 다음 위치\"를 가르고, 두 값의 차가 개수를 준다.** 세 결과가 같은 표에서 나온다는 것이 이 과제의 요점이다.\n:::\n:::\n\n## 요약\n\n- 손추적은 코드를 실행하지 않고 상태 표를 채워 실행 모델을 검증하는 절차다. \"읽으면 이해되는데 못 짠다\"는 상태를 겨냥한다.\n- 열로 둘 것은 셋뿐이다. 불변식이 걸린 **경계 변수**, 매 반복 줄어드는 **측도**, 판정에 쓰인 **파생값**.\n- **불변식이 정확성을 맡고 측도가 종료를 맡는다.** 측도가 줄지 않는 반복이 하나라도 있으면 무한 루프다.\n- 스냅샷은 **루프 머리 한 곳**에서만 찍고, 표는 **측도가 0이 되는 줄까지** 채운다. 오프바이원은 마지막 줄에서 드러난다.\n- 입력은 답이 중간에 있는 것, 맨 끝에 있는 것, 아예 없는 것 세 가지를 돌린다.\n- 구간 표기는 한 함수 안에서 **반열림 `[lo, hi)` 하나로 통일한다.** 폭이 `hi - lo`이고 빈 구간이 `lo == hi` 하나로 표현되는 것이 오프바이원을 줄인다.\n- 손추적은 정확성 도구다. 성능은 [0-9 N 범위로 알고리즘 역산하기](#/0-9)의 역산으로 판단하고, 역산을 먼저 한다.\n\n**다음 절**: [0-12 디버깅과 반례 찾기](#/0-12) — 손추적으로도 안 잡히는 버그를 브루트포스 대조와 랜덤 스트레스 테스트로 몰아낸다.\n","0-12":"# 0-12 디버깅과 반례 찾기\n\n::: lead\n채점기가 \"틀렸습니다\" 한 줄만 돌려줄 때, 그 반례를 스스로 만들어 내는 방법.\n:::\n\n## 1. 문제\n\n투 포인터를 짰다. 예제 세 개가 전부 맞는다. 제출한다. `틀렸습니다`.\n\n이 상태에서 할 수 있는 일이 별로 없다. 코드를 다시 읽어도 예제는 여전히 맞고, [0-11 손추적](#/0-11)으로 표를 채워도 그 입력에서는 정상이다. **손추적은 \"이 입력에서 코드가 무엇을 하는가\"를 알려 주지 \"어떤 입력에서 틀리는가\"는 알려 주지 않는다.** 반례를 손에 쥐기 전까지는 디버깅이 시작되지 않는다.\n\n흔한 대응이 둘 있고 둘 다 비싸다. 하나는 예제를 손으로 더 만드는 것이다. 사람이 만드는 입력은 사람이 생각한 경우만 담기고, 틀린 이유는 대개 생각하지 못한 경우다. 다른 하나는 조건을 바꿔 가며 재제출하는 것이다. 제출 한 번에 정보 한 비트를 얻는다.\n\n그런데 대부분의 문제에는 **틀릴 수 없는 풀이가 하나 존재한다.** 정의를 그대로 옮긴 완전탐색이다. 느려서 제출할 수 없을 뿐이다.\n\n빠른 풀이와 느린 풀이가 둘 다 있으면 반례 찾기는 자동화된다. 무작위 입력을 만들어 둘에 넣고 답이 갈리는 순간을 잡으면 된다. **사람이 반례를 상상할 필요가 없다.**\n\n## 2. 아이디어\n\n하네스는 네 조각이다. 문제가 바뀌어도 이 구조는 바뀌지 않는다.\n\n```text nolines\n  gen(rng) ──┬──▶ brute(t) ──┐\n             │               ├──▶ same?      <- 다르면 멈추고 t 를 출력\n             └──▶ fast(t)  ──┘\n```\n\n`brute`가 정답의 정의다. 성능을 생각하지 않고 문제 설명을 그대로 코드로 옮긴다. $O(n^3)$이어도 상관없다 — 어차피 $n$을 6 이하로만 만들 것이다. **`brute`가 짧고 뻔할수록 하네스가 신뢰할 만하다.**\n\n### 2.1 생성기 설계가 절반이다\n\n무작위 입력이면 다 되는 것이 아니다. 두 가지를 지켜야 한다.\n\n**작게 만든다.** 원소를 여섯 개 이하로 둔다. 이유는 두 개다. 첫째, 반례를 눈으로 읽고 손으로 따라갈 수 있어야 한다. 원소가 1,000개인 반례는 반례가 아니라 또 하나의 미해결 문제다. 둘째, 작을수록 **한 초에 던질 수 있는 입력이 많다.** 버그가 특정 형태에서만 나온다면 그 형태를 뽑을 확률을 높이는 것이 전부다.\n\n**값 범위를 좁게 만든다.** 이쪽이 덜 알려져 있고 더 중요하다. 값을 $0 \\sim 10^9$에서 뽑으면 **같은 값이 두 번 나오는 일이 사실상 없다.** 그런데 실전 버그의 큰 부분이 중복·동점·경계 일치에서 나온다. 값을 $0 \\sim 3$에서 뽑으면 원소 여섯 개 중 중복이 거의 항상 생긴다.\n\n::: warn\n\"랜덤 테스트를 100만 번 돌렸는데 안 걸렸다\"는 말은 대개 생성기가 좁은 영역만 훑었다는 뜻이다. **생성기가 만들지 못하는 입력은 영원히 검사되지 않는다.** 하네스가 통과했다는 사실보다 생성기가 무엇을 만들 수 있는지가 먼저다.\n:::\n\n### 2.2 축소가 나머지 절반이다\n\n무작위 입력에서 처음 걸린 반례는 대개 필요 이상으로 크다. 원소 다섯 개 중 버그와 관계있는 것은 셋뿐인데 나머지 둘이 시야를 가린다.\n\n그래서 **실패를 유지하면서 입력을 계속 깎는다.** 한 번에 한 곳만 건드리고, 깎은 뒤에도 여전히 실패하면 채택하고 아니면 되돌린다. 더 이상 어느 방향으로도 못 깎는 지점이 최소 반례다.\n\n여기서 종료가 보장되는 이유가 [0-11 §2.1](#/0-11)의 **측도**다. 채택될 때마다 (원소 개수, 값의 합)이 반드시 줄어들고, 둘 다 음이 아닌 정수라 무한히 줄어들 수 없다. ==실패 판정이 단조롭게 유지되는 축소 연산만 쓰는 것이 조건이다.==\n\n## 3. 손으로 따라가기\n\n::: trace\n검증 대상은 \"정렬된 배열에서 `a[i] + a[j] == x` (`i < j`)인 쌍의 개수\"를 세는 투 포인터다. 하네스가 5회차에 잡은 입력은 `a = [0, 0, 3, 3]`, `x = 3`이고 `brute = 4`, `fast = 2`였다.\n\n축소 연산은 셋이고 위에서부터 순서대로 시도한다.\n(a) 원소 하나 지우기 (b) 원소 하나를 1 줄이기 (c) `x`를 1 줄이기\n\n**실패가 유지될 때만 채택한다.** 채택하면 처음(a)부터 다시 시작한다.\n\n| 시도 | 후보 | brute | fast | 실패? | 채택? |\n|---|---|---|---|---|---|\n| 1 | `a=[0,3,3] x=3` | 2 | 1 | 예 | 예 |\n| 2 | `a=[3,3] x=3` | 0 | 0 | 아니오 | 아니오 |\n| 3 | `a=[0,3] x=3` | 1 | 1 | 아니오 | 아니오 |\n| 4 |  |  |  |  |  |\n| 5 |  |  |  |  |  |\n| 6 |  |  |  |  |  |\n| 7 |  |  |  |  |  |\n\n시도 4는 (a)의 마지막 후보이고, 5~6은 (b), 7은 (c)다.\n\n- [ ] 시도 3과 4는 후보가 같아 보인다. 왜 두 번 시도되는가\n- [ ] 최종적으로 남는 최소 반례는 무엇인가\n- [ ] 그 반례에서 `fast`가 왜 1을 돌려주는가. 정답 2와 어디서 갈리는가\n:::\n\n::: answer\n| 시도 | 후보 | brute | fast | 실패? | 채택? |\n|---|---|---|---|---|---|\n| 1 | `a=[0,3,3] x=3` | 2 | 1 | 예 | 예 |\n| 2 | `a=[3,3] x=3` | 0 | 0 | 아니오 | 아니오 |\n| 3 | `a=[0,3] x=3` | 1 | 1 | 아니오 | 아니오 |\n| 4 | `a=[0,3] x=3` | 1 | 1 | 아니오 | 아니오 |\n| 5 | `a=[0,2,3] x=3` | 1 | 1 | 아니오 | 아니오 |\n| 6 | `a=[0,2,3] x=3` | 1 | 1 | 아니오 | 아니오 |\n| 7 | `a=[0,3,3] x=2` | 0 | 0 | 아니오 | 아니오 |\n\n**답 1.** 인덱스 1을 지운 것과 인덱스 2를 지운 것이다. `a = [0, 3, 3]`에서 두 `3`은 값이 같으므로 결과 배열이 같아진다. 축소기는 값을 보지 않고 위치를 지우므로 중복 시도가 생긴다. 값이 같은 원소를 건너뛰는 최적화를 넣을 수 있지만, **축소는 실패한 뒤에 한 번만 도는 코드다.** 여기에 복잡도를 넣는 것은 손해다.\n\n시도 5와 6도 같은 이유다. `[0,3,3]`에서 두 번째 `3`을 2로 줄인 것과 세 번째 `3`을 2로 줄인 것이 정렬 후 같아진다.\n\n**답 2.** `a = [0, 3, 3]`, `x = 3`이다. 어느 방향으로도 못 깎는다. 원소를 지우면 실패가 사라지고(시도 2~4), 값을 줄여도 사라지고(5~6), `x`를 줄여도 사라진다(7).\n\n**답 3.** `i = 0`, `j = 2`에서 시작한다. `a[0] + a[2] = 0 + 3 = 3`이고 `x`와 같으므로 `cnt`를 1 올리고 **양쪽 포인터를 동시에 안으로 당긴다.** `i = 1`, `j = 1`이 되어 `i < j`가 깨지고 루프가 끝난다.\n\n그런데 정답은 `(0, 3)` 쌍이 둘이다 — 인덱스 (0,1)과 (0,2). ==`0`이 하나인데 `3`이 둘이므로 쌍은 둘이다.== `fast`는 합이 맞을 때마다 한 개만 세고 지나가므로 **같은 값이 여럿인 경우를 통째로 놓친다.**\n\n값이 전부 다른 입력에서는 이 버그가 절대 드러나지 않는다. §2.1이 값 범위를 좁히라고 한 이유가 정확히 이것이다.\n:::\n\n## 4. 구현\n\n네 조각을 코드로 옮긴다. `fast`가 검증 대상이고, 나머지 셋은 문제가 바뀌어도 형태가 같다.\n\n::: dual\n```python title=\"스트레스 테스트 하네스 — gen / brute / fast / 비교 루프\"\nimport random\nimport sys\n\n\ndef gen(rng):\n    n = rng.randint(1, 6)          # 작게: 반례를 눈으로 읽을 수 있어야 한다\n    x = rng.randint(0, 6)\n    a = sorted(rng.randint(0, 3) for _ in range(n))   # 값 범위를 좁혀 중복을 만든다\n    return (a, x)\n\n\ndef brute(t):                      # 정의를 그대로 옮긴다. 느려도 상관없다\n    a, x = t\n    cnt = 0\n    for i in range(len(a)):\n        for j in range(i + 1, len(a)):\n            if a[i] + a[j] == x:\n                cnt += 1\n    return cnt\n\n\ndef fast(t):                       # 검증 대상\n    a, x = t\n    i, j, cnt = 0, len(a) - 1, 0\n    while i < j:\n        s = a[i] + a[j]\n        if s == x:\n            cnt += 1               # ❌ 같은 값이 여럿이면 한 번만 세고 지나간다\n            i += 1\n            j -= 1\n        elif s < x:\n            i += 1\n        else:\n            j -= 1\n    return cnt\n\n\ndef main():\n    rng = random.Random(20260804)  # 시드를 고정해야 같은 실패를 다시 볼 수 있다\n    for it in range(1, 100001):\n        t = gen(rng)\n        if brute(t) != fast(t):\n            print(f\"[{it}회차] 불일치\")\n            print(f\"  입력  a={t[0]} x={t[1]}\")\n            print(f\"  brute {brute(t)}  fast {fast(t)}\")\n            return 1\n    print(\"전부 일치\")\n    return 0\n\n\nsys.exit(main())\n```\n```cpp title=\"스트레스 테스트 하네스 — gen / brute / fast / 비교 루프\"\n#include <algorithm>\n#include <cstdio>\n#include <random>\n#include <vector>\nusing namespace std;\n\nstruct Case {\n    vector<int> a;\n    int x;\n};\n\nCase gen(mt19937& rng) {\n    int n = (int)(rng() % 6) + 1;  // 작게: 반례를 눈으로 읽을 수 있어야 한다\n    int x = (int)(rng() % 7);\n    vector<int> a(n);\n    for (int i = 0; i < n; ++i) a[i] = (int)(rng() % 4);  // 값 범위를 좁혀 중복을 만든다\n    sort(a.begin(), a.end());\n    return {a, x};\n}\n\nlong long brute(const Case& t) {   // 정의를 그대로 옮긴다. 느려도 상관없다\n    long long cnt = 0;\n    for (size_t i = 0; i < t.a.size(); ++i)\n        for (size_t j = i + 1; j < t.a.size(); ++j)\n            if (t.a[i] + t.a[j] == t.x) cnt += 1;\n    return cnt;\n}\n\nlong long fast(const Case& t) {    // 검증 대상\n    int i = 0, j = (int)t.a.size() - 1;\n    long long cnt = 0;\n    while (i < j) {\n        int s = t.a[i] + t.a[j];\n        if (s == t.x) {\n            cnt += 1;              // ❌ 같은 값이 여럿이면 한 번만 세고 지나간다\n            i += 1;\n            j -= 1;\n        } else if (s < t.x) {\n            i += 1;\n        } else {\n            j -= 1;\n        }\n    }\n    return cnt;\n}\n\nint main() {\n    mt19937 rng(20260804);         // 시드를 고정해야 같은 실패를 다시 볼 수 있다\n    for (int it = 1; it <= 100000; ++it) {\n        Case t = gen(rng);\n        if (brute(t) != fast(t)) {\n            printf(\"[%d회차] 불일치\\n\", it);\n            printf(\"  입력  a=[\");\n            for (size_t i = 0; i < t.a.size(); ++i) printf(i ? \", %d\" : \"%d\", t.a[i]);\n            printf(\"] x=%d\\n\", t.x);\n            printf(\"  brute %lld  fast %lld\\n\", brute(t), fast(t));\n            return 1;\n        }\n    }\n    printf(\"전부 일치\\n\");\n    return 0;\n}\n```\n:::\n\n**복잡도:** 한 회차가 시간 $O(n^2)$ — `brute`의 이중 루프가 지배한다. $n \\le 6$이므로 회차당 36회 미만이고, 10만 회를 돌려도 총 연산이 $4 \\times 10^6$ 수준이라 [0-9](#/0-9)의 예산 안에 여유롭게 들어온다. 공간 $O(n)$ — 매 회차 입력 하나만 들고 있다. **`brute`의 복잡도를 걱정할 필요가 없다는 것이 이 구조의 핵심이다.** 입력이 작아서 $O(n^3)$이어도 같은 결론이다.\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 난수 | `random.Random(seed)` — 메르센 트위스터, 인스턴스마다 독립 | `mt19937(seed)` — 같은 알고리즘이지만 **난수열은 다르다** |\n| 범위 뽑기 | `rng.randint(1, 6)` — 양끝 포함 | `rng() % 6 + 1` — 나머지 편향이 있으나 작은 범위에서는 무시할 만하다. 엄밀하게는 `uniform_int_distribution` |\n| 입력 표현 | 튜플 `(a, x)` | `struct Case` |\n| 종료 코드 | `sys.exit(1)` | `return 1` |\n\n**난수열이 다르다는 것이 여기서 중요하다.** 같은 시드를 줘도 두 언어가 처음 잡는 회차와 그때의 입력이 다르다. 실제로 이 하네스는 Python에서 5회차에 `a=[0,0,3,3] x=3`을, C++에서 5회차에 `a=[0,0,0,2,2] x=0`을 잡았다. ==하네스가 재현해야 하는 것은 특정 입력이 아니라 **버그의 존재**다.==\n\n축소는 별도 함수로 둔다. 실패한 뒤 한 번만 돌기 때문에 하네스 본체와 분리하는 편이 읽기 쉽다.\n\n아래 두 블록은 **조각**이다. 앞 하네스의 `brute`, `fast`, `Case` 정의를 그대로 이어받으므로 이것만 떼어 내면 컴파일되지 않는다.\n\n::: dual\n```python title=\"축소 (조각) — 실패를 유지하면서 더 못 깎을 때까지\"\ndef fails(t):\n    return brute(t) != fast(t)\n\n\ndef shrink(t):\n    a, x = t\n    changed = True\n    while changed:\n        changed = False\n        for i in range(len(a)):                  # (a) 원소 하나 지우기\n            cand = (a[:i] + a[i + 1:], x)\n            if fails(cand):\n                a, changed = cand[0], True\n                break\n        if changed:\n            continue\n        for i in range(len(a)):                  # (b) 원소 하나 줄이기\n            if a[i] > 0:\n                b = a[:]\n                b[i] -= 1\n                cand = (sorted(b), x)            # 정렬 상태는 입력의 전제다\n                if fails(cand):\n                    a, changed = cand[0], True\n                    break\n        if changed:\n            continue\n        if x > 0:                                # (c) x 줄이기\n            cand = (a, x - 1)\n            if fails(cand):\n                x, changed = x - 1, True\n    return (a, x)\n```\n```cpp title=\"축소 (조각) — 실패를 유지하면서 더 못 깎을 때까지\"\nbool fails(const Case& t) { return brute(t) != fast(t); }\n\nCase shrink(Case t) {\n    bool changed = true;\n    while (changed) {\n        changed = false;\n        for (size_t i = 0; i < t.a.size(); ++i) {      // (a) 원소 하나 지우기\n            Case cand = t;\n            cand.a.erase(cand.a.begin() + i);\n            if (fails(cand)) { t = cand; changed = true; break; }\n        }\n        if (changed) continue;\n        for (size_t i = 0; i < t.a.size(); ++i) {      // (b) 원소 하나 줄이기\n            if (t.a[i] == 0) continue;\n            Case cand = t;\n            cand.a[i] -= 1;\n            sort(cand.a.begin(), cand.a.end());        // 정렬 상태는 입력의 전제다\n            if (fails(cand)) { t = cand; changed = true; break; }\n        }\n        if (changed) continue;\n        if (t.x > 0) {                                 // (c) x 줄이기\n            Case cand = t;\n            cand.x -= 1;\n            if (fails(cand)) { t = cand; changed = true; }\n        }\n    }\n    return t;\n}\n```\n:::\n\n**복잡도:** 시간 $O(K \\cdot (n + 1) \\cdot C)$ — 채택이 일어날 때마다 처음부터 다시 훑으므로, 채택 횟수 $K$에 한 바퀴의 후보 수 $n+1$과 판정 비용 $C = O(n^2)$을 곱한다. $K$의 상한은 측도 (원소 개수 + 값의 합)의 초기값이고 생성기가 작게 만들었으므로 수십을 넘지 않는다. 공간 $O(n)$ — 후보 하나를 복사해 들고 판정한다. **이 함수는 실패한 뒤 한 번만 돌기 때문에 상수를 줄일 이유가 없다.**\n\n::: warn\n축소 연산은 **입력의 전제를 깨뜨리면 안 된다.** 이 문제의 입력은 정렬된 배열이므로 원소를 줄인 뒤 반드시 다시 정렬한다. 정렬하지 않고 넘기면 `fast`와 `brute`가 둘 다 정의되지 않은 입력을 받고, 그때의 불일치는 **버그가 아니라 하네스의 오류다.** 유효하지 않은 입력으로 최소화된 반례는 시간만 잡아먹는다.\n:::\n\n## 5. 하네스가 실제로 잡은 것\n\n`tools/bench/stress_pair_sum.py`와 `.cpp`를 그대로 돌린 출력이다.\n\n```console\n$ python3.13 tools/bench/stress_pair_sum.py 200000\n검사 대상: fast()\n[5회차] 불일치 발견\n  입력   a=[0, 0, 3, 3] x=3\n  brute  4\n  대상   2\n  -- 축소 7회 시도 --\n  최소 입력 a=[0, 3, 3] x=3\n  brute  2\n  대상   1\n```\n\n```console\n$ /tmp/stress 200000\n검사 대상: fast()\n[5회차] 불일치 발견\n  입력   a=[0, 0, 0, 2, 2] x=0\n  brute  3\n  대상   1\n  -- 축소 11회 시도 --\n  최소 입력 a=[0, 0, 0] x=0\n  brute  3\n  대상   1\n```\n\n**5회차다.** 사람이 반례를 상상하려 애쓰는 대신 하네스가 밀리초 안에 찾았다. C++이 최소화한 `a = [0, 0, 0]`, `x = 0`은 더 노골적이다. 세 개의 `0` 중 두 개를 고르는 방법이 3가지인데 `fast`는 1을 돌려준다.\n\n원인은 §3의 정답에 있다. 합이 맞을 때마다 한 쌍만 세고 양쪽을 당기므로 **같은 값 덩어리끼리 만드는 조합이 통째로 빠진다.** 고치려면 덩어리 크기를 세서 곱해야 한다.\n\n```python title=\"고친 판 (조각) — 같은 값 덩어리를 한꺼번에 센다\" {5,10-11}\nif s < x:\n    i += 1\nelif s > x:\n    j -= 1\nelif a[i] == a[j]:         # 남은 구간이 전부 같은 값 -> 조합으로 센다\n    m = j - i + 1\n    cnt += m * (m - 1) // 2\n    break\nelse:\n    ci = 1                 # 왼쪽 덩어리 크기\n    while a[i + 1] == a[i]:\n        i += 1\n        ci += 1\n    cj = 1                 # 오른쪽 덩어리 크기\n    while a[j - 1] == a[j]:\n        j -= 1\n        cj += 1\n    cnt += ci * cj         # 두 덩어리가 만드는 쌍의 수\n    i += 1\n    j -= 1\n```\n\n같은 하네스로 고친 판을 검사하면 이렇게 된다.\n\n```console\n$ python3.13 tools/bench/stress_pair_sum.py 200000 fixed\n검사 대상: fixed()\n  20000회 통과\n  ...\n  200000회 통과\n200000회 전부 일치\n```\n\n::: tip\n검사 대상을 바꿔 끼울 수 있게 만들어 두면 이 확인이 한 줄이다. Python은 `TARGET = fixed`, C++은 함수 포인터 하나를 바꾸면 된다. **하네스는 한 번 짜고 문제마다 `gen`/`brute`/`fast` 셋만 갈아 끼우는 물건이다.** 매번 새로 짜면 하네스 자체에 버그가 들어간다.\n:::\n\n::: perf\n반례가 없는 판(`fixed`)으로 20만 회를 완주하는 데 **Python 0.96초, C++ 0.029초**다. 회차당 `brute`가 $n \\le 6$의 이중 루프뿐이라 이렇게 싸다.\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측. 스크립트는 `tools/bench/stress_pair_sum.py` 와 `.cpp` 다.)\n\n싸다는 사실이 설계를 바꾼다. **하네스를 짜는 데 3분, 돌리는 데 1초다.** 반례를 상상하려고 10분 고민하는 것보다 거의 언제나 싸다. 그리고 버그가 있으면 20만 회를 다 돌 일도 없다 — 위에서는 5회차에 걸렸다.\n:::\n\n## 6. 경계값 체크리스트\n\n하네스를 못 짜는 상황도 있다. `brute`조차 정의하기 어려운 문제이거나, 시간이 없을 때다. 그때는 손으로 만드는 입력의 목록을 고정해 둔다. **여기 있는 것들은 하네스가 없어도 반드시 넣는다.**\n\n| 축 | 넣을 입력 | 무엇이 드러나는가 |\n|---|---|---|\n| 크기 | $n = 0$, $n = 1$, $n = 2$ | 루프가 한 번도 안 도는 경우, 포인터 둘이 겹치는 경우 |\n| 중복 | 전부 같은 값 | 동점 처리, 덩어리 세기 — **§5의 버그가 여기서 나온다** |\n| 순서 | 이미 정렬, 역순 정렬 | 최악 입력, 정렬 안정성([0-13](#/0-13)) |\n| 부호 | 전부 음수, 0 포함 | 최댓값 초기화를 0으로 한 버그, 음수 나눗셈([0-11](#/0-11)) |\n| 극값 | 제약의 최댓값, 최솟값 | 오버플로, 배열 범위 |\n| 답의 위치 | 맨 앞, 맨 뒤, 없음 | 오프바이원. 이 셋이 [0-11 §2.5](#/0-11)의 세 입력이다 |\n| 형태 | 자기 자신을 가리키는 간선, 중복 간선, 연결되지 않은 그래프 | 그래프 문제의 전제 위반 |\n\n::: danger\n**$n = 1$이 가장 많이 빠진다.** 투 포인터는 `i < j`가 처음부터 거짓이고, 이분 탐색은 `mid`가 항상 같은 자리이고, 분할 정복은 기저 조건이 곧바로 걸린다. 코드의 모든 분기가 한 번씩만 실행되거나 아예 실행되지 않는 상태다.\n\n$n = 0$은 문제가 허용하지 않는 경우가 많지만, 허용한다면 **출력이 빈 줄인지 `0`인지**가 갈린다. 지문이 말하지 않으면 둘 다 시도해 볼 가치가 있다.\n:::\n\n## 7. 하네스가 못 잡는 것\n\n세 가지가 남는다. 남는다는 사실을 아는 것이 하네스를 신뢰하는 조건이다.\n\n**첫째, 큰 입력에서만 나는 문제.** 정수 오버플로는 값이 커야 나오고, 시간 초과는 $n$이 커야 나오고, 스택 오버플로는 재귀가 깊어야 나온다. 하네스는 $n \\le 6$을 던지므로 전부 통과시킨다. ==정확성과 성능은 다른 검사다.== 성능은 [0-9](#/0-9)의 두 배 실험이 본다.\n\n**둘째, `brute`도 같이 틀린 경우.** 문제를 잘못 읽었다면 두 구현이 같은 오해를 공유하고 하네스는 조용히 통과한다. 이것이 하네스의 근본 한계다. **`brute`를 지문에서 직접 옮기고, 예제 입출력으로 `brute`부터 검증하는 것**이 유일한 방어다.\n\n**셋째, 생성기가 만들지 못하는 입력.** 값을 $0 \\sim 3$으로 좁히면 중복은 잘 나오지만 큰 값의 상호작용은 영영 안 나온다. 그래서 **생성기를 두세 개 두고 번갈아 돌린다.** 좁은 값의 작은 입력, 넓은 값의 작은 입력, 특수 구조(전부 같은 값 / 정렬된 / 역순) 하나씩이다.\n\n## 8. 어디에 쓰이는가\n\n**속성 기반 테스트가 이 하네스의 산업용 판이다.** 테스트를 \"입력 하나와 기대 출력 하나\"로 적는 대신 \"이 성질이 모든 입력에서 성립한다\"로 적고, 도구가 무작위 입력을 만들어 성질을 깨뜨리려 시도한다. 성질이 깨지면 도구가 자동으로 입력을 줄여 최소 반례를 보고한다. **§2.2의 축소가 그 도구의 핵심 기능이고 이름이 shrinking이다.** 하네스를 직접 짜 본 사람은 그 도구의 출력을 읽을 줄 안다.\n\n**퍼징도 같은 뼈대다.** 무작위·변형 입력을 프로그램에 밀어 넣어 크래시나 이상 동작을 찾는다. 다른 것은 판정 기준이다 — 여기서는 `brute`와 비교했지만, 퍼징에서는 \"죽지 않는다\", \"메모리를 넘지 않는다\" 같은 성질이 판정이 된다. 보안 취약점의 상당수가 이 방식으로 발견된다.\n\n**참조 구현 대조는 시스템 교체의 표준 절차다.** 오래된 구현을 새 구현으로 바꿀 때, 한동안 둘을 나란히 돌리고 출력이 갈리는 순간을 기록한다. 옛 구현이 `brute`이고 새 구현이 `fast`다. **정답의 정의가 \"지금 돌고 있는 것과 같은 답\"인 경우가 실무에서는 오히려 흔하다.**\n\n**축소는 버그 리포트 작성의 절차이기도 하다.** 재현 절차 40단계를 3단계로 줄이는 작업이 §2.2와 같은 알고리즘이다. 한 번에 한 단계씩 지우고, 여전히 재현되면 채택한다. 코드 변경 이력에서 원인 커밋을 이분 탐색으로 찾는 것도 같은 발상의 다른 축이다 — **입력을 줄이는 대신 변경 이력을 줄인다.**\n\n## 9. 이 방법이 필요한 신호\n\n::: classify\n- 신호어: \"틀렸습니다\"인데 예제는 전부 통과, \"일부 케이스에서만 실패\", \"로컬에서는 되는데\", \"특정 조건에서만 값이 다르다\"\n- 제약조건: 정답의 정의를 완전탐색으로 옮길 수 있는 문제. 입력을 작게 만들어도 문제가 성립하는 문제. 답이 유일하게 결정되는 문제\n- 혼동 주의: 시간 초과에는 쓰지 않는다. 하네스는 작은 입력만 던지므로 성능 문제를 통과시킨다 — 그쪽은 [0-9](#/0-9)의 두 배 실험이다. 코드가 무엇을 하는지 모르겠으면 하네스보다 [0-11](#/0-11)의 손추적이 먼저다\n- 반례 함정: 답이 여러 개일 수 있는 문제(경로 복원, 사전순 조건이 없는 구성 문제)에서는 출력을 그대로 비교하면 안 된다. **답의 유효성과 최적성을 따로 판정하는 검사기를 `brute` 자리에 둔다.** 부동소수 출력도 같은 이유로 정확한 비교가 아니라 오차 범위 비교여야 한다([X-7](#/x-7))\n:::\n\n## 연습\n\n::: quiz\n전부 **하네스를 짜서 반례를 찾는** 훈련이다. 먼저 `brute`를 무엇으로 둘지 정하라.\n\n**1. 백준 2470 두 용액 (골드 5)** — https://www.acmicpc.net/problem/2470\n- 신호: 정렬 + 투 포인터의 원형이고, 값에 음수가 섞인다. **§6 체크리스트의 \"부호\" 축이 그대로 걸린다.**\n- 상태: 양끝 포인터 둘과 지금까지의 최선. 합의 절댓값이 최소가 되는 쌍을 찾는다.\n- 자료구조: 정렬된 배열. `brute`는 모든 쌍을 보는 $O(n^2)$이고 다섯 줄이다. 생성기는 값을 $-3 \\sim 3$에서 뽑아 **합이 0이 되는 쌍과 동점 상황**을 만든다.\n\n**2. 백준 1806 부분합 (골드 4)** — https://www.acmicpc.net/problem/1806\n- 신호: \"합이 S 이상이 되는 가장 짧은 연속 부분수열\". 조건을 만족하는 답이 **없을 수 있다**는 것이 함정이다.\n- 상태: 창의 왼쪽 끝, 오른쪽 끝, 창 안의 합. 오른쪽을 밀어 조건을 만족시키고 왼쪽을 당겨 줄인다.\n- 자료구조: 배열과 정수 셋. `brute`는 모든 시작점에서 끝점을 늘려 보는 $O(n^2)$이다. 생성기는 $n \\le 5$, 값 $1 \\sim 3$, $S \\le 10$으로 두어 **답이 없는 경우를 자주 만든다.**\n\n**3. 백준 10971 외판원 순회 2 (실버 2)** — https://www.acmicpc.net/problem/10971\n- 신호: $N \\le 10$이라 완전탐색이 정답이다. **`brute`와 `fast`가 같은 것을 보는 문제**이므로 하네스의 대상은 \"가지치기를 넣은 판\"이 된다.\n- 상태: 방문 집합과 현재 도시. 가지치기를 넣으면 \"지금까지의 비용이 이미 최선보다 크면 중단\"이 붙는다.\n- 자료구조: 인접 행렬. `brute`는 가지치기 없는 순열 전탐색, `fast`는 가지치기를 넣은 판이다. **가지치기 조건을 잘못 쓰면 답이 줄어든다 — 그것이 이 하네스가 잡을 버그다.** [III-4 백트래킹과 가지치기](#/iii-4).\n\n**4. 하네스 과제.** [0-11](#/0-11)의 `lower_bound`를 검증하는 하네스를 짜라. `gen`은 정렬된 배열과 찾을 값 `x`를 만들고, `brute`는 앞에서부터 훑어 `a[i] >= x`인 첫 인덱스를 찾는다. `fast`는 이분 탐색이다. 그다음 `fast`의 `lo = mid + 1`을 `lo = mid`로 바꾸면 하네스는 어떻게 되는가.\n\n::: answer\n`brute`는 세 줄이다. `for i in range(len(a)): if a[i] >= x: return i` 그리고 못 찾으면 `len(a)`를 돌려준다. **이 함수는 정의 그 자체이므로 틀릴 수 없다.**\n\n`gen`은 `n`을 0~6, 값을 0~3에서 뽑아 정렬하고, `x`도 0~4에서 뽑는다. `n = 0`을 포함시키는 것이 중요하다 — §6 체크리스트의 첫 줄이다. `x`가 모든 원소보다 큰 경우도 자주 나와야 하므로 `x`의 범위를 값의 범위보다 한 칸 넓게 잡는다.\n\n**`lo = mid`로 바꾸면 하네스는 멈추지 않는다.** 정답을 틀리는 것이 아니라 무한 루프에 빠지기 때문이다. `mid`가 `lo`와 같아지는 순간 `lo = mid`는 아무것도 바꾸지 않는다([0-11 §3](#/0-11)).\n\n여기서 하네스의 성질 하나가 드러난다. ==대조 검증은 \"답이 다르다\"를 잡지 \"끝나지 않는다\"를 잡지 못한다.== 실패가 응답 없음으로 나타난다면 그것도 정보이긴 하지만, 어느 입력에서 멈췄는지를 알려면 회차와 입력을 매번 출력하거나 시간 제한을 걸어야 한다.\n\n대응은 둘이다. 하네스에 **반복 횟수 상한**을 넣어 초과하면 실패로 판정하거나(측도가 줄지 않았다는 뜻이므로 정당한 판정이다), 애초에 이 종류는 [0-11](#/0-11)의 손추적이 표 다섯 줄에서 잡는다. **두 도구는 겹치지 않고 보완한다.**\n:::\n:::\n\n## 요약\n\n- 반례를 상상하지 말고 **만들어 내라.** 대부분의 문제에는 틀릴 수 없는 완전탐색 풀이가 있고, 그것과 대조하면 반례 찾기가 자동화된다.\n- 하네스는 네 조각이다. `gen` / `brute` / `fast` / 비교 루프. **문제가 바뀌어도 구조는 그대로**이고 셋만 갈아 끼운다.\n- 생성기 설계가 절반이다. **작게**(원소 6개 이하, 반례를 눈으로 읽을 수 있게), **값 범위를 좁게**(중복과 동점이 생기게).\n- 축소가 나머지 절반이다. 실패를 유지하며 한 번에 한 곳씩 깎는다. 측도가 단조 감소하므로 반드시 끝난다.\n- 실제로 이 하네스는 투 포인터의 중복 처리 버그를 **5회차에** 잡았고, 최소 반례는 `a = [0, 0, 0]`, `x = 0`이었다. 값이 전부 다른 입력으로는 절대 나오지 않는 버그다.\n- 20만 회 완주가 Python 0.96초, C++ 0.029초다. **하네스를 짜는 3분이 반례를 고민하는 10분보다 거의 언제나 싸다.**\n- 못 잡는 것 셋: 큰 입력에서만 나는 문제(오버플로·TLE), `brute`도 같이 틀린 경우(문제 오독), 생성기가 못 만드는 입력. **정확성과 성능은 다른 검사다.**\n\n**다음 절**: [0-13 Python ↔ C++ 대응 치트시트](#/0-13) — 두 언어의 자료구조·함수·관용구를 1:1로 놓고, 같아 보이는데 다른 지점을 실행 결과로 확정한다.\n","0-13":"# 0-13 Python ↔ C++ 대응 치트시트\n\n::: lead\n두 언어를 오갈 때 손이 멈추는 자리와, 같아 보이는데 다른 자리를 한 장에 모은다.\n:::\n\n## 1. 문제\n\n두 언어를 같이 쓰면 두 종류의 마찰이 생긴다.\n\n**첫째, 이름이 안 떠오른다.** `bisect_left`가 C++에서 무엇인지, `Counter`가 무엇으로 대체되는지. 이건 찾으면 나오고 몇 번 쓰면 붙는다. 이 챕터의 표 절반이 그 목록이다.\n\n**둘째, 같아 보이는데 다르다.** 이쪽이 실제로 사람을 잡는다. `sort`는 양쪽에 다 있고 이름도 같은데 한쪽만 안정 정렬이다. 힙은 양쪽에 다 있는데 기본 방향이 반대다. `-7 / 2`는 양쪽에서 계산되는데 값이 다르다. **문법 오류가 아니라 조용한 오답으로 나타난다.**\n\n두 번째 종류를 표로 적으면 틀린다. 사람이 기억으로 적은 대응표는 검증되지 않은 주장이다. 그래서 이 챕터의 표는 다르게 만들었다. **같은 라벨로 같은 값을 찍는 두 프로그램을 짜고 출력을 `diff` 했다.** 63줄 중 갈린 것은 4줄이다. 그 4줄이 §7이고, 나머지 59줄은 \"확인된 대응\"이다.\n\n그리고 여기서 나온 부산물이 §8이다. **같은 줄을 내기 위해 C++을 다르게 써야 했던 자리**가 여섯 군데 있었다. `diff`에 안 남으므로 표만 봐서는 안 보이고, 실전에서 가장 자주 틀리는 것이 이쪽이다.\n\n## 2. 검증 방법\n\n두 프로그램의 뼈대다. 전체는 `tools/bench/cheatsheet_verify.py`와 `.cpp`에 있다.\n\n::: dual\n```python title=\"치트시트 검증 — 같은 라벨로 같은 값을 찍는다\"\nimport bisect\nimport heapq\nfrom itertools import accumulate\n\n\ndef p(label, value):\n    print(f\"{label:<30}| {value}\")\n\n\nb = [1, 3, 3, 5, 7, 9]\np(\"lower_bound\", bisect.bisect_left(b, 3))\np(\"upper_bound\", bisect.bisect_right(b, 3))\np(\"count = upper - lower\", bisect.bisect_right(b, 3) - bisect.bisect_left(b, 3))\n\nh = []\nfor v in [5, 1, 4]:\n    heapq.heappush(h, v)       # heapq 는 최소 힙 전용\np(\"heap top\", h[0])\n\nps = [(2, \"b\"), (1, \"c\"), (2, \"a\"), (1, \"a\")]\np(\"stable sort by key\", sorted(ps, key=lambda t: t[0]))\n\nxs = [10, 20, 30]\np(\"enumerate\", [(i, v) for i, v in enumerate(xs)])\np(\"accumulate\", list(accumulate(xs)))\np(\"join\", \"-\".join(map(str, xs)))\n```\n```cpp title=\"치트시트 검증 — 같은 라벨로 같은 값을 찍는다\"\n#include <algorithm>\n#include <iostream>\n#include <numeric>\n#include <queue>\n#include <string>\n#include <vector>\nusing namespace std;\n\n// 라벨 폭은 코드포인트 수로 센다. printf 의 %-30s 는 바이트로 세기 때문이다.\nvoid p(const string& label, const string& value) {\n    size_t n = 0;\n    for (unsigned char c : label) if ((c & 0xC0) != 0x80) ++n;\n    cout << label << string(n < 30 ? 30 - n : 0, ' ') << \"| \" << value << \"\\n\";\n}\nvoid p(const string& label, long long v) { p(label, to_string(v)); }\n\nint main() {\n    vector<int> b = {1, 3, 3, 5, 7, 9};\n    auto lo = lower_bound(b.begin(), b.end(), 3);\n    auto hi = upper_bound(b.begin(), b.end(), 3);\n    p(\"lower_bound\", (long long)(lo - b.begin()));\n    p(\"upper_bound\", (long long)(hi - b.begin()));\n    p(\"count = upper - lower\", (long long)(hi - lo));\n\n    priority_queue<int, vector<int>, greater<int>> h;  // 기본은 최대 힙이라 뒤집는다\n    for (int v : {5, 1, 4}) h.push(v);\n    p(\"heap top\", (long long)h.top());\n\n    vector<pair<int, string>> ps = {{2, \"b\"}, {1, \"c\"}, {2, \"a\"}, {1, \"a\"}};\n    stable_sort(ps.begin(), ps.end(),                  // sort 는 안정적이지 않다\n                [](const auto& l, const auto& r) { return l.first < r.first; });\n    string s = \"[\";\n    for (size_t i = 0; i < ps.size(); ++i)\n        s += (i ? \", (\" : \"(\") + to_string(ps[i].first) + \", '\" + ps[i].second + \"')\";\n    p(\"stable sort by key\", s + \"]\");\n\n    vector<int> xs = {10, 20, 30};\n    s = \"[\";\n    for (size_t i = 0; i < xs.size(); ++i)\n        s += (i ? \", (\" : \"(\") + to_string(i) + \", \" + to_string(xs[i]) + \")\";\n    p(\"enumerate\", s + \"]\");\n    vector<int> acc(xs.size());\n    partial_sum(xs.begin(), xs.end(), acc.begin());\n    s = \"[\";\n    for (size_t i = 0; i < acc.size(); ++i) s += (i ? \", \" : \"\") + to_string(acc[i]);\n    p(\"accumulate\", s + \"]\");\n    s = \"\";\n    for (size_t i = 0; i < xs.size(); ++i) s += (i ? \"-\" : \"\") + to_string(xs[i]);\n    p(\"join\", s);\n    return 0;\n}\n```\n:::\n\n두 출력은 한 글자도 다르지 않다.\n\n```console\nlower_bound                   | 1\nupper_bound                   | 3\ncount = upper - lower         | 2\nheap top                      | 1\nstable sort by key            | [(1, 'c'), (1, 'a'), (2, 'b'), (2, 'a')]\nenumerate                     | [(0, 10), (1, 20), (2, 30)]\naccumulate                    | [10, 30, 60]\njoin                          | 10-20-30\n```\n\n**복잡도:** 검증 프로그램 자체는 시간 $O(1)$ — 상수 크기 입력에 고정된 개수의 연산을 한다. 의미 있는 것은 각 줄이 대표하는 연산의 복잡도이고 §4의 표에 있다. 공간도 $O(1)$이다. **이 프로그램의 값어치는 성능이 아니라 \"표가 거짓말하지 않는다\"는 보증이다.**\n\n| 언어 차이 | Python | C++ |\n|---|---|---|\n| 문자열 폭 | `f\"{s:<30}\"`은 **코드포인트** 수로 센다 | `%-30s`는 **바이트** 수로 센다. 한글 라벨에서 어긋난다 |\n| 컨테이너 출력 | `print(list)`가 곧 `[1, 2, 3]` | 직접 조립해야 한다 |\n| 힙 방향 | `heapq` = 최소 힙 고정 | `priority_queue` = **최대 힙 기본**. `greater<int>`로 뒤집는다 |\n| 정렬 안정성 | `sorted`/`sort`는 안정 | `sort`는 불안정. `stable_sort`가 대응 |\n\n## 3. 컨테이너 대응\n\n| 용도 | Python | C++ | 비고 |\n|---|---|---|---|\n| 동적 배열 | `list` | `std::vector` | [0-3](#/0-3), [0-6](#/0-6) |\n| 양끝 큐 | `collections.deque` | `std::deque` | 앞쪽 삽입이 $O(1)$ |\n| 스택 | `list` + `append`/`pop` | `std::stack` 또는 `vector` | [II-4](#/ii-4) |\n| 큐 | `collections.deque` | `std::queue` | `list.pop(0)`은 $O(n)$이다 |\n| 우선순위 큐 | `heapq` (리스트 위에서) | `std::priority_queue` | **방향이 반대** |\n| 해시 맵 | `dict` | `std::unordered_map` | [II-6](#/ii-6) |\n| 해시 집합 | `set` | `std::unordered_set` | |\n| 정렬 맵 | 없음 — `dict` + `sorted(keys)` 또는 `bisect` | `std::map` (레드-블랙 트리) | [II-9](#/ii-9) |\n| 정렬 집합 | 없음 — 정렬 리스트 + `bisect` | `std::set` | |\n| 고정 크기 배열 | `list` (또는 `array` 모듈) | `std::array` | |\n| 문자열 | `str` (불변) | `std::string` (가변) | |\n| 튜플 | `tuple` | `std::pair`, `std::tuple` | |\n| 개수 세기 | `collections.Counter` | `map`/`unordered_map` + `+= 1` | |\n| 기본값 맵 | `collections.defaultdict` | `map::operator[]`이 이미 기본값을 만든다 | **§8 참조** |\n\n::: warn\n==Python에는 정렬 상태를 유지하는 맵/집합이 표준에 없다.== 삽입과 정렬 순회가 둘 다 필요하면 세 가지 중 하나다. 삽입이 끝난 뒤 한 번만 정렬하거나, `bisect.insort`로 정렬 리스트에 넣거나(삽입이 $O(n)$이다), 힙으로 대체할 수 있는 문제인지 다시 본다. **`std::set`을 그대로 옮기려 하면 막힌다.**\n:::\n\n## 4. 연산과 복잡도\n\n| 연산 | Python | C++ | 복잡도 |\n|---|---|---|---|\n| 뒤에 추가 | `a.append(x)` | `a.push_back(x)` | 상환 $O(1)$ — 재할당이 두 배씩이라 총 복사가 $O(n)$ |\n| 뒤에서 제거 | `a.pop()` | `a.pop_back()` | $O(1)$ |\n| 앞에 추가 | `d.appendleft(x)` | `d.push_front(x)` | `deque`면 $O(1)$, `list`/`vector`면 $O(n)$ |\n| 앞에서 제거 | `d.popleft()` | `d.pop_front()` | 같음 |\n| 길이 | `len(a)` | `a.size()` | $O(1)$ |\n| 첫/끝 원소 | `a[0]`, `a[-1]` | `a.front()`, `a.back()` | $O(1)$. **C++에 음수 인덱스는 없다** |\n| 부분 복사 | `a[i:j]` | `vector<int>(a.begin()+i, a.begin()+j)` | $O(j-i)$ |\n| 정렬 | `a.sort()` / `sorted(a)` | `sort(a.begin(), a.end())` | $O(n \\log n)$ — 비교가 $n \\log n$회 |\n| 안정 정렬 | `a.sort()` (이미 안정) | `stable_sort(...)` | $O(n \\log n)$, 추가 공간 $O(n)$ |\n| 역순 정렬 | `sorted(a, reverse=True)` | `sort(a.begin(), a.end(), greater<int>())` | 같음 |\n| 이분 탐색 | `bisect.bisect_left(a, x)` | `lower_bound(a.begin(), a.end(), x)` | $O(\\log n)$ — 구간을 절반씩 접는다 |\n| 상계 탐색 | `bisect.bisect_right(a, x)` | `upper_bound(...)` | $O(\\log n)$ |\n| 힙 삽입 | `heapq.heappush(h, x)` | `pq.push(x)` | $O(\\log n)$ — 높이만큼 sift |\n| 힙 최소 꺼내기 | `heapq.heappop(h)` | `pq.pop()` + `pq.top()` | $O(\\log n)$ |\n| 맵 조회 | `d[k]` / `d.get(k, v)` | `m[k]` / `m.count(k)` | 평균 $O(1)$, 최악 $O(n)$ |\n| 포함 여부 | `x in a` | `find(a.begin(), a.end(), x) != a.end()` | 리스트면 $O(n)$, 집합/맵이면 평균 $O(1)$ |\n| 중복 제거 | `sorted(set(a))` | `sort` → `unique` → `erase` | $O(n \\log n)$ |\n| 최대·최소 | `max(a)`, `min(a)` | `*max_element(...)`, `*min_element(...)` | $O(n)$ |\n| 합 | `sum(a)` | `accumulate(a.begin(), a.end(), 0)` | $O(n)$. **C++은 초기값 타입이 결과 타입이다** |\n| 누적 합 | `itertools.accumulate(a)` | `partial_sum(a.begin(), a.end(), out.begin())` | $O(n)$ |\n| 개수 | `a.count(x)` | `count(a.begin(), a.end(), x)` | $O(n)$ |\n| 뒤집기 | `a[::-1]` / `reversed(a)` | `reverse(a.begin(), a.end())` / `rbegin()` | $O(n)$ |\n| 다음 순열 | `itertools.permutations` | `next_permutation(...)` | 순열 하나당 상환 $O(1)$ |\n| k번째 원소 | `sorted(a)[k]` | `nth_element(a.begin(), a.begin()+k, a.end())` | C++은 평균 $O(n)$ — [0-7](#/0-7) |\n\n::: danger\n`accumulate(a.begin(), a.end(), 0)`은 **초기값 `0`이 `int`라 결과도 `int`다.** 원소가 `long long`이어도 합이 `int`로 계산되어 넘친다. `0LL`을 넣어야 한다. Python에는 이 함정이 없다 — 정수가 임의 정밀도다([0-5](#/0-5)).\n:::\n\n## 5. 관용구\n\n| 관용구 | Python | C++ |\n|---|---|---|\n| 인덱스와 값 | `for i, v in enumerate(a):` | `for (size_t i = 0; i < a.size(); ++i)` |\n| 두 배열 나란히 | `for x, y in zip(a, b):` | 인덱스로 동시에 접근 |\n| 조건 만족 여부 | `any(...)`, `all(...)` | `any_of`, `all_of` |\n| 변환 | `[f(x) for x in a]` | `transform(...)` 또는 그냥 루프 |\n| 걸러내기 | `[x for x in a if p(x)]` | `copy_if(...)` 또는 그냥 루프 |\n| 키로 정렬 | `sorted(a, key=f)` | `sort(a.begin(), a.end(), cmp)` — **key가 아니라 비교자** |\n| 여러 기준 정렬 | `key=lambda t: (-t[0], t[1])` | 비교자 안에서 `if (l.a != r.a) return l.a > r.a; return l.b < r.b;` |\n| 2차원 초기화 | `[[0] * m for _ in range(n)]` | `vector<vector<int>>(n, vector<int>(m, 0))` |\n| 문자열 쪼개기 | `s.split()` | `istringstream` + `>>` |\n| 문자열 잇기 | `\"-\".join(parts)` | 루프로 누적, 첫 원소만 구분자 생략 |\n| 문자열 뒤집기 | `s[::-1]` | `string(s.rbegin(), s.rend())` |\n| 정수 ↔ 문자열 | `str(x)`, `int(s)` | `to_string(x)`, `stoi(s)` / `stoll(s)` |\n| 문자 코드 | `ord(c)`, `chr(n)` | `(int)c`, `(char)n` |\n| 최대공약수 | `math.gcd(a, b)` | `__gcd(a, b)` (GCC 확장) 또는 직접 구현 |\n| 거듭제곱 mod | `pow(a, b, m)` | 직접 구현 — [X-3](#/x-3) |\n| 무한대 | `float(\"inf\")` | `INT_MAX` / `LLONG_MAX` / `1e18` |\n| 스왑 | `a, b = b, a` | `swap(a, b)` |\n\n::: danger\n`[[0] * m] * n`은 **행 하나를 n번 참조하는 리스트**를 만든다. `g[0][1] = 7`이 모든 행을 바꾼다. 반드시 `[[0] * m for _ in range(n)]`이다. Python에서 가장 자주 나오는 조용한 버그이고 [0-2](#/0-2)에 있다.\n\nC++의 `INT_MAX`를 무한대로 쓸 때는 `INT_MAX + w`가 넘치는지 본다. 다익스트라에서 `dist[u] + w`를 계산하는 순간 터진다. `1e9` 정도로 두거나 더하기 전에 걸러라([V-1](#/v-1)).\n:::\n\n## 6. 입출력\n\n| | Python | C++ |\n|---|---|---|\n| 한 줄 | `sys.stdin.readline()` (개행 포함) | `getline(cin, s)` |\n| 정수 하나 | `int(sys.stdin.readline())` | `cin >> x` |\n| 한 줄에 여러 정수 | `map(int, sys.stdin.readline().split())` | `cin >> a >> b >> c` |\n| 전부 읽기 | `sys.stdin.buffer.read().split()` | 반복 `cin >>` (이미 버퍼링됨) |\n| 빠르게 만들기 | `readline` 사용 | `ios_base::sync_with_stdio(false); cin.tie(nullptr);` |\n| 한 줄 출력 | `print(x)` | `cout << x << \"\\n\"` |\n| 모아서 출력 | `sys.stdout.write(\"\\n\".join(out))` | `string buf`에 누적 후 한 번에 |\n| 절대 쓰지 말 것 | 큰 입력에 `input()` | 큰 출력에 `endl` |\n\n수치는 [0-10 §3.1](#/0-10)에 있다. **같은 언어 안에서 4배가 공짜로 있다.**\n\n## 7. `diff`가 남긴 네 줄\n\n63개 항목 중 실제로 갈린 것은 넷이다. 이 넷이 **문법이 아니라 의미가 다른** 지점이다.\n\n| 표현 | Python | C++ |\n|---|---|---|\n| `-7 / 2` | `-4` (`//`는 항상 **내림**) | `-3` (`/`는 **0 방향 절삭**) |\n| `-7 % 2` | `1` (나머지 부호가 **제수**를 따른다) | `-1` (나머지 부호가 **피제수**를 따른다) |\n| 정수 상한 | 없음 (임의 정밀도) | `9223372036854775807` (`long long`) |\n| $2^{64}$ 계산 | `18446744073709551616` | `0` (`unsigned long long`이 한 바퀴 돈다) |\n\n> (Linux x86-64 / CPython 3.13 / g++ 13 `-O2` 실측. `tools/bench/cheatsheet_verify.py` 와 `.cpp` 의 출력을 `diff` 한 결과다.)\n\n::: danger\n음수 나눗셈이 조용한 오답의 대표다. 좌표를 격자 인덱스로 바꾸는 코드에서 `x / cell`을 쓰면 원점 왼쪽에서 인덱스가 하나 어긋난다. Python으로 검증하고 C++로 옮겼다면 그 순간 결과가 갈린다.\n\n방어는 하나다. **음수가 들어올 수 있으면 나눗셈을 쓰지 말고 좌표를 먼저 양수로 밀어라.** `(x + OFFSET) / cell` 형태로 바꾸면 두 언어가 같아진다. 나머지도 같다 — C++에서 항상 양수 나머지를 원하면 `((x % m) + m) % m`이다.\n\n부호 있는 정수의 넘침은 **정의되지 않은 동작**이라 값이 무엇이 되든 근거가 없다. 위 표의 $2^{64}$가 `0`인 것은 `unsigned long long`을 썼기 때문이고, 부호 없는 정수만 \"$2^{64}$로 나눈 나머지\"가 표준으로 보장된다([0-5](#/0-5)).\n:::\n\n## 8. `diff`에 안 남지만 더 위험한 여섯 자리\n\n같은 줄을 내기 위해 **C++을 다르게 써야 했던** 자리다. 그냥 옮겨 적으면 값이 갈리는데, 표에는 흔적이 남지 않는다.\n\n**1. 힙의 방향.** `heapq`는 최소 힙 전용이고 `priority_queue`는 최대 힙이 기본이다. 그대로 옮기면 다익스트라가 최장 경로를 찾는다. C++에서 최소 힙은 `priority_queue<int, vector<int>, greater<int>>`다.\n\n**2. 정렬 안정성.** `std::sort`는 안정성을 보장하지 않는다. 그런데 **작은 입력에서는 안정적으로 보인다.**\n\n::: perf\n| n | Python `list.sort` | C++ `std::sort` | C++ `std::stable_sort` |\n|---|---|---|---|\n| 4, 8, 16 | 안정 | 안정 | 안정 |\n| 32, 40, 64, 1000 | 안정 | **불안정** | 안정 |\n\n> (같은 환경 실측. `tools/bench/sort_stability.py` 와 `.cpp`. introsort가 짧은 구간을 삽입 정렬로 마무리하기 때문에 $n \\le 16$에서는 결과가 안정적으로 나온다.)\n:::\n\n예제 입력이 작으면 로컬에서 통과하고 채점기에서 깨진다. **동점의 순서가 답에 영향을 주면 `stable_sort`를 쓴다.**\n\n**3. `map::operator[]`가 삽입한다.** `m[\"z\"]`는 없는 키를 **기본값으로 만들어 넣는다.** `d.get(\"z\", 0)`을 그대로 옮기면 맵이 커지고, 순회 결과가 달라지고, `const map`에서는 컴파일조차 안 된다. 조회만 할 때는 `m.count(k)`나 `m.find(k)`를 쓴다.\n\n거꾸로 이 성질이 `defaultdict` 대응이 되기도 한다. `m[k] += 1`은 없는 키를 0으로 만들어 1을 더하므로 Python의 `defaultdict(int)`와 같다. **의도한 것이면 관용구이고 의도하지 않았으면 버그다.**\n\n**4. 비교자는 `const` 참조를 받아야 한다.** `[](pair<int,int>& l, pair<int,int>& r)`로 쓰면 `sort`는 통과하는데 `stable_sort`가 컴파일 오류를 낸다. 내부에서 `const` 원소와 비교하는 경로가 있기 때문이다. 항상 `const auto&`로 받는다.\n\n**5. `next_permutation`은 현재 순열부터 앞으로만 간다.** 모든 순열을 얻으려면 **입력이 오름차순으로 정렬되어 있어야 한다.** `itertools.permutations`는 입력 순서와 무관하게 전부 만든다. 정렬을 빼먹으면 순열의 일부만 나온다.\n\n**6. 비교자는 strict weak ordering이어야 한다.** `<=`로 쓰면 \"같은 원소끼리도 앞선다\"가 되어 표준이 요구하는 조건을 어긴다. `std::sort`가 배열 밖을 읽고 실제로 크래시한다. Python의 `key`는 값을 뽑을 뿐이라 이 문제가 없다. [0-8](#/0-8)에 있다.\n\n::: note\n여섯 자리를 한 문장으로 줄이면 이렇다. ==**컴파일되는 것과 같은 값을 내는 것은 다른 문제다.**== 대응표를 보고 옮긴 코드는 컴파일까지만 보장된다. 값이 같은지는 [0-12](#/0-12)의 하네스가 확인한다 — 양쪽 구현을 `brute`와 `fast` 자리에 놓고 무작위 입력을 던지면, 위 여섯 자리는 전부 몇 회차 안에 걸린다.\n:::\n\n## 9. 어디에 쓰이는가\n\n**포팅과 참조 구현 대조가 이 표의 실무 형태다.** 검증된 구현을 다른 언어로 옮길 때, 두 구현을 나란히 돌려 출력이 갈리는 순간을 찾는 절차가 표준이다([0-12 §8](#/0-12)). 이때 갈리는 지점의 목록이 대개 §7과 §8이다 — 나눗셈 부호, 정렬 동점, 정수 상한. **어디를 볼지 알고 있으면 대조 작업이 몇 시간에서 몇 분으로 줄어든다.**\n\n**언어 경계를 가진 시스템의 계약도 같은 목록으로 정해진다.** Python 층과 C++ 층이 정수를 주고받는 인터페이스에서는 \"이 값은 `int64`에 들어간다\"가 명시되어야 한다. 한쪽에는 상한이 없고 다른 쪽에는 있기 때문이다([0-10 §7](#/0-10)). 해시 순회 순서를 계약에 넣지 않는 것도 같은 이유다 — 두 언어의 순서가 다르고 같은 언어 안에서도 보장되지 않는다.\n\n## 연습\n\n::: quiz\n전부 **옮겨 적으면 값이 갈리는** 자리를 확인하는 훈련이다. 코드를 짜기 전에 §7·§8을 보라.\n\n**1. 백준 11004 K번째 수 (실버 5)** — https://www.acmicpc.net/problem/11004\n- 신호: $N \\le 5{,}000{,}000$에서 K번째로 작은 수. 전부 정렬하면 $O(N \\log N)$이고 통과하지만, **부분 정렬만으로 충분하다.**\n- 상태: K번째 자리 하나. 그 앞뒤의 순서는 답에 필요 없다.\n- 자료구조: C++은 `nth_element`로 평균 $O(N)$이다. Python에는 대응이 없어 `sort` 또는 `heapq.nsmallest`를 쓴다. ==표에서 \"대응이 없다\"가 나오는 대표 항목이다.== 입력이 500만 개라 읽는 방법도 함께 정해진다([0-10](#/0-10)).\n\n**2. 백준 11650 좌표 정렬하기 (실버 5)** — https://www.acmicpc.net/problem/11650\n- 신호: \"x가 같으면 y가 증가하는 순서\". **여러 기준 정렬**의 원형이다.\n- 상태: 좌표 쌍의 배열 하나.\n- 자료구조: Python은 `key=lambda p: (p[0], p[1])`이고 `pair`는 이미 사전순 비교라 C++은 `sort`만으로 된다. **§8의 2번(안정성)이 문제가 되는지 스스로 판정하라** — 두 기준으로 완전히 순서가 정해지면 안정성은 답에 영향을 주지 않는다.\n\n**3. 백준 10814 나이순 정렬 (실버 5)** — https://www.acmicpc.net/problem/10814\n- 신호: \"나이가 같으면 **먼저 가입한 순서**로\". 동점의 순서가 곧 답이다. **§8의 2번이 정면으로 걸린다.**\n- 상태: (나이, 이름) 배열과 원래 입력 순서.\n- 자료구조: Python은 `sort(key=...)`가 이미 안정이라 그대로 끝난다. C++은 `stable_sort`를 쓰거나 인덱스를 비교자의 두 번째 기준으로 넣는다. **`sort`로 짜면 $n \\le 16$인 예제는 통과하고 실제 데이터에서 깨진다.**\n\n**4. 대응 과제.** 다음 Python 조각을 C++로 옮기고, §7·§8 중 몇 개가 걸리는지 세라.\n\n```python title=\"옮길 조각 — data 는 정수 리스트다\"\nimport heapq\nh = []\nfor x in data:\n    heapq.heappush(h, (-x, x // 2))\ntop = heapq.heappop(h)\n```\n\n::: answer\n**셋이 걸린다.**\n\n**하나, 힙 방향(§8-1).** `heapq`는 최소 힙이고 값에 `-1`을 곱해 최대 힙을 흉내 낸 코드다. C++의 `priority_queue`는 이미 최대 힙이므로 **부호 뒤집기를 그대로 옮기면 이중으로 뒤집혀 최소 힙이 된다.** `priority_queue<pair<int,int>> pq; pq.push({x, x / 2});`가 맞다.\n\n**둘, 음수 나눗셈(§7).** `x // 2`는 내림이고 `x / 2`는 0 방향 절삭이다. `data`에 음수가 있으면 두 언어의 두 번째 원소가 갈린다. 그리고 이 값은 힙 비교의 두 번째 기준이므로 **동점일 때 꺼내는 순서가 달라진다.** 음수가 없다는 보장이 있어야 그냥 옮길 수 있다.\n\n**셋, 정수 상한(§7).** `-x`는 Python에서 안전하지만 C++에서 `x`가 `INT_MIN`이면 `-x`가 `int` 범위 밖이다. 부호 있는 정수의 넘침은 정의되지 않은 동작이다. 애초에 부호를 뒤집을 필요가 없으므로(첫 번째 항목) 이 위험도 함께 사라진다.\n\n==문제 셋 중 둘이 \"부호를 뒤집는다\"는 한 줄에서 나왔다.== 언어를 옮길 때 가장 먼저 지워야 할 것은 **다른 언어의 제약을 우회하려고 넣은 코드**다.\n:::\n:::\n\n## 요약\n\n- 이 표는 손으로 적은 것이 아니라 **같은 라벨로 같은 값을 찍는 두 프로그램의 `diff`**로 만들었다. 63줄 중 갈린 것이 4줄이다.\n- 갈린 넷: **음수 나눗셈**(`-4` vs `-3`), **음수 나머지**(`1` vs `-1`), 정수 상한의 유무, 부호 없는 정수의 한 바퀴.\n- 더 위험한 것은 `diff`에 안 남는 여섯 자리다. **힙 방향이 반대**, `std::sort`는 불안정($n \\ge 32$에서 실측으로 확인), `map::operator[]`가 삽입, 비교자의 `const`, `next_permutation`의 정렬 전제, strict weak ordering.\n- Python에는 **정렬 상태를 유지하는 맵/집합이 표준에 없다.** `std::set`을 그대로 옮기려 하면 막힌다.\n- C++에는 **음수 인덱스가 없고**, `accumulate`의 초기값 타입이 결과 타입이며, `INT_MAX`에 무언가를 더하면 넘친다.\n- **컴파일되는 것과 같은 값을 내는 것은 다른 문제다.** 옮긴 코드는 [0-12](#/0-12)의 하네스로 대조한다.\n\n**다음 절**: [I-1 왜 판별이 병목인가](#/i-1) — 도구가 갖춰졌으니 이제 \"이 문제는 무슨 문제인가\"를 결정하는 훈련으로 넘어간다.\n","i-1":"# I-1 왜 판별이 병목인가\n\n::: lead\nBFS를 외워서 짤 수 있는 사람이 왜 BFS 문제를 못 푸는가.\n:::\n\n## 1. 문제\n\n지문 하나를 보자. 알고리즘 이름은 한 번도 나오지 않는다.\n\n> 창고에 토마토가 격자 모양 상자에 담겨 있다. 어떤 칸에는 잘 익은 토마토가, 어떤 칸에는 아직 익지 않은 토마토가 들어 있고, 토마토가 아예 없는 빈 칸도 있다. 하루가 지나면 익은 토마토의 위·아래·왼쪽·오른쪽에 있는 익지 않은 토마토가 익는다. 모든 토마토가 익을 때까지 최소 며칠이 걸리는지 구하라. 모두 익지는 못하는 상황이면 -1을 출력하라. 상자의 크기는 최대 1000 × 1000이다.\n\n이 지문에는 \"최단\"도 \"거리\"도 \"그래프\"도 \"큐\"도 없다. 있는 것은 토마토와 날짜뿐이다. 같은 지문을 세 사람이 읽으면 세 가지 풀이가 나온다.\n\n**첫 번째 매핑 — 시뮬레이션.** 하루를 한 번의 전체 훑기로 본다. 격자를 처음부터 끝까지 돌면서 익은 칸의 이웃을 익히고, 이번 바퀴에 익은 칸이 하나도 없으면 멈춘다. 지문이 \"하루가 지나면\"이라고 절차를 그대로 말해 주므로 가장 자연스러운 독해다. **답도 정확히 맞는다.** 문제는 비용이다. 한 바퀴가 $10^6$칸이고, 통로가 뱀처럼 굽은 배치라면 날짜가 수십만이 된다. $5 \\times 10^5$일 × $10^6$칸 = $5 \\times 10^{11}$ 연산. 시간 초과다.\n\n**두 번째 매핑 — DP.** \"각 칸이 익는 최소 날짜\"를 $dp[i][j]$로 두면 점화식이 바로 나온다. 익은 칸은 0이고, 나머지는 네 이웃의 최솟값 더하기 1이다. 표를 채우면 될 것처럼 보인다. 그런데 채울 수가 없다. **$dp[i][j]$가 $dp[i][j+1]$에 의존하고 $dp[i][j+1]$도 $dp[i][j]$에 의존한다.** 의존 관계에 사이클이 있으면 계산 순서가 존재하지 않고, 계산 순서가 없으면 DP 표를 한 번에 채울 수 없다. 이 매핑을 살리려면 값이 변하지 않을 때까지 표 전체를 반복해서 갱신해야 하는데, 그 절차에는 이미 이름이 있다. 벨만-포드다([V-2 벨만-포드와 음수 간선](#/v-2)). 답은 나오지만 필요 없는 비용을 낸다.\n\n**세 번째 매핑 — 다중 시작점 BFS.** 처음부터 익어 있던 칸을 **전부** 큐에 넣고 시작한다. 큐에서 꺼낸 칸의 이웃을 익히며 날짜를 하나씩 올린다. 큐가 비면 끝이고, 안 익은 칸이 남아 있으면 -1이다. 격자 한 칸이 큐에 정확히 한 번 들어가므로 $10^6$번의 방문으로 끝난다.\n\n두 번째 매핑이 실패한 지점은 기억해 둘 값어치가 있다. **DP가 성립하려면 부분 문제 사이의 의존 관계에 사이클이 없어야 한다.** 방향이 한쪽으로 고정된 격자(위에서 아래로만 내려가는 삼각형)에서는 DP가 되고, 사방으로 오갈 수 있는 격자에서는 안 된다. 사이클이 있는 의존 관계 위에서 최솟값을 구하는 절차에는 이미 이름이 붙어 있고 그것이 최단경로 알고리즘이다. 이 둘이 사실 같은 것이라는 이야기는 [V-4 DP와 최단경로는 같은 것이다](#/v-4)에서 정면으로 다룬다.\n\n::: note\n첫 번째와 두 번째는 **틀린 답을 내지 않는다.** 그래서 위험하다. 논리적으로 틀린 후보는 반례 하나로 잘려 나가지만, 맞는데 느린 후보는 반례로 잘리지 않는다. 오직 수치로만 잘린다. 제약조건 역산([I-2 제약조건 역산법](#/i-2))이 판별의 첫 단계인 이유가 이것이다.\n:::\n\n### 정답 매핑이 반응한 것\n\n세 번째 독해는 토마토를 보지 않았다. 세 가지 구조적 사실에 반응했다.\n\n| 지문의 사실 | 구조로 번역하면 | 결론 |\n|---|---|---|\n| 하루가 지나면 인접 칸이 익는다 | 상태 전이의 비용이 전부 1로 같다 | 큐가 거리순 정렬을 유지한다 → BFS |\n| 익은 칸이 여러 개일 수 있다 | 시작점이 여러 개다 | 다중 시작점 BFS |\n| \"최소 며칠\" | 시작 집합에서 각 칸까지의 최단 거리 | 최댓값이 답 |\n\n==매핑은 지문의 단어가 아니라 지문이 서술하는 구조에 반응한다.== \"격자\"라는 말도 신호가 아니다. 격자는 그래프를 그리는 여러 방식 중 하나일 뿐이고, 그 사실은 [IV-1 그래프 표현](#/iv-1)에서 다시 나온다.\n\n## 2. 두 가지 실패는 다른 병이다\n\n문제를 못 푸는 상태는 하나가 아니다. 원인이 둘이고 처방도 다르다.\n\n**실패 A — 지식 결손.** 알고리즘 자체를 모른다. 위상 정렬을 들어 본 적이 없으면 위상 정렬 문제는 풀 수 없다. 이 결손은 **진단이 쉽고 유한하다.** 이름을 들었을 때 \"그게 뭔가\"가 나오면 그것이다. 코딩테스트 범위에서 이 목록은 서른에서 마흔 개 사이이고, 한 번 채우면 다시 비지 않는다.\n\n**실패 B — 매핑 결손.** 알고리즘은 안다. 그런데 이 지문이 그 알고리즘의 자리라는 것을 못 알아본다. 위의 토마토 지문에서 첫 번째 매핑을 택한 사람도 BFS를 못 짜는 것이 아니다. 격자와 큐를 주면 20줄을 정확히 짠다. ==결손은 코드에 있지 않고 지문과 코드 사이에 있다.==\n\n두 실패의 비대칭이 이 Part의 존재 이유다.\n\n| | 지식 결손 | 매핑 결손 |\n|---|---|---|\n| 처방 | 그 알고리즘을 공부한다 | 판별을 반복 훈련한다 |\n| 범위 | 유한하다. 목록이 닫혀 있다 | 문제마다 새로 요구된다 |\n| 진단 | 쉽다. 이름을 모른다 | 어렵다. **해설을 보면 이해된다** |\n| 해설을 읽으면 | 실제로 메워진다 | 거의 메워지지 않는다 |\n\n마지막 줄이 핵심이다. 해설은 **매핑의 결과**를 보여 주고 매핑의 **근거**는 대개 생략한다. \"이 문제는 BFS다\"로 시작하는 해설을 읽으면 그다음이 전부 이해되고, 이해되었으므로 배웠다고 느낀다. 그러나 다음 문제에서 필요한 것은 \"BFS다\"라는 결론이 아니라 그 결론에 도달하는 절차다. **결론만 반복해서 공급받으면 절차는 자라지 않는다.**\n\n::: warn\n\"해설을 보면 아는데 혼자서는 못 푼다\"는 상태는 실력이 부족한 상태가 아니라 **훈련 종목이 잘못된 상태**다. 이 상태에서 문제를 더 푸는 것은 효과가 낮다. 풀이를 늘리는 대신 **지문만 읽고 유형을 맞히는 연습**의 비중을 올려야 한다. 이 책이 `::: classify` 상자를 모든 알고리즘 챕터에 심고 그것을 플래시카드로 뽑는 이유다.\n:::\n\n**알고리즘 학습의 실질 병목은 지식의 부재가 아니라 문제-알고리즘 매핑의 실패다.** 이것이 이 책의 구성 근거이고, Part I이 자료구조보다 앞에 오는 이유다.\n\n### 매핑 결손이 만드는 두 가지 착시\n\n**첫째, 이해의 착시.** 해설을 읽고 이해되는 것과 스스로 도달할 수 있는 것은 다른 사건이다. 앞의 토마토 지문에서 매핑에 실제로 필요한 정보는 \"다중 시작점 BFS로 푼다\"가 아니라 \"전이 비용이 균일하다는 사실이 큐를 부른다\"이고, 대부분의 해설은 앞 문장만 준다. 앞 문장은 읽는 즉시 이해되고 다음 문제에서 아무것도 하지 못한다. **판별의 근거가 빠진 해설은 정답 코드와 정보량이 같다.**\n\n**둘째, 진도의 착시.** 비슷한 문제를 연달아 풀면 정답률이 오른다. 그러나 그때 늘어난 것은 판별 능력이 아니라 **사례 기억**인 경우가 많다. 격자 확산 문제 열 개를 연달아 풀면 열한 번째도 맞힌다. 그 사이에 격자가 아닌 수직선 위의 확산(아래 연습 3번)이 섞이면 다시 막힌다. 유형이 섞인 상태에서 지문만 보고 맞히는 것이 실제 시험 환경이고, 훈련도 그 형태여야 한다.\n\n두 착시의 공통 원인은 같다. **판별 능력은 그것만 따로 측정하지 않으면 측정되지 않는다.** 문제를 풀어서 나오는 점수에는 판별·구현·시간 관리가 뭉쳐 있어서, 어느 항목이 모자란지 알려 주지 않는다. 지문만 읽고 유형을 답하는 훈련은 그 항목 하나만 떼어 재는 장치다.\n\n## 3. 매핑은 왜 저절로 늘지 않는가\n\n지문은 **도메인 언어**로 쓰
