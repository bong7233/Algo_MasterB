name: ci

# CLAUDE.md §7-3 — 매 푸시마다 빌드 → 콘텐츠 → 링크 → 다이어그램.
# 빌드 실패와 깨진 내부 링크만 CI 를 빨갛게 만든다. 콘텐츠 규범 경고는
# 로그로만 남긴다. 집필 중인 챕터 때문에 파이프라인이 막히면 안 된다.
#
# 서드파티 액션을 쓰지 않는다(공식 checkout/setup-python 둘뿐).
# 이 레포는 의존성 제로가 원칙이고, 그 원칙은 CI 에도 적용된다.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 검사기는 아래 단계에서 따로 돌리므로 빌드에서는 건너뛴다.
      - name: 번들 빌드
        run: python build.py --no-lint

      # 종료 코드 0 고정(경고 전용). 개수는 로그에 남는다.
      - name: 콘텐츠 규범 검사 (경고만)
        run: python tools/check_content.py

      # 깨진 내부 링크가 있으면 여기서 종료 코드 1 — CI 실패.
      - name: 내부 링크 검사
        run: python tools/check_links.py

      - name: 아스키 다이어그램 정렬 검사 (경고만)
        run: python tools/check_diagrams.py
