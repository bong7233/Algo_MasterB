<!doctype html>

<header id="topbar">

  </button>

  <a id="brand" href="#/">Algorithmic</a>

  <div id="lang-toggle" class="seg" role="group" aria-label="코드 언어 선택">
    <button class="seg-btn" type="button" data-lang="python">Python</button>
    <button class="seg-btn" type="button" data-lang="cpp">C++</button>
    <button class="seg-btn is-active" type="button" data-lang="both">둘 다</button>
  </div>

  <div class="topbar-actions">
    <button id="btn-review" class="icon-btn" type="button" aria-label="복습 큐" title="복습 큐">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      <span class="badge" hidden>0</span>
    </button>
    <button id="btn-search" class="icon-btn" type="button" aria-label="검색" title="검색 (/)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button id="btn-font" class="icon-btn" type="button" aria-label="글자 크기" title="글자 크기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l6-14 6 14M6.5 14h7"/><path d="M17 19l3-7 3 7M18 17h4"/></svg>
    </button>
    <button id="btn-theme" class="icon-btn" type="button" aria-label="테마 전환" title="테마 전환">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg>

  </div>

<div id="layout">

      <input id="toc-filter" type="search" placeholder="목차 검색" aria-label="목차 검색" autocomplete="off">

    <div class="sidebar-foot">
      <a class="text-btn" href="#/glossary">용어 사전</a>
      <div id="progress-line"></div>
      <button id="btn-reset" class="text-btn" type="button">진도 초기화</button>
    </div>
  </nav>

  <main id="main">
    <article id="doc" tabindex="-1"></article>
    <nav id="pager" aria-label="이전/다음 절"></nav>
  </main>

  <aside id="inbook" aria-label="이 절의 목차"></aside>
</div>

<div id="overlay"></div>

<div id="search-modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="검색">
  <div class="modal-box">
    <input id="search-input" type="search" placeholder="전체 본문 검색…" aria-label="전체 본문 검색" autocomplete="off">
    <div id="search-results" class="search-results"></div>

  </div>
</div>

<div id="review-modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="복습 큐">

    <div id="review-body" class="review-body"></div>
  </div>
</div>
